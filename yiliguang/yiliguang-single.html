const VS_FULL = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

W.pond = {
  ready: false, t: 0, fade: 1, vol: 1, reveal: 1, white: 0,
  init() {
    if (this.ready) return;
    const gl = YL.gl;
    this.pBase = YL.makeProgram('pond-base', VS_FULL, FS_BASE);
    this.pGround = YL.makeProgram('pond-ground', VS_FULL, FS_GROUND);
    this.pStroke = YL.makeProgram('pond-stroke', VS_STROKE, FS_STROKE);
    this.pFinal = YL.makeProgram('pond-final', VS_FULL, FS_FINAL);
    [this.pBase, this.pGround, this.pStroke, this.pFinal].forEach(YL.checkProgram);
    // the lily pads: clusters drifting across the water, smaller and flatter toward the far bank
    let a = 0x51ed27; const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const pads = [], clusters = [[0.30, 0.13, 9], [0.80, 0.06, 7], [1.42, 0.17, 9], [0.58, 0.36, 7], [1.18, 0.43, 7], [0.16, 0.48, 6], [1.58, 0.55, 6], [0.88, 0.60, 6], [0.40, 0.64, 5]];
    for (const [cx, cy, n] of clusters) {
      const z = (0.745 - cy) / 0.745;
      for (let i = 0; i < n && pads.length < NPAD; i++) {
        const r = (0.025 + 0.085 * z * z) * (0.65 + 0.7 * rnd());
        pads.push([cx + (rnd() - 0.5) * 0.36 * (0.35 + z), cy + (rnd() - 0.5) * 0.08 * (0.3 + z), r, rnd()]);
      }
    }
    pads.sort((p, q) => q[1] - p[1]);                                 // far ones first, so near ones overlap them
    this.pads = new Float32Array(NPAD * 4); pads.forEach((p, i) => this.pads.set(p, i * 4));
    // the dewdrop sits on a near leaf
    const near = pads.filter(p => p[1] < 0.3).sort((p, q) => q[2] - p[2])[0] || pads[pads.length - 1];
    this.dewPad = near;
    // the strokes: two layers, on jittered grids
    const mk = (n) => { const d = new Float32Array(n * 4); for (let i = 0; i < n; i++) d.set([rnd(), rnd(), rnd() * 100, rnd() * 100], i * 4); return d; };
    this.layers = [];
    for (const [n, scale] of [[2600, 0.030], [9000, 0.016]]) {
      const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, mk(n), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(0, 1);
      gl.bindVertexArray(null);
      this.layers.push({ vao, n, scale });
    }
    this.empty = gl.createVertexArray();
    if (!this.inited) this.t = +(YL.QS.get('wt') || 0);
    this.inited = true;
    this.ready = true;
  },
  targets(w, h) {
    if (this.res && this.res.w === w && this.res.h === h) return;
    const gl = YL.gl;
    if (this.res) for (const t of [this.base, this.canvas]) { gl.deleteFramebuffer(t.fb); t.texs.forEach(x => gl.deleteTexture(x.t)); }
    this.base = YL.makeTarget(Math.max(64, w >> 2), Math.max(36, h >> 2), ['rgba8', 'rgba8'], { mips: true });
    this.canvas = YL.makeTarget(w, h, ['rgba8']);
    this.res = { w, h };
  },
  // 一粒光: the first light on the water, drifting along the sun's road; at the end it goes into the dewdrop
  hero: { p: [0.98, 0.30], v: [0, 0], aim: null, k: 1 },
  arrive(px, py) { this.hero.p = [px, py]; this.hero.v = [0, 0]; },
  toPaint(nx, ny, aspect) { return [(nx * 0.5 + 0.5) * aspect + (1.7778 - aspect) * 0.5, ny * 0.5 + 0.5]; },
  pointer(nx, ny) { this.hero.aim = this.toPaint(nx, ny, YL.canvasAspect()); this.hero.aimT = this.t; },
  dew: 0, drop: 0,
  update(dt) {
    this.t += dt;
    const H = this.hero, sunX = 1.0;
    let tgt = H.aim && this.t - H.aimT < 3 ? H.aim : [sunX + 0.03 * Math.sin(this.t * 0.5), 0.30 + 0.05 * Math.sin(this.t * 0.31)];
    if (this.dew > 0) tgt = [this.dewPad[0] + 0.004, this.dewPad[1] + this.dewPad[2] * 0.12];
    for (let i = 0; i < 2; i++) { H.v[i] += (tgt[i] - H.p[i]) * 3.2 * dt; H.v[i] *= Math.exp(-dt * 2.6); H.p[i] += H.v[i] * dt; }
    this.sound(dt);
  },
  render(target, aspect) {
    const gl = YL.gl, U = YL.U;
    const w = target ? target.w : gl.drawingBufferWidth, h = target ? target.h : gl.drawingBufferHeight;
    this.targets(w, h);
    const t = this.t, H = this.hero, br = 1 + 0.07 * Math.sin(t * 2.1) + 0.03 * Math.sin(t * 5.3);
    const sun = [1.0, 0.765, 1.0, 1.0];
    // 1) the underpainting
    const B = this.base;
    gl.bindFramebuffer(gl.FRAMEBUFFER, B.fb); gl.viewport(0, 0, B.w, B.h);
    gl.disable(gl.BLEND);
    gl.useProgram(this.pBase.p);
    U(this.pBase, 'uRes', [B.w, B.h]); U(this.pBase, 'uAspect', aspect); U(this.pBase, 'uTime', t);
    gl.uniform4fv(this.pBase.u.uPad, this.pads); U(this.pBase, 'uSun', sun);
    U(this.pBase, 'uHero', [H.p[0], H.p[1], (1 - this.dew) * br, 0]);
    gl.bindVertexArray(this.empty); gl.drawArrays(gl.TRIANGLES, 0, 3);
    for (const tx of B.texs) { gl.bindTexture(gl.TEXTURE_2D, tx.t); gl.generateMipmap(gl.TEXTURE_2D); }
    // 2) the ground, then the strokes over it, big ones first
    const Cv = this.canvas;
    gl.bindFramebuffer(gl.FRAMEBUFFER, Cv.fb); gl.viewport(0, 0, Cv.w, Cv.h);
    gl.useProgram(this.pGround.p); U(this.pGround, 'uRes', [Cv.w, Cv.h]); YL.bindTex(this.pGround, 'uC', B.texs[0], 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(this.pStroke.p);
    YL.bindTex(this.pStroke, 'uC', B.texs[0], 0); YL.bindTex(this.pStroke, 'uP', B.texs[1], 1);
    // (the strokes are laid with the base texture's nearest samples: its direction must not be blended across an edge)
    gl.activeTexture(gl.TEXTURE1); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    const boil = YL.reduced ? 0 : Math.floor(t * 6);
    U(this.pStroke, 'uRes', [Cv.w, Cv.h]); U(this.pStroke, 'uTime', t); U(this.pStroke, 'uBoil', boil % 64); U(this.pStroke, 'uSun', sun);
    U(this.pStroke, 'uReveal', this.reveal * 2.4); U(this.pStroke, 'uBurst', [(sun[0] - (1.7778 - aspect) * 0.5) / aspect, 0.74]);
    for (const L of this.layers) {
      U(this.pStroke, 'uScale', L.scale);
      gl.bindVertexArray(L.vao); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, L.n);
    }
    gl.activeTexture(gl.TEXTURE1); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.disable(gl.BLEND);
    // 3) the canvas, the dewdrop, the frame
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null); gl.viewport(0, 0, w, h);
    gl.useProgram(this.pFinal.p);
    U(this.pFinal, 'uRes', [w, h]); U(this.pFinal, 'uTime', t); U(this.pFinal, 'uFade', this.fade); U(this.pFinal, 'uWhite', this.white);
    const dx = (H.p[0] - (1.7778 - aspect) * 0.5) / aspect, dy = H.p[1] - this.drop * this.drop * 0.9;
    U(this.pFinal, 'uDew', [dx, dy, 0.0045 + 0.002 * this.dew, this.dew * br]);
    YL.bindTex(this.pFinal, 'uA', Cv.tex, 0);
    gl.bindVertexArray(this.empty); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.bindVertexArray(null);
  },
  /* ---- sound: morning birds, a breath of wind in the willow, now and then a drop into the water */
  buildAudio(b) {
    const { ctx, out, noiseBuffer, loop } = b;
    const bus = ctx.createGain(); bus.gain.value = 0; bus.connect(out);
    const pink = noiseBuffer(6.3, 'pink');
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 0.5;
    const wg = ctx.createGain(); wg.gain.value = 0.05;
    loop(pink, 0.8, bp); bp.connect(wg); wg.connect(bus);
    this.snd = { ctx, bus, wg, nextBird: 0.4, nextDrip: 2.5 };
  },
  bird() {
    const S = this.snd, ctx = S.ctx; let t = ctx.currentTime + 0.05;
    const o = ctx.createOscillator(), g = ctx.createGain(); g.gain.value = 0;
    const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    o.connect(g); if (p) { p.pan.value = Math.random() * 1.4 - 0.7; g.connect(p); p.connect(S.bus); } else g.connect(S.bus);
    const base = 2400 + Math.random() * 1600, n = 3 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      const d = 0.06 + Math.random() * 0.08, f0 = base * (0.9 + 0.3 * Math.random());
      o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * (0.75 + 0.5 * Math.random()), t + d);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.03, t + 0.01); g.gain.setTargetAtTime(0, t + d * 0.7, d * 0.2);
      t += d + 0.04 + Math.random() * 0.08;
    }
    o.start(); o.stop(t + 0.3);
  },
  plip(gain = 0.08) {
    const S = this.snd, ctx = S.ctx, t0 = ctx.currentTime + 0.02;
    const o = ctx.createOscillator(); o.frequency.setValueAtTime(900, t0); o.frequency.exponentialRampToValueAtTime(2200, t0 + 0.05);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0 + 0.004); g.gain.setTargetAtTime(0, t0 + 0.01, 0.03);
    o.connect(g); g.connect(S.bus); o.start(t0); o.stop(t0 + 0.3);
  },
  sound(dt) {
    if (!this.snd) { const b = YL.AUDIO.bus && YL.AUDIO.bus(); if (b) this.buildAudio(b); else return; }
    const S = this.snd, now = S.ctx.currentTime;
    S.bus.gain.setTargetAtTime(this.fade * (this.vol ?? 1), now, 0.5);
    S.wg.gain.setTargetAtTime(0.04 + 0.03 * Math.sin(this.t * 0.4), now, 0.5);
    if ((S.nextBird -= dt) <= 0) { this.bird(); S.nextBird = 0.8 + Math.random() * 2.5; }
    if ((S.nextDrip -= dt) <= 0) { this.plip(0.04); S.nextDrip = 2 + Math.random() * 4; }
  },
};
})();

</script>
<script>
/* ---- src/director.js ---- */
/* ============================================================================
   导演 —— 时间线、镜头与转场。
   第一幕 · 雨夜的房间
     intro     台灯亮着；你点它，或者等它自己闪两下——一粒光从灯丝里跳出来，灯熄了
     wander    它在屋里飘：茶的热气、练习本、挂钟、吊兰，最后停到窗玻璃上
     window    镜头推近玻璃，焦点落在它和雨滴上
   转场 1→2 · 雨滴里的白昼
     daydrops  窗上每一颗雨滴里倒映的，从夜里的街慢慢变成晴空、积云和田野（窗外仍是雨夜）
     dive      镜头扎进它所在的那颗雨滴；雨滴的圆从它身上张开，夏天从里面涌出来
   第二幕 · 盛夏午后
     summer    光在风里；光标就是风，按住不动风就停
   转场 2→3 · 被抽走的颜色
     updraft   一阵上升的风把它带走；镜头跟着它仰起来，望向那座最高的积云
     cloud     钻进云里：一片白，越来越厚、越来越暗、越来越冷；开始下雪；颜色被一层层抽走，最后只剩一张纸
   第三幕 · 雪夜·木刻
     print     这张纸被印上去：先靛版，再墨版，最后朱版——世界一块版一块版地出现；它随着雪落下来
     woodcut   它找到那盏黑着的灯笼，钻进去，灯亮了；你在黑处划一刀，它就沿着你的刀痕走
   转场 · 灯笼里
     inlantern 镜头推进灯笼，直到只剩它透亮的纸；那张纸变成另一盏灯的纸
   走马灯·皮影
     shadow    一盏走马灯：烛火的热气推着纸轮转，骑马的人、跃起的鲤鱼、浪、渔船的影子在纸幕上奔跑
     snuff     烛火一缩，纸幕暗下去，影子的黑涌上来，只剩那一点火——它落进黑水里
   （旧的出口，只在调试里还能看到：leave 刻一条路走到冰窟窿，tear 纸从洞口撕开）
   第四幕 · 深海
     deepsea   只有它照亮的那一小团水是看得见的。手牵着它走；不动，黑暗里的小生命就过来看它；
               一会儿，黑暗里出现另一粒一模一样的光
   转场 · 墨
     inkbloom  黑水化开：像一滴墨落进清水，翻涌、散成丝，沉下来，沉成山
   水墨·烟雨山水
     ink       远山、中景、石壁和老松一笔一笔洇开；雾流过山腰，细雨；一点朱砂落在小舟上
     dawn      天边破晓：颜色从水墨里渗出来
   印象派·清晨睡莲池
     burst     颜色炸开：一万多笔从太阳那里往外铺开，成了一片清晨的睡莲池
     pond      全是笔触的水、天光、柳、睡莲；一粒光是水上第一点阳光
     dew       它停进一片叶子上的露珠里；露珠滚落——落进那杯茶
   （旧的出口，只在调试里还能看到：rise 往上浮到杯底）
   转场 4→5 · 杯底
     rise      它往上浮。头顶有一圈暖光——杯口那么大，边上一圈白搪瓷，几片茶叶的影子漂着；水越来越像茶
   第五幕 · 回到房间
     surface   穿出水面：是书桌上那只搪瓷杯里的茶。镜头从茶面上方慢慢拉开，雨夜的房间
     home      它飞回台灯，钻进灯丝；灯重新亮起，房间又暖了
     end       雨还在下。（再点一下台灯，就从头再来一遍）
   调试：?phase=wander|window|daydrops|dive|summer|updraft|cloud|print|woodcut|leave|tear|deepsea|rise|surface &pt=秒

   ========================================================================== */
(() => {
'use strict';
const YL = window.YL;

  { p: S.BULB },
  { p: [-0.50, 0.985, 0.27], travel: 0.7, dwell: 1.0 },     // drops out of the shade's open bottom, looks around
  { p: [-0.17, 0.905, 0.19], travel: 2.4, dwell: 2.2 },     // into the tea's steam
  { p: [0.03, 0.80, 0.31], travel: 2.2, dwell: 1.8 },       // low over the open notebook
  { p: [-0.62, 1.60, 0.12], travel: 3.2, dwell: 1.8 },      // up to the clock
  { p: [0.26, 1.07, 0.04], travel: 3.4, dwell: 2.4 },       // in among the spider plant's leaves
  { p: [0.20, 1.42, -0.098], travel: 2.8, dwell: 0 },       // to the glass, among the drops
];
let T_HOLD = 2.5, T_DAY = 4.5, T_DIVE = 2.6;
let T_SUMMER = 30, T_UP = 6.5, T_CLOUD = 6.0, T_PRINT = 4.8, T_WOOD = 50, T_ZOOM = 3.0, T_SHADOW = 36, T_SNUFF = 2.6, T_TEAR = 4.4, T_WHALE = 10, T_LURE = 24, T_SEA = 46, T_BLOOM = 4.5, T_INK = 30, T_DAWN = 4.0, T_BURST = 3.0, T_POND = 30, T_DEW = 3.0, T_RISE = 8, T_SURF = 4.5;
/* ---- 成片（?film）：没有人要等，每个世界只演最好的两三拍就走。观众的手也编好了：夏天里一阵风扫过、按住不动；
   深海里小鱼一齐受惊，然后鲸来了。 */
const FILM = QS.has('film');
const FILM_ROUTE = [
  { p: S.BULB },
  { p: [-0.50, 0.985, 0.27], travel: 0.6, dwell: 0.4 },
  { p: [-0.17, 0.905, 0.19], travel: 1.5, dwell: 0.8 },     // the tea's steam
  { p: [0.26, 1.07, 0.04], travel: 2.0, dwell: 0.7 },       // the spider plant
  { p: [0.20, 1.42, -0.098], travel: 1.8, dwell: 0 },       // the glass
];
if (FILM) ({ T_HOLD, T_DAY, T_DIVE, T_SUMMER, T_UP, T_CLOUD, T_PRINT, T_ZOOM, T_SHADOW, T_SNUFF, T_TEAR, T_WHALE, T_SEA, T_BLOOM, T_INK, T_DAWN, T_BURST, T_POND, T_DEW, T_RISE, T_SURF } =
  { T_HOLD: 0.4, T_DAY: 1.7, T_DIVE: 2.0, T_SUMMER: 7.6, T_UP: 3.2, T_CLOUD: 4.2, T_PRINT: 2.6, T_ZOOM: 2.6, T_SHADOW: 13.0, T_SNUFF: 2.2, T_TEAR: 3.2, T_WHALE: 4.0, T_SEA: 15.0, T_BLOOM: 4.0, T_INK: 10.0, T_DAWN: 3.2, T_BURST: 2.6, T_POND: 9.0, T_DEW: 2.8, T_RISE: 5.0, T_SURF: 3.0 });
const ease = x => x * x * (3 - 2 * x), easeIn = x => x * x * x;

// someone who has asked their system for less motion: the print stops 'boiling' between printings
YL.reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const D = YL.director = {
  phase: 'intro', t: 0, pt: 0, clock: 0, later: [],
  go(ph) { D.phase = ph; D.pt = 0; if (FILM) console.log('film ' + D.clock.toFixed(2) + ' ' + ph); },
  // do something a little later, by the film's own clock (the recorder runs far slower than real time)
  after(s, fn) { D.later.push({ at: D.clock + s, fn }); },
  escape() {
    if (D.phase !== 'intro') return;
    D.go('wander'); D.t = 0;
    HERO.on = true; HERO.glow = 0; YL.hero.glowTarget = 1;
    YL.hero.setRoute(FILM ? FILM_ROUTE : ROUTE);
    LIGHT.on = 0; LIGHT.dip = 0;
    YL.AUDIO.click && YL.AUDIO.click(0);
    D.after(0.35, () => YL.AUDIO.motif && YL.AUDIO.motif(-0.4));
  },
  // the window shot (and where the dive goes)
  winShot(aspect) {

  },
  update(dt, realT) {
    D.t += dt; D.pt += dt; D.clock += dt;
    for (const e of D.later.filter(e => e.at <= D.clock)) { D.later.splice(D.later.indexOf(e), 1); e.fn(); }
    if (FILM) D.fade(dt);
    const summer = YL.worlds.summer;
    if (D.phase === 'intro') {
      // it wants out: two little flickers of the lamp, then it goes by itself (in the film, almost at once)
      const t = D.t + (FILM ? 6.6 : 0);
      LIGHT.dip = 0.55 * (smooth(7.4, 7.5, t) - smooth(7.6, 7.75, t)) + 0.35 * (smooth(8.3, 8.36, t) - smooth(8.45, 8.6, t));
      if (t > 10) D.escape();
      YL.cam = null;
      return;
    }
    if (D.phase === 'summer' || D.phase === 'updraft' || D.phase === 'cloud') { D.toPrint(dt); return; }
    if (D.phase === 'print' || D.phase === 'woodcut' || D.phase === 'inlantern' || D.phase === 'leave') { D.inPrint(dt); return; }
    if (D.phase === 'shadow' || D.phase === 'snuff') { D.inShadow(dt); return; }
    if (D.phase === 'inkbloom' || D.phase === 'ink' || D.phase === 'dawn') { D.inInk(dt); return; }
    if (D.phase === 'burst' || D.phase === 'pond' || D.phase === 'dew') { D.inPond(dt); return; }
    if (D.phase === 'tear' || D.phase === 'deepsea' || D.phase === 'rise') { D.inSea(dt); return; }
    if (D.phase === 'surface' || D.phase === 'home' || D.phase === 'end') { D.inRoom(dt, realT); return; }

    const L = YL.hero.routeLength(), Tw = L - (FILM ? 2.4 : 2.0), Tww = FILM ? 2.8 : 3.5;
    if (D.phase === 'wander' && D.t > L) D.go('window');
    if (D.phase === 'window' && D.pt > 0.2 && !summer.ready) summer.init();                 // compile the next world early
    if (D.phase === 'window' && D.pt > T_HOLD) D.go('daydrops');
    if (D.phase === 'daydrops' && D.pt > T_DAY) D.go('dive');
    if (D.phase === 'dive' && D.pt > T_DIVE) { D.enterSummer(); return; }

    const aspect = YL.canvasAspect();
    const base = YL.framing(aspect), h = HERO.p;

      const u = easeIn(clamp(D.pt / T_DIVE, 0, 1));

      pos = pos.map((v, i) => lerp(v, [h[0] - 0.01, h[1], S.GLASS_Z + 0.09][i], u));
      tgt = tgt.map((v, i) => lerp(v, at[i], u));

    const fwd = V.norm(V.sub(tgt, pos));
    const focus = lerp(V.dot(V.sub(h, pos), fwd), (S.GLASS_Z - pos[2]) / fwd[2], ww);
    YL.cam = { pos, tgt, vfov, focus: Math.max(focus, 0.05), w: smooth(0, 2.5, D.t) };

    if (D.phase === 'daydrops' || D.phase === 'dive') {
      const u = D.phase === 'daydrops' ? ease(clamp(D.pt / T_DAY, 0, 1)) : 1;
      YL.sharpMix = u; YL.sharpGain = 0.45;

  },
  enterSummer() {
    D.go('summer');

    D.world = 'summer'; D.placeHero = true;              // (placed on the first summer frame, once the world exists)
    D.after(0.4, () => YL.AUDIO.motif && YL.AUDIO.motif(0, 0.05, 1));
  },
  /* ---- the film's own hand. In the summer: one sweep across the field (a gust: the grass goes down in a wave and the
     light is blown along), then a press held still (the wind drops and the cicadas swell). */
  filmHand(world, t) {
    const set = (nx, ny, speed, down) => { YL.ptr = { nx, ny, t: YL.now(), speed }; YL.ptrDown = down; };
    if (world === 'summer') {
      const a = [-0.85, -0.40], b = [0.80, -0.05], t0 = 1.4, t1 = 2.2;
      if (t > t0 && t < t1) { const u = ease((t - t0) / (t1 - t0)); set(lerp(a[0], b[0], u), lerp(a[1], b[1], u), 2.6, true); }
      else if (t >= t1 && t < t1 + 0.1) YL.ptrDown = false;

      else if (t >= 6.6 && YL.ptrDown) YL.ptrDown = false;

  // the film opens out of black and closes into it
  fade(dt) {

    if (!el) { el = D.fadeEl = document.createElement('div'); el.style.cssText = 'position:fixed;inset:0;background:#000;pointer-events:none;z-index:50'; document.body.appendChild(el); }
    const a = Math.max(1 - smooth(0.2, 1.6, D.clock), D.phase === 'end' ? smooth(4.0, 6.0, D.pt) : 0);
    el.style.opacity = a.toFixed(3);

  },
  // ---- out of the summer: up into the cloud, and through it into the print
  toPrint(dt) {
    const summer = YL.worlds.summer, wood = YL.worlds.woodcut, H = summer.hero;
    if (D.phase === 'summer') { if (FILM) D.filmHand('summer', D.pt); if (D.pt > T_SUMMER) { YL.ptrDown = false; D.go('updraft'); } return; }
    // the light is carried up toward the tower of cloud, further and further away; the eye follows it up
    const T = summer.tower, dir = [Math.sin(T[0]) * Math.cos(T[1]), Math.sin(T[1]), -Math.cos(T[0]) * Math.cos(T[1])];

  },
  // ---- in the print: the blocks go on one after another; later, the way out
  inPrint(dt) {

      const t = D.pt;
      const k = T_PRINT / 4.8;
      wood.show = [ease(clamp(t / (1.6 * k), 0, 1)), ease(clamp((t - 1.3 * k) / (1.6 * k), 0, 1)), ease(clamp((t - 2.7 * k) / (1.3 * k), 0, 1))];
      wood.vol = ease(clamp(t / 3, 0, 1));
      if (D.pt > T_PRINT) { wood.show = [1, 1, 1]; D.go('woodcut'); }
    } else if (D.phase === 'woodcut') {
      wood.vol = 1;
      // once the lantern is lit, a word on what the hand can do here (only once, and never in a screenshot)
      if (!D.carveHint && wood.hero.mode === 'home' && D.pt > 3 && !YL.DBG.shot) {
        D.carveHint = true;
        const h = document.getElementById('hint');
        if (h) { h.textContent = '在黑处划一刀'; h.classList.add('show'); setTimeout(() => h.classList.remove('show'), 6000); }
      }

      if (D.pt > (FILM ? 0.6 : 20) && !wood.userCut && !wood.moonDone && wood.hero.mode === 'home') wood.carveMoon();
      const done = FILM ? wood.moonDone && !wood.queue.length && wood.hero.mode === 'home' && D.pt > 5 : D.pt > T_WOOD;
      if (done && wood.hero.mode === 'home') { D.go('inlantern'); const sh = YL.worlds.shadow; if (!sh.ready) sh.init(); }

  // ---- inside the lantern of shadows; then the candle shrinks to nothing, and there is only the black water
  inShadow(dt) {
    const sh = YL.worlds.shadow, sea = YL.worlds.deepsea;
    if (D.phase === 'shadow') {
      sh.pull = Math.min(1, D.pt / 3.4);

    } else if (D.phase === 'snuff') {

  // ---- through the ice: the print tears open onto the deep, and then there is only the deep

      if (!FILM && D.pt > T_LURE && sea.lure.state === 'off' && (!sea.pass || sea.t - sea.pass.t0 > 12)) sea.startLure();

        const P = ink.toPaint(YL.V.dot(v, c.right) / (z * c.tan[0]), YL.V.dot(v, c.up) / (z * c.tan[1]), aspect);

  // ---- ink: the deep's black breaking up into it, the painting laying itself down, then the dawn
  inInk(dt) {

    const G = (a, b, x) => smooth(a, b, x);

      const u = clamp(D.pt / T_BLOOM, 0, 1);
      ink.bloom = 1 - smooth(0.12, 1.0, u);
      ink.grow = [G(0.35, 0.85, u), G(0.55, 1.0, u), 0, 0];
      ink.vol = smooth(0.1, 0.8, u); sea.vol = 1 - smooth(0.0, 0.3, u);

      const t = D.pt;
      ink.grow = [1, 1, G(0.0, 2.6, t), G(2.2, 4.2, t)];
      if (D.pt > T_INK) D.go('dawn');

  // ---- the pond: bursting out of the dawn; then the light into a dewdrop, and the drop into the tea

  // ---- back in the room: out of the tea, home to the lamp
  surface() {

    D.go('surface'); D.world = 'room'; YL.roomTarget = null;
    sea.vol = 0; if (wood) wood.vol = 0; if (YL.worlds.ink) YL.worlds.ink.vol = 0; if (YL.worlds.pond) YL.worlds.pond.vol = 0; YL.roomVol = 1;

      { p: tea },
      { p: [S_.MUG_X, S_.DESK_TOP + 0.17, S_.MUG_Z + 0.01], travel: 1.3, dwell: 0.9 },     // up out of the steam: it looks round — it's home
      { p: [-0.36, 1.04, 0.27], travel: 1.9, dwell: 0.3 },
      { p: S_.BULB, travel: 1.7, dwell: 0 },

  inRoom(dt, realT) {
    const aspect = YL.canvasAspect(), base = YL.framing(aspect), S_ = YL.S, h = HERO.p;
    if (D.phase === 'surface' || D.phase === 'home') YL.hero.update(dt, realT);
    // the shot: from just above the tea, drawing back to the room, with a lean toward the light
    const u = ease(clamp(D.pt / T_SURF, 0, 1));
    const close = { pos: [S_.MUG_X + 0.05, S_.DESK_TOP + 0.13, S_.MUG_Z + 0.12], tgt: [S_.MUG_X, S_.DESK_TOP + 0.075, S_.MUG_Z], vfov: 42 };

  },
  // tapping the lamp at the end: the light jumps out again, and the film runs once more

    const sm = YL.worlds.summer, wd = YL.worlds.woodcut, sea = YL.worlds.deepsea;
    if (sm) { sm.lift = 0; sm.zoom = 0; if (sm.hero) { sm.hero.fly = null; sm.hero.on = false; } sm.vol = 0; }
    if (wd) { wd.gone = false; wd.hero.mode = 'home'; wd.show = [1, 1, 1]; wd.lanLight = 1; wd.vol = 0; wd.zoomIn = 0; wd.whole = false; }
    const sh = YL.worlds.shadow; if (sh) { sh.vol = 0; sh.light = 1; sh.pull = 1; sh.sink = 0; }

    const pd = YL.worlds.pond; if (pd) { pd.vol = 0; pd.dew = 0; pd.drop = 0; pd.white = 0; }
    if (sea) { sea.hero.on = false; sea.hero.hold = null; sea.pass = null; sea.rise = 0; sea.riseY = 0; sea.surf = 0; sea.tea = 0; sea.flash = 0; sea.lure.state = 'off'; sea.vol = 0; }
    D.scared = false;

  },
  tearSound() {
    const b = YL.AUDIO.bus && YL.AUDIO.bus(); if (!b) return;
    const { ctx, out } = b, t0 = ctx.currentTime + 0.05;

// ---- the iris: during the dive the room and the summer are both drawn into textures and composited here
const FS_IRIS = `#version 300 es
precision highp float;
uniform sampler2D uA, uB; uniform vec2 uRes, uC; uniform float uR, uFlash;
out vec4 o;
void main(){

// ---- inside the cloud: the summer drowned in white, then cold, then snow, the colour drained out of it, then paper
const FS_DRAIN = `#version 300 es
precision highp float;
uniform sampler2D uA, uB; uniform vec2 uRes; uniform float uTime, uFog, uCold, uSnow, uPaper; uniform vec3 uHero;
out vec4 o;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

// one layer of falling flakes, drifting with the wind; near ones big and soft, far ones small; crisper as the world turns to paper
float flakes(vec2 p, float cell, float rad, float speed, float dens, float blur, float seed){
  p.y += uTime * speed; p.x += uTime * speed * 0.35 + 0.3 * cell * sin(uTime * 0.7 + p.y / cell * 0.4 + seed);

// ---- the print tearing open onto the deep
const FS_TEAR = `#version 300 es
precision highp float;
uniform sampler2D uA, uB; uniform vec2 uRes, uC, uR0; uniform float uU, uZoom;

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);

// ---- one world dissolving into the next through a warm glow
const FS_MIX = `#version 300 es

// ---- screenshots: jump straight to a moment
if (QS.get('phase')) {
  const ph = QS.get('phase'), pt = +(QS.get('pt') || 0);
  D.escape();
  LIGHT.level = 0; HERO.glow = 1;
  const L = YL.hero.routeLength();
  if (ph === 'wander') { YL.hero.t = pt; D.t = pt; }
  else {
    YL.hero.t = L + 5; D.t = L + 5;
    const later = ['summer', 'updraft', 'cloud', 'print', 'woodcut', 'inlantern', 'shadow', 'snuff', 'leave', 'tear', 'deepsea', 'inkbloom', 'ink', 'dawn', 'burst', 'pond', 'dew', 'rise', 'surface'];
    if (later.includes(ph)) {
      D.irisCenter = [0.1, 0.1]; D.enterSummer();
      if (ph === 'summer') D.pt = pt;
      else if (ph === 'updraft' || ph === 'cloud') { D.go(ph); D.pt = pt; }
      else {
        // straight into the print (once the GL context exists: see renderFrame)
        D.world = 'woodcut'; YL.roomVol = 0; D.jump = { ph, pt };
        if (ph === 'deepsea' || ph === 'rise') { D.world = 'deepsea'; D.jump = null; D.go(ph); D.pt = pt; D.seaJump = true; }
        if (ph === 'shadow' || ph === 'snuff') { D.world = 'shadow'; D.jump = null; D.go(ph); D.pt = pt; YL.worlds.shadow.t = 1 + pt; }
        if (ph === 'burst' || ph === 'pond' || ph === 'dew') { D.world = ph === 'burst' ? 'ink' : 'pond'; D.jump = null; D.go(ph); D.pt = pt; YL.worlds.ink.dawn = 1; }
        if (ph === 'inkbloom' || ph === 'ink' || ph === 'dawn') { D.world = 'ink'; D.jump = null; D.go(ph); D.pt = pt; const k = YL.worlds.ink; k.bloom = ph === 'inkbloom' ? 1 : 0; k.grow = ph === 'inkbloom' ? [0, 0, 0, 0] : [1, 1, 1, 1]; }
        if (ph === 'surface') { D.jump = null; YL.roomVol = 1; setTimeout(() => { D.surface(); D.pt = pt; YL.hero.t = pt; if (pt > T_SURF) D.go('home'); }, 0); }
      }
    }
    else { D.go(ph); D.pt = pt; }
  }
}
})();
