vec3 mirrorScene(vec3 p, vec3 r){
  if (r.z > 0.02){
    float tw = (FAC_Z - p.z) / r.z;
    vec3 q = p + r * tw;
    if (q.y < 10.0){
      if (abs(q.x - WIN_CX) < WIN_HW && abs(q.y - WIN_CY) < WIN_HH){
        float bar = smoothstep(MW + 0.01, MW, abs(q.x)) + smoothstep(TW + 0.01, TW, abs(q.y - TRANSOM_Y));
        return mix(uWinL * 1.3, vec3(0.004, 0.006, 0.004), sat(bar));
      }
      vec3 a = abs(q - UPW_C), b = abs(q - NBW_C);
      if ((a.x < WIN_HW && a.y < WIN_HH) || (b.x < WIN_HW && b.y < WIN_HH)) return skyRad(r) * 0.25 + uCityGlow * 0.004;
      float rr; vec3 alb = (q.y < -0.1 ? plinthAlb(q) : wallAlb(q, rr)) * 0.72;          // wet, like the wall itself
      return alb / PI * outdoorE(q, vec3(0.0, 0.0, -1.0), 0.6 + 0.4 * smoothstep(0.0, 0.6, q.y - PAVE_Y), false);
    }
  }
  return skyRad(r);
}
vec3 envOut(vec3 r){          // the street behind the viewer, as the glass mirrors it (rendered from the window)
  r.z = min(r.z, -0.03); r = normalize(r);
  return textureLod(uSharp, dirToEq(r), 0.5).rgb;
}

vec3 shadeStreet(vec3 p, vec3 n, vec3 rd, float id){
  vec3 v = -rd;
  float ao = aoS(p, n);
  float rough = 0.8, wetK = 0.6; vec3 alb = vec3(0.3), emis = vec3(0.0), f0 = vec3(0.04);
  float snowy = uSnow * smoothstep(0.6, 0.9, n.y);
  if (id == S_WALL){ alb = wallAlb(p, rough); alb *= 0.72; }                    // wet lime-wash darkens
  else if (id == S_PLINTH) { alb = plinthAlb(p) * 0.75; rough = 0.6; }
  else if (id == S_STONE){ alb = vec3(0.30, 0.29, 0.27) * (0.7 + 0.4 * fbm(p.xy * 9.0 + p.z * 5.0)) * (n.y > 0.5 ? 0.6 : 0.8); rough = n.y > 0.5 ? 0.25 : 0.6; }
  else if (id == S_PIPE){ alb = mix(vec3(0.08, 0.10, 0.09), vec3(0.22, 0.10, 0.05), smoothstep(0.5, 0.8, fbm(p.xy * vec2(30.0, 4.0)))); rough = 0.35; }
  else if (id == S_AC){
    vec3 q = p - AC_C;
    alb = vec3(0.52, 0.50, 0.44) * (0.85 + 0.15 * fbm(q.xy * 20.0));
    alb = mix(alb, vec3(0.30, 0.15, 0.07), 0.6 * smoothstep(0.55, 0.8, fbm(vec2(q.x * 25.0, q.y * 3.0))) * smoothstep(0.0, -0.25, q.y));   // rust runs
    if (n.z < -0.7){
      vec2 g = q.xy - vec2(0.12, 0.0); float r = length(g);
      float grille = step(r, 0.21) * (0.5 + 0.5 * step(0.5, fract(r * 55.0)));
      alb = mix(alb, vec3(0.03), grille * 0.85);
      alb = mix(alb, vec3(0.04), step(abs(q.x + 0.29), 0.06) * step(abs(q.y), 0.2) * step(0.5, fract(q.y * 45.0)));   // louvres
    }
    rough = 0.45;
  }
  else if (id == S_IRON || id == S_CABLE){ alb = vec3(0.025, 0.024, 0.022); rough = 0.4; }
  else if (id == S_ENAMEL){
    bool inner = dot(n, normalize(p - WL_P)) < 0.0;
    alb = inner ? vec3(0.75, 0.74, 0.70) : vec3(0.05, 0.16, 0.10); rough = 0.12;
    if (inner) emis = uWallI * 0.75 / dot(p - WL_P, p - WL_P) * 0.75 / PI;           // the white enamel inside, lit by the bulb
  }
  else if (id == S_BULB){ emis = uWallI / (PI * 0.032 * 0.032) * 0.6 + vec3(0.02); alb = vec3(0.0); }
  else if (id == S_GLASS2){
    // the other windows: dark panes that mirror the street; one may have a lit curtain behind it
    vec3 c = abs(p - UPW_C).y < WIN_HH + 0.01 && abs(p.x - UPW_C.x) < WIN_HW + 0.01 ? UPW_C : (p.y < 0.0 ? BSW_C : NBW_C);
    vec2 q = p.xy - c.xy;
    float bars = max(smoothstep(0.03, 0.02, abs(q.x)), smoothstep(0.025, 0.015, abs(q.y - 0.3))) + smoothstep(WIN_HW - 0.05, WIN_HW - 0.04, abs(q.x)) + smoothstep(WIN_HH - 0.05, WIN_HH - 0.04, abs(q.y));
    float lit = c == BSW_C ? 0.0 : step(hash11(c.x * 3.1 + 7.0), uOcc * 1.4);
    vec3 curtain = vec3(0.9, 0.55, 0.28) * (0.6 + 0.4 * sin(q.x * 40.0 + 2.0 * sin(q.y * 3.0))) * 0.035 * lit;
    vec3 rr = reflect(rd, vec3(0.0, 0.0, -1.0));
    float F = fresnel(max(dot(v, vec3(0.0, 0.0, -1.0)), 0.0), 1.0, NG);
    vec3 glassC = envOut(rr) * F * 1.6 + curtain * (1.0 - F) + lampSpec(p, vec3(0.0, 0.0, -1.0), v, 0.01, vec3(0.04));
    vec3 frameC = vec3(0.12, 0.10, 0.07) / PI * outdoorE(p, n, ao, false);
    return mix(glassC, frameC, sat(bars));
  }
  else if (id == S_PAVE){
    vec2 g = p.xz / 0.3, gi = floor(g), gf = fract(g);
    float th = hash12(gi);
    float grout = 1.0 - smoothstep(0.0, 0.035, min(min(gf.x, 1.0 - gf.x), min(gf.y, 1.0 - gf.y)));
    alb = vec3(0.27, 0.26, 0.24) * (0.75 + 0.35 * th) * (0.85 + 0.25 * vnoise(p.xz * 30.0)) * (1.0 - 0.45 * grout) * 0.7;
    // puddles where the pavers have sunk: by the wall under the sill drip, round the downpipe's shoe, in a few dips
    float pud = fbm(p.xz * 0.55 + 11.0) + 0.3 * smoothstep(1.3, 0.3, length((p.xz - vec2(0.45, -6.1)) * vec2(0.8, 1.2)) + 0.25 * vnoise(p.xz * 3.0)) + 0.25 * smoothstep(0.9, 0.0, abs(p.x - PIPE_X)) * smoothstep(1.4, 0.3, abs(p.z + 0.8)) + 0.12 * smoothstep(1.5, 0.4, p.z - FAC_Z + 1.4) * smoothstep(1.2, 0.5, abs(p.x));
    float water = smoothstep(0.56, 0.6, pud + 0.05 * (th - 0.5) - 0.04 * grout) * (1.0 - uSnow);
    // fallen plane leaves in autumn, stuck flat to the wet paving
    if (uSeason > 1.5 && uSeason < 2.5){
      vec2 lg = p.xz / 0.45, li = floor(lg); vec3 lh = hash32(li + 5.0);
      if (lh.z < 0.35){
        vec2 lq = rot2((fract(lg) - 0.3 - 0.4 * lh.xy) * 0.45, lh.z * 40.0);
        float a = atan(lq.y, lq.x), r = length(lq);
        float leaf = smoothstep(0.004, 0.0, r - 0.05 * (0.65 + 0.35 * abs(cos(2.5 * a))));
        alb = mix(alb, mix(vec3(0.42, 0.24, 0.05), vec3(0.3, 0.12, 0.04), lh.x) * 0.8, leaf * (1.0 - water * 0.5));
      }
    }
    if (snowy > 0.0 || uSnow > 0.0){
      float trod = smoothstep(0.35, 0.65, fbm(p.xz * vec2(1.6, 0.5) + 3.0));          // a trodden, slushy path along the kerb side
      snowy = uSnow * (1.0 - 0.75 * trod);
    }
    vec3 nW = normalize(vec3(-ripples(p.xz).x, 1.0, -ripples(p.xz).y));
    vec3 nn = normalize(mix(n, nW, water));
    float cw = max(dot(nn, v), 0.0);
    float Fw = fresnel(cw, 1.0, NW);
    vec3 r = reflect(rd, nn);
    vec3 E = outdoorE(p, n, ao, true);
    vec3 dry = alb / PI * E + lampSpec(p, n, v, 0.32, vec3(0.04)) + F_Schlick(vec3(0.04), max(dot(n, v), 0.0)) * skyRad(reflect(rd, n)) * 0.4;
    vec3 wetc = alb * 0.35 / PI * E * (1.0 - Fw) + Fw * mirrorScene(p, r) + lampSpec(p, nn, v, 0.02, vec3(0.02)) * 1.0;
    vec3 c = mix(dry, wetc, water);
    c = mix(c, vec3(0.75, 0.76, 0.78) / PI * E, snowy);
    return c;
  }
  else if (id == M_FRAME){
    Mat m = getMat(id, p, n); alb = m.alb * 0.8; rough = 0.45;
  }
  if (snowy > 0.0) alb = mix(alb, vec3(0.8, 0.81, 0.83), snowy);
  vec3 E = outdoorE(p, n, ao, true);
  vec3 col = emis + alb / PI * E;
  float a = rough * rough;
  col += lampSpec(p, n, v, max(a, 0.02), f0) * (1.0 - snowy);
  col += F_Schlick(f0, max(dot(n, v), 0.0)) * skyRad(reflect(rd, n)) * (1.0 - rough) * 0.6 * ao;
  return col;
}

// ---- our window from outside: drops, glass, and the room behind them
vec3 windowOut(vec3 P, vec3 rd){
  vec2 guv = (P.xy - vec2(WIN_X0, WIN_Y0)) / vec2(WIN_X1 - WIN_X0, WIN_Y1 - WIN_Y0);
  vec4 st = texture(uState, guv);
  float M = smoothstep(0.02, 0.9, st.r), Fin = min(st.b * uFogK, 1.0), rim = st.a;
  vec2 e = 1.0 / uHTex, emm = e * uSimMM;
  float h = texture(uHeight, guv).r / uHScale;
  float hx = (texture(uHeight, guv + vec2(e.x, 0.0)).r - texture(uHeight, guv - vec2(e.x, 0.0)).r) / uHScale / (2.0 * emm.x);
  float hy = (texture(uHeight, guv + vec2(0.0, e.y)).r - texture(uHeight, guv - vec2(0.0, e.y)).r) / uHScale / (2.0 * emm.y);
  float wet = smoothstep(0.0, 0.03, h);
  vec3 N = normalize(vec3(-hx, -hy, -1.0));                  // the drop's surface, facing the street
  vec3 v = -rd;
  // into the drop, through the pane, out into the room: the drop is a little lens that shows the room upside down
  float ci = max(dot(v, N), 1e-3);
  float Fw = fresnel(ci, 1.0, NW);
  vec3 tw = refract(rd, N, 1.0 / NW);
  vec2 xy = tw.xy * NW; float s2 = dot(xy, xy);
  vec3 dDrop = s2 < 1.0 ? vec3(xy, sqrt(1.0 - s2)) : vec3(0.0, 0.0, 1.0);
  vec3 dIn = normalize(mix(rd, dDrop, wet));
  float Fg = fresnel(abs(rd.z), 1.0, NG);
  // march the room
  vec3 roomC = vec3(0.0);
  float tr = 0.003; vec2 hr = vec2(1.0, 0.0); bool rh = false;
  for (int i = 0; i < 100; i++){
    hr = map(P + dIn * tr, true);
    if (hr.x < 0.0003 * tr + 0.0001){ rh = true; break; }
    tr += hr.x * 0.96;
    if (tr > 6.0) break;
  }
  if (rh){ vec3 q = P + dIn * tr; roomC = shade(q, calcNormal(q), dIn, hr.y); }
  vec4 sm = smokeVol(P, dIn, rh ? tr : 6.0);
  roomC = roomC * sm.a + sm.rgb;
  // the outside mist scatters a little of everything; the inside condensation glows with the lamp behind it
  vec3 Lb = BULB - P; float ld2 = dot(Lb, Lb);
  vec3 Eg = uLampI * lampEmitFactor(-Lb * inversesqrt(ld2)) * max(Lb.z * inversesqrt(ld2), 0.0) / ld2 + uAmbL;
  vec3 Lw = WL_P - P; float lw2 = dot(Lw, Lw);
  vec3 Eo = uWallI * lampMask(-Lw * inversesqrt(lw2)) * max(-Lw.z, 0.0) * inversesqrt(lw2) / lw2 + uCityGlow + uEVert;   // light falling on the glass from the street
  roomC = mix(roomC, uWinL, M * 0.3) + Eo * 0.006 * M;
  float fogA = sat(Fin * 0.85 + rim * 0.35);
  vec3 fogC = (Eg * 0.2 + uWinL * 1.1 + Eo * 0.01) * (0.9 + 0.2 * vnoise(guv * uSimMM * 2.5));
  vec3 through = mix(roomC, fogC, fogA);
  // frost on the inside, lit from the room
  if (uFrost > 0.0){
    float yb = P.y < TRANSOM_Y ? P.y - (WIN_Y0 + FW) : P.y - (TRANSOM_Y + TW);
    float xe = min(min(abs(P.x - (WIN_X0 + FW)), abs(P.x + MW)), min(abs(P.x - MW), abs(P.x - (WIN_X1 - FW))));
    vec2 fq = P.xy * vec2(75.0, 60.0);
    float fern = 0.0, amp = 0.5;
    for (int k = 0; k < 4; k++){ fern += amp * (1.0 - abs(2.0 * vnoise(fq) - 1.0)); fq = FBM_R * fq * 1.1 + 5.3; amp *= 0.55; }
    float corner = min(yb, xe) + 0.6 * max(yb, xe);
    float frost = smoothstep(0.62, 0.86, fern + 0.95 - min(min(yb, xe * 1.6) * 15.0, corner * 11.0)) * (P.y < TRANSOM_Y ? 1.0 : 0.55);
    through = mix(through, Eg * 0.06 + uWinL * 0.5 + Eo * 0.03, frost * 0.8);
  }
  // the paper-cuts on the inside: red paper glowing with the lamp behind it
  float aaW = length(fwidth(P.xy)) * 0.8 + 0.0002;
  vec2 dL = vec2(P.x - (WIN_X0 + FW), (TRANSOM_Y - TW) - P.y), dR = vec2((WIN_X1 - FW) - P.x, (TRANSOM_Y - TW) - P.y);
  float tR = atan(dR.y, dR.x) / (PI * 0.5);
  float keep = smoothstep(0.02, -0.02, tR - 0.6 - 0.12 * (vnoise(dR * 260.0) - 0.5));
  float pc = max(paperCut(dL, 0.112, aaW), paperCut(dR, 0.112, aaW) * keep);
  through = mix(through, (Eg * vec3(0.10, 0.008, 0.006) + uWinL * vec3(0.6, 0.06, 0.05)) * (0.85 + 0.3 * vnoise(P.xy * 300.0)) + Eo * vec3(0.05, 0.01, 0.01), pc);
  // reflections: the flat pane mirrors the street behind the viewer and the lane lamp; the drops mirror it small and bright
  vec3 Rg = reflect(rd, vec3(0.0, 0.0, -1.0));
  vec3 dryC = through * (1.0 - Fg) * (1.0 - Fg) + (envOut(Rg) * Fg * (1.0 + 0.85 * (1.0 - M)) + lampSpec(P, vec3(0.0, 0.0, -1.0), v, 0.004 + 0.05 * M, vec3(0.04))) * (1.0 - 0.5 * M);
  vec3 Rw = reflect(rd, N);
  vec3 wetC = through * (1.0 - Fw) * (1.0 - Fg) * step(s2, 1.0) + envOut(Rw) * Fw + lampSpec(P, N, v, 0.01, vec3(0.02));
  vec3 col = mix(dryC, wetC, wet);
  // snowflakes resting on the outside, lit by the street and the lamp
  float flake = texture(uHeight, guv).g;
  if (flake > 0.0) col = mix(col, (Eo * 0.8 + uEVert * 0.3) / PI + Eg * 0.01, min(flake, 1.0) * 0.9);
  // autumn: wet leaves stuck to the outside
  for (int i = 0; i < 3; i++){
    if (uGLeaf[i].z <= 0.0) continue;
    float Rl = uGLeaf[i].z;
    vec2 q = rot2(P.xy - uGLeaf[i].xy, uGLeaf[i].w);
    float a = atan(q.x, q.y - Rl * 0.35), r = length(q - vec2(0.0, Rl * 0.35));
    float lf = smoothstep(aaW, -aaW, r - Rl * 0.62 * (0.6 + 0.4 * abs(cos(2.5 * a)))) ;
    if (lf <= 0.0) continue;
    vec3 alb = mix(vec3(0.36, 0.20, 0.04), vec3(0.22, 0.10, 0.03), smoothstep(0.4, 0.8, vnoise(q * 60.0 + float(i) * 9.0)));
    col = mix(col, alb / PI * Eo + Eg * vec3(0.02, 0.012, 0.002) + lampSpec(P, vec3(0.0, 0.0, -1.0), v, 0.15, vec3(0.03)), lf);
  }
  return col;
}

void main(){
  vec2 ndc = (gl_FragCoord.xy + uJitter) / uRes * 2.0 - 1.0;
  vec3 rd = normalize(uCamFwd + ndc.x * uTan.x * uCamRight + ndc.y * uTan.y * uCamUp);
  vec3 ro = uCamPos;
  float tGl = 1e9;
  if (rd.z > 0.0){
    float tz = (GLASS_Z - ro.z) / rd.z; vec3 pg = ro + rd * tz;
    if (abs(pg.x - WIN_CX) < WIN_HW && abs(pg.y - WIN_CY) < WIN_HH) tGl = tz;
  }
  float t = 0.0; vec2 h = vec2(1.0, 0.0); bool hit = false;
  for (int i = 0; i < 110; i++){
    h = mapStreet(ro + rd * t);
    if (h.x < 0.0003 * t + 0.0002){ hit = true; break; }
    t += h.x * 0.95;
    if (t > tGl || t > 80.0) break;
  }
  vec3 col;
  if (hit && t < tGl){
    vec3 p = ro + rd * t;
    col = shadeStreet(p, calcNormalS(p), rd, h.y);
  } else if (tGl < 1e8){
    t = tGl;
    col = windowOut(ro + rd * tGl, rd);
  } else { col = skyRad(rd); t = 80.0; }
  oCol = vec4(max(col, 0.0), 0.0);
  oAux = vec4(t * dot(rd, uCamFwd));
}
`;

// after TAA: rain in the air (only where something lights it) and the glow of the lamps in the wet air
const FS_STREETPOST = () => GLSL_HEAD() + `
uniform vec2 uRes;
uniform vec3 uCamPos, uCamFwd, uCamRight, uCamUp;
uniform vec2 uTan;
uniform sampler2D uSrc, uDepth;
uniform float uTime, uRain, uWind, uSnow, uFocus, uAperture;
uniform vec3 uWallI, uWinL, uCityGlow, uSkyH;
out vec4 o;
` + GLSL_STREET.replace('vec3 skyRad(vec3 d){ return mix(uSkyH, uSkyZ, sat(d.y * 1.4)); }', '') + `
// single scattering of a point light along a ray segment [0, T] (closed form of ∫ dt / (h² + (t − tc)²))
float airlight(vec3 ro, vec3 rd, vec3 S, float T, out vec3 cp){
  vec3 so = S - ro; float tc = dot(so, rd);
  float h = max(length(so - rd * tc), 0.02);
  cp = ro + rd * clamp(tc, 0.0, T);
  return (atan((T - tc) / h) + atan(tc / h)) / h;
}
// light arriving at a point in the air (for the raindrops there): the lane lamp, our window, the glow of the street
vec3 lightAt(vec3 p, vec3 rd, out float fwd){
  vec3 L = WL_P - p; float d2 = dot(L, L); vec3 l = L * inversesqrt(d2);
  vec3 W = vec3(WIN_CX, WIN_CY, GLASS_Z) - p; float w2 = dot(W, W); vec3 wl = W * inversesqrt(w2);
  vec3 E = uWallI * lampMask(-l) / max(d2, 0.04);
  vec3 Ew = uWinL * 1.4 * max(-wl.z, 0.0) / max(w2, 0.1);
  // drops scatter strongly forward: a drop between the eye and a light lights up
  fwd = pow(max(dot(-l, -rd), 0.0), 6.0);
  float fw = pow(max(dot(-wl, -rd), 0.0), 6.0);
  return E * (0.15 + 2.2 * fwd) + Ew * (0.15 + 2.2 * fw) + uCityGlow * 0.08;
}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 col = texture(uSrc, uv).rgb;
  vec2 ndc = uv * 2.0 - 1.0;
  vec3 rd = normalize(uCamFwd + ndc.x * uTan.x * uCamRight + ndc.y * uTan.y * uCamUp);
  float zv = texture(uDepth, uv).r, cf = dot(rd, uCamFwd);
  float T = zv / cf;
  // glow: the lamp's light and the window's, scattered by rain and mist on the way to the eye
  float sigma = 0.012 + 0.05 * uRain + 0.03 * uSnow;
  vec3 cp;
  float A = airlight(uCamPos, rd, WL_P, T, cp);
  col += uWallI * lampMask(normalize(cp - WL_P)) * A * sigma * (0.08 + 0.5 * pow(max(dot(rd, normalize(WL_P - uCamPos)), 0.0), 40.0)) / (4.0 * PI) * 4.0;
  float Aw = airlight(uCamPos, rd, vec3(WIN_CX, WIN_CY, GLASS_Z - 0.05), T, cp);
  col += uWinL * 1.4 * max(normalize(vec3(WIN_CX, WIN_CY, GLASS_Z) - cp).z, 0.0) * Aw * sigma * 0.12;
  // falling rain / snow: layers at increasing depth; each a sheet of short streaks (the shutter is open 1/50 s),
  // blurred by the lens where it is out of focus, and dark unless a light is behind it or beside it
  float wind = uWind * 0.6;
  for (int k = 0; k < 7; k++){
    float z = 0.7 * pow(1.5, float(k));
    if (z > zv) break;
    vec3 P = uCamPos + rd * (z / cf);
    float coc = uAperture * abs(z - uFocus) / uFocus;                   // blur diameter in metres at that depth
    float px = 2.0 * z * uTan.y / uRes.y;                               // one pixel in metres at that depth
    vec2 q = vec2(dot(P - uCamPos, normalize(vec3(uCamRight.x, 0.0, uCamRight.z))), P.y);
    float cell = max(0.045 * z, 0.06);
    float vfall = uSnow > 0.5 ? 1.1 : 7.5, len = uSnow > 0.5 ? 0.006 : vfall / 50.0;
    q.x -= (wind * (q.y - uTime * vfall) * (uSnow > 0.5 ? 0.6 : 0.12)) + (uSnow > 0.5 ? 0.04 * sin(uTime * 1.3 + q.y * 3.0 + float(k)) : 0.0);
    q.y += uTime * vfall + float(k) * 3.7;
    vec2 g = vec2(q.x / cell, q.y / (cell * 3.0)), gi = floor(g);
    vec3 hh = hash32(gi + float(k) * 13.0);
    if (hh.z > 0.7 * sat(uRain * 1.6 + uSnow)) continue;
    vec2 c = (gi + 0.15 + 0.7 * hh.xy) * vec2(cell, cell * 3.0);
    float w = max(max(coc, px * 1.2), 0.0015);
    float dx = abs(q.x - c.x), dy = abs(q.y - c.y);
    float shape = smoothstep(w * 0.5 + px * 0.5, w * 0.5 - px * 0.5 - 0.0005, dx) * smoothstep(len * 0.5 + w * 0.5, len * 0.5 - w * 0.2, dy);
    if (shape <= 0.0) continue;
    float fwd;
    vec3 Li = lightAt(P, rd, fwd);
    // energy of a 2 mm drop spread over the blurred width
    // a 2 mm drop is mostly a lens (lit from behind); a 5 mm snowflake is a white scatterer, lit from every side
    float k2 = uSnow > 0.5 ? 0.012 / w : 0.0018 / w;
    vec3 Ls = uSnow > 0.5 ? Li * 0.4 + (uCityGlow + uWinL * 0.3) * 0.25 : Li;
    col += Ls * shape * k2 * (0.35 + 0.65 * hh.x) * 0.5;
  }

// and blends it into a full-resolution history reprojected with the depth. Because the room
// is static and the camera only drifts, the history converges to a supersampled image at the
// full output resolution: fine detail survives even when the raymarch runs at half resolution.

    SIM.events.length = 0;
    console.log('prewarm', (performance.now() - t0).toFixed(0) + 'ms', JSON.stringify(simStats()));
    whenProgramsReady(() => { resize(); if (DBG.rec) recRun(); else start(); });

<script>
/* ---- src/hero.js ---- */
/* ============================================================================
   一粒光 —— 主角。它没有脸：性格只靠运动和明暗。
   · 位置：导演给出一条带停留的路径（路点 + 行程时间 + 停留时间），中间用 Catmull-Rom 平滑；
     叠加一点游移（像在空气里浮着），停留时绕着小圈「东张西望」。
   · 好奇：光标靠近时，它朝光标的那条视线凑过去一点；光标甩得太快，它吓得一暗，躲开。
   · 呼吸：亮度有一个固定的慢节奏（全片不变，是它的识别特征）。
   ========================================================================== */
(() => {
'use strict';
const YL = window.YL;
const { V, clamp, lerp, smooth } = YL;
const H = YL.hero = {
  route: null, t: 0, scare: 0, lean: [0, 0, 0], last: null,
  // route: [{ p: [x,y,z], travel: s, dwell: s }, …]; the first point is where it starts
  setRoute(route) { H.route = route; H.t = 0; H.last = null; },
  routeLength() { return H.route ? H.route.slice(1).reduce((s, w) => s + w.travel + (w.dwell || 0), 0) : 0; },
  // position along the route at time t (s): eased travel between points, gentle hovering while dwelling
  sample(t) {
    const R = H.route; if (!R) return YL.HERO.p;
    if (R.flow) return H.flowAt(t);
    let k = 1, tt = t;
    for (; k < R.length; k++) {
      const w = R[k];
      if (tt < w.travel) break;
      tt -= w.travel;
      if (tt < (w.dwell || 0) && k < R.length - 1) return H.hover(w.p, tt, k);
      tt -= (w.dwell || 0);
    }
    if (k >= R.length) return H.hover(R[R.length - 1].p, tt + 99, R.length - 1);
    const p0 = R[Math.max(k - 2, 0)].p, p1 = R[k - 1].p, p2 = R[k].p, p3 = R[Math.min(k + 1, R.length - 1)].p;
    const u = smooth(0, 1, tt / R[k].travel), u2 = u * u, u3 = u2 * u;
    const cr = i => 0.5 * ((2 * p1[i]) + (-p0[i] + p2[i]) * u + (2 * p0[i] - 5 * p1[i] + 4 * p2[i] - p3[i]) * u2 + (-p0[i] + 3 * p1[i] - 3 * p2[i] + p3[i]) * u3);
    // an arc: it does not travel in straight lines, it bobs up a little on the way
    const lift = Math.sin(Math.PI * u) * Math.min(0.06, 0.25 * Math.hypot(p2[0] - p1[0], p2[2] - p1[2]));
    return [cr(0), cr(1) + lift, cr(2)];
  },
  // a flowing route (the film): one curve through all the points, never stopping on the way — it gathers speed as it
  // leaves the first point and settles only at the last; between, each leg takes its own time
  flowAt(t) {
    const R = H.route, legs = R.slice(1).map(w => w.travel), T = legs.reduce((a, b) => a + b, 0), a = 0.6, b = 0.9;
    // time warp: speed ramps up over the first a seconds and down over the last b, constant between
    const v = 1 / (1 - a / 2 / T - b / 2 / T);
    const tc = clamp(t, 0, T);
    let s = tc < a ? v * tc * tc / (2 * a) : tc > T - b ? v * (T - a / 2 - b / 2) - v * (T - tc) * (T - tc) / (2 * b) : v * (tc - a / 2);
    s = clamp(s, 0, T);
    let k = 0; while (k < legs.length - 1 && s > legs[k]) { s -= legs[k]; k++; }
    const u = clamp(s / legs[k], 0, 1), u2 = u * u, u3 = u2 * u;
    const p0 = R[Math.max(k - 1, 0)].p, p1 = R[k].p, p2 = R[k + 1].p, p3 = R[Math.min(k + 2, R.length - 1)].p;
    const cr = i => 0.5 * ((2 * p1[i]) + (-p0[i] + p2[i]) * u + (2 * p0[i] - 5 * p1[i] + 4 * p2[i] - p3[i]) * u2 + (-p0[i] + 3 * p1[i] - 3 * p2[i] + p3[i]) * u3);
    const p = [cr(0), cr(1), cr(2)];
    return t > T ? H.hover(p, t - T, R.length - 1) : p;
  },
  hover(p, tt, k) {
    const a = tt * 1.7 + k * 1.3, r = 0.012 * smooth(0, 0.8, tt);
    return [p[0] + Math.sin(a) * r, p[1] + Math.sin(a * 2.0) * r * 0.5, p[2] + Math.cos(a) * r * 0.6];
  },
  update(dt, realT) {
    const HERO = YL.HERO;
    if (!HERO.on) return;
    H.t += dt;
    let p = H.sample(H.t);
    // floating in the air: a slow, small, three-axis drift
    const f = YL.DBG.still ? 0 : 1;
    p = V.add(p, [0.004 * f * YL.drift(realT * 0.9, 11), 0.005 * f * YL.drift(realT * 0.8, 12), 0.004 * f * YL.drift(realT * 0.7, 13)]);
    // curiosity and fright: the pointer's line of sight
    const P = YL.ptr, CAM = YL.CAM;
    let leanT = [0, 0, 0];
    if (P && YL.now() - P.t < 1.5 && !YL.DBG.shot) {
      const rd = YL.camRay(P.nx, P.ny), oc = V.sub(p, CAM.pos), tc = V.dot(oc, rd);
      const q = V.add(CAM.pos, V.mul(rd, tc)), d = V.sub(q, p), dl = Math.hypot(...d);
      if (P.speed > 3.5 && dl < 0.3) H.scare = 1;                         // flung past it: it flinches
      else if (dl < 0.35) leanT = V.mul(d, 0.35 * smooth(0.35, 0.05, dl));   // drawn towards it
    }
    H.scare = Math.max(0, H.scare - dt * 0.8);
    if (H.scare > 0 && P) leanT = V.add(leanT, V.mul(V.norm(V.sub(p, CAM.pos)), 0.05 * H.scare));
    H.lean = H.lean.map((v, i) => v + (leanT[i] - v) * (1 - Math.exp(-dt * 2.5)));
    HERO.p = V.add(p, H.lean);
    // brightness: the breathing never changes (its signature); fright dims it
    const target = (H.glowTarget ?? 1) * (1 - 0.55 * H.scare);
    HERO.glow += (target - HERO.glow) * (1 - Math.exp(-dt * (target > HERO.glow ? 2.5 : 6)));
  },
};
})();

</script>
<script>
/* ---- src/worlds/summer.js ---- */
/* ============================================================================
   世界二 · 盛夏午后 —— 手绘动画背景的画风
   ----------------------------------------------------------------------------
   色彩脚本：
     天：头顶是浓的天青（几乎发紫），往地平线褪成被暑气蒸白的浅青。
     云：一座高高的积雨云塔（入道云）和几朵晴天积云。受光面是带一点暖的纯白，背光面是冷的蓝灰，
         明暗交界是一条清楚的硬边（手绘动画的赛璐璐光影），边缘有薄处透光的亮边。
     山：两三层蓝紫色的远山，越远越淡（空气透视），向阳的山脊亮一点。
     地：一道起伏的绿坡，坡顶一棵孤零零的樟树；近处是齐腰的草，风吹过时一路倒伏，露出发亮的草背。
     光：太阳在左上方，下午三点左右的高光。
   做法：
     背景（天、云、山、坡、远处的草地）是一个全屏片元着色器，按视线方向画，每一层有自己的视差；
     近处的草是真的几何：两万多片草叶，实例化绘制，被风场吹弯，两三阶的赛璐璐明暗；4× MSAA。
     风场 = 持续的风 + 一阵阵的阵风波 + 光标划过的轨迹（光标就是风）。
   ========================================================================== */
(() => {
'use strict';
const YL = window.YL;
const W = (YL.worlds = YL.worlds || {});

const TOWER = [-0.30, 0.36];        // the great cumulus: azimuth, and the elevation the light flies up into
const SUN = (() => { const az = -0.75, el = 0.62; return [Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)]; })();

const HEAD = `#version 300 es
precision highp float;
precision highp int;
#define PI 3.14159265359
float sat(float x){ return clamp(x, 0.0, 1.0); }
float hash11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y); }
const mat2 FR = mat2(1.6, 1.2, -1.2, 1.6);
float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = FR * p + vec2(3.1, 1.7); a *= 0.5; } return s; }
float fbm3(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 3; i++){ s += a * vnoise(p); p = FR * p + vec2(3.1, 1.7); a *= 0.5; } return s / 0.875; }
`;

// --------------------------------------------------------------------------- background: sky, clouds, hills, field
const FS_BG = HEAD + `
uniform vec2 uRes;
uniform vec3 uFwd, uRight, uUp;
uniform vec2 uTan;
uniform float uTime;
uniform vec3 uSun;
uniform vec4 uLobes[112];     // billows: x = azimuth (rad), y = elevation (rad), z = radius (rad), w = depth (painting order)
uniform vec4 uClouds[6];      // per cloud: x = base elevation, y = distance (0 near … 1 far), z = first billow, w = seed (<0: none)
uniform vec4 uCBox[6];        // per cloud: bounds (az min, az max, el min, el max)
uniform int uCCount[6];       // per cloud: number of billows
uniform vec2 uWind;           // ground-plane wind (m/s, x and z)
uniform float uGust;          // phase of the travelling gust bands
uniform int uMode;            // 0: the camera's view; 1: an equirect panorama seen from the room's window (for its drops)
uniform vec3 uEq;             // (azimuth range, elevation min, elevation max) of that panorama
uniform vec3 uEye;            // where the eye is over the field (it travels)
out vec4 o;
// a cloud's shadow on the field (shared with the grass): big soft-edged patches sailing downwind at a few m/s
float cloudShade(vec2 p, float t){ return smoothstep(0.50, 0.60, fbm3(p * 0.012 + vec2(t * 0.040, t * 0.012))); }

// ---- the painter's colours (display-referred)
const vec3 SKY_Z = vec3(0.10, 0.30, 0.78);
const vec3 SKY_M = vec3(0.26, 0.55, 0.92);
const vec3 SKY_H = vec3(0.72, 0.87, 0.95);
const vec3 CL_LIT = vec3(1.00, 0.99, 0.96);
const vec3 CL_MID = vec3(0.85, 0.89, 0.97);
const vec3 CL_SHD = vec3(0.60, 0.67, 0.84);
const vec3 CL_DEEP = vec3(0.46, 0.53, 0.73);

vec3 skyCol(float el, float az){
  float t = sat(el / 0.85);
  vec3 c = mix(SKY_H, SKY_M, smoothstep(0.0, 0.32, t));
  c = mix(c, SKY_Z, smoothstep(0.3, 1.0, t));
  vec2 sa = vec2(atan(uSun.x, -uSun.z), asin(uSun.y));
  float dsun = length(vec2((az - sa.x) * cos(el), el - sa.y));
  c += vec3(0.18, 0.16, 0.10) * exp(-dsun * 2.0) * 0.6;           // the sun's side of the sky, brighter and warmer
  c = mix(c, vec3(0.86, 0.93, 0.95), exp(-max(el, 0.0) * 25.0) * 0.6);   // heat haze along the horizon
  return c;
}

// A cumulus as a background painter paints it: one big light falls across the whole mass (lit on the left,
// blue shadow on the right, a crisp terminator wobbling like a brush), and the billows are relief on that
// surface: their caps catch the light, the creases between them sink into shadow.
//   silhouette: a tight smooth union of the billows;  relief: a soft-max height field of their spherical caps.
vec4 cloud(vec2 q, vec2 qw, int i0, int n, vec4 C, vec4 B, float aa){
  vec3 Ls = normalize(vec3(uSun.x * 1.7, uSun.y, 0.5));
  const float K = 0.005, KH = 140.0;
  float acc = 0.0, hs = 0.0, hmax = 0.0; vec2 gs = vec2(0.0);
  for (int i = i0; i < i0 + n; i++){
    vec4 L = uLobes[i];
    vec2 d = qw - L.xy; float len = length(d);
    float ang = atan(d.y, d.x);
    float lump = 1.0 + 0.09 * (vnoise(vec2(ang * 2.2 + L.w * 40.0, L.w * 9.0)) - 0.5);
    acc += exp(-(len - L.z * lump) / K);
    float r = L.z * lump;
    if (len < r){
      float hc = sqrt(r * r - len * len) + L.w * 0.004;
      float e = exp(KH * (hc - 0.08));
      hs += e; gs += e * (-d / max(hc, 2e-3)); hmax = max(hmax, hc);
    }
  }
  float d = -K * log(max(acc, 1e-30));
  // a solid core inside the silhouette (the billows make the outline; the body never shows sky through it)
  float xc0 = 0.5 * (B.x + B.y), hw0 = 0.5 * (B.y - B.x) - 0.04;
  vec2 ca = vec2(xc0, C.x + 0.02), cb = vec2(xc0, max(B.w - hw0 * 0.9, C.x + 0.03));
  vec2 pa = qw - ca, ba = cb - ca;
  float core = length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)) - hw0 * 0.5;
  d = min(d, core);
  d = max(d, C.x - qw.y);                                           // the flat base
  float alpha = smoothstep(aa, -aa, d);
  if (alpha <= 0.0) return vec4(0.0);
  vec2 grad = hs > 0.0 ? gs / hs : vec2(0.0);
  float hsoft = hs > 0.0 ? log(hs) / KH + 0.08 : 0.0;
  float crease = sat((hsoft - hmax) * KH / 0.69);                  // 1 where two billows meet
  // the mass: a rounded column (horizontal bulge from the centre line, a domed top)
  float xc = 0.5 * (B.x + B.y), hw = 0.5 * (B.y - B.x) - 0.03;
  vec3 Nm = normalize(vec3((qw.x - xc) / max(hw, 0.02) * 0.95, 0.15 + 0.9 * smoothstep(B.w - 0.16, B.w - 0.02, qw.y), 0.6));
  vec3 Nb = normalize(vec3(-grad * 0.8, 1.0));                    // height field normal: (−∇h, 1)
  vec3 N = normalize(Nm + vec3(Nb.xy * 0.9, 0.0));
  float wob = (vnoise(qw * 45.0 + C.w * 3.0) - 0.5) * 0.08 + (vnoise(qw * 200.0) - 0.5) * 0.04;
  float lam = dot(N, Ls) + wob;
  // four painted tones: a white highlight on the billow caps, warm-white light, a pale blue half-tone, blue shadow
  float hi = smoothstep(0.62, 0.66, lam), lit = smoothstep(0.24, 0.29, lam), mid = smoothstep(-0.10, -0.05, lam);
  vec3 c = mix(CL_SHD, mix(CL_MID, CL_LIT * vec3(0.985, 0.98, 0.965), lit), mid);
  c = mix(c, vec3(1.0, 1.0, 0.99), hi * 0.9);
  // on the sunlit side the billows still show: their undersides turned from the sun take a lilac half-tone
  float away = smoothstep(0.05, -0.25, dot(Nb.xy, normalize(Ls.xy)) * length(Nb.xy) * 2.0);
  c = mix(c, mix(CL_MID, CL_SHD, 0.25), away * lit * 0.55);
  c = mix(c, CL_DEEP, smoothstep(-0.38, -0.55, lam) * 0.6);
  // creases: a soft seam where the billows meet, mostly in the shade
  c = mix(c, c * vec3(0.84, 0.87, 0.95), crease * (1.0 - lit) * 0.7);
  // the lower body is shaded by the mass above; ground light warms the very bottom
  float h = (qw.y - C.x) / max(B.w - C.x, 0.05);
  c = mix(c, c * vec3(0.84, 0.87, 0.95), smoothstep(0.3, 0.0, h) * 0.55);
  c += vec3(0.05, 0.045, 0.0) * smoothstep(0.08, 0.0, h) * (1.0 - lit);
  // a thin rim of light along the sunward silhouette, where the cloud is thinnest
  c += vec3(0.06, 0.06, 0.04) * smoothstep(-0.005, 0.0, d) * sat(dot(normalize(vec2(qw.x - xc, 0.3)), normalize(Ls.xy)) * 2.0);
  c *= 0.975 + 0.04 * vnoise(qw * vec2(240.0, 100.0) + C.w);     // brush texture
  c = mix(c, mix(SKY_H, SKY_M, 0.35), C.y * 0.5);                // aerial perspective
  return vec4(c, alpha);
}

float ridge(float x, float seed){ float h = 0.0, a = 0.5, f = 1.0; for (int i = 0; i < 5; i++){ h += a * (1.0 - abs(2.0 * vnoise(vec2(x * f + seed, seed)) - 1.0)); f *= 2.1; a *= 0.5; } return h; }

void main(){
  vec2 uv = gl_FragCoord.xy / uRes, ndc = uv * 2.0 - 1.0;
  vec3 rd = normalize(uFwd + ndc.x * uTan.x * uRight + ndc.y * uTan.y * uUp);
  if (uMode == 1){ float a = ndc.x * uEq.x, e = mix(uEq.y, uEq.z, uv.y); rd = vec3(sin(a) * cos(e), sin(e), -cos(a) * cos(e)); }
  float az = atan(rd.x, -rd.z), el = asin(clamp(rd.y, -1.0, 1.0));
  vec3 col = skyCol(el, az);
  float aaE = max(fwidth(el), 1e-4) * 1.2;                         // (derivatives taken here, in uniform control flow)
  // ---- clouds, far to near; each only inside its own bounds
  if (el > 0.0){
    vec2 q0 = vec2(az, el);
    vec2 rag = (vec2(fbm3(q0 * 34.0), fbm3(q0 * 34.0 + 7.0)) - 0.5) * 0.008 + (vec2(vnoise(q0 * 150.0), vnoise(q0 * 150.0 + 3.0)) - 0.5) * 0.002;
    for (int ci = 0; ci < 6; ci++){
      vec4 C = uClouds[ci];
      if (C.w < 0.0) continue;
      vec2 q = vec2(az + uTime * 0.0012 * (1.0 - C.y * 0.6), el);
      vec4 B = uCBox[ci];
      if (q.x < B.x || q.x > B.y || q.y < B.z || q.y > B.w) continue;
      vec4 cl = cloud(q, q + rag, int(C.z), uCCount[ci], C, B, aaE);
      col = mix(col, cl.rgb, cl.a);
    }
  }
  // ---- three mountain ranges: the farthest palest and highest, nearer ones darker and lower
  for (int m = 0; m < 3; m++){
    float fm = float(m);
    float fq = 1.3 + fm * 1.1;
    float rg = ridge(az * fq + 2.0 + fm, 11.0 + fm * 7.0);
    float h = 0.006 + (0.075 - 0.02 * fm) * rg * rg - 0.004 * fm;
    float inside = smoothstep(aaE, -aaE, el - h);
    if (inside > 0.0){
      vec3 c = mix(vec3(0.58, 0.66, 0.90), vec3(0.34, 0.44, 0.74), fm / 2.0);
      float slope = (ridge(az * fq + 2.0 + fm - 0.003, 11.0 + fm * 7.0) - ridge(az * fq + 2.0 + fm + 0.003, 11.0 + fm * 7.0)) * rg * 2.0;
      c *= 1.0 + 0.22 * smoothstep(0.0, 0.015, slope);                 // slopes turned to the sun (left)
      c = mix(c, SKY_H, exp(-max(h - el, 0.0) * 50.0) * (0.35 - fm * 0.08));   // haze pooled at their feet
      col = mix(col, c, inside);
    }
  }
  // ---- the near hill: a long green rise with a lone camphor tree on its crest
  float hill = 0.004 + 0.020 * smoothstep(-1.0, 0.3, az) * smoothstep(1.2, 0.3, az) + 0.003 * sin(az * 6.0 + 1.0) + 0.002 * fbm3(vec2(az * 9.0, 1.0));
  float onHill = smoothstep(aaE, -aaE, el - hill);
  if (onHill > 0.0){
    float below = hill - el;
    vec3 g = mix(vec3(0.58, 0.76, 0.28), vec3(0.32, 0.56, 0.22), smoothstep(0.0, 0.04, below));
    g *= 0.94 + 0.07 * sin(az * 140.0 + below * 380.0 + vnoise(vec2(az * 30.0, below * 80.0)) * 3.0);
    col = mix(col, mix(g, SKY_H, 0.12), onHill);
  }
  {
    // the tree: a dark trunk, a crown of round clumps lit from the left; its shadow pools on the slope to the right
    vec2 tq = vec2(az - 0.26, el - 0.021);

    H.anchor = [e[0] + 0.20 + 0.35 * Math.sin(t * 0.37), 0.80 + 0.14 * Math.sin(t * 0.61 + 1), e[2] - 2.3 + 0.3 * Math.sin(t * 0.29)];
    const kk = (this.speed ?? 0.5) > 0.2 ? 2.2 : 0.55;
    for (let i = 0; i < 3; i++) H.v[i] += (H.anchor[i] - H.p[i]) * kk * dt;
    const damp = Math.exp(-dt * 0.9);
    for (let i = 0; i < 3; i++) { H.v[i] *= damp; H.p[i] += H.v[i] * dt; }
    H.p[1] = Math.max(H.p[1], 0.35);
    H.bob = 0.03 * Math.sin(t * 1.3) + 0.015 * Math.sin(t * 2.9 + 1);
  },
  /* ---- the sheet of paper. It comes blowing in from the right, low over the grass, tumbling end over end; it rises and
     slows, and turns to face us, and hangs there in front of the eye. 0.48 × 0.30 m: the print's own shape. */
  startSheet() {
    // where it will come to rest: ahead of the eye, on the tops of the grass, tilted up toward the eye as if propped
    const V = YL.V, cam = this.cam || this.camera(YL.canvasAspect(), this.t, YL.DBG.still), E = this.eyeAt(this.t);
    const F = V.norm([cam.fwd[0], 0, cam.fwd[2]]), R = V.norm(V.cross(F, [0, 1, 0]));
    const C = V.add(E, V.add(V.mul(F, 1.6), V.add(V.mul(R, 0.10), [0, 0.66 - E[1], 0])));
    const tilt = 34 * Math.PI / 180, yaw = 0.10;
    const Fy = V.norm(V.add(V.mul(F, Math.cos(yaw)), V.mul(R, Math.sin(yaw)))), Ry = V.norm(V.cross(Fy, [0, 1, 0]));
    const N = V.norm(V.add(V.mul([0, 1, 0], Math.cos(tilt)), V.mul(Fy, -Math.sin(tilt))));
    const X = Ry, Y = V.norm(V.cross(N, X));
    this.sheet = { t0: this.t, rest: { c: C, X, Y, N }, E0: E, F, R };
  },
  /* ---- the sheet of paper. It comes blowing in from the right over the grass, tumbling, and settles onto the grass
     tops ahead of the eye, propped up toward it. 0.48 × 0.27 m: the print's own shape (16 : 9). */
  sheetAt() {
    const S = this.sheet; if (!S) return null;
    const V = YL.V, tau = this.t - S.t0, Rs = S.rest;
    const e = YL.smooth(0, 2.4, tau);
    // its way in: from up and off to the right, gliding down in an arc onto its resting place, with a last flutter
    const from = V.add(Rs.c, V.add(V.mul(S.R, 1.7), V.add([0, 0.75, 0], V.mul(S.F, 0.6))));
    const mid = V.add(Rs.c, V.add(V.mul(S.R, 0.55), V.add([0, 0.42, 0], V.mul(S.F, -0.1))));
    const b = (a, m, c, u) => V.add(V.add(V.mul(a, (1 - u) * (1 - u)), V.mul(m, 2 * u * (1 - u))), V.mul(c, u * u));
    const c = V.add(b(from, mid, Rs.c, e), [0, 0.012 * Math.sin(tau * 9.0) * Math.exp(-Math.max(tau - 2.2, 0) * 3.0) * YL.smooth(1.8, 2.3, tau), 0]);
    // turning end over end on the way, the turns dying out as it lands
    const rot = (a, axis, ang) => { const c_ = Math.cos(ang), s_ = Math.sin(ang), d = V.dot(axis, a); return V.add(V.add(V.mul(a, c_), V.mul(V.cross(axis, a), s_)), V.mul(axis, d * (1 - c_))); };
    const flip = 2 * Math.PI * (1 - e) * 1.0, sw = 0.7 * Math.sin(2.1 * tau) * (1 - e), rl = 0.5 * Math.sin(1.6 * tau + 0.5) * (1 - e);
    let X = Rs.X, Y = Rs.Y, N = Rs.N;
    for (const [ax, ang] of [[Rs.X, flip], [[0, 1, 0], sw], [Rs.N, rl]]) { X = rot(X, ax, ang); Y = rot(Y, ax, ang); N = rot(N, ax, ang); }
    const curl = ((0.04 * Math.sin(tau * 4.0) + 0.03) * (1 - e) + 0.010) * (1 - YL.smooth(3.0, 4.2, tau));
    return { c, X: V.mul(X, 0.24), Y: V.mul(Y, 0.135), N, curl, tau, rest: Rs };
  },
  // where the eye is: it travels forward over the field (this.speed m/s), weaving a little
  eyeAt(t) { const z = -(this.travel || 0); return [0.45 * Math.sin(z * 0.11), 0.80 + 0.05 * Math.sin(t * 0.55), z]; },
  update(dt, still) {
    this.t += dt;
    this.travel = (this.travel || 0) + (this.speed ?? 0.5) * dt;
    // pressing and holding still stops the wind
    const P = YL.ptr, now = YL.now();
    const holding = YL.ptrDown && P && now - P.t > 0.5;
    this.calm = (this.calm || 0) + ((holding ? 1 : 0) - (this.calm || 0)) * (1 - Math.exp(-dt / 1.2));
    this.heroUpdate(dt);
    this.sound(dt);
    this.gust += dt * 0.55 * (1 - 0.8 * this.calm);
    this.strokes.forEach(s => s.age += dt);
    this.strokes = this.strokes.filter(s => s.age < 3);
  },
  camera(aspect, t, still) {
    // eye 1.1 m above the field, looking a little up so the sky has most of the frame; a slow drift
    let yaw = (aspect < 0.9 ? -0.12 : 0) + (still ? 0 : 0.02 * Math.sin(t * 0.13)) + (YL.ptrPar ? YL.ptrPar[0] * 0.04 : 0);
    let pitch = 0.20 - 0.08 * Math.min(1, (this.speed ?? 0.5) / 1.1) + (still ? 0 : 0.008 * Math.sin(t * 0.11)) + (YL.ptrPar ? YL.ptrPar[1] * 0.02 : 0);
    // following the light up into the great cloud (TOWER: its azimuth and the height it rises to), then into it
    const lift = this.lift || 0, zoom = this.zoom || 0;
    yaw += (TOWER[0] - yaw) * lift; pitch += (TOWER[1] - 0.06 - pitch) * lift;
    // (watching the sheet of paper: turning to it, then closing in on it)
    if (this.look && this.look.k > 0) {
      const d = YL.V.sub(this.look.p, this.eyeAt(t)), ty_ = Math.atan2(d[0], -d[2]), tp = Math.atan2(d[1], Math.hypot(d[0], d[2]));
      yaw += (ty_ - yaw) * this.look.k; pitch += (tp - pitch) * this.look.k;
    }
    let fwd = [Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch)];
    let upW = [0, 1, 0], eye = this.eyeAt(t);
    let vfov = (aspect < 0.9 ? 68 : 52) * (1 - zoom) + 9 * zoom;
    const O = this.camOv;
    if (O && O.k > 0) {
      const V = YL.V, k = O.k;
      eye = V.add(V.mul(eye, 1 - k), V.mul(O.eye, k));
      fwd = V.norm(V.add(V.mul(fwd, 1 - k), V.mul(O.fwd, k)));
      upW = V.norm(V.add(V.mul(upW, 1 - k), V.mul(O.up, k)));
      vfov = vfov + (O.vfov - vfov) * k;
    }
    const right = YL.V.norm(YL.V.cross(fwd, upW)), up = YL.V.cross(right, fwd);
    const ty = Math.tan(vfov * Math.PI / 360);
    return { eye, fwd, right, up, tan: [ty * aspect, ty] };
  },
  // the summer sky and field as the room's window would see them, for the drops' inverted images
  renderEquirect(target) {
    const gl = YL.gl, U = YL.U, S = YL.S;
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb); gl.viewport(0, 0, target.w, target.h);
    gl.useProgram(this.pBg.p);
    U(this.pBg, 'uRes', [target.w, target.h]); U(this.pBg, 'uMode', YL.I(1)); U(this.pBg, 'uEq', [S.AZM, S.ELMIN, S.ELMAX]);
    U(this.pBg, 'uFwd', [0, 0, -1]); U(this.pBg, 'uRight', [1, 0, 0]); U(this.pBg, 'uUp', [0, 1, 0]); U(this.pBg, 'uTan', [1, 1]);
    U(this.pBg, 'uTime', this.t); U(this.pBg, 'uSun', SUN); U(this.pBg, 'uWind', [1.6, -0.6]); U(this.pBg, 'uGust', this.gust); U(this.pBg, 'uEye', [0, 0.85, 0]);
    gl.uniform4fv(this.pBg.u.uLobes, new Float32Array(this.cl.lobes.flat().concat(new Array((112 - this.cl.lobes.length) * 4).fill(0))));
    gl.uniform4fv(this.pBg.u.uClouds, new Float32Array(this.cl.clouds.flat()));
    gl.uniform4fv(this.pBg.u.uCBox, new Float32Array(this.cl.boxes.flat()));
    gl.uniform1iv(this.pBg.u.uCCount, new Int32Array(this.cl.counts));
    gl.bindVertexArray(this.empty); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
  },
  // where a point on the screen is, at a given distance in this world (to hand the light over at the same spot)
  project(p, aspect) {
    const cam = this.camera(aspect, this.t, YL.DBG.still), V = YL.V, v = V.sub(p, cam.eye), z = V.dot(v, cam.fwd);
    return [V.dot(v, cam.right) / (z * cam.tan[0]), V.dot(v, cam.up) / (z * cam.tan[1])];
  },
  unproject(nx, ny, dist, aspect) {
    const cam = this.camera(aspect, this.t, YL.DBG.still), V = YL.V;
    const rd = V.norm(V.add(cam.fwd, V.add(V.mul(cam.right, nx * cam.tan[0]), V.mul(cam.up, ny * cam.tan[1]))));
    return V.add(cam.eye, V.mul(rd, dist));
  },
  render(target, aspect) {
    const gl = YL.gl;
    const w = target ? target.w : gl.drawingBufferWidth, h = target ? target.h : gl.drawingBufferHeight;
    this.targets(w, h);
    const cam = this.cam = this.camera(aspect, this.t, YL.DBG.still);
    const U = YL.U;
    // 1) background into the multisampled buffer
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.msFb); gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 1); gl.clearDepth(1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(this.pBg.p);
    U(this.pBg, 'uRes', [w, h]); U(this.pBg, 'uFwd', cam.fwd); U(this.pBg, 'uRight', cam.right); U(this.pBg, 'uUp', cam.up); U(this.pBg, 'uTan', cam.tan);
    const wk = 1 - 0.85 * (this.calm || 0), wind = [1.6 * wk, -0.6 * wk];
    U(this.pBg, 'uTime', this.t); U(this.pBg, 'uSun', SUN); U(this.pBg, 'uWind', wind); U(this.pBg, 'uGust', this.gust); U(this.pBg, 'uMode', YL.I(0)); U(this.pBg, 'uEye', cam.eye);
    gl.uniform4fv(this.pBg.u.uLobes, new Float32Array(this.cl.lobes.flat().concat(new Array((112 - this.cl.lobes.length) * 4).fill(0))));
    gl.uniform4fv(this.pBg.u.uClouds, new Float32Array(this.cl.clouds.flat()));
    gl.uniform4fv(this.pBg.u.uCBox, new Float32Array(this.cl.boxes.flat()));
    gl.uniform1iv(this.pBg.u.uCCount, new Int32Array(this.cl.counts));
    gl.bindVertexArray(this.empty); gl.drawArrays(gl.TRIANGLES, 0, 3);
    // 2) the grass, depth-tested against itself
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);
    gl.useProgram(this.pGrass.p);
    U(this.pGrass, 'uEye', cam.eye); U(this.pGrass, 'uFwd', cam.fwd); U(this.pGrass, 'uRight', cam.right); U(this.pGrass, 'uUp', cam.up); U(this.pGrass, 'uTan', cam.tan);
    U(this.pGrass, 'uTime', this.t); U(this.pGrass, 'uWind', wind); U(this.pGrass, 'uGust', this.gust); U(this.pGrass, 'uSun', SUN); U(this.pGrass, 'uTile', [TILE[0], TILE[1], 0, 0]);
    U(this.pGrass, 'uSheetC', this.sheet ? [this.sheet.rest.c[0], this.sheet.rest.c[2], 0.55, 0] : [0, 0, 0, 0]);
    const H = this.hero, hp = [H.p[0], H.p[1] + (H.bob || 0), H.p[2]];
    U(this.pGrass, 'uHP', hp); U(this.pGrass, 'uHOn', H.on ? 1 : 0);
    const st = new Float32Array(32); this.strokes.forEach((s, i) => st.set([s.x, s.z, s.s, s.age], i * 4));
    gl.uniform4fv(this.pGrass.u.uStroke, st);
    gl.bindVertexArray(this.vao); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 7, this.nGrass);
    // the small lives, among the grass (hidden by the blades in front of them)
    gl.useProgram(this.pCrit.p);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
    U(this.pCrit, 'uEye', cam.eye); U(this.pCrit, 'uFwd', cam.fwd); U(this.pCrit, 'uRight', cam.right); U(this.pCrit, 'uUp', cam.up); U(this.pCrit, 'uTan', cam.tan);
    U(this.pCrit, 'uTime', this.t); U(this.pCrit, 'uWind', wind);
    gl.bindVertexArray(this.cvao); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, this.nCrit);
    gl.disable(gl.BLEND); gl.depthMask(true);
    const sh = this.sheetAt();
    if (sh) {
      gl.useProgram(this.pPaper.p); gl.disable(gl.CULL_FACE);
      U(this.pPaper, 'uEye', cam.eye); U(this.pPaper, 'uFwd', cam.fwd); U(this.pPaper, 'uRight', cam.right); U(this.pPaper, 'uUp', cam.up); U(this.pPaper, 'uTan', cam.tan);
      U(this.pPaper, 'uSC', sh.c); U(this.pPaper, 'uSX', sh.X); U(this.pPaper, 'uSY', sh.Y); U(this.pPaper, 'uSN', sh.N); U(this.pPaper, 'uCurl', sh.curl);
      U(this.pPaper, 'uSun', SUN); U(this.pPaper, 'uGlow', this.sheetGlow || [0, 0, 0, 0.1]); U(this.pPaper, 'uFlat', this.sheetFlat || 0);
      U(this.pPaper, 'uHeroP', [H.p[0], H.p[1] + (H.bob || 0), H.p[2], (H.on ? 1 : 0) * (this.heroK ?? 1)]);
      if (this.printTex) YL.bindTex(this.pPaper, 'uPrint', this.printTex, 0);
      gl.bindVertexArray(this.pvao); gl.drawArrays(gl.TRIANGLES, 0, this.nPaper);
    }
    // the little light, in front of what is behind it and behind the blades in front of it
    if (H.on) {
      gl.useProgram(this.pHero.p);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.depthMask(false);
      U(this.pHero, 'uRes', [w, h]); U(this.pHero, 'uEye', cam.eye); U(this.pHero, 'uFwd', cam.fwd); U(this.pHero, 'uRight', cam.right); U(this.pHero, 'uUp', cam.up); U(this.pHero, 'uTan', cam.tan);
      const br = 1 + 0.07 * Math.sin(this.t * 2.1) + 0.03 * Math.sin(this.t * 5.3);     // the same breathing as in the room
      const far = Math.hypot(hp[0] - cam.eye[0], hp[1] - cam.eye[1], hp[2] - cam.eye[2]);      // carried far off, it shrinks more slowly than it should, so the eye can follow it
      U(this.pHero, 'uHP', hp); U(this.pHero, 'uHR', 0.018 * Math.pow(Math.max(1, far / 2.4), 0.7)); U(this.pHero, 'uTime', this.t); U(this.pHero, 'uBreath', br); U(this.pHero, 'uOn', this.heroK ?? 1);
      gl.bindVertexArray(this.empty); gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.disable(gl.BLEND); gl.depthMask(true);
    }
    gl.disable(gl.DEPTH_TEST);
    // 3) resolve, then onto the screen (or the target)
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, this.msFb); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, this.res.fb);
    gl.blitFramebuffer(0, 0, w, h, 0, 0, w, h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null); gl.viewport(0, 0, w, h);
    gl.useProgram(this.pRes.p); U(this.pRes, 'uRes', [w, h]); U(this.pRes, 'uFade', this.fade); U(this.pRes, 'uVig', 1 - (this.sheetFlat || 0));
    YL.bindTex(this.pRes, 'uSrc', this.res.tex, 0);
    gl.bindVertexArray(this.empty); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
  },
};
})();

</script>
<script>
/* ---- src/worlds/woodcut.js ---- */
/* ============================================================================
   世界三 · 雪夜 —— 套色木刻
   ----------------------------------------------------------------------------
   一张三块版套印的木刻：墨版（黑）、靛版（夜里雪的阴影、冰、天）、朱版（灯笼、窗光、春联）。
   · 墨版上的白线是「刻掉」的：线顺着形体走（天是横的，山是顺坡往下的，雪堆是顺着雪棱的），
     暗处刀口窄而疏，亮处刀口宽而密；每一刀有起刀收刀（两头尖），有手刻的不匀。
     亮的地方反过来：纸上留下的是细黑线。
   · 靛版是「擦」出来的渐变（ぼかし），没有喷枪式的软斑；边缘处墨会积一点。
   · 两遍渲染：先把三块版的覆盖量画进一张图（场景），再「印」：三块版各自错一点位，叠在纸上，
     加纸的纤维、黑版的木纹、靛版的马连（baren）擦痕、没吃上墨的飞白。
   · 整张画以每秒 8 次的节奏「重印」：线条和墨色每一印都有一点点不同，像逐张印出来的定格动画。
   画面（从远到近）：落雪的夜空；雪峰；黑松坡下一排粉墙人家（亮着两三扇窗，一家贴着春联，烟囱冒烟）；
   左边一棵挂雪的老树；结冰的河，河心一个冰窟窿，一串脚印从岸上走过去；近岸雪坡、枯苇、一根挂着灯笼的木杆。
   ========================================================================== */
(() => {
'use strict';
const YL = window.YL;
const W = (YL.worlds = YL.worlds || {});

const HEAD = `#version 300 es
precision highp float;
#define PI 3.14159265359
float sat(float x){ return clamp(x, 0.0, 1.0); }
float hash11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y); }
const mat2 FR = mat2(1.6, 1.2, -1.2, 1.6);
float fbm3(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 3; i++){ s += a * vnoise(p); p = FR * p + vec2(3.1, 1.7); a *= 0.5; } return s / 0.875; }
uniform vec2 uRes;
uniform vec3 uView;          // the print point at the screen's centre (x, y), and print units per screen height
vec2 printPos(vec2 frag){ vec2 uv = frag / uRes; return vec2((uv.x - 0.5) * uRes.x / uRes.y, uv.y - 0.5) * uView.z + uView.xy; }
`;

// (both shaders declare uPx and uBoil before this)
const LINES = `
// The key block's line work along the isolines of a field f (print units; g = |grad f|), spaced sp; a runs along the lines.
// T is the tone wanted: 0 solid ink … 1 bare paper. Below 0.5 the lines are white cuts in the black; above, black lines left on the paper.
// Each line is cut as separate strokes; a stroke swells in the middle and comes to a point where the knife went in and came out.
float lines(float f, float g, float a, float sp, float T, float seed){
  float u = f / sp;
  u += (vnoise(vec2(a * 7.0 + seed, u * 0.37)) - 0.5) * 0.55 + (vnoise(vec2(a * 45.0 + uBoil * 11.0, u * 0.9)) - 0.5) * 0.07;
  float k = floor(u);
  float d = abs(fract(u) - 0.5) * 2.0;                    // 0 on a line's centre, 1 midway to the next
  float hk = hash11(k * 0.737 + seed);
  float s = a / (sp * (7.0 + 26.0 * hk)) + hk * 17.0;
  float sid = floor(s), st = fract(s);
  float r = hash12(vec2(sid, k + seed * 3.1));
  float taper = sqrt(max(sin(PI * st), 0.0)) * (0.8 + 0.4 * hash12(vec2(sid * 1.3, k * 0.7 + seed)));
  float aa = g * uPx / sp * 1.4 + 0.02;
  float ink;
  if (T < 0.5){
    float hw = min(T * 1.75, 1.0) * taper * step(r, 0.45 + 1.2 * T);
    ink = 1.0 - sat((hw - d) / aa + 0.5) * min(hw / aa, 1.0);
  } else {
    float hw = min((1.0 - T) * 1.75, 1.0) * taper * step(r, 1.55 - 1.1 * T);
    ink = sat((hw - d) / aa + 0.5) * min(hw / aa, 1.0);
  }
  return mix(ink, 1.0 - T, smoothstep(0.3, 0.6, aa));     // too fine to cut at this size: just the tone
}
`;

/* ---------------------------------------------------------------- the blocks */
const FS_SCENE = HEAD + `
uniform float uPx;           // one pixel, in print units
uniform float uBoil;         // which printing this frame is (the stop-motion's frame number)
uniform float uTime;         // time, stepped at the print's frame rate
uniform vec4 uBr[112];       // the old tree: limb segments a.xy → b.xy
uniform vec4 uBrR[28];       // … and their radii, four to a vector
uniform int uBrN;
uniform vec4 uTreeBox;       // its bounds
uniform vec4 uHA[8];         // houses: x, base y, half width, wall height
uniform vec4 uHB[8];         //         roof height, type (0 long side to us, 1 gable end), lit windows (bits), seed
uniform vec4 uLan;           // the lantern: centre x, y; its light; sway
uniform vec4 uFig[3];        // people going home: x, foot y, walk phase (sign: which way), their lantern lit

    float cord = sdSeg(q, vec2(0.0112, 0.0188 + bob), vec2(0.0115, 0.0175 + bob + 0.0005 * sin(ph * 2.0))) - 0.0003;
    lay(fill(min(min(coat, head), min(min(hat, legs), min(pole, cord)))), vec3(1.0, 0.75, 0.0));
    lay(fill(abs(coat + 0.0012) - 0.00035) * step(0.004, q.y) * step(q.y, 0.014), vec3(0.0, 0.75, 0.0));   // a padded hem, cut
    lay(fill(lan), vec3(0.0, 0.0, 1.0));
    lay(fill(abs(lan) - 0.0004), vec3(1.0, 0.0, 0.0));
    lay(fill(length(lc * vec2(1.4, 1.0)) - 0.0011 * F.w), vec3(0.0, 0.0, 0.0));
  }
  // ---------------- the far bank: a lip of snow, the dark face under it
  float bF = bankFar(P.x);
  {
    float dF = sdBox(vec2(0.0, P.y - (bF - 0.0070)), vec2(1.0, 0.0060)) + rough(P);
    float mF = fill(dF);
    if (mF > 0.0) lay(mF, vec3(lines(P.y, 1.0, P.x, 0.0024, 0.30, 81.0), 0.85, 0.0));
  }

  // ---------------- the frozen river
  float bN = bankNear(P.x);
  if (P.y < bF - 0.013 && P.y > bN - 0.012){
    float tt = (P.y - bN) / (bF - bN);
    // indigo, wiped: deepest under the far bank (its reflection), a little lighter in the middle
    float B = 0.56 + 0.20 * smoothstep(0.75, 0.97, tt) + 0.08 * (vnoise(vec2(P.x * 1.3, P.y * 7.0)) - 0.5);
    // the far bank's reflection: black lines thickening toward it
    float K = lines(P.y, 1.0, P.x, 0.0040, mix(0.93, 0.56, smoothstep(0.80, 0.985, tt)), 91.0);
    // glints: long thin cuts through the indigo, the snow-light on the ice
    float gl = lines(P.y + 0.0013, 1.0, P.x, 0.0050, 0.06 + 0.16 * smoothstep(0.35, 0.8, vnoise(vec2(P.x * 3.0, P.y * 22.0))), 93.0);
    B *= gl;
    float R = 0.0;
    // the lit windows' reflections: a column of short horizontal strokes going down from the bank
    for (int i = 0; i < 8; i++){
      vec4 H = uHA[i], HB = uHB[i];
      if (H.z <= 0.0 || HB.z < 0.5) continue;
      for (int w = 0; w < 2; w++){
        if (HB.y > 0.5 && w == 1) break;
        float lit = w == 0 ? mod(HB.z, 2.0) : step(2.0, HB.z);
        float wx = H.x + (HB.y > 0.5 ? 0.0 : (float(w) - 0.5) * H.z * 1.05);
        float dy = bF - 0.013 - P.y;
        if (dy < 0.0 || dy > 0.09) continue;
        float row = floor(P.y / 0.0048);
        float fade = 1.0 - dy / 0.09;
        float half_ = (0.0030 + 0.0060 * hash11(row * 3.1 + wx * 50.0)) * fade;
        float jx = (hash11(row * 7.7 + wx * 30.0) - 0.5) * 0.006;
        float dash = fill(abs(P.x - wx - jx) - half_) * step(abs(fract(P.y / 0.0048) - 0.5), 0.22) * step(0.25 * (1.0 - fade), hash11(row * 1.3 + wx * 9.0));
        R = max(R, dash * lit);
      }
    }
    // drifted snow lying on the ice in long streaks, mostly near the banks; a black shadow line under each
    float thr = 0.68 - 0.10 * (1.0 - smoothstep(0.0, 0.25, tt)) - 0.08 * smoothstep(0.80, 1.0, tt);
    vec2 sp = P * vec2(2.2, 30.0) + vec2(5.0, 0.0);
    float n = fbm3(sp) + 0.05 * (vnoise(P * vec2(30.0, 200.0)) - 0.5);
    float n2 = fbm3(sp + vec2(0.0, 0.0030 * 30.0));
    float patch_ = fill((thr - n) / 14.0);
    float shadowL = fill((thr - n2) / 14.0) * (1.0 - patch_) * step(0.3, vnoise(vec2(P.x * 50.0, 3.0)));
    B = mix(B, 0.05, patch_); K = mix(K, 0.0, patch_); R *= 1.0 - patch_;
    K = max(K, shadowL * 0.95);
    // a little boat frozen into the ice by the right bank: only what's above the ice shows; snow heaped in it, its pole leaning
    {
      vec2 bq = P - vec2(1.30, 0.330);
      if (abs(bq.x) < 0.12 && bq.y > -0.03 && bq.y < 0.12){
        float L = 0.078, u = bq.x / L;
        float top = 0.006 + 0.020 * pow(abs(u), 3.0) + 0.004 * u;                // the gunwale's sheer, higher at the bow (right)
        float dHull = max(max(abs(bq.x) - L * (1.0 - 0.3 * sat(-bq.y / 0.01)), bq.y - top), -bq.y - 0.001);
        float mH = fill(dHull);
        // its shadow and the trough of ice round it
        float sh = fill((length((bq - vec2(0.004, -0.002)) / vec2(L * 1.06, 0.010)) - 1.0) * 0.010) * step(bq.y, 0.0);
        B = mix(B, 0.95, sh); K = mix(K, lines(bq.y, 1.0, bq.x, 0.0022, 0.6, 133.0), sh * 0.8);
        float planks = lines(bq.y - top * 0.5, 1.0, bq.x, 0.0026, 0.16, 131.0);
        K = mix(K, max(planks, fill(abs(bq.y - top + 0.0016) - 0.0006)), mH); B = mix(B, 0.7, mH); R *= 1.0 - mH;
        float dSn = max(abs(bq.x) - L * 0.80, bq.y - top - 0.0055 * sat(1.0 - u * u) - 0.002 * vnoise(vec2(bq.x * 160.0, 1.0)));
        dSn = max(dSn, top - 0.003 - bq.y);
        float mSn = fill(dSn);
        K = mix(K, fill(abs(dSn) - 0.0005) * step(bq.y, top), mSn); B = mix(B, 0.10, mSn);
        float pole = fill(sdSeg(bq, vec2(-0.040, 0.004), vec2(0.030, 0.105)) - 0.0012);
        K = max(K, pole); B = mix(B, 0.6, pole);
      }
    }
    // the ice hole: black water ringed with broken ice; a few cracks run out from it
    vec2 hq = (P - HOLE) * vec2(1.0, HOLE_SQ);
    float hr = length(hq);
    if (hr < 0.17){
      float ha = atan(hq.y, hq.x);
      for (int j = 0; j < 5; j++){
        float ca = float(j) * 1.257 + (hash11(float(j) * 3.3 + 1.0) - 0.5) * 0.8;
        float cl = HOLE_R + 0.025 + 0.075 * hash11(float(j) * 5.1 + 2.0);
        vec2 cdir = vec2(cos(ca), sin(ca));
        float al = dot(hq, cdir);
        float cd = hq.x * cdir.y - hq.y * cdir.x + 0.010 * (vnoise(vec2(al * 40.0, float(j) * 7.0)) - 0.5) + 0.003 * (vnoise(vec2(al * 160.0, float(j))) - 0.5);
        float crack = fill(abs(cd) / HOLE_SQ * 1.6 - 0.0007 * (1.0 - al / cl)) * step(HOLE_R, al) * step(al, cl);
        K = max(K, crack);
      }
      // the rim: broken chunks of ice heaped round the hole, each its own size, outlined in black, shaded on the near side
      float cn = 13.0, cpos = ha / (2.0 * PI) * cn + 0.35 * vnoise(vec2(ha * 2.0, 2.0));
      float ci = floor(cpos), cf = fract(cpos);
      // the outer edge runs straight from corner to corner, each corner at its own distance: a jagged ring of slabs
      float outer = HOLE_R + 0.005 + 0.016 * mix(hash11(mod(ci, cn) * 3.7 + 1.0), hash11(mod(ci + 1.0, cn) * 3.7 + 1.0), cf);
      float dRim = (hr - outer) / HOLE_SQ * 1.6;
      float mRim = fill(dRim);
      float nearSide = step(hq.y, 0.0) * smoothstep(outer - 0.016, outer, hr);
      B = mix(B, 0.08 + 0.40 * nearSide * hash11(ci * 5.3), mRim); K = mix(K, 0.0, mRim); R *= 1.0 - mRim;
      K = max(K, fill(abs(dRim) - 0.0007));
      K = max(K, mRim * fill(abs(cf - 0.5) < 0.5 ? (0.5 - abs(cf - 0.5)) / cn * 2.0 * PI * hr / HOLE_SQ * 1.6 - 0.0006 : 1.0) * step(0.3, hash11(ci * 9.1)));
      // the water
      float dH = (hr - HOLE_R - (vnoise(vec2(ha * 6.0, 3.0)) - 0.5) * 0.006) / HOLE_SQ * 1.6;
      float mH = fill(dH);
      if (mH > 0.0){
        // the ice's thickness, seen on the far inner wall
        float wall = fill(-(length((P - HOLE - vec2(0.0, -0.0060)) * vec2(1.0, HOLE_SQ)) - HOLE_R) / HOLE_SQ * 1.6);
        float Kw = 1.0;
        for (int j = 0; j < 3; j++){
          float ph = t * 0.10 + float(j) / 3.0;
          float rr = fract(ph) * (HOLE_R - 0.004);
          Kw *= 1.0 - fill((abs(hr - rr) - 0.0016 * (1.0 - rr / HOLE_R)) / HOLE_SQ * 1.6) * 0.9 * step(0.55, vnoise(vec2(ha * 2.2, float(j) + floor(ph) * 7.0)));
        }
        float iceW = 1.0 - lines(P.x, 1.0, P.y, 0.0022, 0.42, 97.0);
        K = mix(K, mix(Kw, 1.0 - iceW * 0.8, wall), mH);
        B = mix(B, mix(1.0, 0.70, wall), mH); R *= 1.0 - mH;
      }
    }
    float mR = fill(max(P.y - bF + 0.013, bN - P.y) + rough(P));
    lay(mR, vec3(K, B, R));
  }

  // ---------------- the near bank: bare paper, mostly. A few long low drifts, each crest throwing a short blue shadow toward us,
  // hatched along the crest; the bottom of the sheet printed a little darker
  if (P.y < bN + 0.004){
    float K = fill(abs(P.y - bN) - 0.0008) * step(0.25, vnoise(vec2(P.x * 35.0, 6.0)));
    float B = 0.04 + 0.22 * smoothstep(0.07, 0.0, P.y);
    for (int i = 0; i < 4; i++){
      vec4 D = DRIFTS[i];
      float u = (P.x - D.x) / D.z;
      if (abs(u) > 1.0) continue;
      float arc = 1.0 - u * u;
      float cr = D.y + D.w * arc + 0.004 * (vnoise(vec2(P.x * 30.0, float(i))) - 0.5);
      float dc = cr - P.y;
      float len = 0.030 * arc;
      if (dc > 0.0 && dc < len){
        float sh = pow(1.0 - dc / len, 1.4);
        B = max(B, 0.55 * sh);
        K = max(K, lines(P.y - cr, 1.0, P.x, 0.0042, 1.0 - 0.30 * sh, 101.0 + float(i)) * step(0.08, sh));
      }
      K = max(K, fill(abs(dc) - 0.0008 * arc) * step(0.3, vnoise(vec2(P.x * 40.0, float(i) + 9.0))) * step(-0.002, dc));
    }
    // footprints: someone walked from here down onto the ice, to the hole
    {
      vec2 a = vec2(0.36, 0.0), b = HOLE + vec2(-0.045, -0.014);
      vec2 ab = b - a; float L = length(ab); vec2 dn = ab / L, pn = vec2(-dn.y, dn.x);
      float s2 = dot(P - a, dn) / L;
      if (s2 > -0.02 && s2 < 1.02){
        float N = 30.0, i0 = floor(s2 * N);
        for (int j = 0; j <= 1; j++){
          float i = i0 + float(j);
          if (i < 0.0 || i > N) continue;
          float sc = mix(1.25, 0.6, i / N);
          vec2 c = a + ab * (i / N) + pn * (mod(i, 2.0) - 0.5) * 0.010 * sc + pn * 0.020 * sin(i / N * 4.0);
          vec2 fq = P - c; fq = vec2(dot(fq, dn), dot(fq, pn));
          float df = length(fq / (vec2(0.0050, 0.0026) * sc)) - 1.0;
          float mf = fill(df * 0.0026 * sc);
          B = max(B, 0.62 * mf);
          K = max(K, fill(abs(df * 0.0026 * sc) - 0.00055) * step(0.0, fq.x + 0.001 * sc));
        }
      }
    }
    lay(fill(P.y - bN), vec3(K, B, 0.0));
  }

  // ---------------- the ice fisherman by the hole, hunched on his stool, his line down into the black water
  {
    vec2 q = P - (HOLE + vec2(0.072, -0.004));
    if (abs(q.x) < 0.03 && q.y > -0.006 && q.y < 0.03){
      float b = 0.0003 * sin(t * 0.8);
      float body = length((q - vec2(0.0, 0.0085 + b)) / vec2(0.0062, 0.0075)) - 1.0;
      float head = length(q - vec2(-0.0032, 0.0168 + b)) - 0.0024;
      vec2 hq = q - vec2(-0.0032, 0.0180 + b);
      float hat = max(abs(hq.x) * 0.40 + hq.y - 0.0016, -hq.y);
      float stool = sdBox(q - vec2(0.0012, 0.0012), vec2(0.0032, 0.0012));
      float rod = sdSeg(q, vec2(-0.0050, 0.0110 + b), vec2(-0.0220, 0.0190 + b)) - 0.00035;
      float line_ = sdSeg(q, vec2(-0.0220, 0.0190 + b), vec2(-0.0235, -0.0030)) - 0.00018;
      lay(fill(min(min(body * 0.006, head), min(hat, min(stool, min(rod, line_))))), vec3(1.0, 0.7, 0.0));
    }
  }
  // ---------------- dry reeds in clumps along the near bank: curving, tapering strokes, some broken over; snow on the seed heads
  if (P.y < bN + 0.24 && ((P.x > 0.24 && P.x < 0.56) || (P.x > 1.08 && P.x < 1.44))){
    float dR = 1e9, dSnow = 1e9;
    for (int c = 0; c < 4; c++){
      float fc = float(c);
      float cx = c == 0 ? 0.31 : c == 1 ? 0.47 : c == 2 ? 1.16 : 1.35;
      if (abs(P.x - cx) > 0.12) continue;
      for (int i = 0; i < 12; i++){
        float fi = float(i) + fc * 12.0;
        float x0 = cx + (hash11(fi * 3.3) - 0.5) * 0.05;
        float H = 0.08 + 0.13 * hash11(fi * 7.1) * (1.0 - 0.5 * abs(x0 - cx) / 0.025);
        float lean = (x0 - cx) * 1.6 + (hash11(fi * 1.7) - 0.5) * 0.05 + 0.005 * sin(t * 1.1 + fi * 1.3);
        vec2 p0 = vec2(x0, bankNear(x0) - 0.015 - 0.035 * hash11(fi * 5.5));
        vec2 p1 = p0 + vec2(lean * 0.06, H * 0.30), p2 = p0 + vec2(lean * 0.25, H * 0.58), p3 = p0 + vec2(lean * 0.55, H * 0.82), p4 = p0 + vec2(lean, H);
        if (hash11(fi * 9.3) > 0.75){ p3 = p2 + vec2(sign(lean + 0.001) * 0.35, 0.10) * H * 0.4; p4 = p3 + vec2(sign(lean + 0.001) * 0.45, -0.55) * H * 0.35; }
        if (abs(P.x - p0.x) > H * 0.8 + 0.03) continue;
        dR = min(dR, sdSeg(P, p0, p1) - 0.0021);
        dR = min(dR, sdSeg(P, p1, p2) - 0.0016);
        dR = min(dR, sdSeg(P, p2, p3) - 0.0011);
        dR = min(dR, sdSeg(P, p3, p4) - 0.0007);
        if (hash11(fi * 2.9) > 0.3){
          vec2 hd = normalize(p4 - p3), hp = P - (p4 + hd * 0.007);
          vec2 hl = vec2(dot(hp, hd), dot(hp, vec2(-hd.y, hd.x)));
          dR = min(dR, (length(hl / vec2(0.0095, 0.0026)) - 1.0) * 0.0026);
          vec2 up = vec2(-hd.y, hd.x) * sign(hd.x + 0.001);
          dSnow = min(dSnow, (length((hp - up * 0.0018) / vec2(0.0065, 0.0017)) - 1.0) * 0.0017);
        }
        // a long leaf, bending away from a few of them
        if (hash11(fi * 4.4) > 0.55){
          float sd = sign(hash11(fi) - 0.5);
          vec2 lp = mix(p1, p2, 0.2 + 0.6 * hash11(fi * 6.1)), lm = lp + vec2(sd * (0.012 + 0.010 * hash11(fi * 2.2)), 0.007), le = lm + vec2(sd * 0.010, -0.016 - 0.012 * hash11(fi * 3.4));
          float tl = clamp(dot(P - lp, le - lp) / dot(le - lp, le - lp), 0.0, 1.0);
          dR = min(dR, min(sdSeg(P, lp, lm), sdSeg(P, lm, le)) - 0.0026 * sqrt(max(1.0 - tl, 0.0)) * (0.4 + tl * 2.0));
        }
      }
    }
    lay(fill(dR), vec3(1.0, 0.3, 0.0));
    lay(fill(dSnow), vec3(0.0, 0.0, 0.0));
  }

  // ---------------- the lantern's light, cut out of everything behind it: a ring of rays, wider and closer near the flame
  vec2 lq = P - uLan.xy;
  float lr = length(lq);
  if (uLan.z > 0.0 && lr < 0.26){
    float la = atan(lq.x, -lq.y);
    float rk = floor(la / (2.0 * PI / 60.0) + 0.5);
    float reach = 0.07 + 0.19 * hash11(rk * 1.31 + 4.0) * hash11(rk * 0.73 + 9.0) + 0.05 * hash11(rk * 2.9);
    float T = 0.49 * uLan.z * exp(-max(lr - 0.03, 0.0) / 0.075) * smoothstep(reach, reach * 0.6, lr);
    float ray = lines(la, 1.0 / max(lr, 1e-3), lr, 2.0 * PI / 60.0, T, 111.0);
    float core = fill(lr - 0.029 * uLan.z - 0.004 * (vnoise(vec2(la * 8.0, 2.0)) - 0.5));
    float keep = ray * (1.0 - core);
    ink.x *= keep; ink.y *= mix(1.0, keep, 0.95);
  }

  // ---------------- the old tree in the foreground: black limbs, carved along their length, lit a little from the lantern's side;
  // snow along their tops; a fine white keyline where they cross the dark
  if (P.x > uTreeBox.x && P.x < uTreeBox.z && P.y > uTreeBox.y && P.y < uTreeBox.w){
    float dT = 1e9, dSn = 1e9, perp = 0.0, along = 0.0, rad = 0.0; vec2 nrm = vec2(0.0);
    for (int i = 0; i < 112; i++){
      if (i >= uBrN) break;
      vec4 b = uBr[i];
      float r = uBrR[i / 4][i % 4];
      vec2 ba = b.zw - b.xy, pa = P - b.xy;
      float L2 = dot(ba, ba);
      vec2 mid = pa - ba * 0.5;
      float reach = sqrt(L2) * 0.5 + r * 3.0 + 0.004;
      if (dot(mid, mid) > reach * reach) continue;
      float h = clamp(dot(pa, ba) / L2, 0.0, 1.0);
      vec2 dv = pa - ba * h;
      float dl = length(dv);
      float d = dl - r;
      if (d < dT){ dT = d; rad = r; nrm = dv / max(dl, 1e-5); vec2 dir = ba * inversesqrt(L2); perp = dir.x * pa.y - dir.y * pa.x; along = dot(pa, dir); }
      vec2 dir = ba * inversesqrt(L2);
      float s = (r * 1.15 * (1.0 - abs(dir.y)) + 0.0005) * (0.55 + 0.7 * vnoise(vec2(dot(pa, dir) * 60.0, float(i))));
      dSn = min(dSn, sdSeg(P - vec2(0.0, r * 0.55 + s * 0.6), b.xy, b.zw) - s * 0.75);
    }
    dT += (vnoise(P * 400.0) - 0.5) * 0.0008 + (vnoise(P * 90.0) - 0.5) * 0.0012 * step(0.006, rad);
    float ring = fill(dT - 0.0008) * (1.0 - fill(dT)) * smoothstep(0.008, 0.016, rad);
    ink.x *= 1.0 - ring; ink.y *= 1.0 - 0.6 * ring; ink.z *= 1.0 - ring;
    float mT = fill(dT);
    if (mT > 0.0){
      // bark: cuts running along the limb, wider on the side the light comes from
      float lit = dot(nrm, normalize(vec2(0.75, 0.25)));
      float T = mix(0.03, 0.26, smoothstep(0.1, 0.95, lit)) * step(0.0042, rad);
      float K = lines(perp, 1.0, along, max(rad * 0.30, 0.0024), T, 71.0);
      lay(mT, vec3(K, 0.65, 0.0));
    }
    lay(fill(dSn + (vnoise(P * 500.0) - 0.5) * 0.0010), vec3(0.0, 0.10, 0.0));
  }

  // ---------------- the lantern, hanging from the tree's low limb: vermilion paper whose ribs follow its roundness, black caps, a tassel
  {
    vec2 piv = vec2(uLan.x - sin(uLan.w) * 0.075, uLan.y + cos(uLan.w) * 0.075);
    lay(fill(sdSeg(P, piv, uLan.xy + vec2(-sin(uLan.w), cos(uLan.w)) * 0.034) - 0.0006), vec3(1.0, 0.5, 0.0));
    vec2 q = P - uLan.xy;
    float ca = cos(uLan.w), sa = sin(uLan.w);
    q = vec2(ca * q.x + sa * q.y, -sa * q.x + ca * q.y);
    vec2 rr = vec2(0.0255, 0.030);
    float dL = (length(q / rr) - 1.0) * rr.x;
    float mL = fill(dL);
    if (mL > 0.0){
      float yy = clamp(q.y / rr.y, -0.999, 0.999);
      float wy = rr.x * sqrt(1.0 - yy * yy);
      float mer = q.x / wy;                                               // -1 … 1 across the bulge
      float rib = fill((abs(fract(mer * 2.5 + 0.5) - 0.5) / 2.5) * wy - 0.00055);
      float shade = lines(q.x, 1.0, q.y, 0.0020, mix(0.50, 1.0 - 0.45 * smoothstep(0.35, 1.0, mer), sat(uLan.z)), 121.0) * mix(1.0, step(0.3, mer), sat(uLan.z));
      float glow = smoothstep(0.62, 0.0, length(q / rr)) * uLan.z;           // the flame burns the lines away at its heart
      float K = max(rib * 0.9, shade) * (1.0 - glow);
      K = max(K, fill(abs(dL) - 0.0007));
      lay(mL, vec3(K, 0.0, 1.0 - 0.35 * glow));
    }
    float dCap = min(sdBox(q - vec2(0.0, rr.y + 0.0014), vec2(0.0115, 0.0030)), sdBox(q - vec2(0.0, -rr.y - 0.0014), vec2(0.0105, 0.0028)));
    lay(fill(dCap), vec3(1.0, 0.6, 0.0));

    float dTs = sdSeg(q, vec2(0.0, -rr.y - 0.003), vec2(0.0, -rr.y - 0.020)) - 0.0015 * (0.45 + 0.55 * step(-rr.y - 0.010, q.y));

// the old tree in the foreground: a thick leaning trunk, a great limb sweeping across the sky, a low one reaching
// out over the bank (the lantern hangs from its end), one going up out of the picture; twigs forking off them
function makeTree(rnd) {
  const segs = [];
  // a limb through the given points, each span bent a little off the straight (old wood grows in kinks), radius r0 → r1
  const poly = (pts, r0, r1, bend) => {
    const n = pts.length - 1;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[i + 1], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
      const k = (rnd() - 0.5) * 2 * bend * l, m = [a[0] + dx * 0.5 - dy / l * k, a[1] + dy * 0.5 + dx / l * k];
      const ra = r0 + (r1 - r0) * (i + 0.25) / n, rb = r0 + (r1 - r0) * (i + 0.75) / n;
      segs.push([...a, ...m, ra], [...m, ...b, rb]);
    }
  };
  const along = (pts, f) => {   // a point a fraction f along a polyline, and the direction there
    const n = pts.length - 1, x = Math.min(f * n, n - 1e-6), i = Math.floor(x), u = x - i;
    const a = pts[i], b = pts[i + 1];
    return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, Math.atan2(b[1] - a[1], b[0] - a[0])];
  };

      vec3 sc = vec3(0.24, 0.30, 0.24);

      float A = dot(dd, dd), B2 = dot(oo, dd), C2 = dot(oo, oo) - 1.0;
      float disc = B2 * B2 - A * C2;
      if (disc < 0.0) continue;
      float t = (-B2 - sqrt(disc)) / A;
      if (t > 0.0 && t < tBest){
        tBest = t; best = 1200 + s * 8 + j;

}
float laneX(float z){
  vec2 L0 = vec2(0, 22), L1 = vec2(-2.5, 2), L2 = vec2(-1, -16), L3 = vec2(3, -32), L4 = vec2(4, -46);

// warm light thrown on the snow: lit windows, lit lanterns, the stage once its lamp burns, and the light itself
vec3 pools(vec3 p){
  vec3 L = vec3(0.0);
  for (int i = 0; i < 56; i++){
    if (float(i) >= uNH) break;
    vec4 A = uHA[i], B = uHB[i];
    if (hash11(B.w * 3.3) > 0.6) continue;
    float dd = length(p.xz - A.xy) - max(A.z, A.w);
    L += WARM2 * 0.40 * exp(-max(dd, 0.0) / 1.4) * smoothstep(-0.4, 0.0, dd);
  }
  for (int s = 0; s < NS; s++){
    for (int j = 0; j < LPER; j++){
      float on = lanOn(s * LPER + j);
      if (on <= 0.0) continue;
      vec3 c = strPt(s, (float(j) + 0.5) / float(LPER));
      L += WARM * 0.50 * on * exp(-length(p - c + vec3(0.0, 0.4, 0.0)) / 1.5);
    }
  }
  float ds = length((p.xz - STAGE - vec2(0.0, 4.5)) * vec2(0.5, 1.0));
  L += WARM * 0.9 * uLit * exp(-ds / 3.5);
  L += vec3(1.0, 0.78, 0.45) * uHero.w * 1.1 * exp(-length(p - uHero.xyz) / 1.8);
  return L;
}
vec3 skyCol(vec3 rd, out float fid){
  fid = 0.0;
  float e = rd.y;
  vec3 c = mix(SKY1, SKY0, smoothstep(-0.02, 0.40, e));
  float a = atan(rd.x, -rd.z);
  float m = -1.0; float side_ = 0.0;
  for (int i = 0; i < 7; i++){
    float fi = float(i);
    float ai = -0.75 + fi * 0.26 + 0.08 * (hash11(fi * 3.7) - 0.5);
    float hi = 0.035 + 0.035 * hash11(fi * 5.1);
    if (i == 3) { ai = 0.06; hi = 0.105; }
    float wi = hi * (1.9 + 0.6 * hash11(fi * 9.3));
    float x = (a - ai) / wi;
    float hgt = hi * (1.0 - abs(x)) + 0.004 * (vnoise(vec2(a * 90.0, fi)) - 0.5) * (1.0 - abs(x));
    if (hgt > m){ m = hgt; side_ = x; }
  }
  if (e < m){
    bool lit_ = side_ < 0.0;
    float gully = smoothstep(0.55, 0.8, vnoise(vec2(a * 180.0 + e * 60.0, e * 14.0)));
    c = lit_ ? vec3(0.70, 0.75, 0.86) : vec3(0.41, 0.47, 0.62);
    c = mix(c, vec3(0.45, 0.51, 0.66), gully * (lit_ ? 0.55 : 0.0));
    c = mix(c, SKY1 * 1.05, 0.20 + 0.45 * smoothstep(m - 0.02, m - 0.07, e));
    fid = lit_ ? 1.0 : 2.0;
  }
  float hh = -0.020 + 0.022 * fbm3(vec2(a * 3.5, 7.0)) + 0.008 * sin(a * 7.0);
  float g = a * 140.0; float gi = floor(g), gf = fract(g) - 0.5;
  float ph = 0.010 + 0.010 * hash11(gi);
  float pine = max(abs(gf) * (1.0 / 140.0) - 0.0035 * (1.0 - (e - hh) / ph), e - hh - ph);
  if (e < hh || (pine < 0.0 && hash11(gi + 3.0) < 0.8)){
    c = mix(vec3(0.27, 0.32, 0.46), vec3(0.11, 0.15, 0.25), smoothstep(hh - 0.05, hh, e));
    fid = 3.0;
  }
  return c;
}
// ---- a villager (a flat figure standing on the snow): hat or hood, padded coat, snow on the shoulders, maybe a lantern or umbrella
vec4 person(vec2 q, float seed, float h, float walk, out float fid){
  fid = 0.0;
  float kind = hash11(seed + 21.0);
  vec3 coat = kind < 0.45 ? vec3(0.15, 0.19, 0.33) : kind < 0.75 ? vec3(0.32, 0.22, 0.17) : kind < 0.88 ? vec3(0.33, 0.35, 0.42) : vec3(0.70, 0.17, 0.12);

  float ph = uTime * 3.4 + seed * 7.0;
  u.y -= walk * 0.012 * abs(sin(ph));
  vec4 c = vec4(0.0);
  float stride = walk * 0.05 * sin(ph);
  float legs = min(sdSeg(u, vec2(-0.06 + stride, 0.02), vec2(-0.05, 0.22)), sdSeg(u, vec2(0.06 - stride, 0.02), vec2(0.05, 0.22))) - 0.045;

  if (head < 0.0){ c = vec4(vec3(0.12, 0.10, 0.10), 1.0); fid = 4.0; }
  if (hash11(seed + 31.0) < 0.6){
    float hat = max(abs(u.x) - 0.36 * (1.0 - (u.y - 0.90) / 0.16), max(0.90 - u.y, u.y - 1.06));
    if (hat < 0.0){ c = vec4(vec3(0.62, 0.48, 0.30), 1.0); fid = 5.0; if (abs(fract((u.x / max(1.0 - (u.y - 0.90) / 0.16, 0.05)) * 9.0) - 0.5) < 0.08) c.rgb *= 0.75; }

  } else {
    float hood = length(u - vec2(0.0, 0.88)) - 0.14;

    if (hood < 0.0 && u.y > 0.96 + 0.02 * vnoise(vec2(u.x * 30.0, seed))){ c = vec4(SNOW, 1.0); fid = 6.0; }
  }

  if (sh < 0.0 && coatD < 0.02){ c = vec4(SNOW, 1.0); fid = 7.0; }
  float extra = hash11(seed + 11.0);
  if (extra > 0.72){
    vec2 uq = rot(0.18 * (hash11(seed + 9.0) - 0.5)) * (u - vec2(0.06, 1.16));
    float can = max(sdEll(uq, vec2(0.62, 0.24)), -uq.y);
    float shaft = max(abs(u.x - 0.06) - 0.012, max(0.55 - u.y, u.y - 1.16));
    if (shaft < 0.0 && can > 0.0){ c = vec4(vec3(0.15), 1.0); fid = 8.0; }
    if (can < 0.0){ c = vec4(mix(vec3(0.76, 0.48, 0.24), vec3(0.62, 0.20, 0.14), step(0.5, hash11(seed + 9.0))), 1.0); fid = 9.0;
      if (abs(fract(atan(uq.x, uq.y + 0.2) / PI * 7.0) - 0.5) < 0.05) c.rgb *= 0.55; }

  } else if (extra > 0.45){
    float side = hash11(seed + 3.0) < 0.5 ? -1.0 : 1.0;

float treeD(vec2 u, float seed){
  float d = max(abs(u.x - 0.03 * sin(u.y * 5.0 + seed)) - mix(0.035, 0.012, u.y), u.y - 0.62);
  for (int i = 0; i < 9; i++){
    float fi = float(i);
    float y0 = 0.28 + fi * 0.045;
    float side = mod(fi + seed, 2.0) < 1.0 ? -1.0 : 1.0;
    vec2 a = vec2(0.03 * sin(y0 * 5.0 + seed), y0);
    float ang = side * (0.6 + 0.5 * hash11(fi + seed));
    vec2 dir = vec2(sin(ang), cos(ang));
    float len = 0.30 - fi * 0.02 + 0.08 * hash11(fi * 3.0 + seed);
    vec2 b = a + dir * len;
    float r0 = 0.016 - fi * 0.0012;
    d = min(d, sdSeg(u, a, b) - r0 * (1.0 - 0.6 * clamp(dot(u - a, dir) / len, 0.0, 1.0)));
    vec2 m = a + dir * len * 0.55;
    vec2 dir2 = vec2(sin(ang + side * 0.6), cos(ang + side * 0.6));
    d = min(d, sdSeg(u, m, m + dir2 * len * 0.45) - r0 * 0.4);
    vec2 dir3 = vec2(sin(ang - side * 0.5), cos(ang - side * 0.5));
    d = min(d, sdSeg(u, b - dir * len * 0.2, b - dir * len * 0.2 + dir3 * len * 0.3) - r0 * 0.3);
  }
  return d;
}
vec4 tree(vec2 q, float hgt, float seed, out float fid){
  fid = 0.0;
  vec2 u = q / hgt;
  if (abs(u.x) > 0.6 || u.y < 0.0 || u.y > 1.05) return vec4(0.0);
  float d = treeD(u, seed);
  if (d >= 0.0) return vec4(0.0);
  float above = treeD(u + vec2(0.0, 0.010), seed);
  if (above > 0.0 && vnoise(u * 260.0) > 0.2){ fid = 2.0; return vec4(SNOW, 1.0); }
  fid = 1.0; return vec4(vec3(0.08, 0.07, 0.09), 1.0);
}
float smokeA(vec2 q, float seed){
  float a = 0.0;
  for (int i = 0; i < 10; i++){
    float fi = float(i);
    float age = fract(uTime * 0.10 + fi / 10.0 + seed);
    vec2 c = vec2(age * age * 3.0 + 0.2 * sin(age * 5.0 + seed), age * 5.0);
    float r = 0.12 + age * 0.75;
    float d = length(q - c) - r * (0.8 + 0.2 * vnoise(q * 2.0 + fi));
    a = max(a, smoothstep(0.15, -0.25, d) * (1.0 - age) * 0.9);
  }
  return a;
}
void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 sp = (frag - 0.5 * uRes) / uRes.y;
  vec3 fw = normalize(uCamTgt - uCamPos), rt = normalize(cross(fw, vec3(0, 1, 0))), up = cross(rt, fw);
  float fl = 0.5 / tan(radians(uFov) * 0.5);
  vec3 rd = normalize(fw * fl + rt * sp.x + up * sp.y), ro = uCamPos;
  tBest = 1e9; best = -1;
  for (int i = 0; i < 56; i++){ if (float(i) >= uNH) break; house(ro, rd, i); }
  stage(ro, rd, true);
  lanterns(ro, rd);
  float tg = -ro.y / rd.y;
  if (rd.y < 0.0 && tg < tBest && tg < 140.0){ tBest = tg; best = 1; }
  vec3 bn = normalize(vec3(-fw.x, 0.0, -fw.z));
  vec3 br = normalize(cross(vec3(0, 1, 0), bn));
  vec4 bb = vec4(0.0); float bfid = 0.0, bt = 1e9, smokeAcc = 0.0;
  for (int i = 0; i < 30; i++){

    vec3 hp = ro + rd * t - c;
    vec2 q = vec2(dot(hp, -br), hp.y);

  }
  for (int i = 0; i < 7; i++){
    vec4 Tr = uTR[i];
    vec3 c = vec3(Tr.x, 0.0, Tr.y);
    float t = dot(c - ro, bn) / dot(rd, bn);
    if (t < 0.0 || t > tBest || t > bt) continue;
    vec3 hp = ro + rd * t - c;
    vec2 q = vec2(dot(hp, -br), hp.y);
    float f;

  }
  for (int i = 0; i < 56; i++){
    if (float(i) >= uNH) break;

    if (hash11(B.w * 5.1) >= 0.45 || hash11(B.w * 9.7) > 0.35) continue;

    cc.y = B.x + B.y * 1.3;
    cc.xz = B.z > 0.5 ? vec2(A.x - A.w * 0.3, A.y + A.z * 0.35) : vec2(A.x + A.z * 0.35, A.y + A.w * 0.3);

    float sq = smoothstep(8.0, 6.0, length((p.xz - STAGE - vec2(0.0, 7.0)) * vec2(0.55, 1.0)));
    laneM = max(laneM, sq);

  else if (best < 1000){
