    col = mix(col, SKY1 * 1.15, smoothstep(30.0, 130.0, tBest) * 0.6);
  }
  else {
    vec3 L = bestL;
    if (best >= 1100){
      int idx = best - 1100;
      float lit = dot(bestN, KEYL);
      if (idx == 0){ col = vec3(0.30, 0.13, 0.11) + WARM2 * 0.25 * uLit; }
      else {
        col = lit > 0.3 ? SNOW : SNOWSH;
        float f = bestInfo.x;
        float rim = min(6.4 - abs(L.x), 4.4 - abs(L.z));
        float lipW = 0.30 + 0.12 * vnoise(vec2((L.x + L.z) * 5.0, 1.0));
        if (rim < lipW) col = TILE;
        if (rim < lipW && rim > 0.18) col = lit > 0.0 ? SNOW : SNOWSH;
        if (f < -0.30) col = SHU * 0.8;
      }
    } else {
      int part = (best - 1000) / 8;
      if (part == 0){ col = vec3(0.27, 0.21, 0.20); if (abs(fract(L.y * 2.4) - 0.5) < 0.05) col *= 0.6; if (bestN.y > 0.5) col = SNOWSH; }
      else if (part == 1 || part == 2 || part == 6 || part == 7) col = SHU;
      else if (part == 3) col = vec3(0.12, 0.09, 0.09);
      else if (part == 4){
        // the screen. Dark until the lamp behind it burns; then what is on it is the shadow play itself
        vec2 su = (L.xy - vec2(0.0, 3.05)) / vec2(${SCR.hw.toFixed(3)}, ${SCR.hh.toFixed(3)});
        vec3 glow = mix(vec3(1.0, 0.91, 0.64), vec3(0.95, 0.58, 0.26), smoothstep(0.2, 1.3, length(su * vec2(0.8, 1.0))));
        vec3 lit_ = uScreenOn > 0.5 ? texture(uScreen, su * 0.5 + 0.5).rgb : glow;
        col = mix(vec3(0.33, 0.36, 0.45), lit_, uLit);
      }
      else if (part == 5){ col = SHU; if (L.y < 5.02 + 0.06 * abs(sin(L.x * 6.0))) col = vec3(0.86, 0.66, 0.25); }
      else if (part == 8){ col = SHU * 0.85; if (bestN.y > 0.5) col = SNOW; }
      if (part != 4) col += WARM2 * 0.35 * uLit * exp(-length(L - vec3(0.0, 3.0, 2.0)) / 3.0);
    }
    fid = float(best);
  }
  if (bt < tBest){ col = bb.rgb; fid = bfid; col = mix(col, SKY1 * 1.15, smoothstep(30.0, 130.0, bt) * 0.55); tBest = bt; }
  col = mix(col, vec3(0.56, 0.61, 0.73), smokeAcc * 0.45);
  {
    float best2 = 1e9;
    for (int s = 0; s < NS; s++){
      for (int j = 0; j < 8; j++){
        vec3 a = strPt(s, float(j) / 8.0), b = strPt(s, float(j + 1) / 8.0);
        vec3 va = a - ro, vb = b - ro;
        float za = dot(va, fw), zb = dot(vb, fw);
        if (za < 0.5 || zb < 0.5) continue;
        vec2 pa = vec2(dot(va, rt), dot(va, up)) * fl / za, pb = vec2(dot(vb, rt), dot(vb, up)) * fl / zb;
        vec2 ba = pb - pa; float h = clamp(dot(sp - pa, ba) / dot(ba, ba), 0.0, 1.0);
        float dd = length(sp - pa - ba * h) * uRes.y;
        float z = mix(za, zb, h);
        if (dd < 0.9 && z < tBest * dot(rd, fw)) best2 = min(best2, dd);
      }
    }
    if (best2 < 0.9) col = mix(col, TIMB, 0.85);
  }
  o = vec4(col, fid);
  oD = vec4(tBest * dot(rd, fw), 0.0, 0.0, 1.0);          // depth along the view axis
}`;

/* ---------------------------------------------------------------- pass 2: the printing */
const FS_PRINT = HEAD + `
uniform sampler2D uA, uD;
uniform vec4 uHeroS;          // the light on screen: x, y (px), depth along the view, size (px)
uniform float uHeroB;         // its brightness
uniform float uSnowAmt;       // the falling snow (thins as the eye comes up to the screen)
uniform float uPure;          // inside the screen, how much of the printing is left (0 at the end of the push)
uniform vec4 uScrRect;        // the screen's rect on the picture (px): x0, y0, x1, y1
uniform float uBoil;          // which printing this is
uniform vec3 uWake;           // the print waking: from where (px), how far it has reached (px; huge = all awake)
out vec4 o;
void main(){
  vec2 frag = gl_FragCoord.xy, uv = frag / uRes;
  vec4 s0 = texture(uA, uv);
  float id = s0.a;
  float key = 0.0;
  for (int i = 0; i < 8; i++){
    float a = float(i) * PI * 0.25;
    vec2 o2 = vec2(cos(a), sin(a)) * 1.2;
    float id2 = texture(uA, uv + o2 / uRes).a;
    if (abs(id2 - id) > 0.5 && max(id, id2) > 5.5) key += 0.25;
  }
  key = clamp(key, 0.0, 1.0);
  vec2 mis = vec2(1.0, -0.7) / uRes;
  vec3 c = texture(uA, uv + mis).rgb;
  if (abs(texture(uA, uv + mis).a - id) > 0.5) c = s0.rgb * 0.6 + c * 0.4;
  vec2 p = frag / uRes.y;
  vec2 bo = vec2(hash11(uBoil), hash11(uBoil + 7.0)) * 3.0;           // each printing lands a little differently
  float fib = smoothstep(0.62, 0.9, vnoise(vec2(p.x * 40.0 + p.y * 9.0, p.y * 300.0))) * 0.5 + smoothstep(0.7, 0.95, vnoise(vec2(p.x * 300.0, p.y * 30.0 + p.x * 5.0))) * 0.5;
  float tooth = vnoise(frag * 0.7 + bo) * 0.6 + vnoise(frag * 1.9) * 0.4;
  float dark = 1.0 - dot(c, vec3(0.3, 0.5, 0.2));
  float isSky = step(id, 0.5);
  float grain = vnoise(vec2(p.x * 1.8 + 2.0 * fbm3(p * vec2(0.8, 5.0)), p.y * 150.0));
  float mottle = fbm3(p * 50.0 + bo);
  // inside the screen near the end of the push, the printing gives way to the screen itself
  float inScr = step(uScrRect.x, frag.x) * step(frag.x, uScrRect.z) * step(uScrRect.y, frag.y) * step(frag.y, uScrRect.w) * step(abs(id - ${1000 + 4 * 8}.0), 0.5);
  float pr = mix(1.0, uPure, inScr);
  vec3 c0 = c;
  c *= 1.0 + dark * ((0.05 + 0.10 * isSky) * (grain - 0.5) + 0.06 * (mottle - 0.5));
  c = mix(c, c * 0.93, smoothstep(0.55, 0.8, tooth) * dark);
  c = mix(c, vec3(0.97, 0.96, 0.92), fib * 0.08 * (1.0 - dark * 0.6));
  c = mix(c0, c, pr);
  // asleep: until the light comes, the sheet carries only the key block, black lines on bare paper (a proof, not yet
  // coloured); the colour blocks go on from where the light went in, outward
  float wd = length(frag - uWake.xy) + 0.06 * uRes.y * (fbm3(p * 7.0) - 0.5);
  float awake = smoothstep(uWake.z, uWake.z - 0.05 * uRes.y, wd);
  vec3 bare = vec3(0.95, 0.935, 0.89) * (0.96 + 0.04 * tooth);
  c = mix(bare, c, awake);
  c *= 1.0 - 0.10 * exp(-pow((wd - uWake.z) / (0.02 * uRes.y), 2.0)) * step(uWake.z, 1e4);      // the fresh edge of the ink, a little darker
  c = mix(c, vec3(0.06, 0.055, 0.075), key * (0.85 + 0.15 * vnoise(frag * 1.3)));
  // the light: a little carved flame, warm, and its glow on the paper; hidden where something stands in front of it
  if (uHeroB > 0.0){
    vec2 d = frag - uHeroS.xy;
    float sz = uHeroS.w;
    float depth = texture(uD, uv).r;
    float vis = 1.0;
    float hd = texture(uD, uHeroS.xy / uRes).r;
    if (hd < uHeroS.z - 0.3) vis = 0.0;                                  // something in front of it
    float r = length(d) / sz;
    // the flame: a teardrop, its point up and flickering
    vec2 q = d / sz; q.x *= 1.0 + 0.15 * sin(uTime * 13.0);
    float fl = length(vec2(q.x * (1.0 + max(q.y, 0.0) * 0.9), q.y * 0.75 + 0.15)) - 0.55;
    vec3 flame = mix(vec3(1.0, 0.97, 0.80), vec3(0.98, 0.55, 0.18), smoothstep(-0.35, 0.0, fl));
    float inF = smoothstep(0.06, -0.04, fl);
    // carved rays round it, as a printer would show a light
    float ang = atan(d.y, d.x);
    float rays = smoothstep(0.55, 0.95, sin(ang * 12.0 + 0.3 * sin(uTime * 2.0))) * smoothstep(1.0, 1.4, r) * smoothstep(3.6, 1.6, r);
    vec3 glow = vec3(1.0, 0.72, 0.38) * (exp(-r / 1.4) * 0.55 + rays * 0.25);
    c += glow * uHeroB * vis * (1.0 - inF);
    c = mix(c, flame, inF * uHeroB * vis);
    // round the flame a thin dark key line, as if cut
    c = mix(c, vec3(0.30, 0.10, 0.05), smoothstep(0.10, 0.04, abs(fl - 0.05)) * uHeroB * vis * 0.5);
  }
  // snow falling: gofun dots in three depths
  float snow = 0.0;
  for (int L = 0; L < 3; L++){
    float fl = float(L);
    float cell = 0.020 + fl * 0.028;
    vec2 q = p + vec2(0.015 * uTime * (0.5 + fl * 0.4) + 0.02 * sin(uTime * 0.3 + fl), uTime * (0.03 + 0.04 * fl));
    vec2 g = q / cell, gi = floor(g), gf = fract(g) - 0.5;
    float h = hash12(gi + fl * 17.0);
    if (h < 0.34 - fl * 0.10){
      vec2 o2 = (hash22(gi + fl * 5.0) - 0.5) * 0.6;
      float r = (0.040 + 0.028 * fl) * (0.6 + 0.6 * h / 0.34) * (0.020 / cell) * (1.0 + 1.3 * fl);
      float d = length(gf - o2) - r;
      snow = max(snow, smoothstep(0.012 + fl * 0.035, -0.01, d) * (0.92 - 0.15 * fl));
    }
  }
  c = mix(c, vec3(0.95, 0.96, 0.98), snow * uSnowAmt * awake);
  o = vec4(c, 1.0);
}`;

/* ---------------------------------------------------------------- the world */
const V3 = { sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t] };
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
// Catmull-Rom through points, by arc parameter u in [0, 1]
function spline(P, u) {
  const n = P.length - 1, x = Math.min(Math.max(u, 0), 1) * n, i = Math.min(Math.floor(x), n - 1), f = x - i;
  const p0 = P[Math.max(i - 1, 0)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(i + 2, n)];
  return [0, 1, 2].map(k => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * f + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * f * f + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * f * f * f));
}
// the establishing view: the whole village down the lane to the stage (this is the picture printed on the sheet in the summer)
const CAM0 = { pos: [0, 8.5, 18], tgt: [3, 1.0, -60], vfov: 20.6 };
// the sheet ends a hair larger than the picture (so no grass shows at its edges): the village takes over with the lens
// narrowed by the same hair, so nothing moves at the handover
const PAPER_OVER = 1.005;
const CAM0V = { pos: CAM0.pos, tgt: CAM0.tgt, vfov: 2 * Math.atan(Math.tan(CAM0.vfov * Math.PI / 360) / PAPER_OVER) * 180 / Math.PI };
// the end of the push: square on to the screen, the screen exactly filling a 16 : 9 picture
// (a hair closer than exactly filling, so no edge of the frame can show: the stage world starts with the same hair)
const OVER = 1.02;
const CAM_END = (() => { const d = SCR.hh / OVER / Math.tan(12 * Math.PI / 180); return { pos: [SCR.c[0], SCR.c[1], SCR.c[2] + d], tgt: SCR.c.slice(), vfov: 24 }; })();
// the light's way: from where it came in through the paper, down the lane under the lantern strings, over the crowd,
// over the screen's frame and down behind it, where the lamp is
const ENTRY = [-1.6, 6.2, 3.0];             // (high over the roofs, left of the middle of the print: where it comes in through the paper)
// (it ends on the screen's face: the light goes into the paper of the screen, as it went into the paper in the summer)
const PATH = [ENTRY, [-2.4, 4.0, -2], [-1.7, 3.4, -8], [-0.6, 3.5, -17], [1.6, 3.6, -26], [3.2, 3.5, -35], [4.1, 4.2, -44], [4.4, 3.9, -49], [4.6, 3.6, -52.5], [4.8, 3.5, -55.0], [4.9, 3.5, SCR.c[2]]];

W.village = {
  ready: false, t: 0, vol: 1, fade: 1,
  // driven from outside (the director): where the eye is, where the light is
  cam: CAM0, CAM0, CAM0V, PAPER_OVER, CAM_END, SCR, ENTRY, PATH, STAGE, OVER,
  hero: { p: ENTRY.slice(), b: 0 },
  lit: 0,                  // the stage's lamp (0 dark … 1 burning)
  snowAmt: 1, pure: 1,
  screenTex: null,
  lanOn: new Float32Array(Math.ceil(NL / 4) * 4),
  lanT: new Float32Array(NL).fill(-1),
  init() {
    const gl = YL.gl;
    this.pG = YL.makeProgram('village-g', VS, FS_G); YL.checkProgram(this.pG);
    this.pP = YL.makeProgram('village-print', VS, FS_PRINT); YL.checkProgram(this.pP);
    this.empty = gl.createVertexArray();
    this.black = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, this.black); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
    this.ready = true;
  },
  targets(w, h) {
    if (this.G && this.G.w === w && this.G.h === h) return;

  },
  // where a world point lands on a picture of the given aspect, in ndc (and its depth along the view)
  project(p, aspect, cam = this.cam) {
    const fw = V3.norm(V3.sub(cam.tgt, cam.pos)), rt = V3.norm(V3.cross(fw, [0, 1, 0])), up = V3.cross(rt, fw);
    const v = V3.sub(p, cam.pos), z = V3.dot(v, fw), f = 0.5 / Math.tan(cam.vfov * Math.PI / 360);
    return [V3.dot(v, rt) * f / z / (aspect * 0.5), V3.dot(v, up) * f / z / 0.5, z];
  },
  // the light along its way, by u in [0, 1]
  pathAt(u) { return spline(PATH, u); },
  // ... and by distance along it (m), with its heading
  arc() {
    if (this._arc) return this._arc;
    const N = 600, pts = [], d = [0];
    for (let i = 0; i <= N; i++) pts.push(spline(PATH, i / N));
    for (let i = 1; i <= N; i++) d.push(d[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1], pts[i][2] - pts[i - 1][2]));
    return (this._arc = { pts, d, L: d[N], N });
  },
  pathAtS(sm) {
    const A = this.arc(); sm = Math.min(Math.max(sm, 0), A.L);
    let lo = 0, hi = A.N; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (A.d[m] < sm) lo = m; else hi = m; }
    const f = (sm - A.d[lo]) / Math.max(A.d[hi] - A.d[lo], 1e-6);
    return V3.lerp(A.pts[lo], A.pts[hi], f);
  },
  // light the lanterns the light passes close to
  lightNear(p, now) {
    for (let i = 0; i < NL; i++) {
      if (this.lanT[i] >= 0) continue;
      const L = LANTERNS[i];
      if (Math.hypot(L[0] - p[0], L[1] - p[1], L[2] - p[2]) < 3.4) this.lanT[i] = now;
    }
  },
  update(dt) {
    this.t += dt;
    for (let i = 0; i < NL; i++) this.lanOn[i] = this.lanT[i] < 0 ? 0 : smooth(0, 0.45, this.t - this.lanT[i]);
    // walkers come up the lane toward the stage, and stop at the back of the crowd
    this.pp = this.pp || new Float32Array(30 * 4);
    PEOPLE.forEach((P, i) => {
      let x, z, w = 0;
      if (!P.walk) { x = P.x; z = P.z; }
      else {
        z = Math.max(P.z0 - P.v * this.t, -46 - (i - 18) * 0.9);
        w = z > -46 - (i - 18) * 0.9 + 0.05 ? 1 : 0;
        x = laneAt(z) + P.x0;
      }
      this.pp.set([x, z, P.h, P.seed + w * 100], i * 4);
    });
    this.sound(dt);
  },
  render(target, aspect) {
    const gl = YL.gl, U = YL.U;

    this.targets(w, h);
    const cam = this.cam;
    const tq = Math.floor(this.t * 12) / 12;               // the print is re-printed twelve times a second
    // 1) the blocks
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.G.fb); gl.viewport(0, 0, w, h);

    U(this.pG, 'uCamPos', cam.pos); U(this.pG, 'uCamTgt', cam.tgt); U(this.pG, 'uFov', cam.vfov);
    U(this.pG, 'uLit', this.lit); U(this.pG, 'uNH', NH);
    if (!this.uni) {
      const a = [], b = [], sa = [], sb = [], tr = [];
      HOUSES.forEach(H => { a.push(H[0], H[1], H[2], H[3]); b.push(H[4], H[5], H[6], H[7]); });
      STRINGS.forEach(s => { sa.push(s[0], s[1], s[2], 0); sb.push(s[3], s[4], s[5], 0); });
      TREES.forEach(q => tr.push(...q));
      this.uni = { a: new Float32Array(a), b: new Float32Array(b), sa: new Float32Array(sa), sb: new Float32Array(sb), tr: new Float32Array(tr) };
    }

    U(this.pG, 'uPP', this.pp || new Float32Array(120)); U(this.pG, 'uLanOn', this.lanOn);

    U(this.pP, 'uHeroS', [(hs[0] * 0.5 + 0.5) * w, (hs[1] * 0.5 + 0.5) * h, hs[2], Math.max(sizePx, 2.5)]);
    U(this.pP, 'uHeroB', hs[2] > 0.2 ? this.hero.b : 0);
    U(this.pP, 'uSnowAmt', this.snowAmt); U(this.pP, 'uPure', this.pure);
    const wk = this.wake;
    if (wk) { const q = this.project(wk.p, w / h, cam); U(this.pP, 'uWake', [(q[0] * 0.5 + 0.5) * w, (q[1] * 0.5 + 0.5) * h, wk.r * h]); }
    else U(this.pP, 'uWake', [0, 0, 1e6]);
    const a = this.project([SCR.c[0] - SCR.hw, SCR.c[1] - SCR.hh, SCR.c[2]], w / h), b = this.project([SCR.c[0] + SCR.hw, SCR.c[1] + SCR.hh, SCR.c[2]], w / h);

  /* ---- sound: wind over the snow, the crowd murmuring in the square, a distant temple bell; a little chime as each

  buildAudio(b) {
    const { ctx, out, noiseBuffer, loop } = b;

    const pink = noiseBuffer(7.1, 'pink');

    const wg = ctx.createGain(); wg.gain.value = 0.05; loop(pink, 1, lp); lp.connect(wg); wg.connect(bus);

    this.snd = { ctx, bus, wg, cg, nextBell: 1.5, lit: 0 };
  },
  strike(t0, parts, a, pan = 0) {
    const S = this.snd, ctx = S.ctx;
    const g = ctx.createGain(); g.gain.value = a;
    const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if (p) { p.pan.value = pan; g.connect(p); p.connect(S.bus); } else g.connect(S.bus);

      const o = ctx.createOscillator(), e = ctx.createGain();
      o.frequency.setValueAtTime(f * bend, t0); o.frequency.exponentialRampToValueAtTime(f, t0 + 0.3);
      e.gain.setValueAtTime(0, t0); e.gain.linearRampToValueAtTime(amp, t0 + 0.004); e.gain.setTargetAtTime(0, t0 + 0.01, dec / 3);
      o.connect(e); e.connect(g); o.start(t0); o.stop(t0 + dec * 2 + 0.1);
    }
  },
  chime(pan) { const t0 = this.snd.ctx.currentTime + 0.01; const f = [1318, 1568, 1760, 2093][Math.floor(Math.random() * 4)]; this.strike(t0, [[f, 1, 0.5], [f * 2.76, 0.25, 0.2]], 0.018, pan); },
  bell() { const t0 = this.snd.ctx.currentTime + 0.02; this.strike(t0, [[196, 1, 4.5], [392.8, 0.5, 3.2], [538, 0.25, 2.5], [742, 0.12, 1.6]], 0.020, -0.4); },
  gong() { const t0 = this.snd.ctx.currentTime + 0.02; this.strike(t0, [[110, 1, 1.6, 1.03], [167, 0.6, 1.2], [231, 0.35, 0.9], [298, 0.2, 0.7], [413, 0.1, 0.5]], 0.06); },

    if (!this.snd) { const b = YL.AUDIO.bus && YL.AUDIO.bus(); if (b) this.buildAudio(b); else return; }

    const toStage = Math.hypot(this.cam.pos[0] - STAGE[0], this.cam.pos[2] - STAGE[1]);
    S.cg.gain.setTargetAtTime(0.035 * smooth(40, 10, toStage) * (1 - 0.7 * this.lit), now, 0.5);
    if ((S.nextBell -= dt) <= 0) { this.bell(); S.nextBell = 9 + Math.random() * 4; }
    // a chime for each lantern as it catches
    let n = 0; for (let i = 0; i < NL; i++) if (this.lanT[i] >= 0) n++;
    if (n > S.lit) { const pr = this.project(LANTERNS[0], 16 / 9); this.chime(Math.max(-0.8, Math.min(0.8, (Math.random() - 0.5) * 0.8))); S.lit = n; }
    if (this.lit > 0.3 && !S.gonged) { S.gonged = true; this.gong(); }
  },
};

    const g = ctx.createGain(); g.gain.value = 0.05 + 0.06 * Math.random();
    s.connect(f); f.connect(g); g.connect(S.bus); s.start(t0);
  },
  // a struck tone: a few partials with their own decays (wood, bronze, skin)
  strike(t0, parts, a, pan = 0) {
    const S = this.snd, ctx = S.ctx, p = ctx.createStereoPanner(); p.pan.value = pan; p.connect(S.bus);
    for (const [f, amp, dec, f1] of parts) {
      const o = ctx.createOscillator(); o.frequency.setValueAtTime(f * (f1 || 1), t0); if (f1) o.frequency.exponentialRampToValueAtTime(f, t0 + 0.08);
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(a * amp, t0 + 0.003); g.gain.setTargetAtTime(0, t0 + 0.004, dec);
      o.connect(g); g.connect(p); o.start(t0); o.stop(t0 + dec * 8 + 0.1);
    }
  },
  // a burst of filtered noise (the click of wood on wood, the hiss of a cymbal, a breath of wind)
  hiss(t0, type, f, q, a, att, dec, pan = 0) {
    const S = this.snd, ctx = S.ctx, s = ctx.createBufferSource(); s.buffer = S.pink;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(a, t0 + att); g.gain.setTargetAtTime(0, t0 + att, dec);
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    s.connect(fl); fl.connect(g); g.connect(p); p.connect(S.bus); s.start(t0, Math.random() * 4); s.stop(t0 + att + dec * 7);
  },
  clapper(t0, a, hi, pan) { this.strike(t0, [[hi ? 1180 : 940, 1, 0.025], [hi ? 3150 : 2600, 0.35, 0.012]], a, pan); this.hiss(t0, 'bandpass', 2400, 2, a * 0.5, 0.002, 0.01, pan); },
  hoof(t0, a, pan) { this.strike(t0, [[620 + 80 * Math.random(), 1, 0.02], [140, 0.8, 0.035, 1.6]], a, pan); },
  gong(t0, a) { this.strike(t0, [[110, 1, 1.6, 1.03], [167, 0.6, 1.2], [231, 0.35, 0.9], [298, 0.2, 0.7], [413, 0.1, 0.5]], a); this.hiss(t0, 'highpass', 3000, 0.7, a * 0.3, 0.005, 0.4); },
  craneCall(t0, a, pan) {
    const S = this.snd, ctx = S.ctx;
    for (const [dt, f] of [[0, 860], [0.22, 760]]) {
      const t = t0 + dt, o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(f * 1.12, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.06); o.frequency.exponentialRampToValueAtTime(f * 0.86, t + 0.18);
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 2.5;
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a, t + 0.02); g.gain.setTargetAtTime(0, t + 0.12, 0.04);
      const p = ctx.createStereoPanner(); p.pan.value = pan;
      o.connect(bp); bp.connect(g); g.connect(p); p.connect(S.bus); o.start(t); o.stop(t + 0.5);
    }
  },
  // where something is in the picture: -1 (left edge) … 1 (right edge), and how near the middle (for loudness)
  where(s) { const x = wrap(s - this.camS(this.wheelT(this.t))); return { pan: Math.max(-1, Math.min(1, x / 0.3)), near: Math.exp(-x * x / 0.07) }; },
  // an erhu-like phrase: a bowed tone sliding between notes of the pentatonic scale, then a soft gong
  phrase() {
    const S = this.snd, ctx = S.ctx; let t = ctx.currentTime + 0.05;
    const notes = [392, 440, 523.25, 587.33, 659.25], seq = [2, 3, 1, 2, 0];
    const o = ctx.createOscillator(); o.type = 'sawtooth';
    const vib = ctx.createOscillator(); vib.frequency.value = 5.2; const vg = ctx.createGain(); vg.gain.value = 5; vib.connect(vg); vg.connect(o.frequency);
    const f1 = ctx.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 1100; f1.Q.value = 1.4;
    const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = 2600;
    const g = ctx.createGain(); g.gain.value = 0;
    o.connect(f1); f1.connect(f2); f2.connect(g); g.connect(S.bus);
    o.frequency.setValueAtTime(notes[seq[0]], t);
    let tt = t;
    seq.forEach((k, i) => { const d = i === seq.length - 1 ? 1.8 : 0.55 + 0.25 * (i % 2); o.frequency.setTargetAtTime(notes[k], tt, 0.05); g.gain.setTargetAtTime(0.030, tt, 0.08); g.gain.setTargetAtTime(0.019, tt + d * 0.6, 0.1); tt += d; });
    g.gain.setTargetAtTime(0, tt, 0.4);
    o.start(t); vib.start(t); o.stop(tt + 2); vib.stop(tt + 2);
  },
  sound(dt) {
    if (!this.snd) { const b = YL.AUDIO.bus && YL.AUDIO.bus(); if (b) this.buildAudio(b); else return; }
    const S = this.snd, ctx = S.ctx, now = ctx.currentTime, t = this.t, w = this.wheelT(t), E = S.ev, sink = this.sink || 0;
    const once = (k, cond, fn) => { if (cond && !E[k]) { E[k] = 1; fn(); } else if (!cond) E[k] = 0; };
    S.bus.gain.setTargetAtTime(this.fade * (this.vol ?? 1), now, 0.3);
    const turning = Math.min(1, w > 0 ? (this.wheelT(t + 0.1) - w) / 0.1 : 0) * (1 - sink);
    S.rg.gain.setTargetAtTime(0.022 * turning * (0.6 + 0.4 * Math.sin(t * 6.3) * Math.sin(t * 1.1)), now, 0.1);
    S.wg.gain.setTargetAtTime(0.05 * (0.7 + 0.3 * Math.sin(t * 0.8)) * (1 - sink), now, 0.3);
    if ((S.next -= dt) <= 0) { this.crackle(); S.next = Math.random() < 0.4 ? 0.08 + Math.random() * 0.2 : 0.8 + Math.random() * 2.5; }
    // the flame catches: the gong; then the string begins (and again every twenty-odd seconds after)
    once('gong', t > 1.02 && t < 3, () => this.gong(now + 0.02, 0.05));
    once('erhu', (t - 4.4 + 40) % 24 < 0.5 && t > 4, () => this.phrase());
    // the clappers keep the bearers' step (a lighter tick between)
    const step = Math.floor(2 * 1.17 * w + 0.25);
    if (step !== S.step) { if (S.step >= 0 && turning > 0.3) { const P = this.where(VW * w - 0.03); this.clapper(now + 0.01, (step % 2 ? 0.020 : 0.034) * (0.5 + 0.5 * P.near), step % 2, P.pan * 0.6); } S.step = step; }
    // hooves: three to a stride, from each horseman, louder as he passes the middle
    [[-0.36, 0], [-0.78, 2.1], [-0.40 + C_ARC / 2, 1.0]].forEach(([s0, ph], i) => {
      const P = this.where(s0 + VH * w), g = 9.0 * w + ph, k = Math.floor(g / (2 * Math.PI));
      if (S.stride[i] !== undefined && k !== S.stride[i] && P.near > 0.05 && turning > 0.5) for (const [o, a] of [[0, 0.8], [0.075, 0.6], [0.15, 1]]) this.hoof(now + 0.01 + o, 0.05 * a * P.near, P.pan);
      S.stride[i] = k;
    });
    // the cranes call as they cross; the dragon arrives with a cymbal swell and a drum roll
    const cr = this.where(0.47 + (VC - 0.10) * w);
    once('crane', cr.near > 0.5 && turning > 0.5, () => { this.craneCall(now + 0.02, 0.016, cr.pan); this.craneCall(now + 0.65, 0.011, cr.pan * 0.8); });
    const dr = this.where(0.62 + (VC - 0.11) * w);
    once('dragon', dr.near > 0.12 && dr.pan > 0 && turning > 0.5, () => {
      this.hiss(now + 0.02, 'highpass', 5200, 0.7, 0.05, 0.9, 0.5, 0.4);
      for (let i = 0; i < 14; i++) this.strike(now + 0.02 + 1.3 * Math.pow(i / 14, 0.8), [[92, 1, 0.09, 1.4]], 0.05 * (0.35 + 0.65 * i / 14), 0.2);
      this.strike(now + 1.36, [[80, 1, 0.3, 1.5], [180, 0.3, 0.1]], 0.10, 0.2);
    });
    // a gust: a breath of wind through the lantern, and the flame flutters
    const tg = ((t - 9.4) % 22 + 22) % 22;
    once('gust', tg > 21.6 || tg < 0.3, () => this.hiss(now + 0.02, 'bandpass', 700, 0.6, 0.05, 0.5, 0.7));
    // the candle gutters
    once('snuff', sink > 0.02, () => { this.hiss(now + 0.02, 'lowpass', 900, 0.5, 0.06, 0.15, 0.5); this.strike(now + 0.6, [[110, 1, 1.4, 1.03], [167, 0.5, 1.0]], 0.03); });
  },
};
})();

</script>
<script>
/* ---- src/worlds/stage.js ---- */
/* ============================================================================
   世界四 · 戏台上的皮影 —— 龙戏珠
   ----------------------------------------------------------------------------
   村口戏台那块幕的里面。幕后点着的那盏灯，就是那粒光：它在幕上的那一团亮，就是龙要追的珠。
   · 每一片皮影（染色的半透明牛皮）都从灯的位置投到幕上：逐像素求交，贴着幕的清楚，离幕远的大而虚；
     灯一动，远处的影子跟着挪（近大远小的视差），近幕的几乎不动。
   · 远山、祥云、宝塔、柳、渔船、鲤鱼、一排浪，一条九节的龙。龙头朝着珠游，身子沿着头走过的路一节节跟上来。
   · 最后珠往下一沉，落进浪里——浪线以下就是海（另一个世界）：这里只告诉外面哪里是浪线以下（alpha），
     外面把海画进去，镜头跟着珠往下走。
   ========================================================================== */
(() => {
'use strict';
const YL = window.YL;
const W = (YL.worlds = YL.worlds || {});
const NP = 48;
const SW = 3.2, SH = 1.8;                    // the screen, metres
const D = 1.1;                               // the lamp, behind it
const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float;
uniform sampler2D uAtlas;
uniform vec4 uA[${NP}], uB[${NP}], uC[${NP}];
uniform float uN;
uniform vec2 uRes;
uniform vec3 uLamp;           // x, y on the screen, how bright
uniform vec3 uView;           // the centre of the picture on the screen (m), half its height (m)
uniform float uTime;
uniform vec4 uSea;            // where the pearl went into the water (x, y), how far the water has changed from there, the waterline
out vec4 o;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y); }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 X = uView.xy + (frag - 0.5 * uRes) / uRes.y * 2.0 * uView.z;
  vec2 Lp = uLamp.xy;
  float lampR = 0.035;
  vec3 T = vec3(1.0);
  for (int i = 0; i < ${NP}; i++){
    if (float(i) >= uN) break;
    vec4 A = uA[i], B = uB[i], C = uC[i];
    float s = A.z;
    vec2 Y = Lp + (${D.toFixed(2)} - s) / ${D.toFixed(2)} * (X - Lp);
    vec2 q = rot(-B.x) * (Y - A.xy);
    vec2 a = B.yz + vec2(q.x / A.w, -q.y / abs(A.w));
    if (a.x < C.x || a.x > C.z || a.y < C.y || a.y > C.w) continue;
    float pen = lampR * s / ${D.toFixed(2)} / abs(A.w);
    vec3 tc = textureLod(uAtlas, a / vec2(4096.0, 2048.0), log2(max(pen, 0.7))).rgb;
    bool tile = B.w > 1.5;
    float ex = tile ? 1e3 : min(a.x - C.x, C.z - a.x);
    float edgeF = smoothstep(0.0, 24.0, min(ex, min(a.y - C.y, C.w - a.y)));
    T *= mix(vec3(1.0), tc, (tile ? 1.0 : B.w) * edgeF);
  }
  // the lamp's light on the screen; its hot spot is the pearl
  float r2 = dot(X - Lp, X - Lp), r = sqrt(r2);
  float E = pow(${(D * D).toFixed(3)} / (${(D * D).toFixed(3)} + r2), 1.6);
  float flick = 1.0 + 0.04 * sin(uTime * 11.0) * sin(uTime * 7.3);
  vec3 lampC = vec3(1.0, 0.80, 0.52);
  float on = uLamp.z;
  vec3 c = lampC * E * 2.7 * T * on * flick;
  // the pearl: a hard bright core in the hot spot, and its halo (it shines through the hide too, a little)
  float core = smoothstep(0.034, 0.022, r);
  float halo = exp(-r / 0.05) * 0.9 + exp(-r / 0.16) * 0.35;
  c += vec3(1.0, 0.95, 0.82) * halo * 1.6 * mix(1.0, dot(T, vec3(0.33)), 0.5) * on;
  c += vec3(2.6, 2.3, 1.7) * core * on;
  // the paper of the screen
  float fib = vnoise(vec2(frag.x * 0.05 + frag.y * 0.01, frag.y * 0.6)) * 0.5 + vnoise(frag * 0.3) * 0.5;
  c *= 0.94 + 0.08 * fib;
  // outside the screen (only seen as the eye goes down): the dark of the stage
  float inside = step(abs(X.x), ${(SW / 2).toFixed(2)}) * step(abs(X.y), ${(SH / 2).toFixed(2)});
  c *= mix(0.15, 1.0, inside);
  float lum = dot(c, vec3(0.3, 0.55, 0.15));
  c = max(mix(vec3(lum), c, 1.22), 0.0);                       // dyed hide, lit from behind, is vivid
  c *= mix(vec3(1.0), vec3(1.0, 0.86, 0.70), smoothstep(0.6, 1.7, r));   // warmer and deeper away from the lamp
  c = 1.0 - exp(-c * 1.1);
  c = pow(c, vec3(0.92));
  // below the waterline, near where the pearl went in, the water is no longer hide: it is the sea (alpha 0)
  float below = smoothstep(uSea.w + 0.004, uSea.w - 0.004, X.y);
  float reach = length((X - uSea.xy) * vec2(0.55, 1.0));
  float ragged = 0.05 * (vnoise(vec2(atan(X.y - uSea.y, X.x - uSea.x) * 4.0, uTime * 0.3)) - 0.5);
  float sea = below * smoothstep(uSea.z + 0.04, uSea.z - 0.04, reach + ragged);
  sea = max(sea, step(0.001, uSea.z) * smoothstep(-0.86, -0.92, X.y));
  o = vec4(c, 1.0 - sea);
}`;
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
const clamp = (x, a, b) => Math.min(Math.max(x, a), b);

W.stage = {
  ready: false, t: 0, vol: 1, fade: 1,
  lamp: [0, 0.75], light: 0,            // the light behind the screen, and how bright it burns
  view: [0, 0, SH / 2],                 // what of the screen is in the picture
  sea: [0, -0.755, 0, -0.755],
  WATER: -0.755,
  init() {
    const gl = YL.gl;
    this.p = YL.makeProgram('stage', VS, FS); YL.checkProgram(this.p);
    this.empty = gl.createVertexArray();
    const cv = document.createElement('canvas'); cv.width = 4096; cv.height = 2048;
    YL.PUPPETS.draw(cv.getContext('2d'));
    this.atlas = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, this.atlas);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    this.A = new Float32Array(NP * 4); this.B = new Float32Array(NP * 4); this.C = new Float32Array(NP * 4);
    this.reset();
    this.ready = true;
  },
  reset() {
    this.t = 0; this.light = 0; this.lamp = [0, 0.75];
    this.dragon = { p: [-2.4, 0.15], v: [1.2, 0], trail: [] };
    for (let i = 0; i < 300; i++) this.dragon.trail.push([-2.4 - i * 0.012, 0.15 + 0.10 * Math.sin(i * 0.05)]);
    this.drop = null; this.sea = [0, this.WATER, 0, this.WATER]; this.lampOverride = null; this.seaT = undefined; this.splash = undefined;
  },
  // ---- the way the dragon swims: in from off the left, then round a long figure of eight across the screen, again
  //      and again. Its head is on the way, every joint of its body is on the way behind it (so it bends exactly where
  //      the head bent), and the pearl is on the way a little ahead of the head: it always nearly has it.
  way() {
    if (this._way) return this._way;
    const pts = [];
    for (let i = 0; i <= 40; i++) { const u = i / 40; pts.push([-3.0 + 2.2 * u, 0.42 - 0.18 * u + 0.05 * Math.sin(u * 3.0)]); }
    const f8 = (s) => [1.02 * Math.sin(s), 0.20 + 0.23 * Math.sin(2 * s)];
    // join the figure of eight where it is heading right along its left side, s = -pi/2 … going up the lobe
    const s0 = -Math.PI * 0.62;
    const j = f8(s0), last = pts[pts.length - 1];
    for (let i = 1; i <= 20; i++) { const u = i / 20, e = u * u * (3 - 2 * u); pts.push([last[0] + (j[0] - last[0]) * e, last[1] + (j[1] - last[1]) * e]); }
    for (let i = 1; i <= 2400; i++) pts.push(f8(s0 + i * 0.01));
    const d = [0]; for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    return (this._way = { pts, d });
  },
  wayAt(s) {
    const W = this.way(); s = Math.max(0, Math.min(s, W.d[W.d.length - 1]));
    let lo = 0, hi = W.d.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (W.d[m] < s) lo = m; else hi = m; }
    const f = (s - W.d[lo]) / Math.max(W.d[hi] - W.d[lo], 1e-6);
    return [W.pts[lo][0] + (W.pts[hi][0] - W.pts[lo][0]) * f, W.pts[lo][1] + (W.pts[hi][1] - W.pts[lo][1]) * f];
  },
  pearlAt(t) {
    const enter = this.enterAt || [0.0, 0.70];
    let p = this.wayAt(this.dS(t) + 0.55);
    const k = smooth(0.4, 3.0, t);
    p = [enter[0] + (p[0] - enter[0]) * k, enter[1] + (p[1] - enter[1]) * k];
    if (this.drop) {
      const u = t - this.drop.t0, a = this.drop.p0;
      p = [a[0] + 0.10 * Math.sin(u * 2.0) * Math.min(u, 1), a[1] - 0.25 * u * u - 0.15 * u];
    }
    return p;
  },
  // the head's distance along the way at t: in fast from the left, then at a swimming pace
  dS(t) { const t0 = 0.8; if (t < t0) return 0; const a = t - t0; return 1.6 * a - 0.95 * Math.max(0, a - 1.6) + 0.04 * Math.sin(a * 1.7); },
  startDrop() { this.drop = { t0: this.t, p0: this.pearlAt(this.t) }; },
  pieces() {
    const out = [], t = this.t, P = YL.PUPPETS, CELLS = P.CELLS, PART = P.PART;
    const rectOf = (name) => {
      if (PART[name]) { const [x0, y0, x1, y1, base] = PART[name]; const [cx, cy] = CELLS[base || name]; return [cx * 512 + x0 * 0.512, cy * 512 + y0 * 0.512, cx * 512 + x1 * 0.512, cy * 512 + y1 * 0.512]; }
      const [cx, cy, wd = 1] = CELLS[name]; return [cx * 512, cy * 512, (cx + wd) * 512, (cy + 1) * 512];
    };
    const origin = (name) => { const base = PART[name] ? (PART[name][4] || name) : name; const [cx, cy] = CELLS[base]; return [cx * 512, cy * 512]; };
    const put = (name, x, y, s, mpp, ang, px, py, flip = 1, dens = 1) => {
      const [ox, oy] = origin(name);
      out.push([x, y, s, mpp * flip, ang, ox + px * 0.512, oy + py * 0.512, dens, ...rectOf(name)]);
    };
    // far mountains, soft
    put('mountains', -0.62, -0.06, 0.28, 0.0017, 0, 1000, 560, 1, 0.40);
    put('mountains', 1.05, -0.08, 0.26, 0.0017, 0, 1000, 560, -1, 0.38);
    // clouds drifting across the top
    put('clouds', -0.75 + 0.02 * t, 0.66, 0.03, 0.00095, 0, 1000, 500, 1, 0.9);
    put('clouds', 1.05 + 0.015 * t, 0.70, 0.04, 0.00095, 0, 1000, 500, -1, 0.9);
    // a stone bridge over the water on the right, its far end lost behind the mountains' foot
    put('bridge', 0.95, -0.50, 0.04, 0.00080, 0, 1000, 700, 1, 0.95);
    // reeds and a lotus at the water's edge, close to the screen
    put('reeds', -1.35, -0.62, 0.01, 0.00070, 0.03 * Math.sin(t * 0.9), 500, 990, 1, 1);
    put('lotus', 1.42, -0.58, 0.01, 0.00062, 0, 500, 760, 1, 1);
    // the pagoda on its hill and a willow
    put('pagoda', -1.22, -0.18, 0.05, 0.0011, 0, 500, 1000, 1, 1);
    put('willow', -0.92, -0.42, 0.02, 0.0010, 0.02 * Math.sin(t * 0.8), 500, 1000, 1, 1);
    // the dragon: head, eight joints and the tail, all on its way behind one another
    const mpp = 0.00085, segL = 480 * 0.512 * mpp, sH = this.dS(t);
    const joints = []; for (let i = 0; i <= 9; i++) joints.push(this.wayAt(sH - 0.05 - i * segL));
    const ang = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]);
    const hp = this.wayAt(sH + 0.08);
    put('dhead', joints[0][0], joints[0][1], 0.012, mpp, ang(joints[0], hp) + 0.18, 230, 530);
    for (let i = 0; i < 8; i++) put('dbody', joints[i][0], joints[i][1], 0.012, mpp, ang(joints[i], joints[i + 1]) + Math.PI, 900, 530);
    put('dtail', joints[8][0], joints[8][1], 0.012, mpp, ang(joints[8], joints[9]), 100, 530);
    // two cranes crossing high up, right to left, their wings beating
    for (let k = 0; k < 2; k++) {
      const x = 2.1 - 0.30 * (t - 1.5 - k * 1.1), y = 0.52 + 0.05 * k + 0.02 * Math.sin(t * 0.9 + k);
      if (x < -2.1 || x > 2.1) continue;
      const g = t * 4.2 + k * 1.7;
      put('cwing', x + 0.004, y, 0.03, 0.00062, -0.9 + 0.7 * Math.sin(g - 0.5), 500, 500, -1, 0.8);
      put('crane', x, y, 0.03, 0.00062, 0.04 * Math.sin(g - 1.0), 540, 500, -1, 1);
      put('cwing', x, y, 0.03, 0.00062, -0.9 + 0.7 * Math.sin(g), 500, 500, -1, 1);
    }
    // a carp leaping, now and then; a boat on the waves
    const cj = (t - 5.2);
    if (cj > 0 && cj < 1.6) {
      const u = cj / 1.6, x = 0.85 + 0.45 * u, y = -0.78 + 1.6 * u * (1 - u) * 0.55;
      put('carp', x, y, 0.01, 0.00075, 0.9 - 1.8 * u, 500, 500, 1, 1);
      put('tail', x - 0.12 * Math.cos(0.9 - 1.8 * u), y - 0.12 * Math.sin(0.9 - 1.8 * u), 0.01, 0.00075, 0.9 - 1.8 * u + 0.3 * Math.sin(t * 9), 500, 500, 1, 1);
    }
    put('boat', -0.25 + 0.02 * t, -0.62 + 0.015 * Math.sin(t * 1.3), 0.008, 0.00085, 0.05 * Math.sin(t * 1.2), 500, 600, 1, 1);
    // the waves along the bottom: one band, tiling; it heaves
    const wp = 1000 * 0.512 * 0.00110, wx = 0.06 * Math.sin(t * 0.5);
    for (let i = -3; i <= 3; i++) put('waves', i * wp + wx, -0.80 + 0.010 * Math.sin(t * 1.2), 0.0, 0.00110, 0, 500, 760, 1, 2);
    return out;
  },
  update(dt) {
    this.t += dt;
    const t = this.t;
    if (YL.QS.get('world') === 'stage') { this.light = smooth(0, 0.8, t); if (YL.QS.get('drop') && !this.drop && t > +YL.QS.get('drop')) this.startDrop(); }
    this.lamp = this.lampOverride || this.pearlAt(t);
    this.headSNow = this.dS(t);
    // the water changes, from where the pearl went in
    if (this.drop) {
      const pe = this.lamp;
      if (this.seaT === undefined && pe[1] < this.WATER + 0.02) { this.sea[0] = pe[0]; this.sea[1] = this.WATER; this.seaT = t; this.splash = t; }
      if (this.seaT !== undefined) this.sea[2] = 4.0 * smooth(0, 1.4, t - this.seaT) + 0.12 * smooth(0, 0.15, t - this.seaT);
    }
    this.sound(dt);
  },
  render(target, aspect) {
    const gl = YL.gl, U = YL.U, p = this.p;
    const w = target ? target.w : gl.drawingBufferWidth, h = target ? target.h : gl.drawingBufferHeight;
    const ps = this.pieces();
    this.A.fill(0); this.B.fill(0); this.C.fill(0);
    ps.slice(0, NP).forEach((q, i) => { this.A.set([q[0], q[1], q[2], q[3]], i * 4); this.B.set([q[4], q[5], q[6], q[7]], i * 4); this.C.set([q[8], q[9], q[10], q[11]], i * 4); });
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null); gl.viewport(0, 0, w, h);
    gl.useProgram(p.p);
    U(p, 'uRes', [w, h]); U(p, 'uTime', this.t);
    U(p, 'uA', this.A); U(p, 'uB', this.B); U(p, 'uC', this.C); U(p, 'uN', Math.min(ps.length, NP));
    U(p, 'uLamp', [this.lamp[0], this.lamp[1], this.light]);
    U(p, 'uView', this.view);
    U(p, 'uSea', this.sea);
    YL.bindTex(p, 'uAtlas', this.atlas, 0);
    gl.bindVertexArray(this.empty); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.bindVertexArray(null);
  },
  // where a point of the screen (m) lands in the picture (ndc)
  toNdc(X, aspect) { return [(X[0] - this.view[0]) / (this.view[2] * aspect), (X[1] - this.view[1]) / this.view[2]]; },
  /* ---- sound: the troupe behind the screen. A gong as the lamp catches; a bowed string; a drum roll and cymbal as
     the dragon comes; the clappers; a splash as the pearl goes into the waves */
  buildAudio(b) {
    const { ctx, out, noiseBuffer } = b;
    const bus = ctx.createGain(); bus.gain.value = 0; bus.connect(out);
    this.snd = { ctx, bus, pink: noiseBuffer(6.1, 'pink'), next: 0.5, ev: {}, step: -1 };
  },
  crackle() {
    const S = this.snd, ctx = S.ctx, t0 = ctx.currentTime + 0.01, sr = ctx.sampleRate;
    const n = Math.floor(sr * 0.03), b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sr * 0.003));
    const s = ctx.createBufferSource(); s.buffer = b;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1800;
    const g = ctx.createGain(); g.gain.value = 0.04 + 0.05 * Math.random();
    s.connect(f); f.connect(g); g.connect(S.bus); s.start(t0);
  },
  strike(t0, parts, a, pan = 0) {
    const S = this.snd, ctx = S.ctx, p = ctx.createStereoPanner(); p.pan.value = pan; p.connect(S.bus);
    for (const [f, amp, dec, f1] of parts) {
      const o = ctx.createOscillator(); o.frequency.setValueAtTime(f * (f1 || 1), t0); if (f1) o.frequency.exponentialRampToValueAtTime(f, t0 + 0.08);
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(a * amp, t0 + 0.003); g.gain.setTargetAtTime(0, t0 + 0.004, dec);
      o.connect(g); g.connect(p); o.start(t0); o.stop(t0 + dec * 8 + 0.1);
    }
  },
  hiss(t0, type, f, q, a, att, dec, pan = 0) {
    const S = this.snd, ctx = S.ctx, s = ctx.createBufferSource(); s.buffer = S.pink;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(a, t0 + att); g.gain.setTargetAtTime(0, t0 + att, dec);
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    s.connect(fl); fl.connect(g); g.connect(p); p.connect(S.bus); s.start(t0, Math.random() * 4); s.stop(t0 + att + dec * 7);
  },
  clapper(t0, a, hi, pan) { this.strike(t0, [[hi ? 1180 : 940, 1, 0.025], [hi ? 3150 : 2600, 0.35, 0.012]], a, pan); this.hiss(t0, 'bandpass', 2400, 2, a * 0.5, 0.002, 0.01, pan); },
  gong(t0, a) { this.strike(t0, [[110, 1, 1.6, 1.03], [167, 0.6, 1.2], [231, 0.35, 0.9], [298, 0.2, 0.7], [413, 0.1, 0.5]], a); this.hiss(t0, 'highpass', 3000, 0.7, a * 0.3, 0.005, 0.4); },
  phrase() {
    const S = this.snd, ctx = S.ctx; let t = ctx.currentTime + 0.05;
    const notes = [392, 440, 523.25, 587.33, 659.25], seq = [2, 3, 4, 3, 1, 2];
    const o = ctx.createOscillator(); o.type = 'sawtooth';
    const vib = ctx.createOscillator(); vib.frequency.value = 5.2; const vg = ctx.createGain(); vg.gain.value = 5; vib.connect(vg); vg.connect(o.frequency);
    const f1 = ctx.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 1100; f1.Q.value = 1.4;
    const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = 2600;
    const g = ctx.createGain(); g.gain.value = 0;
    o.connect(f1); f1.connect(f2); f2.connect(g); g.connect(S.bus);
    o.frequency.setValueAtTime(notes[seq[0]], t);
    let tt = t;
    seq.forEach((k, i) => { const d = i === seq.length - 1 ? 1.8 : 0.45 + 0.2 * (i % 2); o.frequency.setTargetAtTime(notes[k], tt, 0.05); g.gain.setTargetAtTime(0.026, tt, 0.08); g.gain.setTargetAtTime(0.016, tt + d * 0.6, 0.1); tt += d; });
    g.gain.setTargetAtTime(0, tt, 0.4);
    o.start(t); vib.start(t); o.stop(tt + 2); vib.stop(tt + 2);
  },
  splashSound() {
    const now = this.snd.ctx.currentTime + 0.01;
    this.hiss(now, 'bandpass', 1400, 0.7, 0.06, 0.01, 0.25, 0.2);
    this.hiss(now + 0.05, 'lowpass', 600, 0.5, 0.05, 0.02, 0.35, 0.1);
    this.strike(now + 0.02, [[320, 1, 0.08, 1.8]], 0.05, 0.2);
  },
  sound(dt) {
    if (!this.snd) { const b = YL.AUDIO.bus && YL.AUDIO.bus(); if (b) this.buildAudio(b); else return; }
    const S = this.snd, ctx = S.ctx, now = ctx.currentTime, t = this.t, E = S.ev;
    const once = (k, cond, fn) => { if (cond && !E[k]) { E[k] = 1; fn(); } };
    S.bus.gain.setTargetAtTime(this.fade * (this.vol ?? 1), now, 0.3);
    if (this.light > 0.2 && (S.next -= dt) <= 0) { this.crackle(); S.next = Math.random() < 0.4 ? 0.08 + Math.random() * 0.2 : 0.8 + Math.random() * 2.5; }
    once('gong', this.light > 0.5, () => this.gong(now + 0.02, 0.05));
    once('erhu', t > 2.4, () => this.phrase());
    once('dragon', t > 1.2, () => {
      this.hiss(now + 0.02, 'highpass', 5200, 0.7, 0.04, 0.9, 0.5, -0.4);
      for (let i = 0; i < 14; i++) this.strike(now + 0.02 + 1.3 * Math.pow(i / 14, 0.8), [[92, 1, 0.09, 1.4]], 0.045 * (0.35 + 0.65 * i / 14), -0.3);
      this.strike(now + 1.36, [[80, 1, 0.3, 1.5], [180, 0.3, 0.1]], 0.09, -0.2);
    });
    // the clappers keep time while it plays
    const step = Math.floor(t * 2.2);
    if (step !== S.step && t > 3 && !this.drop) { this.clapper(now + 0.01, step % 2 ? 0.016 : 0.026, step % 2, 0.3); S.step = step; }
    once('splash', this.splash !== undefined, () => this.splashSound());
  },
};
})();

</script>
<script>
/* ---- src/worlds/deepsea.js ---- */
/* ============================================================================
   世界四 · 深海
   ----------------------------------------------------------------------------
   漆黑的水，没有上下。只有那一团暖光照亮的一小块水是看得见的：
   · 水按颜色吃光：红光一米就没了大半，绿和蓝走得远——近处是暖的，远一点就成了青蓝。
   · 光在水里散开：点光源的单次散射，沿视线用「等角采样」积分（前向散射的 HG 相函数），没有噪点。
   · 海雪：几千粒絮状的碎屑在光里慢慢飘过；离焦的变成虚的光斑（能量守恒地变暗）；少数是自己会闪的蓝色浮游生物。
   · 三只水母，全用解析的椭球求交（不是逐步步进），所以薄膜的边是锐的：
       海月水母   透明的伞一张一合；光穿过的路越长越亮，伞缘自然发亮；16 条辐射管、四瓣马蹄形的生殖腺、垂下的口腕
       栉水母     透明的长囊；八条栉板带被光照到时，彩虹沿着它一路流下去
       Atolla     深红的伞（红光到不了深处，离光远时它几乎是黑的）；伞缘一圈蓝色的生物光，像风车一样转
   · 触手是几何线条：海月水母伞缘一圈细短的触手，Atolla 一根长长拖着的触手。
   渲染：水与水母（全屏，HDR）→ 触手 → 海雪（实例化，加法混合）→ 色调映射、颗粒、暗角。
   ========================================================================== */
(() => {
'use strict';
const YL = window.YL;
const W = (YL.worlds = YL.worlds || {});

// the water and the light, shared by every pass
const COMMON = `
#define PI 3.14159265359
uniform vec3 uL;             // the light
uniform vec3 uLI;            // its intensity
uniform vec3 uL2;            // another light, just like it, out in the dark (an anglerfish's lure)
uniform vec3 uLI2;
const vec3 SIG_T = vec3(0.45, 0.13, 0.07);      // what a metre of this water takes away from the light: the red first, then the green
const vec3 SIG_V = vec3(0.10, 0.06, 0.045);      // … and on the way back to the eye (kept lighter: what the light touches keeps its warmth)
const float SIG_M = 0.030;                       // the coarse particles scatter every colour alike, mostly forward …
const vec3 SIG_R = vec3(0.004, 0.018, 0.075);    // … the fine stuff scatters blue most, every way
float sat(float x){ return clamp(x, 0.0, 1.0); }
float HG(float c, float g){ float g2 = g * g; return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5)); }
// light arriving at x: inverse square, the water eating the red on the way
vec3 lightAt(vec3 x){
  vec3 d = uL - x; float r2 = dot(d, d);
  vec3 e = uLI * exp(-SIG_T * sqrt(r2)) / (r2 + 0.0009);
  if (uLI2.r > 0.0){ vec3 d2 = uL2 - x; float q2 = dot(d2, d2); e += uLI2 * exp(-SIG_T * sqrt(q2)) / (q2 + 0.0009); }
  return e;
}
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3){ p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y); }
`;

/* ---------------------------------------------------------------- the water, and the creatures in it */
const FS_SEA = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform vec3 uEye, uFwd, uRight, uUp; uniform vec2 uTan;
uniform float uTime;
uniform vec4 uJP[3];         // creatures: centre (m), size (m)            — drawn far to near
uniform vec4 uJU[3];         //            up axis, pulse (0 relaxed … 1 contracted)
uniform vec4 uJK[3];         //            kind (0 moon jelly, 1 comb jelly, 2 Atolla), phase, alarm, -
uniform vec4 uSurf;          // the surface far above: its height (world y), how bright, how much the water is tea, -
uniform vec4 uWh;            // the whale: its eye (world), on/off
uniform vec4 uWhF;           //            which way it swims (unit), its blink
uniform vec4 uWhG;           //            where its eye looks (in its own frame)
out vec4 o;
` + COMMON + `
// ---- the light scattered toward the eye along [0, T]: equi-angular samples about the closest approach
vec3 inscatterFrom(vec3 L, vec3 LI, vec3 ro, vec3 rd, float T){
  vec3 lo = L - ro; float t0 = dot(lo, rd); float h = sqrt(max(dot(lo, lo) - t0 * t0, 1e-7));
  float ta = atan(-t0 / h), tb = atan((T - t0) / h);
  vec3 sum = vec3(0.0);
  for (int i = 0; i < 12; i++){
    float th = mix(ta, tb, (float(i) + 0.5) / 12.0);
    float t = t0 + h * tan(th);
    vec3 lx = ro + rd * t - L; float r = length(lx);
    float c = dot(lx / r, -rd);
    sum += exp(-SIG_T * r - SIG_V * t) * (SIG_M * HG(c, 0.85) + SIG_R * HG(c, 0.25));
  }
  return LI * sum / 12.0 * (tb - ta) / h;
}
vec3 inscatter(vec3 ro, vec3 rd, float T){
  vec3 c = inscatterFrom(uL, uLI, ro, rd, T);
  if (uLI2.r > 0.0) c += inscatterFrom(uL2, uLI2, ro, rd, T);
  return c;
}
// ---- ray against an axis-aligned ellipsoid (radii r) at the origin: entry, exit
vec2 ellip(vec3 ro, vec3 rd, vec3 r){
  vec3 oo = ro / r, d = rd / r;
  float a = dot(d, d), b = dot(oo, d), c = dot(oo, oo) - 1.0, h = b * b - a * c;
  if (h < 0.0) return vec2(1e9, -1e9);
  h = sqrt(h);
  return vec2((-b - h) / a, (-b + h) / a);
}
vec2 isect(vec2 a, vec2 b){ return vec2(max(a.x, b.x), min(a.y, b.y)); }
float len(vec2 a){ return max(a.y - a.x, 0.0); }
// the slab above a plane y = y0 (local), as a ray interval
vec2 above(vec3 ro, vec3 rd, float y0){
  if (abs(rd.y) < 1e-6) return ro.y > y0 ? vec2(-1e9, 1e9) : vec2(1e9, -1e9);
  float t = (y0 - ro.y) / rd.y;
  return rd.y > 0.0 ? vec2(t, 1e9) : vec2(-1e9, t);
}
vec3 rainbow(float h){ return clamp(abs(fract(h + vec3(0.0, 0.667, 0.333)) * 6.0 - 3.0) - 1.0, 0.0, 1.0); }

// one creature: what it adds (already carried to the eye), what it lets through, how far away it is
struct Hit { vec3 c; float tr; float t; };
Hit creature(int k, vec3 ro, vec3 rd){
  Hit H = Hit(vec3(0.0), 1.0, 1e9);
  vec4 P = uJP[k], UU = uJU[k], KK = uJK[k];
  float s = P.w, pulse = UU.w, kind = KK.x;
  vec3 u = normalize(UU.xyz), a = normalize(cross(u, abs(u.z) < 0.9 ? vec3(0, 0, 1) : vec3(1, 0, 0))), b = cross(u, a);
  // into the creature's own frame, in units of its size (t stays in metres)
  vec3 rl = ro - P.xyz;
  vec3 o = vec3(dot(rl, a), dot(rl, u), dot(rl, b)) / s, d = vec3(dot(rd, a), dot(rd, u), dot(rd, b)) / s;
  // bounding sphere first
  float bb = dot(o, d), cc = dot(o, o) - 1.6 * 1.6, aa = dot(d, d);
  if (bb * bb - aa * cc < 0.0) return H;
  vec3 Ldir;
  if (kind == 0.0){
    // ---- moon jelly: a lens of clear jelly between the dome and the hollow beneath; open below the margin
    // a saucer: the dome's ellipsoid is cut well above its equator, so the margin is a thin sloping rim
    vec3 Ro = vec3(1.08 - 0.15 * pulse, 0.62 + 0.14 * pulse, 1.08 - 0.15 * pulse); vec3 co = vec3(0.0, -0.26, 0.0);
    vec3 Ri = Ro * vec3(0.93, 0.86, 0.93); vec3 ci = vec3(0.0, -0.33, 0.0);
    float ym = -0.04 - 0.06 * pulse;
    vec2 Io = isect(ellip(o - co, d, Ro), above(o, d, ym));
    vec2 Ii = isect(ellip(o - ci, d, Ri), Io);
    float th = (len(Io) - len(Ii)) * s;                        // metres of jelly along the ray
    if (len(Io) > 0.0){
      // the first surface: the dome, the margin, or the inside of the hollow
      float te = Io.x; vec3 n;
      vec3 pe = o + d * te;
      if (Ii.x <= te + 1e-4 && len(Ii) > 0.0){ te = Ii.y; pe = o + d * te; n = -normalize((pe - ci) / (Ri * Ri)); }
      else if (abs(pe.y - ym) < 1e-3) n = vec3(0.0, -1.0, 0.0);
      else n = normalize((pe - co) / (Ro * Ro));
      vec3 xe = ro + rd * te, xm = ro + rd * (0.5 * (Io.x + Io.y));
      float tm = 0.5 * (Io.x + Io.y);
      vec3 qm = o + d * tm;
      // radial canals and the ring canal, faintly denser jelly
      float phi = atan(pe.z, pe.x), rho = length(pe.xz) / (Ro.x * 0.92);
      float canal = smoothstep(0.975, 1.0, cos(16.0 * phi)) * smoothstep(0.15, 0.5, rho) * 0.3 + smoothstep(0.025, 0.0, abs(rho - 0.97)) * step(pe.y, 0.15) * 0.7;
      // the four horseshoe gonads, sampled through the bell
      float gon = 0.0;
      for (int i = 0; i < 10; i++){
        vec3 q = o + d * mix(Io.x, Io.y, (float(i) + 0.5) / 10.0);
        float best = 1e9;
        for (int j = 0; j < 4; j++){
          float ang = float(j) * 1.5708 + 0.785;
          vec2 cg = vec2(cos(ang), sin(ang)) * 0.30;
          vec2 r2 = q.xz - cg; float ring = length(r2) - 0.14;
          float open = dot(normalize(r2 + 1e-5), normalize(cg));               // the horseshoe opens outward
          float dd = length(vec2(ring, (q.y - 0.20 - 0.05 * pulse) * 1.5)) - 0.045;
          dd = max(dd, open - 0.82);
          best = min(best, dd);
        }
        gon += smoothstep(0.035, -0.02, best);
      }
      gon = gon / 10.0 * len(Io) * 3.0;
      vec3 E = lightAt(xm);
      Ldir = normalize(uL - xm);
      float fwd = HG(dot(-Ldir, rd), 0.55) * 4.0 * PI;                         // brighter seen against the light
      // clear jelly: it shows where the light's path through it is long (its rim) and where it is denser (canals)
      float dens = 1.0 - exp(-th * (2.2 + 14.0 * canal));
      float rim = smoothstep(0.035, 0.11, th);
      vec3 jelly = E * vec3(0.78, 0.88, 1.0) * dens * (0.06 + 0.16 * fwd) * (0.25 + 1.5 * rim);
      // the gonads: milky, pinkish, the brightest thing in it, soft-edged
      jelly += E * vec3(1.0, 0.70, 0.80) * (1.0 - exp(-gon * 1.6)) * (0.10 + 0.14 * fwd);
      // a glint where the light catches the curve of the bell
      vec3 Le = normalize(uL - xe);
      float F = 0.02 + 0.98 * pow(1.0 - abs(dot(n, -rd)), 5.0);
      jelly += lightAt(xe) * F * (pow(max(dot(reflect(rd, n), Le), 0.0), 60.0) * 2.5 + 0.05);
      H.c = jelly; H.tr = exp(-th * 2.0) * (1.0 - 0.35 * (1.0 - exp(-gon * 1.6))); H.t = te;
    }
  } else if (kind == 1.0){
    // ---- comb jelly: a clear sack, mouth open below; eight comb rows that break the light into rainbows
    vec3 Rb = vec3(0.46, 1.0, 0.42);
    vec2 I = isect(ellip(o, d, Rb), above(o, d, -0.82));
    if (len(I) > 0.0){
      vec2 Ii = isect(ellip(o - vec3(0.0, -0.08, 0.0), d, Rb * vec3(0.86, 0.90, 0.86)), I);
      float th = (len(I) - len(Ii)) * s;
      vec3 xm = ro + rd * (0.5 * (I.x + I.y));
      vec3 E = lightAt(xm);
      Ldir = normalize(uL - xm);
      float fwd = HG(dot(-Ldir, rd), 0.5) * 4.0 * PI;
      vec3 c = E * vec3(0.95, 0.88, 0.92) * (1.0 - exp(-th * 25.0)) * (0.10 + 0.25 * fwd) * (0.4 + 1.6 * smoothstep(0.004, 0.012, th));
      vec3 pe = o + d * I.x, ne = normalize(pe / (Rb * Rb));
      float Fe = pow(1.0 - abs(dot(ne, -normalize(d))), 4.0);
      c += lightAt(ro + rd * I.x) * vec3(0.85, 0.92, 1.0) * Fe * 0.22;
      // the comb rows, seen on the near wall and (fainter) through the jelly on the far one
      for (int side = 0; side < 2; side++){
        float tt = side == 0 ? I.x : I.y;
        vec3 q = o + d * tt;
        float phi = atan(q.z, q.x);
        float row = smoothstep(0.955, 1.0, cos(8.0 * phi)) * smoothstep(-0.78, -0.55, q.y) * smoothstep(0.92, 0.70, q.y);
        float beat = pow(0.5 + 0.5 * sin(q.y * 30.0 + uTime * 9.0 + KK.y), 3.0);           // the cilia beat in waves down each row
        vec3 x = ro + rd * tt;
        vec3 Lx = normalize(uL - x);
        // diffraction: the colour depends on the angle between the light and the eye, and runs down the row
        float hue = fract(dot(Lx, -rd) * 0.7 + q.y * 0.55 - uTime * 0.35 + floor(phi * 8.0 / 6.2832 + 0.5) * 0.06);
        c += lightAt(x) * mix(vec3(0.6), rainbow(hue), 0.85) * row * beat * (side == 0 ? 1.0 : 0.45) * 0.9;
      }
      H.c = c; H.tr = exp(-th * 4.0); H.t = I.x;
    }
  } else {
    // ---- Atolla: a deep red dome, crowned and furrowed; red is what the deep takes first, so far from the light it is black
    vec3 Ra = vec3(1.0, 0.44, 1.0);
    vec2 I = isect(ellip(o, d, Ra), above(o, d, -0.02));
    if (len(I) > 0.0){
      vec3 pe = o + d * I.x;
      vec3 n = normalize(pe / (Ra * Ra));
      float groove = smoothstep(0.03, 0.0, abs(length(pe.xz) - 0.62)) + 0.5 * smoothstep(0.8, 1.0, cos(atan(pe.z, pe.x) * 22.0)) * step(length(pe.xz), 0.6);
      vec3 xe = ro + rd * I.x;
      vec3 E = lightAt(xe);
      vec3 Le = normalize(uL - xe);
      float lam = max(dot(n, Le), 0.0) * 0.8 + 0.2;
      vec3 alb = vec3(0.50, 0.035, 0.05) * (1.0 - 0.5 * groove);
      vec3 c = E * alb * lam;
      float F = 0.02 + 0.98 * pow(1.0 - abs(dot(n, -rd)), 5.0);
      c += E * F * pow(max(dot(reflect(rd, n), Le), 0.0), 30.0) * 0.8;
      H.c = c; H.tr = 0.0; H.t = I.x;
    }
  }
  // carried to the eye through the water
  if (H.t < 1e8) H.c *= exp(-SIG_V * H.t);
  return H;
}
// Atolla's ring of blue light: a pinwheel of points running round its margin (it shines on its own, seen from anywhere)
vec3 atollaGlow(int k, vec3 ro, vec3 rd){
  vec4 P = uJP[k], UU = uJU[k], KK = uJK[k];
  vec3 u = normalize(UU.xyz), a = normalize(cross(u, abs(u.z) < 0.9 ? vec3(0, 0, 1) : vec3(1, 0, 0))), b = cross(u, a);
  float s = P.w;
  vec3 g = vec3(0.0);
  float spin = uTime * (0.6 + 3.0 * KK.z);
  for (int i = 0; i < 14; i++){
    float ang = float(i) / 14.0 * 6.2832 + 0.15 * sin(float(i) * 7.3);
    vec3 c = P.xyz + (a * cos(ang) + b * sin(ang)) * s * 1.05 - u * s * 0.03;
    vec3 v = c - ro; float t = dot(v, rd);
    if (t < 0.0) continue;
    float h2 = dot(v, v) - t * t;
    float w = pow(0.5 + 0.5 * cos(ang - spin), 10.0) * (0.45 + 0.55 * KK.z) + 0.025 * (0.5 + 0.5 * sin(float(i) * 3.1 + uTime * 0.7));
    float r0 = 0.004 * s / 0.11;
    g += vec3(0.10, 0.42, 1.0) * w * exp(-SIG_V * t) * (8.0e-6 / (h2 + r0 * r0) + 5.0e-6 / (h2 + 16.0 * r0 * r0));
  }
  return g * (0.6 + 0.4 * sin(uTime * 1.7 + KK.y));
}

/* ---- the whale: a humpback sliding by a hand's breadth behind the light. Never the whole animal: only the skin
   round its eye fills the picture. The skin is not noise but a drawn relief, a height (m) over its own surface —
   x along the body (forward), y up, eye at the origin — lit by our light from close by, so every fold casts a shadow:
     the almond of the eye, its lids, the folds that follow them and run out toward the corners, the fine creases
     fanning from the back corner; the line of the mouth below, the lower lip standing proud of it with its row of
     knobs (each with one bristle); crowns of barnacles on the chin; the pale rakes of an orca's teeth, long healed.
   The eye: a wet dark ball behind the lids, which turns to look at the light. */
float smin(float a, float b, float k){ float h = sat(0.5 + 0.5 * (b - a) / k); return mix(b, a, h) - k * h * (1.0 - h); }
float smax(float a, float b, float k){ return -smin(-a, -b, k); }
float sq(float x){ return x * x; }
const float EYE_A = 0.042;                       // half the length of the eye's opening
float gOpen = 1.0;                               // how open the lids are (a blink closes them)
const vec3 BALL = vec3(0.0, 0.0, -0.041);        // the eyeball's centre, under the skin
const float BALL_R = 0.050;
// the mouth: the lower lip's edge, coming back from the snout and rising to its corner just below and behind the eye
const vec2 MOUTH = vec2(-0.035, -0.112);
float lipY(float x){ float u = x - MOUTH.x; return MOUTH.y - 0.060 * u - 0.30 * u * u; }
// a crease: a sharp valley, steep on the side the skin rolls over from (wa), easing out on the other (wb)
float crease(float d, float wa, float wb){ return -exp(-sqrt(d * d + 2e-7) / (d < 0.0 ? wa : wb)); }
// the opening between the lids: the intersection of two arcs, the back corner drawn to a point, the front rounder.
// open: 1 wide … 0 shut (the upper lid comes down to the lower). < 0 inside.
float eyeOpen(vec2 p, float open){
  p.y -= 0.004 * p.x / EYE_A;                    // the back corner sits a little lower
  const float hu = 0.0175, hl = 0.0105;
  float ru = (EYE_A * EYE_A + hu * hu) / (2.0 * hu), rl = (EYE_A * EYE_A + hl * hl) / (2.0 * hl);
  float du = length(p - vec2(0.0, hu - ru)) - ru, dl = length(p - vec2(0.0, rl - hl)) - rl;
  float k = mix(0.0015, 0.007, smoothstep(-EYE_A, EYE_A, p.x));
  float d = smax(du, dl, k);
  // the upper lid's edge, lowered for a blink
  float yu = hu - ru + sqrt(max(ru * ru - p.x * p.x, 0.0)), yl = rl - hl - sqrt(max(rl * rl - p.x * p.x, 0.0));
  return max(d, (p.y - mix(yl, yu, open)) * 0.9);
}
float ballH(vec2 p){ vec2 q = p - BALL.xy; float r2 = BALL_R * BALL_R - dot(q, q); return r2 > 0.0 ? BALL.z + sqrt(r2) : -1.0; }
// the skin's angle round the eye, 0 straight ahead (+x), PI/2 up, PI behind
float eyeAng(vec2 p){ return atan(p.y * 1.6, p.x); }
// a fold drawn as an arch over (dir +1) or under (dir -1) the eye: x0 ± L, its ends at height y1, its crown at y0.
// Each fold is a roll of skin overhanging the next one in toward the eye: steep on its outer side, easing inward.
float arch(vec2 p, float x0, float L, float y1, float y0, float A, float seed, inout float cav){
  float u = (p.x - x0) / L;
  if (abs(u) > 1.0) return 0.0;
  float yk = y1 + (y0 - y1) * (1.0 - u * u) + 0.0016 * sin(u * 5.0 + seed) + 0.0008 * sin(u * 13.0 + seed * 2.0);
  float slope = -2.0 * (y0 - y1) * u / L;
  float dk = (p.y - yk) * sign(y0 - y1) / sqrt(1.0 + slope * slope);
  float env = pow(1.0 - u * u, 0.6) * (0.55 + 0.45 * vnoise(vec2(u * 4.0, seed * 5.0)));
  cav += env * exp(-abs(dk) / 0.0016) * A / 0.004;
  return A * env * crease(dk, 0.0040, 0.0013);
}
// a bump of rounded flesh
float knob(vec2 p, vec2 c, vec2 r, float h){ float q = length((p - c) / r); return q < 1.0 ? h * sq(1.0 - q * q) : 0.0; }
// an acorn barnacle (Coronula): a ribbed crown sunk deep in the skin, its plates uneven, a ragged opening in its top
// with the grey plug inside; mat.x gets its shell, mat.y the dark of its opening
float barnacle(vec2 p, vec2 c, float r, float seed, inout vec4 mat){
  vec2 q = p - c; float dd = length(q);
  if (dd > r * 1.5) return 0.0;
  float th = atan(q.y, q.x);
  float jag = vnoise(vec2(th * 2.0 + seed * 10.0, seed));
  float rr = dd / r * (1.0 + 0.05 * sin(6.0 * th + seed * 6.0) + 0.10 * (jag - 0.5));
  float wall = smoothstep(1.0, 0.60, rr);
  float rim = 0.30 + 0.10 * (vnoise(vec2(th * 3.0, seed * 3.0)) - 0.5);
  float top = smoothstep(rim + 0.07, rim - 0.03, rr);
  float ribs = (0.5 + 0.5 * cos(18.0 * th + seed + 4.0 * vnoise(vec2(th * 3.0, seed)))) * smoothstep(1.0, 0.8, rr) * smoothstep(rim, 0.70, rr);
  float h = r * (0.40 + 0.25 * jag) * (wall * (1.0 + 0.05 * ribs) - 0.30 * top);
  h += r * 0.30 * exp(-sq((rr - 1.04) / 0.20));                       // sunk in: the skin heaped up round its foot
  mat.x = max(mat.x, smoothstep(1.0, 0.86, rr) * (1.0 - top) * (0.75 + 0.25 * ribs) * (0.45 + 0.55 * jag));
  vec2 sl = mat2(cos(seed), sin(seed), -sin(seed), cos(seed)) * q / r;
  mat.y = max(mat.y, top * (0.25 + 0.75 * smoothstep(0.05, 0.015, abs(sl.y)) * step(abs(sl.x), 0.22)));
  return h;
}
// the relief. fine: also the smallest creases (for shading; the shape and the shadows don't need them)
// mat: barnacle shell, barnacle top, crease darkness, pale (scars); lice: the little crabs among the barnacles
float whaleH(vec2 p, bool fine, out vec4 mat, out float lice){
  mat = vec4(0.0); lice = 0.0;
  float h = 0.0;
  // the head curves away above and toward the snout
  h -= sq(p.x + 0.05) / (2.0 * 2.6) + sq(p.y - 0.06) / (2.0 * 0.85);
  // ---- the mouth. The lower lip is a broad rounded rim standing out of the line; the upper jaw tucks in behind it
  float ym = lipY(p.x) + 0.0025 * sin(p.x * 37.0 + 1.0) + 0.0010 * sin(p.x * 107.0);
  float dy = p.y - ym;
  float lipOn = smoothstep(MOUTH.x - 0.005, MOUTH.x + 0.05, p.x);
  float lipT = 0.015 * (0.8 + 0.4 * vnoise(vec2(p.x * 11.0, 3.0)));
  h += lipOn * lipT * smoothstep(0.003, -0.007, dy) * (1.0 - 0.45 * smoothstep(-0.012, -0.05, dy));
  h += lipOn * 0.010 * crease(dy - 0.0025, 0.0016, 0.0050);
  // small creases across the lip's edge
  float lcr = smoothstep(0.65, 1.0, sin(p.x * 240.0 + 9.0 * vnoise(p * 18.0))) * smoothstep(0.35, 0.7, vnoise(vec2(p.x * 30.0, 4.0)));
  h -= lipOn * 0.0007 * lcr * smoothstep(0.001, -0.004, dy) * smoothstep(-0.028, -0.010, dy);
  mat.z += lipOn * (exp(-abs(dy - 0.0025) / 0.0030) + 0.4 * lcr * smoothstep(0.001, -0.004, dy) * smoothstep(-0.028, -0.010, dy));
  // behind its corner the mouth runs on as a fold that fades into the cheek; the corner itself a deep dimple
  float tail = smoothstep(MOUTH.x + 0.01, MOUTH.x - 0.02, p.x) * smoothstep(MOUTH.x - 0.17, MOUTH.x - 0.03, p.x);
  float ty = MOUTH.y + 0.20 * (p.x - MOUTH.x) - 0.7 * sq(p.x - MOUTH.x);
  h += tail * 0.006 * crease(p.y - ty, 0.0020, 0.0050);
  mat.z += tail * 0.7 * exp(-abs(p.y - ty) / 0.003);
  float cm = length((p - MOUTH) * vec2(1.0, 1.4));
  h -= 0.007 * exp(-sq(cm / 0.011));
  // the knobs along the lower jaw, each with a bristle in a pit on its top
  if (dy < 0.0 && dy > -0.075 && p.x > MOUTH.x) for (int k = 0; k < 6; k++){
    float fk = float(k), hk = hash12(vec2(fk, 41.0));
    float x = MOUTH.x + 0.07 + fk * 0.070 + 0.014 * (hk - 0.5);
    vec2 c = vec2(x, lipY(x) - 0.040 - 0.012 * hash12(vec2(fk, 5.0)));
    float r = 0.015 * (0.85 + 0.3 * hk);
    h += knob(p, c, vec2(r * 1.15, r), 0.0075 * (0.8 + 0.4 * hk));
    float pit = length(p - c - vec2(0.002, 0.003));
    h -= 0.0020 * exp(-sq(pit / 0.0016));
    mat.z += smoothstep(0.0020, 0.0006, pit);
  }
  // ---- the eye: a broad mound of thick flesh with the opening in it
  float d = eyeOpen(p, gOpen);
  float ang = eyeAng(p), r = length(p * vec2(0.75, 1.15));
  if (r < 0.22){
    h += 0.012 * exp(-sq((p.x + 0.01) / 0.10) - sq((p.y + 0.004) / 0.065));
    // the lids' rims: the upper a fat roll, the lower thinner
    float up = smoothstep(-0.2, 0.4, sin(ang));
    h += mix(0.0030, 0.0050, up) * (0.7 + 0.6 * vnoise(vec2(ang * 3.0, 11.0))) * exp(-sq((d - 0.005) / mix(0.0045, 0.0070, up)));
    // into the opening the skin turns under (the eyeball, below, fills it)
    h -= 0.05 * smoothstep(0.0005, -0.004, d);
    // folds that follow the lids, longer and flatter the further out, running on past the back corner; one forks
    float cav = 0.0;
    h += arch(p, -0.004, 0.058, -0.004, 0.029, 0.0036, 1.0, cav);
    h += arch(p, -0.013, 0.078, -0.007, 0.043, 0.0030, 2.0, cav);
    h += arch(p, -0.030, 0.085, -0.012, 0.058, 0.0022, 3.0, cav);
    h += arch(p, -0.070, 0.050, -0.020, 0.040, 0.0016, 5.0, cav);
    h += arch(p, 0.002, 0.055, -0.006, -0.020, 0.0024, 6.0, cav);
    h += arch(p, -0.010, 0.074, -0.008, -0.034, 0.0018, 7.0, cav);
    h += arch(p, -0.040, 0.060, -0.014, -0.047, 0.0012, 8.0, cav);
    // creases running out from the eye across the folds, so the skin round it is puckered into soft cells
    float rr = length(vec2(p.x, p.y * 1.6));
    if (fine) for (int j = 0; j < 18; j++){
      float fj = float(j), hj = hash12(vec2(fj, 77.0));
      float d0 = 0.006 + 0.018 * hash12(vec2(fj, 3.0)), d1 = d0 + 0.010 + 0.026 * hash12(vec2(fj, 9.0));
      if (d > d0 && d < d1){
        float sj = (d - d0) / (d1 - d0);
        float aa = ang - ((fj + 0.6 * hj) / 18.0 * 6.2832 - 3.14159) - 0.12 * sin(d * 70.0 + fj * 2.0);
        aa = mod(aa + 3.14159, 6.2832) - 3.14159;
        float w = pow(sin(sj * 3.14159), 1.2) * (0.5 + 0.5 * hj) * (1.0 - 0.7 * smoothstep(0.2, 0.8, sin(ang)));
        float dist = aa * rr / 1.3;
        h += 0.0013 * w * crease(dist, 0.0020, 0.0020);
        cav += 0.3 * w * exp(-abs(dist) / 0.0018);
      }
    }
    mat.z += cav + smoothstep(0.004, -0.0005, d) * 0.8;
  }
  // fine creases fanning out of the back corner, and a few from the front one
  vec2 q = p - vec2(-EYE_A - 0.003, -0.004);
  if (fine && q.x < 0.0 && dot(q, q) < 0.09 * 0.09){
    float a = atan(q.y, -q.x), rq = length(q);
    for (int k = 0; k < 7; k++){
      float fk = float(k), hk = hash12(vec2(fk, 13.0));
      float ak = (fk - 3.0) * 0.19 + 0.08 * (hk - 0.5) + 0.25 * rq;      // they curve a little as they go
      float along = rq / (0.030 + 0.045 * hk);
      if (along < 1.0){
        float w = sin(along * 3.14159) * (1.0 - along * 0.4) * smoothstep(1.35, 1.0, abs(a));
        float dist = (a - ak) * rq;
        h += 0.0013 * w * crease(dist, 0.0010, 0.0018);
        mat.z += 0.4 * w * exp(-abs(dist) / 0.0013);
      }
    }
  }
  q = p - vec2(EYE_A + 0.004, 0.002);
  if (fine && q.x > 0.0 && dot(q, q) < 0.05 * 0.05){
    float a = atan(q.y, q.x), rq = length(q);
    for (int k = 0; k < 3; k++){
      float fk = float(k);
      float along = rq / (0.022 + 0.01 * fk);
      if (along < 1.0) h += 0.0009 * sin(along * 3.14159) * crease((a - (fk - 1.0) * 0.45 - 0.15) * rq, 0.001, 0.0016);
    }
  }
  // ---- barnacles: a crowd of them on the chin, one riding a knob, a pair alone behind the mouth
  if (p.y < -0.12){
    h += barnacle(p, vec2(0.215, -0.220), 0.025, 1.0, mat);
    h += barnacle(p, vec2(0.251, -0.193), 0.018, 2.0, mat);
    h += barnacle(p, vec2(0.181, -0.244), 0.020, 3.0, mat);
    h += barnacle(p, vec2(0.252, -0.238), 0.013, 4.0, mat);
    h += barnacle(p, vec2(0.282, -0.216), 0.010, 5.0, mat);
    h += barnacle(p, vec2(0.236, -0.166), 0.007, 6.0, mat);
    h += barnacle(p, vec2(0.172, -0.166), 0.010, 7.0, mat);
    h += barnacle(p, vec2(-0.168, -0.176), 0.012, 8.0, mat);
    h += barnacle(p, vec2(-0.150, -0.188), 0.008, 9.0, mat);
  }
  // ---- the skin itself: broad slow swells; and (fine) patches of shallow creases that mostly run along the body
  h += 0.0022 * (vnoise(p * 7.0) - 0.5) + 0.0009 * (vnoise(p * 19.0 + 3.0) - 0.5);
  if (fine){
    vec2 w = p + 0.012 * vec2(vnoise(p * 11.0), vnoise(p * 11.0 + 9.0));
    float ph = w.y * 210.0 + 7.0 * vnoise(w * 5.0);
    float li = floor(ph);
    float seg = smoothstep(0.35, 0.70, vnoise(vec2(w.x * 6.0, li * 1.7))) * smoothstep(0.45, 0.70, vnoise(p * 3.5 + 20.0));
    float cr = 0.00018 * seg * crease((fract(ph) - 0.5) / 210.0, 0.0006, 0.0011);
    // near the eye the fine creases follow the lids
    float near = smoothstep(0.10, 0.05, r); float rr = length(vec2(p.x, p.y * 1.6));
    float ph2 = ang * 45.0 + 4.0 * vnoise(vec2(d * 120.0, 1.0));
    float seg2 = smoothstep(0.45, 0.75, vnoise(vec2(d * 160.0, floor(ph2) * 2.3)));
    float cr2 = 0.00022 * seg2 * crease((fract(ph2) - 0.5) * rr / 45.0, 0.0008, 0.0008) * smoothstep(0.004, 0.012, d);
    h += mix(cr, cr2, near);
    h += 0.00005 * (vnoise(p * 600.0) + vnoise(p * 1300.0 + 7.0) - 1.0);
  }
  return h;
}
float whaleSurf(vec2 p){ vec4 m; float l; return max(whaleH(p, false, m, l), ballH(p)); }
// returns the whale's colour (carried to the eye) and its distance, or T unchanged
vec3 whale(vec3 ro, vec3 rd, inout float T){
  if (uWh.w <= 0.0) return vec3(0.0);
  gOpen = 1.0 - uWhF.w;
  vec3 F = uWhF.xyz, Up = vec3(0.0, 1.0, 0.0), Z = normalize(cross(F, Up)); Up = cross(Z, F);
  vec3 rl = ro - uWh.xyz;
  vec3 o = vec3(dot(rl, F), dot(rl, Up), dot(rl, Z)), d = vec3(dot(rd, F), dot(rd, Up), dot(rd, Z));
  // the skin lies within a thin shell under the plane z = 0.03 (and nowhere is deeper than ~0.2 in view)
  if (d.z >= -0.02) return vec3(0.0);
  float t = max((0.035 - o.z) / d.z, 0.0), tEnd = min((-0.45 - o.z) / d.z, T);
  if (t > tEnd) return vec3(0.0);
  float tp = t; bool hit = false;
  for (int i = 0; i < 48; i++){
    vec3 p = o + d * t;
    float f = p.z - whaleSurf(p.xy);
    if (f < 0.0){ hit = true; break; }
    tp = t;
    t += max(f * 0.55, 0.0004);
    if (t > tEnd) break;
  }
  if (!hit) return vec3(0.0);
  for (int i = 0; i < 6; i++){ float tm = 0.5 * (tp + t); vec3 p = o + d * tm; if (p.z - whaleSurf(p.xy) < 0.0) t = tm; else tp = tm; }
  vec3 p = o + d * t;
  vec4 mat; float lice;
  float hs = whaleH(p.xy, true, mat, lice), hb = ballH(p.xy);
  bool isEye = hb > hs;
  // the normal, from the relief's slope
  vec2 e = vec2(0.0007, 0.0);
  vec4 m_; float l_;
  vec3 n;
  if (isEye){ n = normalize(vec3(p.xy, hb) - BALL); }
  else {
    float hx = whaleH(p.xy + e.xy, true, m_, l_) - whaleH(p.xy - e.xy, true, m_, l_);
    float hy = whaleH(p.xy + e.yx, true, m_, l_) - whaleH(p.xy - e.yx, true, m_, l_);
    n = normalize(vec3(-hx, -hy, 2.0 * e.x));
  }
  vec3 xw = ro + rd * t;
  vec3 Lw = uL - xw;
  vec3 Ll = vec3(dot(Lw, F), dot(Lw, Up), dot(Lw, Z)), Ld = normalize(Ll);
  float distL = length(Ll);
  // shadow: walk toward the light over the relief
  float sh = 1.0, s = 0.0015;
  for (int i = 0; i < 18; i++){
    vec3 q = p + Ld * s;
    float f = q.z - whaleSurf(q.xy);
    sh = min(sh, 0.5 + 0.5 * f / (0.03 * s));
    s += max(0.0025, s * 0.22);
    if (sh < 0.0 || s > min(distL, 0.30)) break;
  }
  sh = smoothstep(0.0, 1.0, sat(sh));
  vec3 V = -d;
  vec3 Hh = normalize(Ld + V);
  float ndl = dot(n, Ld), ndh = max(dot(n, Hh), 0.0), ndv = max(dot(n, V), 0.0);
  vec3 E = lightAt(xw) * sh;
  vec3 col;
  if (isEye){
    // the eye: turned toward wherever uWhG says. Nearly black: a dark brown iris with faint fibres, the pupil wide open
    // (it is very dark down here), and round them the white, which shows only when it looks aside
    vec3 g = normalize(uWhG.xyz);
    float a = acos(clamp(dot(n, g), -1.0, 1.0));
    vec3 gx = normalize(cross(vec3(0.0, 1.0, 0.0), g)), gy = cross(g, gx);
    float az = atan(dot(n, gy), dot(n, gx));
    float pr = 0.36 * (1.0 + 0.22 * abs(cos(az)));                     // a broad oval, wider than tall
    float fib = vnoise(vec2(az * 14.0, a * 10.0)) * 0.6 + vnoise(vec2(az * 40.0, a * 4.0)) * 0.4;
    vec3 iris = vec3(0.0085, 0.0058, 0.0042) * (0.7 + 0.5 * fib) * (0.8 + 0.5 * smoothstep(pr, 0.72, a));
    iris *= 1.0 - 0.5 * smoothstep(0.64, 0.74, a);                      // a darker ring at its edge
    vec3 sclera = vec3(0.16, 0.15, 0.135) * (0.80 + 0.30 * vnoise(vec2(az * 6.0, a * 7.0)));
    sclera = mix(sclera, vec3(0.025, 0.017, 0.012), smoothstep(1.0, 0.80, a) * 0.7);   // brown seeps into the white near the iris
    vec3 alb = mix(iris, sclera, smoothstep(0.76, 0.84, a));
    alb = mix(vec3(0.0012, 0.0010, 0.0010), alb, smoothstep(pr - 0.03, pr + 0.03, a));
    // a wet cornea: one crisp highlight, and a soft sheen over the whole ball
    float fr = 0.03 + 0.97 * pow(1.0 - ndv, 5.0);
    float spec = 2.0 * pow(ndh, 1400.0) * (0.25 + fr);
    col = E * (alb * max(ndl, 0.0) + spec * step(0.0, ndl)) ;
    col *= smoothstep(-0.010, 0.008, hb);                               // dim where it sinks in under the lids
  } else {
    // skin: nearly black slate; darker in its creases; pale where scarred; barnacles chalky grey, grimed, a little green
    vec3 alb = vec3(0.0070, 0.0076, 0.0090) * (0.80 + 0.40 * vnoise(p.xy * 11.0) + 0.15 * (vnoise(p.xy * 90.0) - 0.5));
    alb *= 1.0 - 0.6 * sat(mat.z);
    alb = mix(alb, vec3(0.034, 0.035, 0.036) * (0.75 + 0.4 * vnoise(p.xy * 150.0)), sat(mat.w) * 0.8);
    vec3 shell = vec3(0.085, 0.082, 0.075) * (0.6 + 0.6 * vnoise(p.xy * 320.0)) * mix(vec3(1.0), vec3(0.70, 0.80, 0.60), smoothstep(0.4, 0.8, vnoise(p.xy * 45.0)) * 0.8);
    alb = mix(alb, shell, sat(mat.x));
    vec3 opening = vec3(0.004, 0.0035, 0.003);
    vec3 plug = vec3(0.022, 0.021, 0.019) * (0.6 + 0.6 * vnoise(p.xy * 500.0));
    alb = mix(alb, mix(plug, opening, smoothstep(0.4, 0.9, mat.y)), smoothstep(0.0, 0.25, mat.y));
    alb = mix(alb, vec3(0.13, 0.07, 0.04), sat(lice));
    // wet skin: a broad sheen that shows its shape; a glassy line where the lid meets the eye
    float fr = 0.03 + 0.97 * pow(1.0 - ndv, 5.0);
    float gloss = (0.030 * pow(ndh, 40.0) + 0.005 * pow(ndh, 6.0)) * (1.0 - sat(mat.x) * 0.6);
    gloss += 0.15 * pow(ndh, 250.0) * smoothstep(0.0025, 0.0005, eyeOpen(p.xy, gOpen)) * smoothstep(0.3, 0.7, vnoise(p.xy * 300.0));
    float wrap = sat((ndl + 0.10) / 1.10);
    col = E * (alb * wrap + gloss * (0.4 + fr) * step(0.0, ndl));
  }
  T = t;
  return col * exp(-SIG_V * t);
}

/* ---- the whole whale going by, further off: a long dark body (a body of revolution, thickest a little ahead of the
   middle), the grooves of its throat, the flukes at the end of its tail, and the long white flipper, knobbed along its
   leading edge, held out toward the light. Local frame: x toward its head, y up, z toward us. */
uniform vec4 uGW;            // where the middle of its body is (world), on/off
uniform vec4 uGF;            // which way it swims (unit), the stroke of its flukes
uniform vec4 uGA;            // the near flipper: its direction (local, unit)
uniform float uDown;         // the daylight far above
float bodyR(float x){
  float u = clamp((x + 7.5) / 14.0, 0.0, 1.0);
  float head = sqrt(max(1.0 - sq(max(u - 0.60, 0.0) / 0.40), 0.0));
  float tail = pow(smoothstep(0.0, 0.60, u), 0.80);
  return 1.55 * head * tail + 0.10;
}
float greatSDF(vec3 q, out float part){
  // body: an ellipse in section (a little deeper than wide); throat grooves along its underside
  float r = bodyR(q.x);
  float d = (length(vec2(q.y / 0.88, q.z)) - r) * 0.82;
  d = max(d, abs(q.x + 0.5) - 7.05);
  float ph = atan(q.y, q.z);
  float throat = smoothstep(0.5, 2.0, q.x) * smoothstep(-0.25, -0.75, q.y / max(r, 0.2));
  d += 0.010 * throat * (0.5 + 0.5 * sin(ph * 70.0));
  part = 0.0;
  // the flukes: two broad swept lobes at the end of the tail stock, beating slowly up and down
  vec3 fq = q - vec3(-7.75, 0.30 * uGF.w, 0.0);
  float sw = 0.40;
  vec2 lz = vec2(fq.x + abs(fq.z) * sw, abs(fq.z) - 0.95);
  float fl = (length(vec3(lz.x / 0.42, fq.y / 0.06, lz.y / 1.00)) - 1.0) * 0.06;
  if (fl < d){ d = fl; part = 1.0; }
  // the flippers: from their roots low on each flank, long blades held down and out; thick along the leading edge,
  // knobbed there (the near one, z > 0, is the one that sweeps past the light)
  vec3 A = uGA.xyz;
  q.z = abs(q.z);                                                      // (the two are mirror images)
  vec3 R0 = vec3(2.55, -0.95, 1.05);
  vec3 v = q - R0;
  float al = dot(v, A), Lf = 3.6, s = clamp(al, 0.0, Lf), sl = s / Lf;
  vec3 Cd = normalize(vec3(1.0, 0.0, 0.0) - A * A.x), N = cross(A, Cd);
  vec3 off = v - A * s;
  float b = dot(off, Cd), n = dot(off, N);
  float chord = 0.46 * (1.0 - 0.35 * sl) * sqrt(max(1.0 - pow(sl, 5.0), 0.0)) + 0.02;
  float knob = pow(0.5 + 0.5 * sin(s * 10.5 + 1.0), 2.0) * smoothstep(0.05, 0.25, sl);
  float cb = b > 0.0 ? chord * (0.40 + 0.16 * knob) : chord * 0.60;        // the knobs stand out along the leading edge
  float th = (0.075 * (1.0 - 0.55 * sl) + 0.012) * (b > 0.0 ? 1.0 + 0.3 * knob : 1.0 - 0.7 * sat(-b / cb));
  float fd = (length(vec2(b / cb, n / th)) - 1.0) * min(cb, th) * 0.7;
  fd = max(fd, max(al - Lf, -al - 0.3));
  if (fd < d){ d = fd; part = 2.0 + knob * smoothstep(0.0, 0.6, b / cb); }

}
vec3 great(vec3 ro, vec3 rd, inout float T){
  if (uGW.w <= 0.0) return vec3(0.0);
  vec3 F = uGF.xyz, Up = vec3(0.0, 1.0, 0.0), Z = normalize(cross(F, Up)); Up = cross(Z, F);
  vec3 rl = ro - uGW.xyz;
  vec3 o = vec3(dot(rl, F), dot(rl, Up), dot(rl, Z)), d = vec3(dot(rd, F), dot(rd, Up), dot(rd, Z));
  // a box round all of it
  vec3 bmin = vec3(-8.6, -4.8, -4.6), bmax = vec3(7.0, 2.0, 4.6);
  vec3 ia = (bmin - o) / d, ib = (bmax - o) / d;
  vec3 lo = min(ia, ib), hi = max(ia, ib);
  float t0 = max(max(lo.x, lo.y), max(lo.z, 0.0)), t1 = min(min(hi.x, hi.y), min(hi.z, T));
  if (t0 >= t1) return vec3(0.0);

  for (int i = 0; i < 64; i++){
    float f = greatSDF(o + d * t, part);
    if (f < 0.0012 * t){ hit = true; break; }
    t += max(f, 0.002);
    if (t > t1) break;
  }
