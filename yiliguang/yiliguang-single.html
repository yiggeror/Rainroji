    // puddles where the pavers have sunk: by the wall under the sill drip, round the downpipe's shoe, in a few dips
    float pud = fbm(p.xz * 0.55 + 11.0) + 0.3 * smoothstep(1.3, 0.3, length((p.xz - vec2(0.45, -6.1)) * vec2(0.8, 1.2)) + 0.25 * vnoise(p.xz * 3.0)) + 0.25 * smoothstep(0.9, 0.0, abs(p.x - PIPE_X)) * smoothstep(1.4, 0.3, abs(p.z + 0.8)) + 0.12 * smoothstep(1.5, 0.4, p.z - FAC_Z + 1.4) * smoothstep(1.2, 0.5, abs(p.x));
    float water = smoothstep(0.56, 0.6, pud + 0.05 * (th - 0.5) - 0.04 * grout) * (1.0 - uSnow);
    // fallen plane leaves in autumn, stuck flat to the wet paving
    if (uSeason > 1.5 && uSeason < 2.5){
      vec2 lg = p.xz / 0.45, li = floor(lg); vec3 lh = hash32(li + 5.0);
      if (lh.z < 0.35){
        vec2 lq = rot2((fract(lg) - 0.3 - 0.4 * lh.xy) * 0.45, lh.z * 40.0);
        float a = atan(lq.y, lq.x), r = length(lq);
        float leaf = smoothstep(0.004, 0.0, r - 0.05 * (0.65 + 0.35 * abs(cos(2.5 * a))));
        alb = mix(alb, mix(vec3(0.42, 0.24, 0.05), vec3(0.3, 0.12, 0.04), lh.x) * 0.8, leaf * (1.0 - water * 0.5));
      }
    }
    if (snowy > 0.0 || uSnow > 0.0){
      float trod = smoothstep(0.35, 0.65, fbm(p.xz * vec2(1.6, 0.5) + 3.0));          // a trodden, slushy path along the kerb side
      snowy = uSnow * (1.0 - 0.75 * trod);
    }
    vec3 nW = normalize(vec3(-ripples(p.xz).x, 1.0, -ripples(p.xz).y));
    vec3 nn = normalize(mix(n, nW, water));
    float cw = max(dot(nn, v), 0.0);
    float Fw = fresnel(cw, 1.0, NW);
    vec3 r = reflect(rd, nn);
    vec3 E = outdoorE(p, n, ao, true);
    vec3 dry = alb / PI * E + lampSpec(p, n, v, 0.32, vec3(0.04)) + F_Schlick(vec3(0.04), max(dot(n, v), 0.0)) * skyRad(reflect(rd, n)) * 0.4;
    vec3 wetc = alb * 0.35 / PI * E * (1.0 - Fw) + Fw * mirrorScene(p, r) + lampSpec(p, nn, v, 0.02, vec3(0.02)) * 1.0;
    vec3 c = mix(dry, wetc, water);
    c = mix(c, vec3(0.75, 0.76, 0.78) / PI * E, snowy);
    return c;
  }
  else if (id == M_FRAME){
    Mat m = getMat(id, p, n); alb = m.alb * 0.8; rough = 0.45;
  }
  if (snowy > 0.0) alb = mix(alb, vec3(0.8, 0.81, 0.83), snowy);
  vec3 E = outdoorE(p, n, ao, true);
  vec3 col = emis + alb / PI * E;
  float a = rough * rough;
  col += lampSpec(p, n, v, max(a, 0.02), f0) * (1.0 - snowy);
  col += F_Schlick(f0, max(dot(n, v), 0.0)) * skyRad(reflect(rd, n)) * (1.0 - rough) * 0.6 * ao;
  return col;
}

// ---- our window from outside: drops, glass, and the room behind them
vec3 windowOut(vec3 P, vec3 rd){
  vec2 guv = (P.xy - vec2(WIN_X0, WIN_Y0)) / vec2(WIN_X1 - WIN_X0, WIN_Y1 - WIN_Y0);
  vec4 st = texture(uState, guv);
  float M = smoothstep(0.02, 0.9, st.r), Fin = min(st.b * uFogK, 1.0), rim = st.a;
  vec2 e = 1.0 / uHTex, emm = e * uSimMM;
  float h = texture(uHeight, guv).r / uHScale;
  float hx = (texture(uHeight, guv + vec2(e.x, 0.0)).r - texture(uHeight, guv - vec2(e.x, 0.0)).r) / uHScale / (2.0 * emm.x);
  float hy = (texture(uHeight, guv + vec2(0.0, e.y)).r - texture(uHeight, guv - vec2(0.0, e.y)).r) / uHScale / (2.0 * emm.y);
  float wet = smoothstep(0.0, 0.03, h);
  vec3 N = normalize(vec3(-hx, -hy, -1.0));                  // the drop's surface, facing the street
  vec3 v = -rd;
  // into the drop, through the pane, out into the room: the drop is a little lens that shows the room upside down
  float ci = max(dot(v, N), 1e-3);
  float Fw = fresnel(ci, 1.0, NW);
  vec3 tw = refract(rd, N, 1.0 / NW);
  vec2 xy = tw.xy * NW; float s2 = dot(xy, xy);
  vec3 dDrop = s2 < 1.0 ? vec3(xy, sqrt(1.0 - s2)) : vec3(0.0, 0.0, 1.0);
  vec3 dIn = normalize(mix(rd, dDrop, wet));
  float Fg = fresnel(abs(rd.z), 1.0, NG);
  // march the room
  vec3 roomC = vec3(0.0);
  float tr = 0.003; vec2 hr = vec2(1.0, 0.0); bool rh = false;
  for (int i = 0; i < 100; i++){
    hr = map(P + dIn * tr, true);
    if (hr.x < 0.0003 * tr + 0.0001){ rh = true; break; }
    tr += hr.x * 0.96;
    if (tr > 6.0) break;
  }
  if (rh){ vec3 q = P + dIn * tr; roomC = shade(q, calcNormal(q), dIn, hr.y); }
  vec4 sm = smokeVol(P, dIn, rh ? tr : 6.0);
  roomC = roomC * sm.a + sm.rgb;
  // the outside mist scatters a little of everything; the inside condensation glows with the lamp behind it
  vec3 Lb = BULB - P; float ld2 = dot(Lb, Lb);
  vec3 Eg = uLampI * lampEmitFactor(-Lb * inversesqrt(ld2)) * max(Lb.z * inversesqrt(ld2), 0.0) / ld2 + uAmbL;
  vec3 Lw = WL_P - P; float lw2 = dot(Lw, Lw);
  vec3 Eo = uWallI * lampMask(-Lw * inversesqrt(lw2)) * max(-Lw.z, 0.0) * inversesqrt(lw2) / lw2 + uCityGlow + uEVert;   // light falling on the glass from the street
  roomC = mix(roomC, uWinL, M * 0.3) + Eo * 0.006 * M;
  float fogA = sat(Fin * 0.85 + rim * 0.35);
  vec3 fogC = (Eg * 0.2 + uWinL * 1.1 + Eo * 0.01) * (0.9 + 0.2 * vnoise(guv * uSimMM * 2.5));
  vec3 through = mix(roomC, fogC, fogA);
  // frost on the inside, lit from the room
  if (uFrost > 0.0){
    float yb = P.y < TRANSOM_Y ? P.y - (WIN_Y0 + FW) : P.y - (TRANSOM_Y + TW);
    float xe = min(min(abs(P.x - (WIN_X0 + FW)), abs(P.x + MW)), min(abs(P.x - MW), abs(P.x - (WIN_X1 - FW))));
    vec2 fq = P.xy * vec2(75.0, 60.0);
    float fern = 0.0, amp = 0.5;
    for (int k = 0; k < 4; k++){ fern += amp * (1.0 - abs(2.0 * vnoise(fq) - 1.0)); fq = FBM_R * fq * 1.1 + 5.3; amp *= 0.55; }
    float corner = min(yb, xe) + 0.6 * max(yb, xe);
    float frost = smoothstep(0.62, 0.86, fern + 0.95 - min(min(yb, xe * 1.6) * 15.0, corner * 11.0)) * (P.y < TRANSOM_Y ? 1.0 : 0.55);
    through = mix(through, Eg * 0.06 + uWinL * 0.5 + Eo * 0.03, frost * 0.8);
  }
  // the paper-cuts on the inside: red paper glowing with the lamp behind it
  float aaW = length(fwidth(P.xy)) * 0.8 + 0.0002;
  vec2 dL = vec2(P.x - (WIN_X0 + FW), (TRANSOM_Y - TW) - P.y), dR = vec2((WIN_X1 - FW) - P.x, (TRANSOM_Y - TW) - P.y);
  float tR = atan(dR.y, dR.x) / (PI * 0.5);
  float keep = smoothstep(0.02, -0.02, tR - 0.6 - 0.12 * (vnoise(dR * 260.0) - 0.5));
  float pc = max(paperCut(dL, 0.112, aaW), paperCut(dR, 0.112, aaW) * keep);
  through = mix(through, (Eg * vec3(0.10, 0.008, 0.006) + uWinL * vec3(0.6, 0.06, 0.05)) * (0.85 + 0.3 * vnoise(P.xy * 300.0)) + Eo * vec3(0.05, 0.01, 0.01), pc);
  // reflections: the flat pane mirrors the street behind the viewer and the lane lamp; the drops mirror it small and bright
  vec3 Rg = reflect(rd, vec3(0.0, 0.0, -1.0));
  vec3 dryC = through * (1.0 - Fg) * (1.0 - Fg) + (envOut(Rg) * Fg * (1.0 + 0.85 * (1.0 - M)) + lampSpec(P, vec3(0.0, 0.0, -1.0), v, 0.004 + 0.05 * M, vec3(0.04))) * (1.0 - 0.5 * M);
  vec3 Rw = reflect(rd, N);
  vec3 wetC = through * (1.0 - Fw) * (1.0 - Fg) * step(s2, 1.0) + envOut(Rw) * Fw + lampSpec(P, N, v, 0.01, vec3(0.02));
  vec3 col = mix(dryC, wetC, wet);
  // snowflakes resting on the outside, lit by the street and the lamp
  float flake = texture(uHeight, guv).g;
  if (flake > 0.0) col = mix(col, (Eo * 0.8 + uEVert * 0.3) / PI + Eg * 0.01, min(flake, 1.0) * 0.9);
  // autumn: wet leaves stuck to the outside
  for (int i = 0; i < 3; i++){
    if (uGLeaf[i].z <= 0.0) continue;
    float Rl = uGLeaf[i].z;
    vec2 q = rot2(P.xy - uGLeaf[i].xy, uGLeaf[i].w);
    float a = atan(q.x, q.y - Rl * 0.35), r = length(q - vec2(0.0, Rl * 0.35));
    float lf = smoothstep(aaW, -aaW, r - Rl * 0.62 * (0.6 + 0.4 * abs(cos(2.5 * a)))) ;
    if (lf <= 0.0) continue;
    vec3 alb = mix(vec3(0.36, 0.20, 0.04), vec3(0.22, 0.10, 0.03), smoothstep(0.4, 0.8, vnoise(q * 60.0 + float(i) * 9.0)));

  }
  return col;
}

void main(){
  vec2 ndc = (gl_FragCoord.xy + uJitter) / uRes * 2.0 - 1.0;
  vec3 rd = normalize(uCamFwd + ndc.x * uTan.x * uCamRight + ndc.y * uTan.y * uCamUp);

  float tGl = 1e9;
  if (rd.z > 0.0){
    float tz = (GLASS_Z - ro.z) / rd.z; vec3 pg = ro + rd * tz;
    if (abs(pg.x - WIN_CX) < WIN_HW && abs(pg.y - WIN_CY) < WIN_HH) tGl = tz;
  }
  float t = 0.0; vec2 h = vec2(1.0, 0.0); bool hit = false;
  for (int i = 0; i < 110; i++){
    h = mapStreet(ro + rd * t);
    if (h.x < 0.0003 * t + 0.0002){ hit = true; break; }
    t += h.x * 0.95;
    if (t > tGl || t > 80.0) break;
  }
  vec3 col;
  if (hit && t < tGl){
    vec3 p = ro + rd * t;
    col = shadeStreet(p, calcNormalS(p), rd, h.y);
  } else if (tGl < 1e8){
    t = tGl;
    col = windowOut(ro + rd * tGl, rd);
  } else { col = skyRad(rd); t = 80.0; }

  oAux = vec4(t * dot(rd, uCamFwd));
}

    float px = 2.0 * z * uTan.y / uRes.y;                               // one pixel in metres at that depth

uniform vec2 uHTex;         // height texture size (texels)
uniform float uHScale;
uniform float uTime;
uniform int uDbg;
uniform float uFrost, uFogK;     // winter frost on the inside; how heavily the inside condenses this season
uniform vec4 uGLeaf[3];          // autumn: wet leaves stuck to the outside of the glass (x, y, size, angle; size 0 = none)
out vec4 o;

vec2 rot2(vec2 v, float a){ float c = cos(a), s = sin(a); return vec2(c * v.x - s * v.y, s * v.x + c * v.y); }
${GLSL_GLASS}
// micro-droplets of the outside mist (too many to simulate one by one): a jittered grid of
// tiny caps whose presence and size follow the local mist density M (sim-mm units)
vec3 microDrops(vec2 pm, float M){
  const float CS = 0.6;
  vec2 g = pm / CS, gi = floor(g);
  vec3 best = vec3(0.0);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
    vec2 c = gi + vec2(float(i), float(j));
    vec3 h3 = hash32(c);
    if (h3.z > 0.2 + 0.75 * M) continue;
    vec2 ctr = (c + 0.15 + 0.7 * h3.xy) * CS;
    float r = CS * (0.16 + 0.3 * fract(h3.z * 13.1)) * (0.5 + 0.5 * M);
    vec2 d = pm - ctr; float rr = dot(d, d);
    if (rr < r * r){
      float R = r / 0.94, sq = sqrt(R * R - rr), h = sq - R * 0.342;   // θ ≈ 70°
      if (h > best.x) best = vec3(h, -d / sq);
    }
  }
  return best;
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec4 room = texture(uRoom, uv);
  vec3 col = room.rgb;
  float cov = room.a;
  vec2 ndc = uv * 2.0 - 1.0;
  vec3 rd = normalize(uCamFwd + ndc.x * uTan.x * uCamRight + ndc.y * uTan.y * uCamUp);
  vec3 P = uCamPos + rd * ((GLASS_Z - uCamPos.z) / rd.z);
  vec2 guv = (P.xy - vec2(WIN_X0, WIN_Y0)) / vec2(WIN_X1 - WIN_X0, WIN_Y1 - WIN_Y0);
  vec2 pm = guv * uSimMM;
  // ---- glass state: outside mist M, trail film W, inside condensation F, wipe rim
  vec4 st = texture(uState, guv);
  float M = smoothstep(0.02, 0.9, st.r), W = st.g, Fin = min(st.b * uFogK, 1.0), rim = st.a;
  // ---- macro drops: height + gradient (condensation on the inside softens what is seen through it)
  float lod = Fin * 3.0;
  vec2 e = exp2(lod) / uHTex;
  vec2 emm = e * uSimMM;
  float h = textureLod(uHeight, guv, lod).r / uHScale;
  float hx = (textureLod(uHeight, guv + vec2(e.x, 0.0), lod).r - textureLod(uHeight, guv - vec2(e.x, 0.0), lod).r) / uHScale / (2.0 * emm.x);
  float hy = (textureLod(uHeight, guv + vec2(0.0, e.y), lod).r - textureLod(uHeight, guv - vec2(0.0, e.y), lod).r) / uHScale / (2.0 * emm.y);
  vec2 grad = vec2(hx, hy);
  // ---- micro droplets (faded when sub-pixel, and under condensation)
  float pxPerMM = 1.0 / max(length(fwidth(pm)), 1e-4);
  float aaM = smoothstep(2.5, 6.0, pxPerMM * 0.6) * (1.0 - Fin);
  float macro = smoothstep(0.0, 0.03, h);
  vec3 md = aaM > 0.01 ? microDrops(pm, M) * aaM * (1.0 - macro) : vec3(0.0);   // sub-pixel (most phones): skip
  grad += md.yz;
  // ---- trail film: thin, slightly uneven water layer
  float fn = vnoise(pm * vec2(0.9, 0.25) + 3.0) - vnoise(pm * vec2(0.9, 0.25) + vec2(3.6, 3.0));
  grad += vec2(fn, 0.0) * W * 0.05;
  float wet = max(macro, smoothstep(0.0, 0.02, md.x));
  // ---- optics. glass-local frame: x, y as world, z pointing OUT of the room.
  vec3 v = vec3(rd.xy, -rd.z);
  vec3 N = normalize(vec3(-grad, 1.0));
  vec3 dw = vec3(v.xy / NW, 0.0); dw.z = sqrt(1.0 - dot(dw.xy, dw.xy));   // in water (n·sinθ conserved by the flat glass)
  float Fw = fresnel(dot(dw, N), NW, 1.0);
  vec3 dout = refract(dw, -N, NW);
  if (dot(dout, dout) < 0.5) dout = vec3(0.0, 0.0, 1.0);
  vec3 dr = reflect(dw, N);
  vec2 tr = dr.xy * NW; float trr = dot(tr, tr);
  float trapped = step(1.0, trr);                                           // TIR again at the inner glass face
  vec3 droom = trapped > 0.5 ? vec3(0.0, 0.0, 1.0) : vec3(tr, sqrt(max(1.0 - trr, 0.0)));   // world: +z into the room
  // drop: sharp, inverted outside image + internal reflection of the room (lamp glints, dark rims)
  vec2 euv = dirToEq(vec3(dout.xy, -dout.z));
  vec3 sharpC = textureGrad(uSharp, euv, dFdx(euv) * 0.55, dFdy(euv) * 0.55).rgb;
  if (uSharpMix > 0.0) sharpC = mix(sharpC, textureGrad(uSharp2, euv, dFdx(euv) * 0.55, dFdy(euv) * 0.55).rgb * uSharpGain, uSharpMix);
  vec3 inner = mix(interiorRad(P, droom), (uAmbL * 0.4 + uAmbS) * 0.12 + uSkyL * 0.25, trapped);
  float Fg = fresnel(abs(rd.z), 1.0, NG);
  vec3 wetC = sharpC * (1.0 - Fw) * (1.0 - Fg) + inner * Fw * (1.0 - Fg) * 0.92;
  // dry glass: the defocused street, blurred further by the mist of micro droplets
  vec2 off = grad * 0.004 * vec2(1.0, uRes.x / uRes.y) / max(1.0, length(grad) * 2.0);
  float blurL = M * 2.8 + Fin * 3.4;
  vec3 dryC = textureLod(uDefocus, uv + off, blurL).rgb * (1.0 - Fg) * (1.0 - Fg);
  vec3 avgC = textureLod(uDefocus, uv, 6.5).rgb;
  dryC = mix(dryC, avgC * 1.2, M * 0.42);                                  // forward scattering veil of the mist
  vec3 through = mix(dryC, wetC, wet);
  // glass reflection of the room (inner face + outer face; ghost of the lamp)
  // inner face always reflects; the outer face only where it is dry and clear; inside fog scatters both
  vec3 refl = interiorRad(P, reflect(rd, vec3(0.0, 0.0, 1.0))) * Fg * (1.0 + 0.85 * (1.0 - M) * (1.0 - wet)) * (1.0 - 0.6 * Fin);
  // inside condensation: scatters lamp & sky light (warm veil near the lamp), dims what is behind
  vec3 Lb = BULB - P; float ld2 = dot(Lb, Lb);
  vec3 Eg = uLampI * lampEmitFactor(-Lb * inversesqrt(ld2)) * max(Lb.z * inversesqrt(ld2), 0.0) / ld2 + uSkyL * 1.2 + uAmbL;
  vec3 Lhg = uHeroP - P; float hg2 = max(dot(Lhg, Lhg), 1e-4);
  Eg += uHeroI * max(Lhg.z * inversesqrt(hg2), 0.0) / hg2;          // the little light, when it comes close to the glass
  float fogA = sat(Fin * 0.85 + rim * 0.35);
  // condensation droplets: lit from the room side (lamp, room ambient) plus the light they forward-scatter from outside
  vec3 fogC = (Eg * 0.075 + uSkyL * 0.15 + avgC * 0.68) * (0.9 + 0.2 * vnoise(pm * 2.5)) * (1.0 + 0.6 * rim);
  vec3 glass = (through * (1.0 - fogA) + fogC * fogA) + refl;
  glass += Eg * 0.0025 * M * (1.0 - Fin);                                   // mist droplets lit from inside
  // grease on the inside face: round the latch where the window gets pushed open, and in arcs from old wipes;
  // it scatters a little light, so it only shows where the lamp or the bright street catches it
  vec2 lp = P.xy - vec2(0.0, 1.42);
  float smear = smoothstep(0.52, 0.82, fbm(P.xy * vec2(9.0, 14.0) + 21.0)) * (0.2 + 0.9 * exp(-dot(lp, lp) / 0.02));
  glass += (Eg * 0.004 + avgC * 0.12) * smear;
  // dust specks (≈0.6 mm), visible only once they cover a pixel or so
  vec2 dg = P.xy * 260.0, di = floor(dg); vec3 dh = hash32(di);
  float speckPx = 0.15 / max(length(fwidth(dg)), 1e-4);
  float speck = step(0.93, dh.z) * smoothstep(0.17, 0.07, length(fract(dg) - 0.25 - 0.5 * dh.xy)) * smoothstep(0.6, 1.3, speckPx);
  glass += (Eg * 0.03 + avgC * 0.3) * speck;
  float aaG = length(fwidth(P.xy));                          // world size of a pixel on the glass
  // snowflakes resting on the outside: ice crystals scatter both the street light behind and the lamp in front
  float flake = textureLod(uHeight, guv, 0.0).g * (1.0 - 0.5 * Fin);
  if (flake > 0.0) glass = mix(glass, Eg * 0.11 + avgC * 2.2 + uSkyL * 0.25, min(flake, 1.0) * 0.9);
  // 冰花：严冬里内侧玻璃从下沿和窗框边向上结出的冰晶（脊状噪声的分形「羊齿」，越往上越稀）。它散射台灯光，擦不掉。
  if (uFrost > 0.0){
    float yb = P.y < TRANSOM_Y ? P.y - (WIN_Y0 + FW) : P.y - (TRANSOM_Y + TW);
    float xe = min(min(abs(P.x - (WIN_X0 + FW)), abs(P.x + MW)), min(abs(P.x - MW), abs(P.x - (WIN_X1 - FW))));
    float edge = min(yb, xe * 1.6);
    vec2 fq = P.xy * vec2(75.0, 60.0);
    float fern = 0.0, amp = 0.5;
    for (int k = 0; k < 4; k++){ fern += amp * (1.0 - abs(2.0 * vnoise(fq) - 1.0)); fq = FBM_R * fq * 1.1 + 5.3; amp *= 0.55; }
    float corner = min(yb, xe) + 0.6 * max(yb, xe);                 // corners grow first
    float frost = smoothstep(0.62, 0.86, fern + 0.95 - min(edge * 15.0, corner * 11.0)) * uFrost * (P.y < TRANSOM_Y ? 1.0 : 0.55);
    glass = mix(glass, Eg * 0.085 + avgC * 0.9 + uSkyL * 0.12, frost * 0.8);
  }
  // autumn: wet plane-tree leaves blown against the outside of the glass; translucent with the street light behind
  for (int i = 0; i < 3; i++){
    if (uGLeaf[i].z <= 0.0) continue;
    float Rl = uGLeaf[i].z;
    vec2 q = rot2(P.xy - uGLeaf[i].xy, uGLeaf[i].w);
    if (dot(q, q) > Rl * Rl * 1.3) continue;
    vec2 c = q - vec2(0.0, Rl * 0.35);
    float rl = length(c), al = atan(c.x, c.y);
    float lobes = 0.6 + 0.4 * pow(abs(cos(al * 2.5)), 0.6) + 0.035 * sin(al * 26.0);
    float aaL = aaG * 1.2 + 0.0003;
    float blade = smoothstep(aaL, -aaL, rl - Rl * 0.62 * lobes) * step(abs(al), 2.65);
    float stem = smoothstep(0.002 + aaL, 0.0, abs(q.x)) * step(-Rl * 0.45, q.y) * step(q.y, Rl * 0.0);
    float lf = max(blade, stem);
    if (lf <= 0.0) continue;
    float vein = smoothstep(0.0025, 0.0, abs(fract(al / 1.2566 + 0.5) - 0.5) * rl) * step(rl, Rl * 0.55);
    vec3 alb = mix(vec3(0.36, 0.20, 0.04), vec3(0.22, 0.10, 0.03), smoothstep(0.4, 0.8, vnoise(q * 60.0 + float(i) * 9.0)));
    vec3 leafC = avgC * vec3(0.55, 0.36, 0.08) * (1.0 - 0.5 * vein) + Eg * alb / PI * 0.6;
    glass = mix(glass, leafC + refl * 0.5, lf);                                // wet: it keeps a sheen
  }
  // paper-cut corner flowers: red paper glowing with the street light behind it, lit warm from the front by the lamp
  float aaW = length(fwidth(P.xy)) * 0.8 + 0.0002;
  vec2 dL = vec2(P.x - (WIN_X0 + FW), (TRANSOM_Y - TW) - P.y), dR = vec2((WIN_X1 - FW) - P.x, (TRANSOM_Y - TW) - P.y);
  float tR = atan(dR.y, dR.x) / (PI * 0.5);
  float keep = smoothstep(0.02, -0.02, tR - 0.6 - 0.12 * (vnoise(dR * 260.0) - 0.5));       // the right one has lost a piece
  float pc = max(paperCut(dL, 0.112, aaW), paperCut(dR, 0.112, aaW) * keep);
  if (pc > 0.0){
    vec3 alb = mix(vec3(0.26, 0.022, 0.02), vec3(0.42, 0.12, 0.09), 0.6 * smoothstep(0.35, 0.8, fbm(P.xy * 30.0)));   // sun-faded unevenly
    float fibre = 0.82 + 0.18 * vnoise(P.xy * vec2(1400.0, 900.0)) + 0.1 * (vnoise(P.xy * 160.0) - 0.5);
    vec3 back = mix(avgC, dryC, 0.5);
    vec3 paperC = (back * vec3(0.42, 0.035, 0.03) * (0.8 + 0.4 * vnoise(P.xy * 300.0)) + Eg * alb / PI * 0.45) * fibre;
    glass = mix(glass, paperC, pc);
  }
  // yellowed tape holding them on
  float tape = max(rectSoft(rot2(dL - vec2(0.095, 0.012), 0.5), vec2(0.011, 0.0055), vec2(aaW)), rectSoft(rot2(dR - vec2(0.012, 0.09), -0.4), vec2(0.0055, 0.011), vec2(aaW)));
  glass = mix(glass, glass * vec3(0.92, 0.8, 0.52) + Eg * vec3(0.012, 0.01, 0.006), tape * 0.75);
  col += cov * glass;
  if (uDbg == 1) col = vec3(h * 0.5, length(grad) * 0.2, wet);
  if (uDbg == 2) col = N * 0.5 + 0.5;
  if (uDbg == 3) col = sharpC * 4.0;
  if (uDbg == 4) col = vec3(Fw, trapped, 0.0);
  if (uDbg == 5) col = vec3(dirToEq(vec3(dout.xy, -dout.z)), 0.0);
  if (uDbg == 6) col = wetC * 4.0;
  if (uDbg == 7) col = inner * 4.0;
  if (uDbg == 8) col = through * 4.0;
  if (uDbg == 9) col = glass * 4.0;
  if (uDbg == 10) col = vec3(any(isnan(wetC)) || any(isinf(wetC)) ? 1.0 : 0.0, any(isnan(inner)) || any(isinf(inner)) ? 1.0 : 0.0, any(isnan(sharpC)) ? 1.0 : 0.0) + vec3(0.1) * wet;
  if (uDbg == 11) col = vec3(isnan(Fw) ? 1.0 : 0.0, isinf(Fw) ? 1.0 : 0.0, wet * 0.2);
  o = vec4(col, 1.0);
}
`;

// --------------------------------------------------------------------------
// ROOM TEMPORAL UPSAMPLING (TAAU). The room is raymarched at a reduced resolution with a
// sub-pixel jitter that changes every frame (Halton 2,3 over 16 frames). Each output pixel
// takes the nearest jittered sample, weighted by how close that sample lies to the pixel,
// and blends it into a full-resolution history reprojected with the depth. Because the room
// is static and the camera only drifts, the history converges to a supersampled image at the
// full output resolution: fine detail survives even when the raymarch runs at half resolution.
// The history is clamped to the current 3×3 neighbourhood, so lighting changes (the lamp) and
// the moving steam do not ghost; it is resampled with Catmull-Rom so it does not soften.
// --------------------------------------------------------------------------
const FS_TAA = () => GLSL_HEAD() + `
uniform sampler2D uCur, uDepth, uHist;
uniform vec2 uRes, uLowRes, uJitter;
uniform vec3 uCamPos, uCamFwd, uCamRight, uCamUp; uniform vec2 uTan;
uniform vec3 uPPos, uPFwd, uPRight, uPUp; uniform vec2 uPTan;
uniform float uReset;
out vec4 o;
vec4 histCR(vec2 uv){
  vec2 sp = uv * uRes, t1 = floor(sp - 0.5) + 0.5, f = sp - t1;
  vec2 w0 = f * (-0.5 + f * (1.0 - 0.5 * f)), w1 = 1.0 + f * f * (-2.5 + 1.5 * f);
  vec2 w2 = f * (0.5 + f * (2.0 - 1.5 * f)), w3 = f * f * (-0.5 + 0.5 * f);
  vec2 w12 = w1 + w2;
  vec2 t0 = (t1 - 1.0) / uRes, t3 = (t1 + 2.0) / uRes, t12 = (t1 + w2 / w12) / uRes;
  vec4 r = texture(uHist, vec2(t12.x, t0.y)) * (w12.x * w0.y) + texture(uHist, vec2(t0.x, t12.y)) * (w0.x * w12.y)
         + texture(uHist, t12) * (w12.x * w12.y) + texture(uHist, vec2(t3.x, t12.y)) * (w3.x * w12.y)
         + texture(uHist, vec2(t12.x, t3.y)) * (w12.x * w3.y);
  return max(r / (w12.x * w0.y + w0.x * w12.y + w12.x * w12.y + w3.x * w12.y + w12.x * w3.y), 0.0);
}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 lt = 1.0 / uLowRes;
  // low-res sample k was taken at screen position (k + 0.5 + jitter) / lowRes
  vec2 lp = uv * uLowRes - 0.5 - uJitter;
  vec2 k = floor(lp + 0.5), dk = lp - k;
  vec2 suv = (k + 0.5) * lt;
  vec4 cur = texture(uCur, suv);
  float w = exp(-dot(dk, dk) * 3.0);                       // 1 on the sample, ~0.5 half a low-res pixel away
  vec4 mn = cur, mx = cur;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
    vec4 c = texture(uCur, suv + vec2(float(i), float(j)) * lt);
    mn = min(mn, c); mx = max(mx, c);
  }
  vec4 curB = texture(uCur, uv - uJitter * lt);               // bilinear at the true position (used on a reset)
  vec2 ndc = uv * 2.0 - 1.0;
  vec3 rd = normalize(uCamFwd + ndc.x * uTan.x * uCamRight + ndc.y * uTan.y * uCamUp);
  float z = texture(uDepth, suv).r;
  vec3 P = uCamPos + rd * (z / max(dot(rd, uCamFwd), 1e-3));
  vec3 d = P - uPPos; float pz = dot(d, uPFwd);
  vec2 puv = vec2(dot(d, uPRight) / pz / uPTan.x, dot(d, uPUp) / pz / uPTan.y) * 0.5 + 0.5;
  bool off = max(abs(puv.x - 0.5), abs(puv.y - 0.5)) > 0.5;
  if (uReset > 0.5 || off){ o = curB; return; }
  vec4 hist = clamp(histCR(puv), mn, mx);
  o = mix(hist, cur, 0.03 + 0.14 * w);
}`;

// --------------------------------------------------------------------------
// ROOM DEPTH OF FIELD: thin-lens circle of confusion, focus on the glass.
//   CoC(z) = A · |1/z − 1/z_f|  (angular radius, A = aperture radius)
// Golden-angle gather; a sample farther than the centre only counts if its own
// blur reaches us (keeps sharp foreground edges from being smeared by background).
// --------------------------------------------------------------------------
const FS_DOF = () => GLSL_HEAD() + `
uniform sampler2D uRoom, uDepth;
uniform vec2 uRes;
uniform float uFocus, uAperture, uPxPerRad;
out vec4 o;
float cocPx(float z){ return min(uAperture * abs(1.0 / max(z, 0.05) - 1.0 / uFocus) * uPxPerRad, 22.0); }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec4 c0 = texture(uRoom, uv);
  float z0 = texture(uDepth, uv).r;
  float coc = cocPx(z0);
  if (coc < 0.75){ o = c0; return; }
  vec4 acc = c0; float ws = 1.0;
  float rot = hash12(gl_FragCoord.xy) * 6.2832;
  for (int i = 0; i < 24; i++){
    float fi = float(i) + 0.5;
    float r = sqrt(fi / 24.0) * coc;
    float a = fi * 2.39996 + rot;
    vec2 q = uv + vec2(cos(a), sin(a)) * r / uRes;
    vec4 cs = texture(uRoom, q);
    float zs = texture(uDepth, q).r;
    float w = zs < z0 + 0.01 ? 1.0 : sat(cocPx(zs) - r + 1.0);
    acc += cs * w; ws += w;
  }
  o = acc / ws;
}`;

// --------------------------------------------------------------------------
// BLOOM: no threshold — a small, energy-conserving fraction of the light is
// scattered by the lens (13-tap downsample chain + tent upsample, Jimenez 2014).
// --------------------------------------------------------------------------
const FS_DOWN = () => GLSL_HEAD() + `
uniform sampler2D uSrc; uniform vec2 uTexel; uniform vec2 uRes; uniform int uFirst;
out vec4 o;
vec3 T(vec2 uv, float x, float y){ return texture(uSrc, uv + vec2(x, y) * uTexel).rgb; }
vec3 karis(vec3 a, vec3 b, vec3 c, vec3 d){
  // Karis average on the first level suppresses single-pixel fireflies (glints in drops)
  float wa = 1.0 / (1.0 + dot(a, vec3(0.2126, 0.7152, 0.0722))), wb = 1.0 / (1.0 + dot(b, vec3(0.2126, 0.7152, 0.0722)));
  float wc = 1.0 / (1.0 + dot(c, vec3(0.2126, 0.7152, 0.0722))), wd = 1.0 / (1.0 + dot(d, vec3(0.2126, 0.7152, 0.0722)));
  return (a * wa + b * wb + c * wc + d * wd) / (wa + wb + wc + wd);
}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 a = T(uv,-2.,-2.), b = T(uv,0.,-2.), c = T(uv,2.,-2.), d = T(uv,-1.,-1.), e = T(uv,1.,-1.), f = T(uv,-2.,0.), g = T(uv,0.,0.);
  vec3 h = T(uv,2.,0.), i = T(uv,-1.,1.), j = T(uv,1.,1.), k = T(uv,-2.,2.), l = T(uv,0.,2.), m = T(uv,2.,2.);
  vec3 col;
  if (uFirst == 1) col = karis(d, e, i, j) * 0.5 + karis(a, b, f, g) * 0.125 + karis(b, c, g, h) * 0.125 + karis(f, g, k, l) * 0.125 + karis(g, h, l, m) * 0.125;
  else col = (d + e + i + j) * 0.125 + (a + b + f + g + b + c + g + h + f + g + k + l + g + h + l + m) * 0.03125;
  o = vec4(col, 1.0);
}`;
const FS_UP = () => GLSL_HEAD() + `
uniform sampler2D uSrc; uniform vec2 uTexel; uniform vec2 uRes; uniform float uRadius;
out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes; vec2 d = uTexel * uRadius;
  vec3 c = texture(uSrc, uv).rgb * 4.0;
  c += (texture(uSrc, uv + vec2(-d.x, 0.0)).rgb + texture(uSrc, uv + vec2(d.x, 0.0)).rgb + texture(uSrc, uv + vec2(0.0, -d.y)).rgb + texture(uSrc, uv + vec2(0.0, d.y)).rgb) * 2.0;
  c += texture(uSrc, uv - d).rgb + texture(uSrc, uv + d).rgb + texture(uSrc, uv + vec2(d.x, -d.y)).rgb + texture(uSrc, uv + vec2(-d.x, d.y)).rgb;
  o = vec4(c / 16.0, 1.0);
}`;

// --------------------------------------------------------------------------
// FINAL: lens (CA, bloom, vignette) → exposure → ACES → grade → sRGB → grain, dither
// --------------------------------------------------------------------------
const FS_FINAL = () => GLSL_HEAD() + `
uniform sampler2D uHdr, uBloom;
uniform vec2 uRes, uTan;

   真实物理（量纲为 mm、s、N）：
   · 水滴是球冠：V = π R³ (1−cosθ)² (2+cosθ) / 3，R = r / sinθ（r 接触半径，θ 接触角）。

    const cr = i => 0.5 * ((2 * p1[i]) + (-p0[i] + p2[i]) * u + (2 * p0[i] - 5 * p1[i] + 4 * p2[i] - p3[i]) * u2 + (-p0[i] + 3 * p1[i] - 3 * p2[i] + p3[i]) * u3);
    // an arc: it does not travel in straight lines, it bobs up a little on the way
    const lift = Math.sin(Math.PI * u) * Math.min(0.06, 0.25 * Math.hypot(p2[0] - p1[0], p2[2] - p1[2]));
    return [cr(0), cr(1) + lift, cr(2)];
  },
  hover(p, tt, k) {
    const a = tt * 1.7 + k * 1.3, r = 0.012 * smooth(0, 0.8, tt);
    return [p[0] + Math.sin(a) * r, p[1] + Math.sin(a * 2.0) * r * 0.5, p[2] + Math.cos(a) * r * 0.6];
  },
  update(dt, realT) {
    const HERO = YL.HERO;
    if (!HERO.on) return;
    H.t += dt;
    let p = H.sample(H.t);
    // floating in the air: a slow, small, three-axis drift
    const f = YL.DBG.still ? 0 : 1;
    p = V.add(p, [0.004 * f * YL.drift(realT * 0.9, 11), 0.005 * f * YL.drift(realT * 0.8, 12), 0.004 * f * YL.drift(realT * 0.7, 13)]);
    // curiosity and fright: the pointer's line of sight
    const P = YL.ptr, CAM = YL.CAM;
    let leanT = [0, 0, 0];
    if (P && YL.now() - P.t < 1.5 && !YL.DBG.shot) {
      const rd = YL.camRay(P.nx, P.ny), oc = V.sub(p, CAM.pos), tc = V.dot(oc, rd);
      const q = V.add(CAM.pos, V.mul(rd, tc)), d = V.sub(q, p), dl = Math.hypot(...d);
      if (P.speed > 3.5 && dl < 0.3) H.scare = 1;                         // flung past it: it flinches
      else if (dl < 0.35) leanT = V.mul(d, 0.35 * smooth(0.35, 0.05, dl));   // drawn towards it
    }
    H.scare = Math.max(0, H.scare - dt * 0.8);
    if (H.scare > 0 && P) leanT = V.add(leanT, V.mul(V.norm(V.sub(p, CAM.pos)), 0.05 * H.scare));
    H.lean = H.lean.map((v, i) => v + (leanT[i] - v) * (1 - Math.exp(-dt * 2.5)));
    HERO.p = V.add(p, H.lean);
    // brightness: the breathing never changes (its signature); fright dims it
    const target = (H.glowTarget ?? 1) * (1 - 0.55 * H.scare);
    HERO.glow += (target - HERO.glow) * (1 - Math.exp(-dt * (target > HERO.glow ? 2.5 : 6)));
  },
};
})();

<script>
/* ---- src/worlds/summer.js ---- */
/* ============================================================================
   世界二 · 盛夏午后 —— 手绘动画背景的画风
   ----------------------------------------------------------------------------
   色彩脚本：
     天：头顶是浓的天青（几乎发紫），往地平线褪成被暑气蒸白的浅青。
     云：一座高高的积雨云塔（入道云）和几朵晴天积云。受光面是带一点暖的纯白，背光面是冷的蓝灰，
         明暗交界是一条清楚的硬边（手绘动画的赛璐璐光影），边缘有薄处透光的亮边。
     山：两三层蓝紫色的远山，越远越淡（空气透视），向阳的山脊亮一点。
     地：一道起伏的绿坡，坡顶一棵孤零零的樟树；近处是齐腰的草，风吹过时一路倒伏，露出发亮的草背。
     光：太阳在左上方，下午三点左右的高光。
   做法：
     背景（天、云、山、坡、远处的草地）是一个全屏片元着色器，按视线方向画，每一层有自己的视差；
     近处的草是真的几何：两万多片草叶，实例化绘制，被风场吹弯，两三阶的赛璐璐明暗；4× MSAA。
     风场 = 持续的风 + 一阵阵的阵风波 + 光标划过的轨迹（光标就是风）。
   ========================================================================== */
(() => {
'use strict';
const YL = window.YL;
const W = (YL.worlds = YL.worlds || {});

const TOWER = [-0.30, 0.36];        // the great cumulus: azimuth, and the elevation the light flies up into
const SUN = (() => { const az = -0.75, el = 0.62; return [Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)]; })();

const HEAD = `#version 300 es
precision highp float;
precision highp int;
#define PI 3.14159265359
float sat(float x){ return clamp(x, 0.0, 1.0); }
float hash11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y); }
const mat2 FR = mat2(1.6, 1.2, -1.2, 1.6);
float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = FR * p + vec2(3.1, 1.7); a *= 0.5; } return s; }
float fbm3(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 3; i++){ s += a * vnoise(p); p = FR * p + vec2(3.1, 1.7); a *= 0.5; } return s / 0.875; }
`;

// --------------------------------------------------------------------------- background: sky, clouds, hills, field
const FS_BG = HEAD + `
uniform vec2 uRes;
uniform vec3 uFwd, uRight, uUp;
uniform vec2 uTan;
uniform float uTime;
uniform vec3 uSun;
uniform vec4 uLobes[112];     // billows: x = azimuth (rad), y = elevation (rad), z = radius (rad), w = depth (painting order)
uniform vec4 uClouds[6];      // per cloud: x = base elevation, y = distance (0 near … 1 far), z = first billow, w = seed (<0: none)
uniform vec4 uCBox[6];        // per cloud: bounds (az min, az max, el min, el max)
uniform int uCCount[6];       // per cloud: number of billows
uniform vec2 uWind;           // ground-plane wind (m/s, x and z)
uniform float uGust;          // phase of the travelling gust bands
uniform int uMode;            // 0: the camera's view; 1: an equirect panorama seen from the room's window (for its drops)
uniform vec3 uEq;             // (azimuth range, elevation min, elevation max) of that panorama
out vec4 o;

// ---- the painter's colours (display-referred)
const vec3 SKY_Z = vec3(0.10, 0.30, 0.78);
const vec3 SKY_M = vec3(0.26, 0.55, 0.92);
const vec3 SKY_H = vec3(0.72, 0.87, 0.95);
const vec3 CL_LIT = vec3(1.00, 0.99, 0.96);
const vec3 CL_MID = vec3(0.85, 0.89, 0.97);
const vec3 CL_SHD = vec3(0.60, 0.67, 0.84);
const vec3 CL_DEEP = vec3(0.46, 0.53, 0.73);

vec3 skyCol(float el, float az){
  float t = sat(el / 0.85);
  vec3 c = mix(SKY_H, SKY_M, smoothstep(0.0, 0.32, t));
  c = mix(c, SKY_Z, smoothstep(0.3, 1.0, t));
  vec2 sa = vec2(atan(uSun.x, -uSun.z), asin(uSun.y));
  float dsun = length(vec2((az - sa.x) * cos(el), el - sa.y));
  c += vec3(0.18, 0.16, 0.10) * exp(-dsun * 2.0) * 0.6;           // the sun's side of the sky, brighter and warmer
  c = mix(c, vec3(0.86, 0.93, 0.95), exp(-max(el, 0.0) * 25.0) * 0.6);   // heat haze along the horizon
  return c;
}

// A cumulus as a background painter paints it: one big light falls across the whole mass (lit on the left,
// blue shadow on the right, a crisp terminator wobbling like a brush), and the billows are relief on that
// surface: their caps catch the light, the creases between them sink into shadow.
//   silhouette: a tight smooth union of the billows;  relief: a soft-max height field of their spherical caps.
vec4 cloud(vec2 q, vec2 qw, int i0, int n, vec4 C, vec4 B, float aa){
  vec3 Ls = normalize(vec3(uSun.x * 1.7, uSun.y, 0.5));
  const float K = 0.005, KH = 140.0;
  float acc = 0.0, hs = 0.0, hmax = 0.0; vec2 gs = vec2(0.0);
  for (int i = i0; i < i0 + n; i++){
    vec4 L = uLobes[i];
    vec2 d = qw - L.xy; float len = length(d);
    float ang = atan(d.y, d.x);
    float lump = 1.0 + 0.09 * (vnoise(vec2(ang * 2.2 + L.w * 40.0, L.w * 9.0)) - 0.5);
    acc += exp(-(len - L.z * lump) / K);
    float r = L.z * lump;
    if (len < r){
      float hc = sqrt(r * r - len * len) + L.w * 0.004;
      float e = exp(KH * (hc - 0.08));
      hs += e; gs += e * (-d / max(hc, 2e-3)); hmax = max(hmax, hc);
    }
  }
  float d = -K * log(max(acc, 1e-30));
  // a solid core inside the silhouette (the billows make the outline; the body never shows sky through it)
  float xc0 = 0.5 * (B.x + B.y), hw0 = 0.5 * (B.y - B.x) - 0.04;
  vec2 ca = vec2(xc0, C.x + 0.02), cb = vec2(xc0, max(B.w - hw0 * 0.9, C.x + 0.03));
  vec2 pa = qw - ca, ba = cb - ca;
  float core = length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)) - hw0 * 0.5;
  d = min(d, core);
  d = max(d, C.x - qw.y);                                           // the flat base
  float alpha = smoothstep(aa, -aa, d);
  if (alpha <= 0.0) return vec4(0.0);
  vec2 grad = hs > 0.0 ? gs / hs : vec2(0.0);
  float hsoft = hs > 0.0 ? log(hs) / KH + 0.08 : 0.0;
  float crease = sat((hsoft - hmax) * KH / 0.69);                  // 1 where two billows meet
  // the mass: a rounded column (horizontal bulge from the centre line, a domed top)
  float xc = 0.5 * (B.x + B.y), hw = 0.5 * (B.y - B.x) - 0.03;
  vec3 Nm = normalize(vec3((qw.x - xc) / max(hw, 0.02) * 0.95, 0.15 + 0.9 * smoothstep(B.w - 0.16, B.w - 0.02, qw.y), 0.6));
  vec3 Nb = normalize(vec3(-grad * 0.8, 1.0));                    // height field normal: (−∇h, 1)
  vec3 N = normalize(Nm + vec3(Nb.xy * 0.9, 0.0));
  float wob = (vnoise(qw * 45.0 + C.w * 3.0) - 0.5) * 0.08 + (vnoise(qw * 200.0) - 0.5) * 0.04;
  float lam = dot(N, Ls) + wob;
  // four painted tones: a white highlight on the billow caps, warm-white light, a pale blue half-tone, blue shadow
  float hi = smoothstep(0.62, 0.66, lam), lit = smoothstep(0.24, 0.29, lam), mid = smoothstep(-0.10, -0.05, lam);
  vec3 c = mix(CL_SHD, mix(CL_MID, CL_LIT * vec3(0.985, 0.98, 0.965), lit), mid);
  c = mix(c, vec3(1.0, 1.0, 0.99), hi * 0.9);
  // on the sunlit side the billows still show: their undersides turned from the sun take a lilac half-tone
  float away = smoothstep(0.05, -0.25, dot(Nb.xy, normalize(Ls.xy)) * length(Nb.xy) * 2.0);
  c = mix(c, mix(CL_MID, CL_SHD, 0.25), away * lit * 0.55);
  c = mix(c, CL_DEEP, smoothstep(-0.38, -0.55, lam) * 0.6);
  // creases: a soft seam where the billows meet, mostly in the shade
  c = mix(c, c * vec3(0.84, 0.87, 0.95), crease * (1.0 - lit) * 0.7);
  // the lower body is shaded by the mass above; ground light warms the very bottom
  float h = (qw.y - C.x) / max(B.w - C.x, 0.05);
  c = mix(c, c * vec3(0.84, 0.87, 0.95), smoothstep(0.3, 0.0, h) * 0.55);
  c += vec3(0.05, 0.045, 0.0) * smoothstep(0.08, 0.0, h) * (1.0 - lit);
  // a thin rim of light along the sunward silhouette, where the cloud is thinnest
  c += vec3(0.06, 0.06, 0.04) * smoothstep(-0.005, 0.0, d) * sat(dot(normalize(vec2(qw.x - xc, 0.3)), normalize(Ls.xy)) * 2.0);
  c *= 0.975 + 0.04 * vnoise(qw * vec2(240.0, 100.0) + C.w);     // brush texture
  c = mix(c, mix(SKY_H, SKY_M, 0.35), C.y * 0.5);                // aerial perspective
  return vec4(c, alpha);
}

float ridge(float x, float seed){ float h = 0.0, a = 0.5, f = 1.0; for (int i = 0; i < 5; i++){ h += a * (1.0 - abs(2.0 * vnoise(vec2(x * f + seed, seed)) - 1.0)); f *= 2.1; a *= 0.5; } return h; }

void main(){
  vec2 uv = gl_FragCoord.xy / uRes, ndc = uv * 2.0 - 1.0;
  vec3 rd = normalize(uFwd + ndc.x * uTan.x * uRight + ndc.y * uTan.y * uUp);
  if (uMode == 1){ float a = ndc.x * uEq.x, e = mix(uEq.y, uEq.z, uv.y); rd = vec3(sin(a) * cos(e), sin(e), -cos(a) * cos(e)); }
  float az = atan(rd.x, -rd.z), el = asin(clamp(rd.y, -1.0, 1.0));
  vec3 col = skyCol(el, az);
  float aaE = max(fwidth(el), 1e-4) * 1.2;                         // (derivatives taken here, in uniform control flow)
  // ---- clouds, far to near; each only inside its own bounds
  if (el > 0.0){
    vec2 q0 = vec2(az, el);
    vec2 rag = (vec2(fbm3(q0 * 34.0), fbm3(q0 * 34.0 + 7.0)) - 0.5) * 0.008 + (vec2(vnoise(q0 * 150.0), vnoise(q0 * 150.0 + 3.0)) - 0.5) * 0.002;
    for (int ci = 0; ci < 6; ci++){
      vec4 C = uClouds[ci];
      if (C.w < 0.0) continue;
      vec2 q = vec2(az + uTime * 0.0012 * (1.0 - C.y * 0.6), el);
      vec4 B = uCBox[ci];
      if (q.x < B.x || q.x > B.y || q.y < B.z || q.y > B.w) continue;
      vec4 cl = cloud(q, q + rag, int(C.z), uCCount[ci], C, B, aaE);
      col = mix(col, cl.rgb, cl.a);
    }
  }
  // ---- three mountain ranges: the farthest palest and highest, nearer ones darker and lower
  for (int m = 0; m < 3; m++){
    float fm = float(m);
    float fq = 1.3 + fm * 1.1;
    float rg = ridge(az * fq + 2.0 + fm, 11.0 + fm * 7.0);
    float h = 0.006 + (0.075 - 0.02 * fm) * rg * rg - 0.004 * fm;
    float inside = smoothstep(aaE, -aaE, el - h);
    if (inside > 0.0){
      vec3 c = mix(vec3(0.58, 0.66, 0.90), vec3(0.34, 0.44, 0.74), fm / 2.0);
      float slope = (ridge(az * fq + 2.0 + fm - 0.003, 11.0 + fm * 7.0) - ridge(az * fq + 2.0 + fm + 0.003, 11.0 + fm * 7.0)) * rg * 2.0;
      c *= 1.0 + 0.22 * smoothstep(0.0, 0.015, slope);                 // slopes turned to the sun (left)
      c = mix(c, SKY_H, exp(-max(h - el, 0.0) * 50.0) * (0.35 - fm * 0.08));   // haze pooled at their feet
      col = mix(col, c, inside);
    }
  }
  // ---- the near hill: a long green rise with a lone camphor tree on its crest
  float hill = 0.004 + 0.020 * smoothstep(-1.0, 0.3, az) * smoothstep(1.2, 0.3, az) + 0.003 * sin(az * 6.0 + 1.0) + 0.002 * fbm3(vec2(az * 9.0, 1.0));
  float onHill = smoothstep(aaE, -aaE, el - hill);
  if (onHill > 0.0){
    float below = hill - el;
    vec3 g = mix(vec3(0.58, 0.76, 0.28), vec3(0.32, 0.56, 0.22), smoothstep(0.0, 0.04, below));
    g *= 0.94 + 0.07 * sin(az * 140.0 + below * 380.0 + vnoise(vec2(az * 30.0, below * 80.0)) * 3.0);
    col = mix(col, mix(g, SKY_H, 0.12), onHill);
  }
  {
    // the tree: a dark trunk, a crown of round clumps lit from the left; its shadow pools on the slope to the right
    vec2 tq = vec2(az - 0.26, el - 0.021);
    float trunk = max(abs(tq.x + 0.06 * tq.y) - 0.0018 * (1.0 + smoothstep(0.0, -0.012, tq.y)), max(tq.y - 0.03, -tq.y - 0.006));
    float crown = 1e9; vec3 cn = vec3(0.0); float cw = 0.0;
    for (int i = 0; i < 14; i++){
      float fi = float(i);
      float ang = fi * 2.4, rad = sqrt(hash11(fi * 3.1));
      vec2 c = vec2(cos(ang) * rad * 0.030, 0.045 + sin(ang) * rad * 0.018 + 0.004 * hash11(fi * 7.7));
      float r = 0.010 + 0.007 * hash11(fi * 1.9);
      vec2 dd = tq - c; float l = length(dd);
      crown = min(crown, l - r);
      float w = exp(-max(l - r, 0.0) * 500.0);
      cn += w * vec3(dd / r, sqrt(max(1.0 - (l / r) * (l / r), 0.0))); cw += w;
    }
    crown += (fbm3(tq * 700.0) - 0.5) * 0.004;
    float tr = smoothstep(aaE, -aaE, min(trunk, crown));
    // its shadow on the grass
    float shd = smoothstep(0.004, -0.002, length((tq - vec2(0.022, -0.0035)) * vec2(1.0, 6.0)) - 0.03) * onHill;
    col = mix(col, col * vec3(0.55, 0.68, 0.72), shd * 0.7);
    if (tr > 0.0){
      vec3 N = normalize(cn / max(cw, 1e-6));
      float lam = dot(N, normalize(vec3(uSun.x * 1.7, uSun.y, 0.5))) + (vnoise(tq * 1200.0) - 0.5) * 0.25;
      vec3 c = mix(vec3(0.10, 0.27, 0.24), vec3(0.27, 0.50, 0.20), smoothstep(-0.05, 0.05, lam));
      c = mix(c, vec3(0.55, 0.74, 0.27), smoothstep(0.45, 0.55, lam));
      c = trunk < crown ? vec3(0.17, 0.14, 0.13) : c;
      col = mix(col, mix(c, SKY_H, 0.08), tr);
    }
  }
  // ---- the field between the hill and the near grass, with gust bands running over it and cloud shadows
  if (el < hill){
    float tg = 0.85 / max(-rd.y, 0.003);
    vec2 gp = vec2(rd.x, rd.z) * tg;
    vec3 g = vec3(0.30, 0.55, 0.19);
    vec2 wd = normalize(uWind + 1e-4);
    float band = dot(gp, wd) * 0.12 - uGust;
    float wave = smoothstep(0.55, 1.0, sin(band + 1.5 * fbm3(gp * 0.05)) * 0.5 + 0.5) * (0.6 + 0.4 * fbm3(gp * 0.08 + uGust * 0.3));
    g = mix(g, vec3(0.64, 0.80, 0.38), wave * 0.65);
    g *= 0.86 + 0.18 * fbm3(gp * vec2(0.25, 0.4));
    g *= 1.0 - 0.28 * smoothstep(0.5, 0.58, fbm3(gp * 0.006 + vec2(uTime * 0.004, 0.0)));   // cloud shadows drifting over
    g = mix(g, SKY_H * 0.96, sat(tg / 700.0) * 0.5);
    col = mix(col, g, (el < 0.0 ? 1.0 : 0.0) * (1.0 - onHill * step(0.0, el)));
    if (el < 0.0 && onHill > 0.0 && tg > 300.0) col = mix(col, g, 0.0);
  }
  col *= 0.985 + 0.03 * hash12(floor(gl_FragCoord.xy * 0.5));     // the paper's tooth
  o = vec4(col, 1.0);
}`;

// --------------------------------------------------------------------------- near grass: instanced blades
const VS_GRASS = HEAD + `
layout(location = 0) in vec4 aB;     // x, z (m), height (m), width (m)
layout(location = 1) in vec4 aC;     // phase, stiffness, colour variation, lean angle
uniform vec3 uEye, uFwd, uRight, uUp;
uniform vec2 uTan;
uniform float uTime;
uniform vec2 uWind;
uniform float uGust;
uniform vec4 uStroke[8];             // the pointer as wind: recent stroke points on the ground (x, z, strength, age)
out vec3 vC; out float vT; out float vSide; out float vDepth; out float vShadow; out vec3 vWP;
// wind at a point of the field: the steady wind, travelling gust bands, and the pointer's stroke
vec2 windAt(vec2 p, float t){
  vec2 wd = normalize(uWind + 1e-4);
  float band = dot(p, wd) * 0.12 - uGust;
  float gust = smoothstep(0.3, 1.0, sin(band + 1.5 * fbm3(p * 0.05)) * 0.5 + 0.5);
  vec2 w = uWind * (0.35 + 0.9 * gust) + wd * 0.25 * sin(t * 1.7 + p.x * 0.9 + p.y * 0.7);
  for (int i = 0; i < 8; i++){
    vec4 s = uStroke[i];
    if (s.z <= 0.0) continue;
    vec2 d = p - s.xy; float r2 = dot(d, d);
    w += normalize(d + 1e-4) * s.z * exp(-r2 / 2.0) * exp(-s.w * 1.2) * 3.0;
  }
  return w;
}
void main(){
  int vid = gl_VertexID;                               // 7 vertices: 3 segments + tip, as a strip
  float seg = float(vid / 2) / 3.0;
  float side = (vid == 6) ? 0.0 : (float(vid & 1) * 2.0 - 1.0);
  float h = aB.z, wdt = aB.w;
  vec2 base = aB.xy;
  vec2 wv = windAt(base, uTime + aC.x);
  float bend = length(wv) / (1.0 + aC.y);
  // the blade's own lean, then the wind bends it more toward the tip (quadratic)
  vec2 dir = vec2(cos(aC.w), sin(aC.w)) * 0.22 + wv / (1.0 + aC.y) * 0.34;
  float s = seg * seg;
  vec3 p = vec3(base.x, 0.0, base.y);

  // where a point on the screen is, at a given distance in this world (to hand the light over at the same spot)
  project(p, aspect) {
    const cam = this.camera(aspect, this.t, YL.DBG.still), V = YL.V, v = V.sub(p, cam.eye), z = V.dot(v, cam.fwd);
    return [V.dot(v, cam.right) / (z * cam.tan[0]), V.dot(v, cam.up) / (z * cam.tan[1])];
  },
  unproject(nx, ny, dist, aspect) {
    const cam = this.camera(aspect, this.t, YL.DBG.still), V = YL.V;
    const rd = V.norm(V.add(cam.fwd, V.add(V.mul(cam.right, nx * cam.tan[0]), V.mul(cam.up, ny * cam.tan[1]))));
    return V.add(cam.eye, V.mul(rd, dist));
  },
  render(target, aspect) {
    const gl = YL.gl;
    const w = target ? target.w : gl.drawingBufferWidth, h = target ? target.h : gl.drawingBufferHeight;
    this.targets(w, h);
    const cam = this.cam = this.camera(aspect, this.t, YL.DBG.still);
    const U = YL.U;
    // 1) background into the multisampled buffer
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.msFb); gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 1); gl.clearDepth(1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(this.pBg.p);
    U(this.pBg, 'uRes', [w, h]); U(this.pBg, 'uFwd', cam.fwd); U(this.pBg, 'uRight', cam.right); U(this.pBg, 'uUp', cam.up); U(this.pBg, 'uTan', cam.tan);
    const wk = 1 - 0.85 * (this.calm || 0), wind = [1.6 * wk, -0.6 * wk];
    U(this.pBg, 'uTime', this.t); U(this.pBg, 'uSun', SUN); U(this.pBg, 'uWind', wind); U(this.pBg, 'uGust', this.gust); U(this.pBg, 'uMode', YL.I(0));
    gl.uniform4fv(this.pBg.u.uLobes, new Float32Array(this.cl.lobes.flat().concat(new Array((112 - this.cl.lobes.length) * 4).fill(0))));
    gl.uniform4fv(this.pBg.u.uClouds, new Float32Array(this.cl.clouds.flat()));
    gl.uniform4fv(this.pBg.u.uCBox, new Float32Array(this.cl.boxes.flat()));
    gl.uniform1iv(this.pBg.u.uCCount, new Int32Array(this.cl.counts));
    gl.bindVertexArray(this.empty); gl.drawArrays(gl.TRIANGLES, 0, 3);
    // 2) the grass, depth-tested against itself
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);
    gl.useProgram(this.pGrass.p);
    U(this.pGrass, 'uEye', cam.eye); U(this.pGrass, 'uFwd', cam.fwd); U(this.pGrass, 'uRight', cam.right); U(this.pGrass, 'uUp', cam.up); U(this.pGrass, 'uTan', cam.tan);
    U(this.pGrass, 'uTime', this.t); U(this.pGrass, 'uWind', wind); U(this.pGrass, 'uGust', this.gust); U(this.pGrass, 'uSun', SUN);
    const H = this.hero, hp = [H.p[0], H.p[1] + (H.bob || 0), H.p[2]];
    U(this.pGrass, 'uHP', hp); U(this.pGrass, 'uHOn', H.on ? 1 : 0);
    const st = new Float32Array(32); this.strokes.forEach((s, i) => st.set([s.x, s.z, s.s, s.age], i * 4));
    gl.uniform4fv(this.pGrass.u.uStroke, st);
    gl.bindVertexArray(this.vao); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 7, this.nGrass);
    // the little light, in front of what is behind it and behind the blades in front of it
    if (H.on) {
      gl.useProgram(this.pHero.p);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.depthMask(false);
      U(this.pHero, 'uRes', [w, h]); U(this.pHero, 'uEye', cam.eye); U(this.pHero, 'uFwd', cam.fwd); U(this.pHero, 'uRight', cam.right); U(this.pHero, 'uUp', cam.up); U(this.pHero, 'uTan', cam.tan);
      const br = 1 + 0.07 * Math.sin(this.t * 2.1) + 0.03 * Math.sin(this.t * 5.3);     // the same breathing as in the room
      const far = Math.hypot(hp[0] - cam.eye[0], hp[1] - cam.eye[1], hp[2] - cam.eye[2]);      // carried far off, it shrinks more slowly than it should, so the eye can follow it
      U(this.pHero, 'uHP', hp); U(this.pHero, 'uHR', 0.018 * Math.pow(Math.max(1, far / 2.4), 0.7)); U(this.pHero, 'uTime', this.t); U(this.pHero, 'uBreath', br); U(this.pHero, 'uOn', 1);
      gl.bindVertexArray(this.empty); gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.disable(gl.BLEND); gl.depthMask(true);
    }
    gl.disable(gl.DEPTH_TEST);
    // 3) resolve, then onto the screen (or the target)
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, this.msFb); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, this.res.fb);
    gl.blitFramebuffer(0, 0, w, h, 0, 0, w, h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null); gl.viewport(0, 0, w, h);
    gl.useProgram(this.pRes.p); U(this.pRes, 'uRes', [w, h]); U(this.pRes, 'uFade', this.fade);
    YL.bindTex(this.pRes, 'uSrc', this.res.tex, 0);
    gl.bindVertexArray(this.empty); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
  },
};
})();

</script>
<script>
/* ---- src/worlds/woodcut.js ---- */
/* ============================================================================
   世界三 · 雪夜 —— 套色木刻
   ----------------------------------------------------------------------------
   一张三块版套印的木刻：墨版（黑）、靛版（夜里雪的阴影、冰、天）、朱版（灯笼、窗光、春联）。
   · 墨版上的白线是「刻掉」的：线顺着形体走（天是横的，山是顺坡往下的，雪堆是顺着雪棱的），
     暗处刀口窄而疏，亮处刀口宽而密；每一刀有起刀收刀（两头尖），有手刻的不匀。
     亮的地方反过来：纸上留下的是细黑线。
   · 靛版是「擦」出来的渐变（ぼかし），没有喷枪式的软斑；边缘处墨会积一点。
   · 两遍渲染：先把三块版的覆盖量画进一张图（场景），再「印」：三块版各自错一点位，叠在纸上，
     加纸的纤维、黑版的木纹、靛版的马连（baren）擦痕、没吃上墨的飞白。
   · 整张画以每秒 8 次的节奏「重印」：线条和墨色每一印都有一点点不同，像逐张印出来的定格动画。
   画面（从远到近）：落雪的夜空；雪峰；黑松坡下一排粉墙人家（亮着两三扇窗，一家贴着春联，烟囱冒烟）；
   左边一棵挂雪的老树；结冰的河，河心一个冰窟窿，一串脚印从岸上走过去；近岸雪坡、枯苇、一根挂着灯笼的木杆。
   ========================================================================== */
(() => {
'use strict';
const YL = window.YL;
const W = (YL.worlds = YL.worlds || {});

const HEAD = `#version 300 es
precision highp float;
#define PI 3.14159265359
float sat(float x){ return clamp(x, 0.0, 1.0); }
float hash11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y); }
const mat2 FR = mat2(1.6, 1.2, -1.2, 1.6);
float fbm3(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 3; i++){ s += a * vnoise(p); p = FR * p + vec2(3.1, 1.7); a *= 0.5; } return s / 0.875; }
uniform vec2 uRes;
uniform vec3 uView;          // the print point at the screen's centre (x, y), and print units per screen height
vec2 printPos(vec2 frag){ vec2 uv = frag / uRes; return vec2((uv.x - 0.5) * uRes.x / uRes.y, uv.y - 0.5) * uView.z + uView.xy; }
`;

// (both shaders declare uPx and uBoil before this)
const LINES = `
// The key block's line work along the isolines of a field f (print units; g = |grad f|), spaced sp; a runs along the lines.
// T is the tone wanted: 0 solid ink … 1 bare paper. Below 0.5 the lines are white cuts in the black; above, black lines left on the paper.
// Each line is cut as separate strokes; a stroke swells in the middle and comes to a point where the knife went in and came out.
float lines(float f, float g, float a, float sp, float T, float seed){
  float u = f / sp;
  u += (vnoise(vec2(a * 7.0 + seed, u * 0.37)) - 0.5) * 0.55 + (vnoise(vec2(a * 45.0 + uBoil * 11.0, u * 0.9)) - 0.5) * 0.07;
  float k = floor(u);
  float d = abs(fract(u) - 0.5) * 2.0;                    // 0 on a line's centre, 1 midway to the next
  float hk = hash11(k * 0.737 + seed);
  float s = a / (sp * (7.0 + 26.0 * hk)) + hk * 17.0;
  float sid = floor(s), st = fract(s);
  float r = hash12(vec2(sid, k + seed * 3.1));
  float taper = sqrt(max(sin(PI * st), 0.0)) * (0.8 + 0.4 * hash12(vec2(sid * 1.3, k * 0.7 + seed)));
  float aa = g * uPx / sp * 1.4 + 0.02;
  float ink;
  if (T < 0.5){
    float hw = min(T * 1.75, 1.0) * taper * step(r, 0.45 + 1.2 * T);
    ink = 1.0 - sat((hw - d) / aa + 0.5) * min(hw / aa, 1.0);
  } else {
    float hw = min((1.0 - T) * 1.75, 1.0) * taper * step(r, 1.55 - 1.1 * T);
    ink = sat((hw - d) / aa + 0.5) * min(hw / aa, 1.0);
  }
  return mix(ink, 1.0 - T, smoothstep(0.3, 0.6, aa));     // too fine to cut at this size: just the tone
}
`;

/* ---------------------------------------------------------------- the blocks */
const FS_SCENE = HEAD + `
uniform float uPx;           // one pixel, in print units
uniform float uBoil;         // which printing this frame is (the stop-motion's frame number)
uniform float uTime;         // time, stepped at the print's frame rate
uniform vec4 uBr[112];       // the old tree: limb segments a.xy → b.xy
uniform vec4 uBrR[28];       // … and their radii, four to a vector
uniform int uBrN;
uniform vec4 uTreeBox;       // its bounds
uniform vec4 uHA[8];         // houses: x, base y, half width, wall height
uniform vec4 uHB[8];         //         roof height, type (0 long side to us, 1 gable end), lit windows (bits), seed
uniform vec4 uLan;           // the lantern: centre x, y; its light; sway
out vec4 o;

vec3 ink;                    // coverage of the key (black) block, the indigo block's strength, the vermilion block
void lay(float m, vec3 v){ ink = mix(ink, v, sat(m)); }
float fill(float d){ return sat(0.5 - d / uPx); }
float sdBox(vec2 p, vec2 b){ vec2 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0); }
float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h); }
float sdTrap(vec2 p, float r1, float r2, float he){
  vec2 k1 = vec2(r2, he), k2 = vec2(r2 - r1, 2.0 * he);
  p.x = abs(p.x);
  vec2 ca = vec2(p.x - min(p.x, (p.y < 0.0) ? r1 : r2), abs(p.y) - he);
  vec2 cb = p - k1 + k2 * clamp(dot(k1 - p, k2) / dot(k2, k2), 0.0, 1.0);
  float s = (cb.x < 0.0 && ca.y < 0.0) ? -1.0 : 1.0;
  return s * sqrt(min(dot(ca, ca), dot(cb, cb)));
}
// a knife's edge is never a perfect curve
float rough(vec2 p){ return (vnoise(p * 300.0) - 0.5) * 0.0010 + (vnoise(p * 70.0) - 0.5) * 0.0012; }

` + LINES + `
// ---- the land's shapes
// summits: x, y, left flank steepness, right flank steepness
const vec4 PEAKS[5] = vec4[5](vec4(0.30, 0.700, 0.62, 0.55), vec4(0.63, 0.680, 0.60, 0.70), vec4(1.03, 0.800, 0.50, 0.66), vec4(1.40, 0.720, 0.62, 0.55), vec4(1.76, 0.690, 0.6, 0.6));
float nearHill(float x){
  return 0.440 + 0.130 * exp(-pow((x - 0.88) / 0.27, 2.0)) + 0.070 * exp(-pow((x - 0.52) / 0.13, 2.0)) + 0.060 * exp(-pow((x - 1.30) / 0.13, 2.0))
       + 0.010 * (vnoise(vec2(x * 13.0, 1.0)) - 0.5) + 0.004 * (vnoise(vec2(x * 41.0, 2.0)) - 0.5);
}
float groundTop(float x){ return 0.457 + 0.005 * sin(x * 4.0 + 1.0) + 0.005 * (vnoise(vec2(x * 9.0, 3.0)) - 0.5); }
float bankFar(float x){ return 0.418 + 0.005 * sin(x * 5.0 + 1.0) + 0.004 * (vnoise(vec2(x * 11.0, 4.0)) - 0.5); }
float bankNear(float x){ return 0.205 + 0.028 * sin(x * 2.3 + 0.8) + 0.008 * (vnoise(vec2(x * 8.0, 5.0)) - 0.5); }
const vec2 HOLE = vec2(0.950, 0.285);
// drifts on the near bank: x centre, base, half width, height of the crest's arc
const vec4 DRIFTS[4] = vec4[4](vec4(0.30, 0.105, 0.24, 0.032), vec4(0.80, 0.050, 0.32, 0.042), vec4(1.32, 0.115, 0.26, 0.026), vec4(0.98, 0.160, 0.16, 0.014));
const float HOLE_R = 0.060;
const float HOLE_SQ = 2.6;    // the hole is round; we see it foreshortened

// falling snow, one layer: small carved flakes, not quite round
float flakes(vec2 p, float cell, float dens, float rad, float seed){
  vec2 g = p / cell, i = floor(g), f = fract(g) - 0.5;
  vec2 h = hash22(i + seed);
  if (h.x > dens) return 0.0;
  vec2 d = (f - (hash22(i * 1.7 + seed) - 0.5) * 0.5) * cell;
  float r = rad * (0.55 + 0.9 * h.y);
  float ang = atan(d.y, d.x);
  return fill(length(d) - r * (1.0 + 0.12 * sin(ang * 3.0 + h.y * 40.0) + 0.08 * sin(ang * 5.0 + h.x * 30.0)));
}
// a snowy pine: tiers of drooping boughs, each with a lid of snow along its upper edges
void pine(vec2 q, float H, float W, float seed){
  if (q.y < -0.012 || q.y > H * 1.05 || abs(q.x) > W * 1.2) return;
  float n = 4.0 + floor(hash11(seed * 5.7) * 2.5);
  q.x -= (hash11(seed * 8.1) - 0.5) * 0.25 * q.y;              // a slight lean
  float inside = 0.0, snow = 0.0;
  for (int i = 0; i < 6; i++){
    float fi = float(i);
    if (fi >= n) break;
    float y0 = H * fi / n * 0.92;
    float th = H / n * (1.55 + 0.3 * hash11(seed + fi * 3.1));
    float wi = W * (1.0 - fi / n * 0.85) * (0.8 + 0.4 * hash11(seed * 1.9 + fi));
    float u = q.x / wi, v = (q.y - y0) / th;
    float top = 1.0 - abs(u) + 0.10 * (vnoise(vec2(u * 7.0 + fi * 3.0, seed)) - 0.5);
    float bot = -0.30 * u * u + 0.08 * (vnoise(vec2(u * 9.0, seed + fi)) - 0.5);
    float d = max(max(v - top, bot - v), abs(u) - 1.0) * th * 0.6;
    float m = fill(d);
    if (m > 0.0){
      inside = max(inside, m);
      // snow: the band under the upper edges, thicker toward the tips; it ends raggedly above the black underside
      float lid = step(top - 0.30 - 0.12 * abs(u) - 0.10 * vnoise(vec2(u * 20.0, seed + fi)), v) * step(abs(u), 0.94);
      snow = mix(snow, lid, m);
    }
  }
  float trunk = fill(max(abs(q.x) - 0.0013, max(q.y - H * 0.2, -q.y - 0.012)));
  lay(max(inside, trunk), vec3(1.0, 0.8, 0.0));
  lay(snow * inside, vec3(0.0, 0.14, 0.0));
}

void main(){
  vec2 P = printPos(gl_FragCoord.xy);
  float t = uTime;
  ink = vec3(1.0, 0.9, 0.0);

  // ---------------- the sky: black, cut with long gently-curving lines; the cuts widen toward the snow-light over the land
  {
    float lift = smoothstep(1.02, 0.56, P.y);
    float T = mix(0.10, 0.47, lift * lift);
    float f = P.y + 0.010 * sin(P.x * 2.3 + 0.4) + 0.004 * sin(P.x * 6.1 + 2.0);
    ink = vec3(lines(f, 1.0, P.x, 0.0078, T, 1.0), mix(0.95, 0.40, lift), 0.0);
  }

  // ---------------- the snow peaks: concave flanks, shoulders and notches. Lit faces nearly bare paper, a few dark spurs;
  // shaded faces indigo, hatched with arcs that wrap round the mountain's bulk, white spurs of snow running down them
  if (P.y < 0.84) {
    float best = -1.0; vec4 pk = PEAKS[0];
    for (int i = 0; i < 5; i++){
      vec4 c = PEAKS[i]; float dx = P.x - c.x;
      float y = c.y - (dx < 0.0 ? c.z : c.w) * pow(abs(dx), 0.85);
      if (y > best){ best = y; pk = c; }
    }
    float h = best + 0.036 * (vnoise(vec2(P.x * 5.0, 3.0)) - 0.5) + 0.012 * (vnoise(vec2(P.x * 17.0, 5.0)) - 0.5) + 0.004 * (vnoise(vec2(P.x * 60.0, 6.0)) - 0.5);
    float d = P.y - h;
    float m = fill(d);
    if (m > 0.0){
      vec2 r = P - pk.xy; float rr = max(length(r), 1e-3);
      float shade = smoothstep(-0.003, 0.003, r.x + 0.30 * r.y + 0.022 * (vnoise(vec2(P.y * 22.0, pk.x * 9.0)) - 0.5) + 0.01 * (vnoise(vec2(P.y * 70.0, pk.x)) - 0.5));
      float low = smoothstep(pk.y - 0.03, pk.y - 0.22, P.y);       // toward the valley the snow goes blue (a wiped gradation)
      float B = mix(0.03 + 0.20 * low, 0.60 + 0.20 * low, shade);
      // cross-contours: arcs hanging from the summit, as the mountain's girth seen from below
      float f = P.y + 1.6 * r.x * r.x;
      float K = lines(f, 1.0 + 3.2 * abs(r.x), P.x, 0.0042, mix(0.91, 0.60, shade), 5.0 + pk.x * 10.0);
      // spurs: ridges coming down from the summit at fixed angles, wandering; white on the shaded face, dark on the lit
      float ang = atan(r.x, -r.y);
      for (int j = 0; j < 5; j++){
        float sa = (float(j) - 2.0) * 0.42 + (hash11(pk.x * 13.0 + float(j)) - 0.5) * 0.3;
        float sl = 0.06 + 0.12 * hash11(pk.x * 7.0 + float(j) * 3.0);
        vec2 dir = vec2(sin(sa), -cos(sa));
        float al = dot(r, dir);
        float pd = r.x * dir.y - r.y * dir.x + 0.010 * (vnoise(vec2(al * 30.0, float(j) + pk.x * 5.0)) - 0.5) * al * 8.0;
        float w = (0.0006 + 0.0018 * sin(PI * sat(al / sl))) * step(0.0, al) * step(al, sl);
        float sp = fill(abs(pd) - w);
        float side = step(0.0, pd);                                  // the spur's shadowed side
        K = mix(K, mix(side * 0.9, 0.0, shade), sp * (1.0 - shade * 0.0));
        B = mix(B, mix(B, 0.08, shade), sp);
      }
      // the summit ridge: a black line, broken where the snow lies over it
      K = max(K, fill(abs(d) - 0.0007) * step(0.32, vnoise(vec2(P.x * 46.0, 7.0))));
      lay(m, vec3(K, B, 0.0));
    }
  }

  // ---------------- the dark hill behind the village: black, with a few contour cuts; snowy pines along it
  float hn = nearHill(P.x);
  if (P.y < hn + 0.11 && P.x > 0.28 && P.x < 1.52){
    float d = P.y - hn + rough(P);
    float m = fill(d);
    if (m > 0.0){
      float K = lines(P.y - 0.55 * hn, 1.0, P.x, 0.0056, 0.08 + 0.16 * smoothstep(-0.05, 0.0, d), 13.0);
      lay(m, vec3(K, 0.75, 0.0));
    }
    float cw = 0.026, ci = floor(P.x / cw);
    for (int j = -2; j <= 2; j++){
      float c = ci + float(j);
      if (hash11(c * 1.37 + 0.5) > 0.62) continue;
      float xc = (c + 0.5 + (hash11(c * 2.1) - 0.5) * 0.8) * cw;
      if (xc < 0.36 || xc > 1.44) continue;
      float H = 0.040 + 0.055 * hash11(c * 3.3);
      float yb = nearHill(xc) - 0.012 - 0.045 * hash11(c * 4.1);
      pine(P - vec2(xc, yb), H, H * 0.30, c);
    }
  }

  // ---------------- the village ground: snow, lying up to the foot of the hill
  float gt = groundTop(P.x);
  if (P.y < gt + 0.002){
    float m = fill(P.y - gt + rough(P) * 0.6);
    float B = 0.10 + 0.28 * smoothstep(gt - 0.014, gt, P.y);
    lay(m, vec3(0.0, B, 0.0));
  }

  // ---------------- the houses: white plaster walls in night shade, roofs heavy with snow, black eaves, a few lit windows
  for (int i = 0; i < 8; i++){
    vec4 H = uHA[i], HB = uHB[i];
    if (H.z <= 0.0) continue;
    vec2 q = P - H.xy;
    float hw = H.z, wh = H.w, rh = HB.x, ov = hw * 0.20, sc = wh / 0.034, snowT = 0.0060 * sc;
    if (abs(q.x) > hw + ov + 0.02 || q.y < -0.012 || q.y > wh + rh + 0.03 + 0.17 * step(2.5, HB.w) * step(HB.w, 3.5)) continue;
    float seed = HB.w;
    bool gable = HB.y > 0.5;
    float lit0 = mod(HB.z, 2.0), lit1 = step(2.0, HB.z);
    // walls
    float dW = sdBox(q - vec2(0.0, wh * 0.5), vec2(hw, wh * 0.5));
    float mW = fill(dW + rough(P) * 0.4);
    if (mW > 0.0){
      float B = 0.30 + 0.30 * smoothstep(wh * 0.55, wh, q.y);                // the eaves' shadow deepens toward the top
      float K = 0.0, R = 0.0;
      // timber: corner posts, a beam, the stone plinth (hatched)
      K = max(K, fill(abs(abs(q.x) - hw + 0.0012 * sc) - 0.0012 * sc));
      K = max(K, fill(abs(q.y - wh * 0.86) - 0.0008 * sc));
      K = max(K, fill(q.y - 0.005 * sc) * lines(q.y, 1.0, q.x, 0.0018, 0.35, seed));
      // windows: lit ones are vermilion paper behind a black lattice
      for (int w = 0; w < 2; w++){
        if (gable && w == 1) break;
        float wx = gable ? 0.0 : (float(w) - 0.5) * hw * 1.05;
        float lit = w == 0 ? lit0 : lit1;
        vec2 wq = q - vec2(wx, wh * 0.52);
        vec2 wb = vec2(0.0070, 0.0066) * sc;
        float dWin = sdBox(wq, wb);
        float inWin = fill(dWin);
        float lat = fill(min(abs(wq.x) - 0.0005, min(abs(abs(wq.x) - wb.x * 0.5) - 0.0004, abs(wq.y) - 0.0005)));
        K = mix(K, max(lat, 1.0 - lit), inWin);
        K = max(K, fill(abs(dWin + 0.0001) - 0.0010));
        R = max(R, inWin * lit);
        B = mix(B, 0.0, inWin * lit);
      }
      // the door, and red couplets pasted either side of it (one house)
      if (seed == 3.0){
        vec2 dq = q / sc;
        float dD = sdBox(dq - vec2(0.0, 0.012), vec2(0.0075, 0.012));
        K = max(K, fill(dD * sc));
        float cp = min(sdBox(vec2(abs(dq.x) - 0.0118, dq.y - 0.013), vec2(0.0021, 0.0105)), sdBox(dq - vec2(0.0, 0.0285), vec2(0.0085, 0.0021)));
        float mc = fill(cp * sc + rough(P) * 0.3);
        K = mix(K, 0.0, mc); B = mix(B, 0.0, mc);
        R = max(R, mc);
        K = max(K, mc * fill((abs(fract(dq.y / 0.0042) - 0.5) * 0.0042 - 0.0006) * sc) * step(0.008, abs(dq.x)) * 0.8);   // characters, as dots
      }
      lay(mW, vec3(K, B, R));
    }
    if (gable){
      // the gable end's triangle; barge boards; snow along both slopes, overhanging
      float tri = max(abs(q.x) * rh / hw + (q.y - wh) - rh, wh - q.y);
      float mT = fill(tri * 0.7);
      if (mT > 0.0){
        float K = lines(q.y, 1.0, q.x, 0.0030, 0.72, seed + 3.0);
        K = max(K, fill(length(q - vec2(0.0, wh + rh * 0.42)) - 0.0035 * sc));
        lay(mT, vec3(K, 0.62, 0.0));
      }
      vec2 L0 = vec2(-hw - ov, wh - ov * rh / hw), R0 = vec2(hw + ov, wh - ov * rh / hw), AP = vec2(0.0, wh + rh);
      float dB = min(sdSeg(q, L0, AP), sdSeg(q, R0, AP));
      lay(fill(dB - 0.0016 * sc), vec3(1.0, 0.7, 0.0));
      vec2 sq = q - vec2(0.0, snowT * 0.85);
      float dS = min(sdSeg(sq, L0 + vec2(-0.002, 0.0), AP), sdSeg(sq, R0 + vec2(0.002, 0.0), AP)) - snowT * (0.85 + 0.30 * vnoise(vec2(q.x * 200.0, seed)));
      float mS = fill(dS);
      if (mS > 0.0){
        float B = 0.34 * smoothstep(0.0, -1.2 * snowT, dS + snowT) * smoothstep(wh + rh, wh, q.y);
        float K = fill(abs(dS) - 0.0006) * step(q.y, wh + rh * 0.55) * step(0.25, vnoise(vec2(q.x * 90.0, seed)));
        lay(mS, vec3(K, B, 0.0));
      }
    } else {
      // the long roof: a band of snow above the eaves, rounded where it's thick, its lip curling over the eave
      float yE = wh;
      float dS = sdTrap(q - vec2(0.0, yE + rh * 0.5), hw + ov, hw + ov - rh * 0.55, rh * 0.5) - snowT - 0.0016 * sc * (vnoise(vec2(q.x * 140.0, seed)) - 0.3);
      // under the lip: the eaves' black shadow, with white icicles cut into it
      float dE = sdBox(q - vec2(0.0, yE - snowT - 0.0038 * sc), vec2(hw + ov * 0.75, 0.0044 * sc));
      float mE = fill(dE);
      if (mE > 0.0){
        float cell = 0.0036 * sc;
        float ic = fract(q.x / cell + seed);
        float il = (0.0015 + 0.0060 * hash11(floor(q.x / cell + seed) * 7.3 + seed)) * sc;
        float yl = yE - snowT - q.y;
        float icicle = step(abs(ic - 0.5) * cell, 0.0008 * sc * sat(1.0 - yl / il)) * step(yl, il);
        lay(mE, vec3(1.0 - icicle, 0.8, 0.0));
      }
      float mS = fill(dS);
      if (mS > 0.0){
        float lip = smoothstep(yE + rh * 0.45, yE - snowT, q.y);
        float B = 0.42 * lip * lip;
        float K = lines(-dS, 1.0, q.x, 0.0032, 1.0 - 0.18 * lip, seed + 7.0) * step(q.y, yE + rh * 0.4);
        K = max(K, fill(abs(dS) - 0.0006) * step(q.y, yE + 0.002));
        lay(mS, vec3(K, B, 0.0));
      }
      // a chimney, and its smoke cut into the dark of the hill behind
      if (seed == 3.0){
        vec2 cq = q - vec2(hw * 0.55, yE + rh * 0.55);
        float dC = sdBox(cq - vec2(0.0, 0.012), vec2(0.0050, 0.012));
        lay(fill(dC), vec3(1.0 - lines(cq.y, 1.0, cq.x, 0.0025, 0.25, 61.0), 0.7, 0.0));
        lay(fill(length((cq - vec2(0.0, 0.0245)) * vec2(1.0, 2.2)) - 0.0072), vec3(0.0, 0.15, 0.0));
        float sy = cq.y - 0.028;
        if (sy > 0.0 && sy < 0.17){
          float sx = 0.011 * sin(sy * 34.0 - t * 1.6) * sat(sy * 30.0) + sy * 0.45 + 0.004 * sin(sy * 90.0 - t * 2.3);
          float wdt = 0.0024 + sy * 0.085;
          float e = abs(abs(cq.x - sx) - wdt) - 0.0007 * (1.0 - sy / 0.17);
          float keep = step(sy / 0.17, vnoise(vec2(sy * 60.0 - t * 2.0, sign(cq.x - sx))) + 0.25);
          float cut = fill(e) * keep;
          float dark = step(0.5, ink.x);
          ink.x = mix(ink.x, 1.0 - dark, cut); ink.y *= 1.0 - 0.7 * cut * dark;
        }
      }
    }
    // snow drifted against the foot of the wall
    float dDr = q.y - 0.005 * sc - 0.003 * vnoise(vec2(q.x * 120.0, seed));
    lay(fill(dDr) * step(abs(q.x), hw + 0.006), vec3(0.0, 0.12, 0.0));
  }

  // ---------------- the far bank: a lip of snow, the dark face under it
  float bF = bankFar(P.x);
  {
    float dF = sdBox(vec2(0.0, P.y - (bF - 0.0070)), vec2(1.0, 0.0060)) + rough(P);
    float mF = fill(dF);
    if (mF > 0.0) lay(mF, vec3(lines(P.y, 1.0, P.x, 0.0024, 0.30, 81.0), 0.85, 0.0));
  }

  // ---------------- the frozen river
  float bN = bankNear(P.x);
  if (P.y < bF - 0.013 && P.y > bN - 0.012){
    float tt = (P.y - bN) / (bF - bN);
    // indigo, wiped: deepest under the far bank (its reflection), a little lighter in the middle
    float B = 0.56 + 0.20 * smoothstep(0.75, 0.97, tt) + 0.08 * (vnoise(vec2(P.x * 1.3, P.y * 7.0)) - 0.5);
    // the far bank's reflection: black lines thickening toward it
    float K = lines(P.y, 1.0, P.x, 0.0040, mix(0.93, 0.56, smoothstep(0.80, 0.985, tt)), 91.0);
    // glints: long thin cuts through the indigo, the snow-light on the ice
    float gl = lines(P.y + 0.0013, 1.0, P.x, 0.0050, 0.06 + 0.16 * smoothstep(0.35, 0.8, vnoise(vec2(P.x * 3.0, P.y * 22.0))), 93.0);
    B *= gl;
    float R = 0.0;
    // the lit windows' reflections: a column of short horizontal strokes going down from the bank
    for (int i = 0; i < 8; i++){
      vec4 H = uHA[i], HB = uHB[i];
      if (H.z <= 0.0 || HB.z < 0.5) continue;
      for (int w = 0; w < 2; w++){
        if (HB.y > 0.5 && w == 1) break;
        float lit = w == 0 ? mod(HB.z, 2.0) : step(2.0, HB.z);
        float wx = H.x + (HB.y > 0.5 ? 0.0 : (float(w) - 0.5) * H.z * 1.05);
        float dy = bF - 0.013 - P.y;
        if (dy < 0.0 || dy > 0.09) continue;
        float row = floor(P.y / 0.0048);
        float fade = 1.0 - dy / 0.09;
        float half_ = (0.0030 + 0.0060 * hash11(row * 3.1 + wx * 50.0)) * fade;
        float jx = (hash11(row * 7.7 + wx * 30.0) - 0.5) * 0.006;
        float dash = fill(abs(P.x - wx - jx) - half_) * step(abs(fract(P.y / 0.0048) - 0.5), 0.22) * step(0.25 * (1.0 - fade), hash11(row * 1.3 + wx * 9.0));
        R = max(R, dash * lit);
      }
    }
    // drifted snow lying on the ice in long streaks, mostly near the banks; a black shadow line under each
    float thr = 0.68 - 0.10 * (1.0 - smoothstep(0.0, 0.25, tt)) - 0.08 * smoothstep(0.80, 1.0, tt);
    vec2 sp = P * vec2(2.2, 30.0) + vec2(5.0, 0.0);
    float n = fbm3(sp) + 0.05 * (vnoise(P * vec2(30.0, 200.0)) - 0.5);
    float n2 = fbm3(sp + vec2(0.0, 0.0030 * 30.0));
    float patch_ = fill((thr - n) / 14.0);
    float shadowL = fill((thr - n2) / 14.0) * (1.0 - patch_) * step(0.3, vnoise(vec2(P.x * 50.0, 3.0)));
    B = mix(B, 0.05, patch_); K = mix(K, 0.0, patch_); R *= 1.0 - patch_;
    K = max(K, shadowL * 0.95);
    // a little boat frozen into the ice by the right bank: only what's above the ice shows; snow heaped in it, its pole leaning
    {
      vec2 bq = P - vec2(1.30, 0.330);
      if (abs(bq.x) < 0.12 && bq.y > -0.03 && bq.y < 0.12){
        float L = 0.078, u = bq.x / L;
        float top = 0.006 + 0.020 * pow(abs(u), 3.0) + 0.004 * u;                // the gunwale's sheer, higher at the bow (right)
        float dHull = max(max(abs(bq.x) - L * (1.0 - 0.3 * sat(-bq.y / 0.01)), bq.y - top), -bq.y - 0.001);
        float mH = fill(dHull);
        // its shadow and the trough of ice round it
        float sh = fill((length((bq - vec2(0.004, -0.002)) / vec2(L * 1.06, 0.010)) - 1.0) * 0.010) * step(bq.y, 0.0);
        B = mix(B, 0.95, sh); K = mix(K, lines(bq.y, 1.0, bq.x, 0.0022, 0.6, 133.0), sh * 0.8);
        float planks = lines(bq.y - top * 0.5, 1.0, bq.x, 0.0026, 0.16, 131.0);
        K = mix(K, max(planks, fill(abs(bq.y - top + 0.0016) - 0.0006)), mH); B = mix(B, 0.7, mH); R *= 1.0 - mH;
        float dSn = max(abs(bq.x) - L * 0.80, bq.y - top - 0.0055 * sat(1.0 - u * u) - 0.002 * vnoise(vec2(bq.x * 160.0, 1.0)));
        dSn = max(dSn, top - 0.003 - bq.y);
        float mSn = fill(dSn);
        K = mix(K, fill(abs(dSn) - 0.0005) * step(bq.y, top), mSn); B = mix(B, 0.10, mSn);
        float pole = fill(sdSeg(bq, vec2(-0.040, 0.004), vec2(0.030, 0.105)) - 0.0012);
        K = max(K, pole); B = mix(B, 0.6, pole);
      }
    }
    // the ice hole: black water ringed with broken ice; a few cracks run out from it
    vec2 hq = (P - HOLE) * vec2(1.0, HOLE_SQ);
    float hr = length(hq);
    if (hr < 0.17){
      float ha = atan(hq.y, hq.x);
      for (int j = 0; j < 5; j++){
        float ca = float(j) * 1.257 + (hash11(float(j) * 3.3 + 1.0) - 0.5) * 0.8;
        float cl = HOLE_R + 0.025 + 0.075 * hash11(float(j) * 5.1 + 2.0);
        vec2 cdir = vec2(cos(ca), sin(ca));
        float al = dot(hq, cdir);
        float cd = hq.x * cdir.y - hq.y * cdir.x + 0.010 * (vnoise(vec2(al * 40.0, float(j) * 7.0)) - 0.5) + 0.003 * (vnoise(vec2(al * 160.0, float(j))) - 0.5);
        float crack = fill(abs(cd) / HOLE_SQ * 1.6 - 0.0007 * (1.0 - al / cl)) * step(HOLE_R, al) * step(al, cl);
        K = max(K, crack);
      }
      // the rim: broken chunks of ice heaped round the hole, each its own size, outlined in black, shaded on the near side
      float cn = 13.0, cpos = ha / (2.0 * PI) * cn + 0.35 * vnoise(vec2(ha * 2.0, 2.0));
      float ci = floor(cpos), cf = fract(cpos);
      // the outer edge runs straight from corner to corner, each corner at its own distance: a jagged ring of slabs
      float outer = HOLE_R + 0.005 + 0.016 * mix(hash11(mod(ci, cn) * 3.7 + 1.0), hash11(mod(ci + 1.0, cn) * 3.7 + 1.0), cf);
      float dRim = (hr - outer) / HOLE_SQ * 1.6;
      float mRim = fill(dRim);
      float nearSide = step(hq.y, 0.0) * smoothstep(outer - 0.016, outer, hr);
      B = mix(B, 0.08 + 0.40 * nearSide * hash11(ci * 5.3), mRim); K = mix(K, 0.0, mRim); R *= 1.0 - mRim;
      K = max(K, fill(abs(dRim) - 0.0007));
      K = max(K, mRim * fill(abs(cf - 0.5) < 0.5 ? (0.5 - abs(cf - 0.5)) / cn * 2.0 * PI * hr / HOLE_SQ * 1.6 - 0.0006 : 1.0) * step(0.3, hash11(ci * 9.1)));
      // the water
      float dH = (hr - HOLE_R - (vnoise(vec2(ha * 6.0, 3.0)) - 0.5) * 0.006) / HOLE_SQ * 1.6;
      float mH = fill(dH);
      if (mH > 0.0){
        // the ice's thickness, seen on the far inner wall
        float wall = fill(-(length((P - HOLE - vec2(0.0, -0.0060)) * vec2(1.0, HOLE_SQ)) - HOLE_R) / HOLE_SQ * 1.6);
        float Kw = 1.0;
        for (int j = 0; j < 3; j++){
          float ph = t * 0.10 + float(j) / 3.0;
          float rr = fract(ph) * (HOLE_R - 0.004);
          Kw *= 1.0 - fill((abs(hr - rr) - 0.0016 * (1.0 - rr / HOLE_R)) / HOLE_SQ * 1.6) * 0.9 * step(0.55, vnoise(vec2(ha * 2.2, float(j) + floor(ph) * 7.0)));
        }
        float iceW = 1.0 - lines(P.x, 1.0, P.y, 0.0022, 0.42, 97.0);
        K = mix(K, mix(Kw, 1.0 - iceW * 0.8, wall), mH);
        B = mix(B, mix(1.0, 0.70, wall), mH); R *= 1.0 - mH;
      }
    }
    float mR = fill(max(P.y - bF + 0.013, bN - P.y) + rough(P));
    lay(mR, vec3(K, B, R));
  }

  // ---------------- the near bank: bare paper, mostly. A few long low drifts, each crest throwing a short blue shadow toward us,
  // hatched along the crest; the bottom of the sheet printed a little darker
  if (P.y < bN + 0.004){
    float K = fill(abs(P.y - bN) - 0.0008) * step(0.25, vnoise(vec2(P.x * 35.0, 6.0)));
    float B = 0.04 + 0.22 * smoothstep(0.07, 0.0, P.y);
    for (int i = 0; i < 4; i++){
      vec4 D = DRIFTS[i];
      float u = (P.x - D.x) / D.z;
      if (abs(u) > 1.0) continue;
      float arc = 1.0 - u * u;
      float cr = D.y + D.w * arc + 0.004 * (vnoise(vec2(P.x * 30.0, float(i))) - 0.5);
      float dc = cr - P.y;
      float len = 0.030 * arc;
      if (dc > 0.0 && dc < len){
        float sh = pow(1.0 - dc / len, 1.4);
        B = max(B, 0.55 * sh);
        K = max(K, lines(P.y - cr, 1.0, P.x, 0.0042, 1.0 - 0.30 * sh, 101.0 + float(i)) * step(0.08, sh));
      }
      K = max(K, fill(abs(dc) - 0.0008 * arc) * step(0.3, vnoise(vec2(P.x * 40.0, float(i) + 9.0))) * step(-0.002, dc));
    }
    // footprints: someone walked from here down onto the ice, to the hole
    {
      vec2 a = vec2(0.36, 0.0), b = HOLE + vec2(-0.045, -0.014);
      vec2 ab = b - a; float L = length(ab); vec2 dn = ab / L, pn = vec2(-dn.y, dn.x);
      float s2 = dot(P - a, dn) / L;
      if (s2 > -0.02 && s2 < 1.02){
        float N = 30.0, i0 = floor(s2 * N);
        for (int j = 0; j <= 1; j++){
          float i = i0 + float(j);
          if (i < 0.0 || i > N) continue;
          float sc = mix(1.25, 0.6, i / N);
          vec2 c = a + ab * (i / N) + pn * (mod(i, 2.0) - 0.5) * 0.010 * sc + pn * 0.020 * sin(i / N * 4.0);
          vec2 fq = P - c; fq = vec2(dot(fq, dn), dot(fq, pn));
          float df = length(fq / (vec2(0.0050, 0.0026) * sc)) - 1.0;
          float mf = fill(df * 0.0026 * sc);
          B = max(B, 0.62 * mf);
          K = max(K, fill(abs(df * 0.0026 * sc) - 0.00055) * step(0.0, fq.x + 0.001 * sc));
        }
      }
    }
    lay(fill(P.y - bN), vec3(K, B, 0.0));
  }

  // ---------------- dry reeds in clumps along the near bank: curving, tapering strokes, some broken over; snow on the seed heads
  if (P.y < bN + 0.24 && ((P.x > 0.24 && P.x < 0.56) || (P.x > 1.08 && P.x < 1.44))){
    float dR = 1e9, dSnow = 1e9;
    for (int c = 0; c < 4; c++){
      float fc = float(c);
      float cx = c == 0 ? 0.31 : c == 1 ? 0.47 : c == 2 ? 1.16 : 1.35;
      if (abs(P.x - cx) > 0.12) continue;
      for (int i = 0; i < 12; i++){
        float fi = float(i) + fc * 12.0;
        float x0 = cx + (hash11(fi * 3.3) - 0.5) * 0.05;
        float H = 0.08 + 0.13 * hash11(fi * 7.1) * (1.0 - 0.5 * abs(x0 - cx) / 0.025);
        float lean = (x0 - cx) * 1.6 + (hash11(fi * 1.7) - 0.5) * 0.05 + 0.005 * sin(t * 1.1 + fi * 1.3);
        vec2 p0 = vec2(x0, bankNear(x0) - 0.015 - 0.035 * hash11(fi * 5.5));
        vec2 p1 = p0 + vec2(lean * 0.06, H * 0.30), p2 = p0 + vec2(lean * 0.25, H * 0.58), p3 = p0 + vec2(lean * 0.55, H * 0.82), p4 = p0 + vec2(lean, H);
        if (hash11(fi * 9.3) > 0.75){ p3 = p2 + vec2(sign(lean + 0.001) * 0.35, 0.10) * H * 0.4; p4 = p3 + vec2(sign(lean + 0.001) * 0.45, -0.55) * H * 0.35; }
        if (abs(P.x - p0.x) > H * 0.8 + 0.03) continue;
        dR = min(dR, sdSeg(P, p0, p1) - 0.0021);
        dR = min(dR, sdSeg(P, p1, p2) - 0.0016);
        dR = min(dR, sdSeg(P, p2, p3) - 0.0011);
        dR = min(dR, sdSeg(P, p3, p4) - 0.0007);
        if (hash11(fi * 2.9) > 0.3){
          vec2 hd = normalize(p4 - p3), hp = P - (p4 + hd * 0.007);
          vec2 hl = vec2(dot(hp, hd), dot(hp, vec2(-hd.y, hd.x)));
          dR = min(dR, (length(hl / vec2(0.0095, 0.0026)) - 1.0) * 0.0026);
          vec2 up = vec2(-hd.y, hd.x) * sign(hd.x + 0.001);
          dSnow = min(dSnow, (length((hp - up * 0.0018) / vec2(0.0065, 0.0017)) - 1.0) * 0.0017);
        }
        // a long leaf, bending away from a few of them
        if (hash11(fi * 4.4) > 0.55){
          float sd = sign(hash11(fi) - 0.5);
          vec2 lp = mix(p1, p2, 0.2 + 0.6 * hash11(fi * 6.1)), lm = lp + vec2(sd * (0.012 + 0.010 * hash11(fi * 2.2)), 0.007), le = lm + vec2(sd * 0.010, -0.016 - 0.012 * hash11(fi * 3.4));
          float tl = clamp(dot(P - lp, le - lp) / dot(le - lp, le - lp), 0.0, 1.0);
          dR = min(dR, min(sdSeg(P, lp, lm), sdSeg(P, lm, le)) - 0.0026 * sqrt(max(1.0 - tl, 0.0)) * (0.4 + tl * 2.0));
        }
      }
    }
    lay(fill(dR), vec3(1.0, 0.3, 0.0));
    lay(fill(dSnow), vec3(0.0, 0.0, 0.0));
  }

  // ---------------- the lantern's light, cut out of everything behind it: a ring of rays, wider and closer near the flame
  vec2 lq = P - uLan.xy;
  float lr = length(lq);
  if (uLan.z > 0.0 && lr < 0.26){
    float la = atan(lq.x, -lq.y);

  update(dt) {

    // into the buffer that isn't on show, and swapped in on its tick. (Stills, and any jump, draw it whole.)
    const whole = YL.DBG.still || this.whole || this.aspect !== aspect || this.shown < 0 || frame !== this.shown + 1 && frame !== this.shown;

    const view = this.view(aspect, this.shown / FPS);

})();
