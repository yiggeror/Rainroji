  vec3 xw = ro + rd * t;
  vec3 Lw = uL - xw, Ll = vec3(dot(Lw, F), dot(Lw, Up), dot(Lw, Z)), Ld = normalize(Ll);
  vec3 V = -d, Hh = normalize(Ld + V);
  float ndl = dot(n, Ld), ndh = max(dot(n, Hh), 0.0), ndv = max(dot(n, V), 0.0);
  vec3 E = lightAt(xw);
  vec3 alb; float gloss = 0.03;
  if (part >= 2.0){
    // the flipper: white, with grey mottling on top and a dark grime of barnacles on the knobs
    float mot = smoothstep(0.45, 0.75, vnoise(p.xz * 3.0 + p.y * 2.0) * 0.7 + vnoise(p.xz * 11.0) * 0.3);
    alb = mix(vec3(0.42, 0.43, 0.44), vec3(0.05, 0.05, 0.055), mot * 0.75 * smoothstep(-0.2, 0.4, n.y));
    float grime = smoothstep(2.4, 2.9, part) * smoothstep(0.55, 0.8, vnoise(p.xz * 40.0 + p.y * 30.0));
    alb = mix(alb, vec3(0.06, 0.06, 0.05), grime);
    gloss = 0.06;
  } else {
    // the body: slate black; paler and mottled underneath; the throat grooves' floors paler still
    float under = smoothstep(0.0, -0.8, n.y);
    alb = vec3(0.011, 0.012, 0.014) * (0.8 + 0.4 * vnoise(p.xz * 2.0));
    alb = mix(alb, vec3(0.10, 0.10, 0.10) * (0.6 + 0.6 * vnoise(p.xz * 4.0 + 3.0)), under * 0.6);
    // scars: thin pale scratches here and there

  T = t;

/* ---- a squid, and the ink it squirts when it takes fright. Local frame: x toward the tip of its mantle (it jets that
   way), y up. Its head at the origin; arms and two long tentacles trailing back from it. */
uniform vec4 uSq;            // the squid: where its head is, shown
uniform vec4 uSqF;           // which way its mantle points (it goes that way), how far its mantle is squeezed
uniform vec4 uInkC;          // its ink: the cloud's middle, how far it has spread (m)
uniform vec4 uInkK;          // how thick the ink is, how bright it glows inside (the spark), -, -
float sdCap(vec3 p, vec3 a, vec3 b, float ra, float rb){ vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - mix(ra, rb, h); }
float squidSDF(vec3 p, float pulse, out float part){
  part = 0.0;
  float m = (length(vec3((p.x - 0.085) / 0.088, p.y / (0.021 * (1.0 - 0.18 * pulse)), p.z / (0.020 * (1.0 - 0.18 * pulse)))) - 1.0) * 0.019;
  float fin = (length(vec3((p.x - 0.140) / 0.032, p.y / 0.0025, p.z / 0.042)) - 1.0) * 0.0025;
  float d = min(m, fin);
  float head = length(p - vec3(-0.006, 0.0, 0.0)) - 0.016;
  if (head < d){ d = head; part = 1.0; }
  float eye = min(length(p - vec3(-0.004, 0.004, 0.014)), length(p - vec3(-0.004, 0.004, -0.014))) - 0.0062;
  if (eye < d){ d = eye; part = 2.0; }
  float t = uTime;
  for (int k = 0; k < 8; k++){
    float a = float(k) * 0.785 + 0.3, w = sin(t * 3.0 + float(k)) * 0.008;
    vec3 e = vec3(-0.085, 0.014 * cos(a) + w, 0.014 * sin(a) + 0.5 * w);
    d = min(d, sdCap(p, vec3(-0.012, 0.004 * cos(a), 0.004 * sin(a)), e, 0.0035, 0.0008));
  }
  for (int k = 0; k < 2; k++){
    float sgn = float(k) * 2.0 - 1.0, w = sin(t * 2.2 + float(k) * 2.0) * 0.015;
    d = min(d, sdCap(p, vec3(-0.012, 0.0, 0.004 * sgn), vec3(-0.16, 0.012 * sgn + w, 0.02 * sgn), 0.0022, 0.0018));
  }
  return d;
}
vec3 squid(vec3 ro, vec3 rd, inout float T){
  if (uSq.w <= 0.0) return vec3(0.0);
  vec3 F = uSqF.xyz, Up0 = vec3(0.0, 1.0, 0.0), Z = normalize(cross(F, Up0)), Up = cross(Z, F);
  vec3 rl = (ro - uSq.xyz) / 1.7;                                               // (it is drawn at 1.7 times its model's size)
  vec3 o = vec3(dot(rl, F), dot(rl, Up), dot(rl, Z)), d = vec3(dot(rd, F), dot(rd, Up), dot(rd, Z));
  vec3 oc = o - vec3(0.0, 0.0, 0.0); float b = dot(oc, d), cc = dot(oc, oc) - 0.20 * 0.20, h = b * b - cc;
  if (h < 0.0) return vec3(0.0);
  float t = max(-b - sqrt(h), 0.0), tEnd = min(-b + sqrt(h), T), part = 0.0; bool hit = false;
  for (int i = 0; i < 56; i++){
    float dd = squidSDF(o + d * t, uSqF.w, part);
    if (dd < 0.0003 + 0.0003 * t){ hit = true; break; }
    t += dd * 0.85;
    if (t > tEnd) break;
  }
  if (!hit) return vec3(0.0);
  vec3 p = o + d * t; float pp;
  vec2 e = vec2(0.0008, -0.0008);
  vec3 n = normalize(e.xyy * squidSDF(p + e.xyy, uSqF.w, pp) + e.yyx * squidSDF(p + e.yyx, uSqF.w, pp) + e.yxy * squidSDF(p + e.yxy, uSqF.w, pp) + e.xxx * squidSDF(p + e.xxx, uSqF.w, pp));
  t *= 1.7;
  vec3 xw = ro + rd * t, Lw = uL - xw, Ld = normalize(vec3(dot(Lw, F), dot(Lw, Up), dot(Lw, Z)));
  float ndl = dot(n, Ld), wrap = sat((ndl + 0.4) / 1.4);
  vec3 E = lightAt(xw);
  // translucent pink skin freckled with dark red chromatophores; the eye black with a silver ring
  float spots = smoothstep(0.55, 0.75, vnoise(p.xz * 900.0 + p.y * 400.0));
  vec3 alb = mix(vec3(0.55, 0.26, 0.24), vec3(0.30, 0.04, 0.04), spots * 0.8);
  if (part > 1.5) alb = mix(vec3(0.004), vec3(0.35, 0.36, 0.38), smoothstep(0.0040, 0.0058, length(p.yz - vec2(0.004, sign(p.z) * 0.014))));
  vec3 col = E * (alb * wrap * 0.9 + 0.25 * alb * pow(1.0 - abs(dot(n, -d)), 2.0));
  T = t;
  return col * exp(-SIG_V * t);
}
// the ink: a billowing cloud that swallows the light behind it; lit, a little, from outside; from inside, by the spark
vec3 inkCloud(vec3 ro, vec3 rd, inout float T, vec3 c){
  if (uInkC.w <= 0.0) return c;
  vec3 oc = ro - uInkC.xyz; float R = uInkC.w * 1.35, b = dot(oc, rd), cc = dot(oc, oc) - R * R, h = b * b - cc;
  if (h < 0.0) return c;
  h = sqrt(h); float t0 = max(-b - h, 0.0), t1 = min(-b + h, T);
  if (t1 <= t0) return c;
  float dt = (t1 - t0) / 18.0, tr = 1.0, firstT = -1.0; vec3 sc = vec3(0.0);
  for (int i = 0; i < 18; i++){
    float t = t0 + (float(i) + 0.5) * dt; vec3 p = ro + rd * t;
    float q = length(p - uInkC.xyz) / uInkC.w;
    float billow = vnoise(p.xy * 9.0 + uTime * 0.25) * 0.6 + vnoise(p.yz * 17.0 - uTime * 0.18) * 0.4;
    float dens = smoothstep(1.0, 0.30, q + 0.45 * (billow - 0.5)) * uInkK.x;
    if (dens <= 0.0) continue;
    float a = dens * dt * 28.0;
    // (the spark's glow in the ink: soft, short-reaching, a warm heart in the black, not a lamp)
    vec3 Ein = uLI2.r > 0.0 ? uLI2 * 6.0 * exp(-length(p - uL2) / 0.10) : vec3(0.0);
    vec3 Eout = lightAt(p); Eout /= 1.0 + 0.5 * length(Eout);                  // (ink drinks light: near the lamp it does not blaze)
    sc += tr * a * (Eout * 0.004 * vec3(0.30, 0.24, 0.22) + Ein * 0.030 * vec3(1.0, 0.55, 0.25) * uInkK.y);
    tr *= exp(-a);
    if (firstT < 0.0 && tr < 0.3) firstT = t;
  }
  if (firstT > 0.0) T = min(T, firstT);
  return c * tr + sc * exp(-SIG_V * t0);
}

/* ---- the anglerfish behind the lure: a dark head, a great open mouth ringed with needle teeth, one eye that shines back.
   Local frame: x toward the light it is hunting, y up. Only what our light reaches is seen. */
uniform vec4 uFishP;         // head centre, shown (0/1)
uniform vec4 uFishF;         // facing (unit), mouth open (0 shut … 1 gaping)
float sdCone(vec3 p, vec3 a, vec3 b, float ra, float rb){
  vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - mix(ra, rb, h);
}
float fishSDF(vec3 p, float gape, out float part){
  float head = length(p / vec3(0.22, 0.17, 0.16)) * 0.16 - 0.16;
  float body = length((p - vec3(-0.28, -0.02, 0.0)) / vec3(0.32, 0.15, 0.12)) * 0.12 - 0.12;
  float d = smin(head, body, 0.06);
  // the mouth: a big cavity opening forward and down
  vec3 mc = vec3(0.17, -0.035, 0.0);
  float mouth = length((p - mc) / vec3(0.12, 0.035 + 0.05 * gape, 0.115)) * 0.035 - 0.035;
  d = max(d, -mouth);
  part = 0.0;
  // fangs: a row along the upper jaw pointing down, a row along the lower pointing up, crossing like a cage;
  // long at the front, shorter toward the corners of the mouth
  float tooth = 1e9;
  float gh = 0.035 + 0.05 * gape;
  for (int k = 0; k < 11; k++){
    float th = (float(k) / 10.0 - 0.5) * 2.6;
    float front = cos(th);
    float h1 = hash12(vec2(float(k), 3.0)), h2 = hash12(vec2(float(k), 7.0));
    vec3 ru = mc + vec3(0.055 * front + 0.015, gh * 0.92, 0.105 * sin(th));
    float lu = (0.015 + 0.045 * front * front * h1 + 0.012 * h2) * (0.55 + 0.6 * gape);
    vec3 tu = ru + vec3(0.010 + 0.012 * (h2 - 0.5), -lu, (h1 - 0.5) * 0.02 - 0.010 * sin(th));
    tooth = min(tooth, sdCone(p, ru, tu, 0.0012 + 0.0016 * h1, 0.0002));
    // the lower jaw juts out past the upper (an underbite), its fangs the longest
    vec3 rl = mc + vec3(0.06 * front + 0.035, -gh * 0.92, 0.10 * sin(th + 0.12));
    float ll = (0.02 + 0.06 * front * front * h2 + 0.012 * h1) * (0.55 + 0.6 * gape);
    vec3 tl = rl + vec3(0.004 + 0.016 * (h1 - 0.3), ll, (h2 - 0.5) * 0.02 - 0.010 * sin(th));
    tooth = min(tooth, sdCone(p, rl, tl, 0.0014 + 0.0018 * h2, 0.0002));
  }
  if (tooth < d){ d = tooth; part = 1.0; }
  // the eye
  float eye = length(p - vec3(0.09, 0.085, 0.115)) - 0.016;
  if (eye < d){ d = eye; part = 2.0; }
  // the stalk that holds out the lure
  float stalk = min(sdCone(p, vec3(0.10, 0.15, 0.0), vec3(0.24, 0.24, 0.0), 0.005, 0.0035), sdCone(p, vec3(0.24, 0.24, 0.0), vec3(0.40, 0.18, 0.0), 0.0035, 0.002));
  if (stalk < d){ d = stalk; part = 3.0; }
  return d;
}
vec3 fish(vec3 ro, vec3 rd, inout float T){
  if (uFishP.w <= 0.0) return vec3(0.0);
  vec3 F = uFishF.xyz, Up0 = vec3(0.0, 1.0, 0.0), Z = normalize(cross(F, Up0)), Up = cross(Z, F);
  vec3 rl = ro - uFishP.xyz;
  vec3 o = vec3(dot(rl, F), dot(rl, Up), dot(rl, Z)), d = vec3(dot(rd, F), dot(rd, Up), dot(rd, Z));
  float b = dot(o, d), c = dot(o, o) - 0.62 * 0.62, h = b * b - c;
  if (h < 0.0) return vec3(0.0);
  float t = max(-b - sqrt(h), 0.0), tEnd = min(-b + sqrt(h), T);
  float part = 0.0, gape = uFishF.w; bool hit = false;
  for (int i = 0; i < 64; i++){
    float dd = fishSDF(o + d * t, gape, part);
    if (dd < 0.0004 * t + 0.0002){ hit = true; break; }
    t += dd * 0.8;
    if (t > tEnd) break;
  }
  if (!hit) return vec3(0.0);
  vec3 p = o + d * t; float pp;
  vec2 e = vec2(0.0015, 0.0);
  vec3 n = normalize(vec3(fishSDF(p + e.xyy, gape, pp) - fishSDF(p - e.xyy, gape, pp), fishSDF(p + e.yxy, gape, pp) - fishSDF(p - e.yxy, gape, pp), fishSDF(p + e.yyx, gape, pp) - fishSDF(p - e.yyx, gape, pp)));
  vec3 nw = normalize(F * n.x + Up * n.y + Z * n.z);
  vec3 xw = ro + rd * t;
  // lit by our light only (its own lure doesn't light its face)
  vec3 Ld = normalize(uL - xw); float r2 = dot(uL - xw, uL - xw);
  vec3 E = uLI * exp(-SIG_T * sqrt(r2)) / (r2 + 0.0009);
  float diff = max(dot(nw, Ld), 0.0);
  vec3 hv = normalize(Ld - rd);
  vec3 alb = vec3(0.10, 0.075, 0.065) * (0.65 + 0.7 * vnoise(p.xy * 90.0 + p.z * 40.0));
  float sh = 45.0, ks = 0.35;                                              // wet, slightly glossy skin
  bool inMouth = length((p - vec3(0.17, -0.035, 0.0)) / vec3(0.13, 0.045 + 0.05 * gape, 0.125)) < 1.0;
  if (part == 0.0 && inMouth) alb *= 0.25;                                  // the dark inside of it
  if (part == 1.0){ alb = vec3(0.75, 0.74, 0.68); sh = 80.0; ks = 0.9; }     // teeth: glassy, catching the light
  if (part == 2.0){ alb = vec3(0.02); sh = 400.0; ks = 4.0; }               // the eye shines back
  if (part == 3.0){ alb = vec3(0.10, 0.08, 0.07); }
  vec3 col = E * (alb * (diff * 0.85 + 0.15) + ks * pow(max(dot(nw, hv), 0.0), sh));
  T = t;
  return col * exp(-SIG_V * t) * uFishP.w;
}
void main(){
  vec2 ndc = gl_FragCoord.xy / uRes * 2.0 - 1.0;
  vec3 rd = normalize(uFwd + uRight * ndc.x * uTan.x + uUp * ndc.y * uTan.y), ro = uEye;
  float T = 40.0;
  // the whale, if it is passing, is the far wall of everything
  vec3 c = whale(ro, rd, T);
  float Tg = T; vec3 cg = great(ro, rd, Tg);
  if (Tg < T){ c = cg; T = Tg; }
  float Tf = T; vec3 cf = fish(ro, rd, Tf);
  if (Tf < T){ c = cf; T = Tf; }
  float Ts = T; vec3 cs = squid(ro, rd, Ts);
  if (Ts < T){ c = cs; T = Ts; }
  // the creatures, composited far to near (JS sends them in that order); what is behind the whale is hidden
  for (int k = 0; k < 3; k++){
    Hit h = creature(k, ro, rd);
    if (h.t < T){ c = c * h.tr + h.c; }
    if (uJK[k].x == 2.0 && distance(uJP[k].xyz, ro) < T) c += atollaGlow(k, ro, rd);
  }
  // far above, the surface: a round window of warm light the size of a cup's mouth, a pale enamel rim round it,
  // tea leaves floating dark against it
  if (uSurf.y > 0.0 && rd.y > 0.0){
    float ts = (uSurf.x - ro.y) / rd.y;
    if (ts > 0.0 && ts < T){
      vec3 hp = ro + rd * ts;
      vec2 q = hp.xz - ro.xz * 0.0 - vec2(uEye.x, uEye.z);
      float R = 1.25, rq = length(q);
      vec2 w = q + 0.05 * vec2(vnoise(q * 3.0 + uTime * 0.4), vnoise(q * 3.0 + 7.0 - uTime * 0.3)) - 0.025;
      // the light coming down through it: brightest in the middle, shimmering with the surface's ripples
      float ripple = 0.70 + 0.35 * vnoise(w * 5.0 + uTime * 0.4) + 0.5 * pow(vnoise(w * 13.0 - uTime * 0.8), 3.0);
      float centre = 1.0 - 0.55 * smoothstep(0.0, R, rq);
      vec3 win = vec3(1.0, 0.74, 0.42) * ripple * centre * smoothstep(R, R * 0.95, rq) * 0.55;
      // the cup's enamel rim, lit from within
      float rim = smoothstep(R * 0.97, R, rq) * smoothstep(R * 1.12, R * 1.02, rq);
      win += vec3(0.90, 0.82, 0.70) * rim * 0.35;
      // tea leaves floating, dark, curled
      for (int k = 0; k < 7; k++){
        float fk = float(k);
        vec2 lc = vec2(cos(fk * 2.4 + uTime * 0.02), sin(fk * 2.4 + uTime * 0.02)) * (0.18 + 0.13 * fk);
        float la = fk * 1.7 + uTime * 0.05;
        vec2 lq = q - lc; lq = mat2(cos(la), -sin(la), sin(la), cos(la)) * lq;
        float len_ = 0.13 + 0.06 * fract(fk * 0.61);
        float wid = 0.05 * sqrt(max(1.0 - pow(lq.x / len_, 2.0), 0.0)) * (1.0 + 0.3 * sin(lq.x * 25.0 + fk));
        float leaf = smoothstep(0.004, -0.004, abs(lq.y + 0.02 * sin(lq.x * 12.0)) - wid) * step(abs(lq.x), len_);
        win *= 1.0 - 0.9 * leaf;
      }
      c += win * uSurf.y * exp(-SIG_V * ts * 0.4);
    }
  }
  // far, far above, the last of the daylight: a faint blue that only shows looking up (against it, what passes overhead
  // is a shadow)
  if (T > 39.0) c += vec3(0.0015, 0.010, 0.030) * pow(max(rd.y - 0.05, 0.0), 1.8) * uDown;
  // the light itself: a small hot core
  vec3 lo = uL - ro; float t0 = dot(lo, rd); float hl2 = max(dot(lo, lo) - t0 * t0, 0.0);
  if (t0 > 0.0 && t0 < T + 0.05) c += uLI * exp(-SIG_V * t0) * (40.0 * exp(-hl2 / 1.6e-5) + 0.0006 / (hl2 + 0.0004));
  // the lure has a core just like it
  if (uLI2.r > 0.0){
    vec3 l2 = uL2 - ro; float s0 = dot(l2, rd), q2 = max(dot(l2, l2) - s0 * s0, 0.0);
    if (s0 > 0.0 && s0 < T + 0.05) c += uLI2 * exp(-SIG_V * s0) * (40.0 * exp(-q2 / 1.6e-5) + 0.0006 / (q2 + 0.0004));
  }
  // and the water between, lit; light scattered many times fills a wide, soft, cold sphere round it
  c += inscatter(ro, rd, T);
  if (t0 > 0.0) c += uLI.r * (vec3(0.0, 0.06, 0.20) * 0.010 / (hl2 + 0.10) + vec3(0.0, 0.03, 0.12) * 0.004 / (hl2 + 0.7)) * exp(-0.25 * t0);
  // and over it all, the squid's ink where it is
  c = inkCloud(ro, rd, T, c);
  o = vec4(c, T);
}`;

/* ---------------------------------------------------------------- the tentacles */
const VS_TENT = `#version 300 es
precision highp float;
uniform vec3 uEye, uFwd, uRight, uUp; uniform vec2 uTan;
uniform float uTime;
uniform vec4 uJP[3]; uniform vec4 uJU[3]; uniform vec4 uJK[3];
uniform int uSeg;            // vertices per tentacle
uniform float uDim;          // (the squid's ink closing over everything)
out vec3 vC;
` + COMMON + `
void main(){
  int inst = gl_InstanceID, seg = gl_VertexID;
  float s = float(seg) / float(uSeg - 1);
  // instances 0–95: the moon jelly's fringe; 96–119: Atolla's margin; 120: Atolla's long trailing tentacle
  int k = 0; float ang, len_, rad, fr = 1.0;
  int jm = -1, ja = -1;
  for (int i = 0; i < 3; i++){ if (uJK[i].x == 0.0) jm = i; if (uJK[i].x == 2.0) ja = i; }
  if (inst < 96){ k = jm; ang = float(inst) / 96.0 * 6.2832; len_ = 0.55 + 0.35 * fract(float(inst) * 0.618); rad = 1.0; }
  else if (inst < 120){ k = ja; ang = float(inst - 96) / 24.0 * 6.2832; len_ = 0.9 + 0.4 * fract(float(inst) * 0.618); rad = 1.02; }
  else { k = ja; ang = 1.3; len_ = 14.0; rad = 0.9; fr = 0.6; }
  if (k < 0){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); vC = vec3(0.0); return; }
  vec4 P = uJP[k], UU = uJU[k];
  float sz = P.w, pulse = UU.w;
  vec3 u = normalize(UU.xyz), a = normalize(cross(u, abs(u.z) < 0.9 ? vec3(0, 0, 1) : vec3(1, 0, 0))), b = cross(u, a);
  float ym = k == jm ? -0.04 - 0.06 * pulse : -0.02;
  float Rx = 1.08 - 0.15 * pulse, Ry = 0.62 + 0.14 * pulse;
  float R = (k == jm ? Rx * sqrt(max(1.0 - pow((ym + 0.26) / Ry, 2.0), 0.0)) : 1.0) * rad;
  vec2 dir = vec2(cos(ang), sin(ang));
  // hanging down, swaying; the long one trails off in slow curves
  float y = ym - s * len_;
  float sw = 0.12 * s * s * len_;
  vec2 off = dir * (R - 0.08 * s * fr) + vec2(sin(uTime * 1.1 - s * 5.0 + ang * 3.0), cos(uTime * 0.9 - s * 4.0 + ang * 2.0)) * sw * fr;
  if (inst == 120) off += vec2(sin(s * 6.0 - uTime * 0.4), sin(s * 4.3 - uTime * 0.3 + 1.0)) * s * 1.6;
  vec3 local = vec3(off.x, y, off.y);

  vec3 v = p - uEye; float z = dot(v, uFwd);
  gl_Position = vec4(dot(v, uRight) / uTan.x, dot(v, uUp) / uTan.y, z * 0.01, z);

  vec3 E = lightAt(p);
  float fwd = HG(dot(normalize(p - uL), -normalize(v)), 0.5) * 4.0 * PI;
  vC = E * (k == jm ? vec3(0.9, 0.95, 1.0) : vec3(0.7, 0.12, 0.12)) * (0.012 + 0.02 * fwd) * (1.0 - 0.7 * s);
  if (k == ja) vC += vec3(0.05, 0.2, 0.6) * 0.004 * (1.0 - s) * (inst == 120 ? 0.4 : 1.0);

}`;
const FS_TENT = `#version 300 es
precision highp float;
in vec3 vC; out vec4 o;
void main(){ o = vec4(vC, 1.0); }`;

/* ---------------------------------------------------------------- marine snow */
const VS_SNOW = `#version 300 es
precision highp float;
layout(location = 0) in vec4 aP;      // where it started (in a 4 m box), and a seed
uniform vec3 uEye, uFwd, uRight, uUp; uniform vec2 uTan; uniform vec2 uRes;
uniform float uTime, uFocus, uAperture, uSink;
uniform sampler2D uDepth;            // the sea pass: alpha is how far the ray went before something solid
out vec2 vUV; out vec3 vC; out float vSharp; out float vSeed;
` + COMMON + `
void main(){
  int corner = gl_VertexID;
  vec2 cq = vec2(corner & 1, corner >> 1) * 2.0 - 1.0;
  float h = aP.w;
  // slowly sinking, turning in the current
  vec3 p = aP.xyz + vec3(0.03 * sin(uTime * 0.11 + h * 40.0), -0.010 - 0.012 * fract(h * 17.0), 0.03 * cos(uTime * 0.09 + h * 30.0)) * uTime * 0.5
         + vec3(sin(uTime * 0.6 + h * 9.0), 0.0, cos(uTime * 0.5 + h * 7.0)) * 0.004;
  p.y += uSink;                                                      // as the light goes deeper, the snow seems to rise past
  p = uEye + mod(p - uEye + 2.0, 4.0) - 2.0;
  vec3 v = p - uEye; float z = dot(v, uFwd);
  if (z < 0.06){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  vec2 ndc = vec2(dot(v, uRight) / (z * uTan.x), dot(v, uUp) / (z * uTan.y));
  if (abs(ndc.x) < 1.0 && abs(ndc.y) < 1.0 && texture(uDepth, ndc * 0.5 + 0.5).a < length(v)){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  float rad = 0.0006 + 0.0022 * pow(fract(h * 31.0), 3.0);                    // mostly tiny, a few big flakes
  float pxPhys = rad / (z * uTan.y) * uRes.y * 0.5;
  float coc = uAperture * abs(z - uFocus) / z * uRes.y;                        // out of focus: a disc
  float size = max(max(pxPhys, coc), 0.8);
  // how bright: the light on it (strongly forward), the water between it and the eye, its light spread over the disc
  vec3 E = lightAt(p);
  float fwd = HG(dot(normalize(p - uL), -normalize(v)), 0.6) * 4.0 * PI;
  // only what the light reaches is seen at all: outside its sphere the snow is lost in the dark
  float reach = exp(-2.4 * max(length(p - uL) - 0.30, 0.0));
  vec3 c = E * 0.7 * reach * (0.25 + 0.75 * fwd) * min(1.0, (pxPhys * pxPhys + 0.08) / (size * size));
  // a few are alive and glow blue now and then
  if (fract(h * 53.0) < 0.07){
    float blink = pow(max(sin(uTime * (0.4 + fract(h * 7.0)) + h * 60.0), 0.0), 30.0);
    c += vec3(0.10, 0.45, 1.0) * (0.002 + 0.08 * blink) / (size * size * 0.5 + 0.5);
  }
  vC = c * exp(-SIG_V * z);
  vSharp = smoothstep(2.5, 1.0, coc);

const FS_SNOW = `#version 300 es
precision highp float;
in vec2 vUV; in vec3 vC; in float vSharp; in float vSeed;
out vec4 o;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
void main(){
  float r = length(vUV);

  float ang = atan(vUV.y, vUV.x);
  float lump = 0.75 + 0.25 * sin(ang * 3.0 + vSeed * 50.0) * sin(ang * 5.0 + vSeed * 20.0);
  float edge = mix(1.0, lump, vSharp);
  float m = smoothstep(edge, edge * 0.82, r) * (1.0 + 0.25 * (1.0 - vSharp) * smoothstep(0.5, 0.9, r));
  o = vec4(vC * m, 1.0);

/* ---------------------------------------------------------------- the plankton the whale wakes
   Laid out along the whale's way through the water (not round the eye like the snow), thickest where its skin will
   pass. Each flashes blue as the skin comes by; the water stirred by the thick of its body keeps glowing a while after,
   fading; the bow wave starts them ahead of its head. So the whole great shape goes by outlined in blue sparks. */
const VS_PLK = `#version 300 es
precision highp float;
layout(location = 0) in vec4 aP;      // along the way (-1…1), out from it (0…1), round it (angle), a seed
uniform vec3 uEye, uFwd, uRight, uUp; uniform vec2 uTan; uniform vec2 uRes;
uniform float uTime, uFocus, uAperture;
uniform vec4 uGW, uGF;               // the whale's middle now (on/off); which way it swims
uniform vec4 uGP;                    // its way: the point nearest the eye's view (world), how far its middle is past it (m)
uniform float uGS;                   // its speed (m/s)
uniform sampler2D uDepth;
out vec2 vUV; out vec3 vC; out float vSharp; out float vSeed;
const vec3 SIG_V = vec3(0.10, 0.06, 0.045);
float bodyR(float x){
  float u = clamp((x + 7.5) / 14.0, 0.0, 1.0);
  float head = sqrt(max(1.0 - pow(max(u - 0.60, 0.0) / 0.40, 2.0), 0.0));
  float tail = pow(smoothstep(0.0, 0.60, u), 0.80);
  return 1.55 * head * tail + 0.10;
}
void main(){
  vec2 cq = vec2(gl_VertexID & 1, gl_VertexID >> 1) * 2.0 - 1.0;
  vec3 F = uGF.xyz, Up = vec3(0.0, 1.0, 0.0), Z = normalize(cross(F, Up)); Up = cross(Z, F);
  float h = aP.w, X = aP.x * 9.0, rho = 0.75 + 1.85 * aP.y, ph = aP.z;
  vec3 p = uGP.xyz + F * X + Up * rho * sin(ph) * 0.88 + Z * rho * cos(ph);
  p += vec3(sin(uTime * 0.3 + h * 40.0), sin(uTime * 0.25 + h * 30.0), cos(uTime * 0.2 + h * 20.0)) * 0.03;
  float xl = X - uGP.w, r = bodyR(xl), dn = rho - r;
  float now = (xl > -7.6 && xl < 6.6) ? exp(-max(dn, 0.0) / 0.22) * step(-0.10, dn) : 0.0;
  float tau = (1.0 - xl) / uGS;
  float wake = tau > 0.0 ? exp(-max(rho - 1.65, 0.0) / 0.35) * exp(-tau / 1.3) * 0.7 : 0.0;
  float bow = (xl > 5.8 && xl < 7.2) ? exp(-max(rho - 0.6, 0.0) / 0.3) * smoothstep(7.2, 6.2, xl) : 0.0;
  float g = max(max(now, wake), bow) * (0.30 + 0.70 * pow(0.5 + 0.5 * sin(uTime * (6.0 + 9.0 * h) + h * 90.0), 3.0));
  vec3 v = p - uEye; float z = dot(v, uFwd);
  // brightest along its outline (where its skin turns away from the eye): so the shape reads, not just a field of sparks
  vec3 nl = normalize(Up * sin(ph) / 0.88 + Z * cos(ph));
  float sil = 1.0 - abs(dot(nl, normalize(v)));
  g *= 0.22 + 0.78 * sil * sil;
  if (g < 0.01 || uGW.w <= 0.0 || z < 0.1){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  vec2 ndc = vec2(dot(v, uRight) / (z * uTan.x), dot(v, uUp) / (z * uTan.y));
  if (abs(ndc.x) > 1.05 || abs(ndc.y) > 1.05 || texture(uDepth, ndc * 0.5 + 0.5).a < length(v) - 0.03){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  float coc = uAperture * abs(z - uFocus) / z * uRes.y;
  float size = max(coc, 1.0);
  vC = vec3(0.30, 0.85, 1.0) * 0.12 * g / (size * size * 0.30 + 0.70) * exp(-SIG_V * z * 0.5);
  vSharp = smoothstep(2.5, 1.0, coc);
  vSeed = h;
  vUV = cq;
  gl_Position = vec4(ndc + cq * (size + 1.0) / uRes * 2.0, 0.5, 1.0);
}`;

/* ---------------------------------------------------------------- small lit lives: rows of blue photophores */
const VS_GLOW = `#version 300 es

const FS_GLOW = `#version 300 es

in vec2 vUV; in float vI; in float vR; in vec3 vK; in float vSoft;

/* ---------------------------------------------------------------- developing the picture */
const FS_POST = `#version 300 es

uniform sampler2D uA, uB; uniform vec2 uRes; uniform float uExp, uTime, uFade, uTea, uFlash;
out vec4 o;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;

  // (world only) the light that will be 一粒光: a metre in front, drifting

<script>
/* ---- src/worlds/sea.js ---- */
/* ============================================================================
   世界五 · 海 —— 透明水彩
   ----------------------------------------------------------------------------
   珠从皮影的浪线落下去，下面是一张湿着的水彩：
   · 颜料是「吸收」：每一层都是乘上去的（Beer–Lambert），颜色越叠越深、越透；纸的白就是光。
   · 水是湿画法一大片：青、天蓝、群青互相渗，深处一点紫；干了以后又罩了一层，边是硬的、带一道深线；
     有水渍（回流的花边），撒过盐（小白星）；光从上面一条条「洗」出来。
   · 海带、成群的小鱼、几只橙色的小鱼、水母、气泡；一头座头鲸：深背浅腹，喉褶，白色的长鳍，藤壶，眼睛。
   · 珠是这里唯一的暖色：四周的颜料被提掉，留出纸白，一圈藤黄晕开。
   · 后来一只鱿鱼受惊，喷出一团墨：墨在湿纸里炸开、羽化，越来越大，颜色被它吃掉——水墨。
   坐标：海的单位 = 一个画面高（缩放 1 时）；海面在 y = 0，往下是负的。
   ========================================================================== */
(() => {
'use strict';
const YL = window.YL;
const W = (YL.worlds = YL.worlds || {});
const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
const HEAD = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime;

const vec3 INDI = vec3(0.80, 0.73, 0.54);

const FS = HEAD + `
uniform vec2 uCam; uniform float uZoom;

// ---- giant kelp: a thin stipe swaying, with long blades streaming off it, each a glaze of its own (so they darken

float kelpFrond(vec2 p, float x0, float top, float sc, float ph, float sway, out float lit){
  float dens = 0.0; lit = 0.0;
  float base = -1.1;
  // the stipe's centre at height y
  #define CX(y) (x0 + sway * pow(clamp(((y) - base) / (top - base), 0.0, 1.0), 1.6) * sin((y) * 2.4 + uTime * 0.5 + ph) + 0.012 * sin((y) * 7.0 + ph * 2.0 + uTime * 0.9))
  if (p.y > top + 0.25 || p.y < base - 0.02 || abs(p.x - x0) > 0.35) return 0.0;

    float fi = float(i);
    float y0 = base + 0.12 + fi * (top - base) / 14.0;

// grey under the belly, the pleats of the throat, a white wing of a flipper, knobs and barnacles, the eye
// its profile, from a humpback's proportions: half-heights above and below the spine, at u = 0, 0.1, ... 1.0
const float RD[11] = float[11](0.014, 0.046, 0.072, 0.090, 0.100, 0.100, 0.092, 0.074, 0.050, 0.028, 0.013);
const float RV[11] = float[11](0.012, 0.064, 0.104, 0.122, 0.124, 0.110, 0.088, 0.062, 0.038, 0.022, 0.013);
float prof(float u, bool up){
  float x = clamp(u, 0.0, 1.0) * 10.0;
  int i = int(min(floor(x), 9.0)); float f = x - float(i);
  int i0 = max(i - 1, 0), i2 = min(i + 1, 10), i3 = min(i + 2, 10);
  float a0 = up ? RD[i0] : RV[i0], a1 = up ? RD[i] : RV[i], a2 = up ? RD[i2] : RV[i2], a3 = up ? RD[i3] : RV[i3];
  // Catmull-Rom
  return 0.5 * ((2.0 * a1) + (-a0 + a2) * f + (2.0 * a0 - 5.0 * a1 + 4.0 * a2 - a3) * f * f + (-a0 + 3.0 * a1 - 3.0 * a2 + a3) * f * f * f);
}
float wOff(float u){ return 0.030 * u * u * u * sin(6.2832 * u * 0.6 - uTime * 1.0); }
void whale(vec2 p, vec4 Wh, float far, vec2 pearl, inout vec3 K, inout float body){
  vec3 Kw = K;
  float L = Wh.z;
  vec2 q = rot(-Wh.w) * (p - Wh.xy) / L;
  if (abs(q.x) > 0.72 || abs(q.y) > 0.5) return;
  float u = q.x + 0.5;
  float v = q.y - wOff(u);
  float rd = prof(u, true), rv = prof(u, false);
  rd += 0.010 * smoothstep(0.035, 0.0, abs(u - 0.66 - 0.6 * max(v - rd, 0.0)));          // the little dorsal fin
  float d = (v > 0.0 ? v - rd : -v - rv);
  d = smax(d, -(u + 0.004), 0.02);
  // the flukes, seen a little from above: two swept blades off the tail stock, beating with it
  vec2 R = vec2(0.93, wOff(0.93));
  float tAng = atan(wOff(1.0) - wOff(0.86), 0.14) * 1.6;
  vec2 fq = rot(-tAng) * (vec2(u, q.y) - R);
  float bladeA = sdSeg(fq, vec2(0.0), vec2(0.085, 0.075)) - 0.020 * (1.0 - clamp(dot(fq, vec2(0.085, 0.075)) / 0.0128, 0.0, 1.0)) - 0.004;
  float bladeB = sdSeg(fq, vec2(0.0), vec2(0.075, -0.060)) - 0.016 * (1.0 - clamp(dot(fq, vec2(0.075, -0.060)) / 0.0092, 0.0, 1.0)) - 0.003;
  float stock = max(abs(v) - 0.012, abs(u - 0.90) - 0.05);
  float flD = min(min(bladeA, bladeB), stock);
  d = smin(d, flD, 0.012);
  d += rough(q, 22.0, 0.003, 3.0);
  float dPx = d * L;
  float vSide = v / max(v > 0.0 ? rd : rv, 1e-3);
  float lost = smoothstep(-0.3, -0.9, vSide) * smoothstep(0.2, 0.7, fbm3(vec2(u * 9.0, 4.0)));      // where the belly melts into the water
  float bodyD = wash(dPx, mix(0.0015, 0.010, lost), 0.65 * (1.0 - lost), 0.007);
  float inB = smoothstep(0.002, -0.002, dPx);
  // counter-shading: dark back, the belly lifted, the two run together wet
  float vn = v / max(v > 0.0 ? rd : rv, 1e-3);                            // -1 belly .. +1 back
  float shade = smoothstep(-0.9, 0.7, vn + 0.25 * (fbm3(q * vec2(5.0, 12.0)) - 0.5));
  float dens = mix(0.10, 1.25, shade) * (0.80 + 0.40 * fbm3(q * vec2(5.0, 16.0) + 1.0));
  dens *= 0.85 + 0.30 * fbm3(vec2(u * 40.0, vn * 3.0) + 4.0);                   // the brush went along the body
  dens += 0.35 * smoothstep(0.55, 0.8, fbm3(q * 7.0 + 21.0)) * shade;          // pigment dropped in wet
  // white scars: thin scratches, mostly on the back half
  float sc1 = abs(fract(u * 9.0 + vn * 1.5 + 0.3 * fbm3(q * 8.0)) - 0.5);
  dens *= 1.0 - 0.6 * smoothstep(0.03, 0.0, sc1) * step(0.72, hash12(vec2(floor(u * 9.0 + vn * 1.5), 3.0))) * smoothstep(0.35, 0.8, u) * smoothstep(-0.2, 0.3, vn);
  // the light from above lifted out along the upper flank: a long pale streak following the body
  float streak = exp(-pow((vn - 0.35 - 0.12 * (fbm3(vec2(u * 6.0, 3.0)) - 0.5)) / 0.16, 2.0)) * smoothstep(0.03, 0.15, u) * smoothstep(0.85, 0.6, u);
  dens *= 1.0 - 0.38 * streak;
  // a second, darker glaze along the back, laid after the first dried: a wandering hard edge
  float ridge = vn - (0.62 + 0.25 * (fbm3(vec2(u * 7.0, 1.0)) - 0.5));
  dens += 0.40 * smoothstep(-0.02, 0.03, ridge) * (1.0 + 0.5 * exp(-max(ridge, 0.0) / 0.05)) * smoothstep(0.02, 0.08, u);
  // a bloom on the flank where water ran back in

  // the throat's pleats: pale lines parallel to the belly
  float pleatZone = smoothstep(0.02, 0.07, u) * smoothstep(0.52, 0.40, u) * smoothstep(-0.25, -0.55, vn);
  float pl = 0.5 + 0.5 * sin((vn + 1.0) * 26.0 + 2.5 * fbm3(q * 5.0));
  dens *= 1.0 - 0.55 * pleatZone * smoothstep(0.55, 0.95, pl);
  // the mouth: a long dark curve from the snout tip back and down, to under the eye
  float mouthV = -0.004 - 0.030 * smoothstep(0.0, 0.25, u);
  float mouth = abs(v - mouthV) * L;
  float mouthL = smoothstep(0.0016, 0.0005, mouth) * smoothstep(0.004, 0.02, u) * smoothstep(0.27, 0.22, u);
  // the eye, just above the corner of the mouth
  vec2 eyeP = vec2(0.245, -0.024);
  float eye = length((vec2(u, v) - eyeP) * vec2(1.0, 1.4)) * L;
  float eyeD = (smoothstep(0.0060, 0.0042, eye) + 0.45 * smoothstep(0.0110, 0.0085, eye) * smoothstep(0.0058, 0.0080, eye)) * 0.0;            // (the eye itself is drawn by bigEye, at every distance)
  // knobs along the head and barnacles on the chin: pale with a dark crescent
  vec2 bg = vec2(u, v) * 70.0;
  vec2 bi = floor(bg), bf = fract(bg) - 0.5;
  vec2 bo = (hash22(bi) - 0.5) * 0.5;
  float bs = 0.16 + 0.14 * hash12(bi + 2.0);
  float bh = hash12(bi + 7.0);
  float knobZone = smoothstep(0.20, 0.04, u) * smoothstep(0.1, 0.7, vn);
  float barnZone = smoothstep(0.17, 0.05, u) * smoothstep(-0.4, -0.85, vn);
  float bd = length(bf - bo) - bs;
  float isB = step(bh, 0.45 * knobZone + 0.6 * barnZone);
  dens *= 1.0 - 0.45 * smoothstep(0.03, -0.02, bd) * isB;
  dens += 0.6 * smoothstep(0.05, 0.0, abs(bd + 0.02)) * smoothstep(0.0, 0.3, bf.y - bo.y) * isB;
  float hueN = fbm3(vec2(u * 3.0, v * 6.0) + 11.0);
  vec3 wK = mix(INDI * 0.55 + ULTR * 0.55 + SIEN * 0.12, INDI * 0.6 + VIOL * 0.45 + SIEN * 0.2, smoothstep(0.35, 0.65, hueN));
  wK = mix(wK, INDI * 0.55 + TURQ * 0.35 + SIEN * 0.25, smoothstep(0.6, 0.95, u) * 0.7);
  // the flipper: long and white, knobbly along its leading edge, rowing slowly
  vec2 root = vec2(0.255, -rv * 0.55 + wOff(0.255));
  float fa = -0.80 + 0.18 * sin(uTime * 0.7);
  vec2 fd = rot(-fa) * (vec2(u, q.y) - root);
  float fu = fd.x / 0.31;
  float prof_ = pow(sin(PI * clamp(fu * 0.92 + 0.06, 0.0, 1.0)), 0.55) * (1.0 - 0.5 * clamp(fu, 0.0, 1.0));
  float wLead = 0.034 * prof_, wTrail = 0.022 * prof_;
  // the knobs along the leading edge: round scallops
  float knob = 0.0042 * sqrt(max(sin(fu * PI * 13.0), 0.0)) * smoothstep(0.05, 0.2, fu) * smoothstep(1.0, 0.8, fu);
  float flip = fd.y > 0.0 ? fd.y - wLead - knob : -fd.y - wTrail;
  flip = max(flip, max(-fd.x + 0.005, fd.x - 0.31));
  flip += rough(fd, 30.0, 0.002, 8.0);
  float fpx = flip * L;
  float flipD = wash(fpx, 0.0015, 1.3, 0.004);
  float flipIn = smoothstep(0.0015, -0.0015, fpx);
  vec3 add = wK * bodyD * dens + (INDI * 0.65 + SIEN * 0.15) * (mouthL * 1.1 + eyeD * 1.7) * inB;
  // over the body the flipper is lifted nearly to white, mottled; its leading edge darker
  float trail = smoothstep(0.0, -0.02, fd.y);
  vec3 flipK = (INDI * 0.20 + CERU * 0.15 + VIOL * 0.08) * flipD * (0.5 + 0.7 * fbm3(fd * 25.0)) * (0.5 + 0.9 * trail)
             + (INDI * 0.5 + ULTR * 0.2) * smoothstep(-0.005, 0.0, fpx) * flipIn * step(0.0, fd.y) * 0.8
             + (INDI * 0.6) * smoothstep(0.75, 0.9, fbm3(fd * 40.0 + 3.0)) * flipIn * 0.5;
  add = mix(add, flipK, flipIn);
  // the pearl's light on the flank: the paint lifted round it, warmed
  float pd = length(p - pearl);
  add *= 1.0 - 0.55 * exp(-pd / 0.09) * inB;
  add += GAMB * 0.25 * exp(-pd / 0.07) * inB;
  // the body is painted round, not over: inside it, the water's colour is mostly gone (a little stays: the water between us)
  float cov = max(clamp(bodyD, 0.0, 1.0) * smoothstep(0.004, -0.002, dPx + 0.004 * lost), flipIn);
  cov = max(cov, smoothstep(0.0015, -0.0015, dPx));
  vec3 inside = add + Kw * (0.22 + 0.5 * far);
  K = mix(Kw + add * (1.0 - cov), inside, cov);
  body = max(body, cov);
}

// ---- a squid, painted in rose and sienna, its chromatophores freckling it; arms trailing; the fins flapping
void squid(vec2 p, vec4 S, vec4 SB, inout vec3 K){
  if (SB.x <= 0.0) return;
  vec2 q = rot(-S.w) * (p - S.xy) / S.z;            // its mantle points along +x (it jets that way)
  if (length(q) > 2.6) return;
  float jet = SB.y;
  float mantle = sdEll(q - vec2(0.35, 0.0), vec2(0.62 * (1.0 - 0.10 * jet), 0.20 * (1.0 + 0.12 * jet)));
  float fin = sdEll(rot(0.0) * (q - vec2(0.80, 0.0)), vec2(0.18, 0.30 + 0.05 * sin(uTime * 6.0)));
  float head = sdEll(q - vec2(-0.30, 0.0), vec2(0.13, 0.15));
  float body = min(min(mantle, fin), head);
  float arms = 1e9;
  for (int i = 0; i < 6; i++){
    float fi = float(i) - 2.5;
    float x = -q.x - 0.38;
    if (x < 0.0) continue;
    float cy = fi * 0.040 * (1.0 + x * 1.4) + 0.05 * sin(x * 6.0 - uTime * 4.0 + fi);
    float w = 0.022 * (1.0 - x / 0.9);
    arms = min(arms, max(abs(q.y - cy) - w, x - 0.9 - 0.25 * step(abs(fi), 0.6)));
  }
  body = min(body, arms);
  body += rough(q, 18.0, 0.02, 4.0);
  float d = body * S.z;
  float b = wash(d, 0.0015, 0.8, 0.005);
  float spots = smoothstep(0.55, 0.75, vnoise(q * 26.0)) * step(d, 0.0);
  float eye = smoothstep(0.045, 0.030, length(q - vec2(-0.27, 0.05)));
  vec3 sK = (ROSE * 0.7 + SIEN * 0.45) * b * (0.7 + 0.3 * fbm3(q * 6.0)) + SIEN * 0.8 * spots + INDI * 1.2 * eye;
  K = mix(K, sK + K * 0.25, clamp(b, 0.0, 1.0) * SB.x);
}
// ---- a school of small silver fish: a whirling ball of darts round a centre, thinning at its edge
void fishBall(vec2 p, vec2 c, float R, float squash, float spin, float seed, inout vec3 K){
  vec2 sp = (p - c) / R;
  float sr = length(sp * vec2(1.0, squash));
  if (sr > 1.15) return;
  float dens = smoothstep(1.05, 0.55, sr + 0.25 * (fbm3(sp * 2.0 + seed + uTime * 0.05) - 0.5)) * smoothstep(0.05, 0.22, sr);
  float a = atan(sp.y * squash, sp.x) - uTime * spin;
  float rings = 14.0 * R / 0.3;
  vec2 polar = vec2(a * floor(9.0 + 26.0 * R) / PI, sr * rings);
  vec2 cell = floor(polar), f = fract(polar) - 0.5;
  vec2 j = hash22(cell + seed) - 0.5;
  if (hash12(cell + 3.1 + seed) > 0.25 + 0.6 * dens) return;
  float ta = atan(sp.y * squash, sp.x) + PI * 0.5 * sign(spin);
  vec2 fq = rot(-ta) * (f - j * 0.45) * vec2(PI * sr * R * 2.0 / floor(9.0 + 26.0 * R), R / rings);
  float fd = fish(fq, 0.026);
  float fdens = wash(fd, 0.0012, 0.6, 0.003);
  K += (INDI * 0.8 + ULTR * 0.6) * fdens * 0.95;
  K *= 1.0 - 0.45 * smoothstep(0.004, 0.0, abs(fq.y + 0.0012)) * step(fd, 0.0);        // a silver flash along each flank
}
// ---- a manta, gliding: dark above, its wings rising and falling slowly; painted round, its belly edge pale
void manta(vec2 p, vec2 c, float s, float ph, inout vec3 K){
  vec2 q = (p - c) / s;
  if (abs(q.x) > 1.4 || abs(q.y) > 1.0) return;
  float flap = sin(uTime * 1.1 + ph);
  float wing = abs(q.x);
  // the body seen a little from above: a broad diamond whose tips rise and fall
  float yTip = 0.18 * flap * wing * wing;
  float top = 0.30 * (1.0 - wing) * (1.0 - 0.3 * wing) + 0.10 + yTip;
  float bot = -0.18 * (1.0 - wing) - 0.04 + yTip;
  float d = max(max(q.y - top, bot - q.y), wing - 1.0 + 0.15 * max(q.y - yTip, 0.0));
  // the horns in front and the whip of a tail behind
  float horns = min(sdSeg(q, vec2(-0.08, 0.36), vec2(-0.13, 0.50)), sdSeg(q, vec2(0.08, 0.36), vec2(0.13, 0.50))) - 0.035;
  float tail = sdSeg(q, vec2(0.0, -0.12), vec2(0.04 * sin(uTime * 2.0 + ph), -0.80)) - 0.012;
  d = min(d, min(horns, tail));
  d += rough(q, 14.0, 0.02, ph);
  float dpx = d * s;
  float b = wash(dpx, 0.0015, 0.7, 0.006);
  float cov = clamp(b, 0.0, 1.0);
  float shade = smoothstep(-0.2, 0.3, q.y - yTip);
  vec3 mK = (INDI * 0.9 + ULTR * 0.5) * mix(0.55, 1.1, shade) * (0.85 + 0.3 * fbm3(q * 5.0 + ph));
  K = mix(K, mK + K * 0.25, cov * 0.92);
}
// ---- the whale's eye: an almond between heavy lids, the folds of skin following the lids' line; the eye wet and dark,
// a highlight lifted out of it, and in it, small and warm, the pearl
void bigEye(vec2 p, vec2 c, float r, float lid, vec2 pearl, inout vec3 K){
  vec2 q = (p - c) / r;
  if (dot(q, q) > 120.0) return;
  q = rot(-0.12) * q;
  // the almond: two arcs meeting at the corners
  float open_ = mix(0.06, 1.0, lid);
  float halfH = 0.62 * open_ * sqrt(max(1.0 - q.x * q.x / 1.9, 0.0));
  float almond = max(abs(q.y + 0.04 * q.x) - halfH, abs(q.x) - 1.38);
  // the folds round it: lines that follow the almond outward, looser and fainter as they go
  float lev = abs(q.y) / max(0.62 * sqrt(max(1.0 - q.x * q.x / 9.0, 0.02)), 0.05) + 0.25 * abs(q.x);
  float fold = abs(fract(lev * 1.3 + 0.12 * fbm3(q * 1.3)) - 0.5);
  float folds = smoothstep(0.07, 0.0, fold - 0.015) * smoothstep(1.1, 1.6, lev) * smoothstep(5.5, 2.5, lev);
  K += INDI * folds * 0.30 * (0.6 + 0.4 * vnoise(q * 2.0));
  // the skin round the eye a shade darker, laid wet so it melts out into the rest
  K += (INDI * 0.30 + VIOL * 0.08) * smoothstep(4.8, 1.3, lev + 0.6 * (fbm3(q * 0.8) - 0.5));
  // a few barnacles below and behind it: pale rings with a dark crescent, in a cluster
  vec2 bq = q - vec2(2.6, -2.4);
  if (dot(bq, bq) < 9.0){
    vec2 bg = bq * 1.6, bi = floor(bg), bf = fract(bg) - 0.5;
    float bh = hash12(bi + 31.0);
    if (bh < 0.55 * smoothstep(3.0, 0.8, length(bq))){
      vec2 bo = (hash22(bi + 2.0) - 0.5) * 0.4;
      float br = 0.16 + 0.14 * hash12(bi + 5.0);
      float bd = length(bf - bo) - br;
      K *= 1.0 - 0.55 * smoothstep(0.03, -0.02, bd);
      K += INDI * 0.9 * smoothstep(0.05, 0.0, abs(bd + 0.03)) * smoothstep(-0.1, 0.2, (bf - bo).y);
      K += INDI * 0.6 * smoothstep(0.06, 0.0, length(bf - bo) - br * 0.3);
    }
  }
  // the heavy lid line and a shadow under the upper lid
  float rim = smoothstep(0.10, 0.0, abs(almond)) ;
  K += INDI * rim * 0.9;
  if (almond < 0.0){
    vec3 eK = INDI * 2.2 + SIEN * 0.5;
    float iris = smoothstep(0.30, 0.55, length(q * vec2(0.8, 1.0)));
    eK = mix(eK, SIEN * 1.5 + INDI * 0.7, iris * 0.55);
    eK += INDI * 0.6 * smoothstep(0.0, 0.35, q.y + 0.04 * q.x - halfH + 0.35);           // the lid's shadow on it
    float hl = smoothstep(0.24, 0.10, length((q - vec2(-0.35, 0.18)) * vec2(0.8, 1.3)));
    eK *= 1.0 - 0.85 * hl;
    vec2 pd = normalize(pearl - c + 1e-5) * 0.30;
    float warm = smoothstep(0.12, 0.03, length(q - pd));
    eK = mix(eK, GAMB * 0.25, warm);
    K = mix(K, eK, smoothstep(0.03, -0.03, almond));
  }
}
void main(){
  vec2 px = gl_FragCoord.xy;
  vec2 s = (px - 0.5 * uRes) / uRes.y;
  vec2 p = s * uZoom + uCam;                   // the world, where the eye is
  vec3 K = vec3(0.0);
  // ===== the water
  vec2 w = s * uZoom * 0.8 + uCam * vec2(0.6, 1.0);
  float depth = -p.y;
  float m1 = fbm(w * vec2(1.1, 1.6) + vec2(3.0, uTime * 0.01));
  float m2 = fbm(w * vec2(1.6, 1.2) + vec2(9.0, 2.0));
  float m3 = fbm(w * 2.3 + 17.0);
  float streak = fbm(vec2(w.x * 0.9, w.y * 9.0) + 5.0);
  float dd = clamp(depth, 0.0, 4.0);
  float mot = mix(0.30, 0.14, smoothstep(0.8, 2.5, dd));
  float wd = 0.30 + 0.60 * min(dd, 1.0) + 0.16 * min(max(dd - 1.0, 0.0), 2.0) + mot * (m1 - 0.5) + 0.08 * (streak - 0.5);
  vec3 mixK = mix(TURQ * 0.85, CERU, smoothstep(0.35, 0.65, m1));
  mixK = mix(mixK, mix(PHTH, ULTR, 0.35) * 1.05, smoothstep(0.2, 1.0, dd) * smoothstep(0.35, 0.7, m2));
  mixK += VIOL * (0.25 * smoothstep(0.62, 0.8, m3) * smoothstep(0.3, 1.0, dd) + 0.10 * smoothstep(1.8, 4.0, dd));
  mixK = mix(mixK, PHTH * 0.75 + TURQ * 0.30, 0.45 * smoothstep(1.0, 2.6, dd));
  K += mixK * wd;
  float gEdge = -0.60 - 0.22 * w.x + 0.14 * (fbm3(vec2(w.x * 2.3, 2.0)) - 0.5) + 0.05 * (fbm3(vec2(w.x * 9.0, 7.0)) - 0.5);
  float gd = gEdge - w.y;
  float g2 = smoothstep(-0.003, 0.006, gd) * (1.0 + 0.5 * exp(-max(gd, 0.0) / 0.008)) * (0.6 + 0.4 * fbm3(w * 3.0 + 2.0));
  K += (ULTR * 0.45 + CERU * 0.2) * g2 * (0.18 + 0.22 * clamp(dd, 0.0, 1.5));
  vec2 bl = bloom(w, vec2(-0.50, -0.92), 0.075, 1.0);
  K *= 1.0 - 0.16 * bl.x; K += ULTR * bl.y * 0.22;
  vec2 bl2 = bloom(w, vec2(0.62, -1.62), 0.055, 7.0);
  K *= 1.0 - 0.14 * bl2.x; K += ULTR * bl2.y * 0.18;
  // shafts of light from the surface, lifted out
  vec2 sun = vec2(-0.55, 1.35);
  vec2 rd = p - sun;
  float ang = atan(rd.x, -rd.y);
  float shafts = smoothstep(0.55, 0.95, vnoise(vec2(ang * 22.0 + uTime * 0.05, 0.5)));
  shafts += 0.6 * smoothstep(0.5, 0.9, vnoise(vec2(ang * 47.0 - uTime * 0.07, 3.5)));
  shafts *= (exp(-max(depth - 0.1, 0.0) * 1.0) * 0.8 + 0.2 * exp(-max(depth - 0.1, 0.0) * 0.35)) * (0.75 + 0.5 * vnoise(vec2(ang * 30.0, length(rd) * 3.0)));
  K *= 1.0 - 0.5 * clamp(shafts, 0.0, 1.2);
  // near the surface the light comes through in a net of caustic lines
  float caus = 1.0 - abs(vnoise(p * vec2(9.0, 14.0) + vec2(uTime * 0.3, 0.0)) * 2.0 - 1.0);
  K *= 1.0 - 0.35 * smoothstep(0.82, 0.97, caus) * exp(-max(depth, 0.0) / 0.25);
  // salt in the wet wash
  {
    vec2 sg = w * 46.0, si = floor(sg), sf = fract(sg) - 0.5;
    float h = hash12(si);
    float cluster = smoothstep(0.55, 0.75, fbm3(w * 2.2 + 31.0));
    if (h < 0.30 * cluster){
      vec2 o2 = (hash22(si + 4.0) - 0.5) * 0.5;
      vec2 sq = sf - o2;
      float sa = atan(sq.y, sq.x);
      float sr = length(sq) / (0.18 + 0.25 * hash12(si + 9.0));
      sr *= 1.0 + 0.35 * (vnoise(vec2(sa * 3.0, h * 50.0)) - 0.5);
      float salt = smoothstep(1.0, 0.25, sr) * smoothstep(0.2, 0.9, length(K));
      K *= 1.0 - 0.55 * salt; K += ULTR * 0.12 * smoothstep(0.85, 1.05, sr) * smoothstep(1.3, 1.05, sr) * step(0.01, salt + 0.01);
    }
  }
  // ===== far kelp (only near the surface)
  vec2 pf = s * uZoom + uCam * vec2(0.35, 0.7);
  float litf;
  float kfd = kelpFrond(pf, -0.80, 0.12 - 0.5, 0.75, 1.0, 0.06, litf) + kelpFrond(pf, 0.66, 0.20 - 0.5, 0.8, 4.0, 0.07, litf)
            + kelpFrond(pf, 0.86, -0.05 - 0.5, 0.65, 6.0, 0.05, litf);
  K += (TURQ * 0.5 + SAPG * 0.25 + ULTR * 0.35) * min(kfd, 2.0) * 0.32;
  // ===== a school of small silver fish, whirling
  vec2 sc = vec2(0.45, -0.85);
  vec2 sp = p - sc;
  float sr = length(sp * vec2(1.0, 1.7));
  float school = smoothstep(0.30, 0.14, sr) * smoothstep(0.02, 0.07, sr);
  if (school > 0.0){
    float a = atan(sp.y * 1.7, sp.x) - uTime * 0.25;
    vec2 polar = vec2(a * 11.0 / PI, sr * 44.0);
    vec2 cell = floor(polar), f = fract(polar) - 0.5;
    vec2 j = hash22(cell) - 0.5;
    if (hash12(cell + 3.1) < 0.62){
      float ta = atan(sp.y * 1.7, sp.x) + PI * 0.5;
      vec2 fq = rot(-ta) * (f - j * 0.4) * vec2(PI * sr * 2.0 / 11.0, 1.0 / 44.0);
      float fd = fish(fq, 0.016);
      float fdens = wash(fd, 0.0012, 0.6, 0.003) * school;
      K += (INDI * 0.7 + ULTR * 0.6) * fdens * 0.8;
      K *= 1.0 - 0.4 * smoothstep(0.004, 0.0, abs(fq.y + 0.0012)) * step(fd, 0.0) * school;
    }
  }
  // ===== further down: a great school whirling, a smaller one, a manta gliding across
  fishBall(p, vec2(-0.55 + 0.05 * sin(uTime * 0.2), -1.75), 0.42, 1.5, 0.22, 1.0, K);
  fishBall(p, vec2(0.62, -2.35), 0.25, 1.8, -0.30, 7.0, K);
  manta(p, vec2(-1.25 + 0.16 * uTime, -1.35 + 0.04 * sin(uTime * 0.5)), 0.30, 0.0, K);
  // ===== jellyfish at their depths
  float jl = 0.0;
  jelly(p, vec2(0.38, -1.05), 0.08, 0.2, 7.0, K, jl);
  jelly(p, vec2(-0.25, -2.05), 0.10, -0.25, 8.0, K, jl);
  jelly(p, vec2(0.48, -2.75), 0.065, 0.15, 9.0, K, jl);
  jelly(p, vec2(-0.42, -0.55 + 0.02 * sin(uTime * 0.6)), 0.12, 0.25, 0.0, K, jl);
  jelly(p, vec2(0.30, -0.25), 0.06, -0.3, 2.0, K, jl);
  jelly(p, vec2(-0.10, -1.55), 0.05, 0.1, 4.0, K, jl);
  jelly(p, vec2(0.55, -3.2), 0.09, -0.2, 5.0, K, jl);
  jelly(p, vec2(-0.6, -3.9), 0.07, 0.3, 6.0, K, jl);
  // ===== the whale
  float wb = 0.0;
  if (uWhale.z > 0.0) whale(p, uWhale, 0.0, uPearl, K, wb);
  if (uWhale.z > 0.0){
    // its eye (in the whale's frame)
    vec2 eyeL = (vec2(0.245, -0.024) - vec2(0.5, 0.0)) * uWhale.z;
    vec2 eyeW = uWhale.xy + rot(uWhale.w) * eyeL;
    bigEye(p, eyeW, 0.0060 * uWhale.z, uWhaleB.x, uPearl, K);
  }
  // ===== near kelp, wet-on-dry (near the surface)
  vec2 pn = s * uZoom + uCam * vec2(1.15, 1.25);
  float litA, litB;
  float knd = kelpFrond(pn, -0.84, 0.32 - 0.55, 1.25, 0.3, 0.09, litA) + kelpFrond(pn, -0.64, 0.02 - 0.55, 1.0, 1.7, 0.07, litB);
  float lit = max(litA, litB);
  float kn2 = kelpFrond(pn, 0.80, 0.38 - 0.55, 1.3, 3.2, 0.09, litA);
  lit = max(lit, litA);
  K += mix(SIEN * 0.75 + SAPG * 0.55 + ULTR * 0.15, SAPG * 0.6 + GAMB * 0.55, clamp(lit, 0.0, 1.0)) * (knd + kn2) * 0.85;
  // ===== a few little orange fish about the pearl
  for (int i = 0; i < 5; i++){
    float fi = float(i);
    vec2 c = uPearl + vec2(0.16 * cos(uTime * 0.35 + fi * 1.3) + 0.05 * fi - 0.1, 0.06 * sin(uTime * 0.5 + fi * 2.1) - 0.02 * fi + 0.03);
    float dirs = -sin(uTime * 0.35 + fi * 1.3) < 0.0 ? -1.0 : 1.0;
    vec2 q = (p - c) * vec2(dirs, 1.0);
    float fd = fish(q, 0.045 + 0.010 * hash11(fi));
    float fb = wash(fd + rough(p, 60.0, 0.002, fi), 0.0012, 0.8, 0.004);
    K = mix(K, (ORAN * 0.8 + SIEN * 0.15) * fb * 0.9 + K * 0.2, clamp(fb, 0.0, 1.0) * smoothstep(-1.2, -0.3, p.y));
  }
  // ===== the squid
  squid(p, uSquid, uSquidB, K);
  // ===== bubbles rising (near the surface, and a stream from where the pearl came in)
  for (int i = 0; i < 18; i++){
    float fi = float(i);
    float x = (hash11(fi * 3.7) - 0.5) * 1.7 + 0.02 * sin(uTime * 2.0 + fi) + uCam.x;
    float y = mod(hash11(fi * 1.3) * 2.4 + uTime * (0.05 + 0.04 * hash11(fi)), 2.4) - 2.0;
    float r = 0.003 + 0.008 * hash11(fi * 7.1);
    float d = length(p - vec2(x, y)) - r;
    K *= 1.0 - 0.7 * smoothstep(0.001, -0.002, d + r * 0.3);
    K += ULTR * wash(abs(d + r * 0.15) - r * 0.15, 0.001, 0.0, 0.01) * 0.5;
  }
  // ===== the ink: puffs sprayed one after another along the squid's way. Each is smoke in water: noise warped through
  // itself so it curls into wisps, a dense heart, soft veils, curling fronts; they swell and run together until
  // there is only ink, still moving
  if (uInk.z > 0.0){
    float tt = uTime * 0.08;
    float inkK = 0.0;
    for (int i = 0; i < 4; i++){
      float fi = float(i);
      float age = uInk.z - fi * 0.30;
      if (age <= 0.0) continue;
      vec2 c = uInk.xy + vec2(-0.20 * fi, 0.06 * fi + 0.04 * sin(fi * 2.3));
      float R = (0.06 + 0.42 * age + 0.16 * age * age) * (0.85 + 0.3 * hash11(fi * 3.1));
      vec2 q = (p - c) / R;
      if (dot(q, q) > 6.0) continue;
      // smoke: warp the point by noise of the point warped by noise
      vec2 w1 = vec2(fbm3(q * 1.3 + vec2(fi * 3.0, tt)), fbm3(q * 1.3 + vec2(5.2 + fi, -tt)));
      vec2 w2 = vec2(fbm3(q * 1.3 + 3.0 * w1 + vec2(1.7, 9.2) + tt), fbm3(q * 1.3 + 3.0 * w1 + vec2(8.3, 2.8) - tt));
      float sm = fbm(q * 1.3 + 3.2 * w2);
      float d = length(q * vec2(1.0, 1.2)) - 0.9 * (sm - 0.45);
      float body = smoothstep(1.05, 0.25, d);
      float dens = body * (0.30 + 0.70 * smoothstep(0.30, 0.80, sm + 0.25 * body));
      inkK = inkK + dens * (1.0 - 0.55 * inkK);
    }
    // in the end it is everywhere, still uneven, still curling
    float flood = smoothstep(2.0, 3.2, uInk.z);
    vec2 fw1 = vec2(fbm3(p * 1.5 + tt), fbm3(p * 1.5 + 4.0 - tt));
    float fl = fbm(p * 1.5 + 3.0 * fw1);
    inkK = max(inkK, flood * (0.45 + 0.55 * smoothstep(0.25, 0.80, fl)));
    inkK = min(inkK, 1.0);
    // thin, it is a grey veil the water shows through; thick, it is black
    K = K * (1.0 - 0.65 * inkK) + SUMI * (0.20 * inkK + 0.95 * inkK * inkK);
  }
  // the colour going out of everything as the ink takes it
  if (uInk.w > 0.0){
    float g = dot(K, vec3(0.33, 0.34, 0.33));
    K = mix(K, vec3(g) * vec3(1.02, 1.0, 0.96), uInk.w);
  }
  // ===== the pearl: the paper left white round it, a warm gamboge glaze blushing out
  vec2 pp = p - uPearl;
  float pr = length(pp) / uZoom;
  K *= 1.0 - 0.75 * exp(-pr / 0.13) * uPearlB;
  K += GAMB * (exp(-pr / 0.05) * 0.5 + exp(-pr / 0.18) * 0.12) * uPearlB;
  K *= 1.0 - 0.35 * jl;
  // ===== the paper: granulation, its tooth
  float ph = paperH(px);
  float gran = (vnoise(px * 0.55) - 0.5) * 0.6 + (vnoise(px * 1.6 + 5.0) - 0.5) * 0.35;
  float blueness = clamp(K.r - K.b, 0.0, 1.0);
  K *= 1.0 + 0.30 * (0.5 - ph) + (0.18 + 0.30 * blueness) * gran;
  vec3 col = PAPER * exp(-K);
  float hx = paperH(px + vec2(1.0, 0.0)) - ph, hy = paperH(px + vec2(0.0, 1.0)) - ph;
  col *= 1.0 + 0.12 * (hx * 0.7 + hy * 0.7);
  col += vec3(1.0, 0.86, 0.55) * (exp(-pr / 0.007) * 1.3 + exp(-pr / 0.03) * 0.28) * uPearlB;
  o = vec4(min(col, vec3(1.0)), 1.0);
}`;
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

W.sea = {
  ready: false, t: 0, vol: 1, fade: 1,
  cam: [0, 0], zoom: 1,
  pearl: [0, 0.1], pearlB: 1,
  whale: [9, 9, 0, 0], whaleB: [1, 0, 0, 0],
  squid: [9, 9, 0.12, 0], squidB: [0, 0, 0, 0],
  ink: [0, 0, 0, 0],
  init() {
    const gl = YL.gl;
    this.p = YL.makeProgram('sea', VS, FS); YL.checkProgram(this.p);
    this.empty = gl.createVertexArray();
    this.ready = true;
  },
  update(dt) { this.t += dt; this.sound(dt); },
  render(target, aspect) {
    const gl = YL.gl, U = YL.U, p = this.p;
    const w = target ? target.w : gl.drawingBufferWidth, h = target ? target.h : gl.drawingBufferHeight;
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null); gl.viewport(0, 0, w, h);
    gl.useProgram(p.p);
    U(p, 'uRes', [w, h]); U(p, 'uTime', this.t);
    U(p, 'uCam', this.cam); U(p, 'uZoom', this.zoom);
    U(p, 'uPearl', this.pearl); U(p, 'uPearlB', this.pearlB);
    U(p, 'uWhale', this.whale); U(p, 'uWhaleB', this.whaleB);
    U(p, 'uSquid', this.squid); U(p, 'uSquidB', this.squidB);
    U(p, 'uInk', this.ink);
    gl.bindVertexArray(this.empty); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.bindVertexArray(null);
  },
  toNdc(q, aspect) { return [(q[0] - this.cam[0]) / this.zoom / (aspect * 0.5), (q[1] - this.cam[1]) / this.zoom / 0.5]; },
  /* ---- sound: under water. A low swell; the hiss of bubbles; the whale's song when it comes; a deep murmur */
  buildAudio(b) {
    const { ctx, out, noiseBuffer, loop } = b;
    const bus = ctx.createGain(); bus.gain.value = 0; bus.connect(out);
    const brown = noiseBuffer(7.3, 'pink');
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240; lp.Q.value = 0.7;
    const sw = ctx.createGain(); sw.gain.value = 0.10; loop(brown, 0.6, lp); lp.connect(sw); sw.connect(bus);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 1.2;
    const bg = ctx.createGain(); bg.gain.value = 0.006; loop(brown, 1.3, bp); bp.connect(bg); bg.connect(bus);
    this.snd = { ctx, bus, sw, bg, ev: {}, nextBub: 0.3 };
  },
  bubble() {
    const S = this.snd, ctx = S.ctx, t0 = ctx.currentTime + 0.01;
    const o = ctx.createOscillator(); const f = 500 + Math.random() * 900;
    o.frequency.setValueAtTime(f, t0); o.frequency.exponentialRampToValueAtTime(f * 1.9, t0 + 0.05);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.012, t0 + 0.005); g.gain.setTargetAtTime(0, t0 + 0.01, 0.02);
    const pn = ctx.createStereoPanner(); pn.pan.value = Math.random() * 1.2 - 0.6;
    o.connect(g); g.connect(pn); pn.connect(S.bus); o.start(t0); o.stop(t0 + 0.2);
  },
  // the whale sings: a long falling moan, and a rising one
  song(a = 1) {
    const S = this.snd, ctx = S.ctx; let t0 = ctx.currentTime + 0.05;
    for (const [f0, f1, d] of [[310, 180, 2.4], [140, 260, 2.0]]) {
      const o = ctx.createOscillator(); o.type = 'sine';
      const o2 = ctx.createOscillator(); o2.type = 'triangle';
      o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + d);
      o2.frequency.setValueAtTime(f0 * 2.01, t0); o2.frequency.exponentialRampToValueAtTime(f1 * 2.01, t0 + d);
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.05 * a, t0 + 0.5); g.gain.setTargetAtTime(0, t0 + d - 0.6, 0.3);
      const g2 = ctx.createGain(); g2.gain.value = 0.25;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(S.bus);
      o.start(t0); o2.start(t0); o.stop(t0 + d + 1); o2.stop(t0 + d + 1);
      t0 += d * 0.8;
    }
  },
  inkSound() {
    const S = this.snd, ctx = S.ctx, t0 = ctx.currentTime + 0.01;
    const s = ctx.createBufferSource(); const sr = ctx.sampleRate, n = Math.floor(sr * 1.2), b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sr * 0.35));
    s.buffer = b; const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
    const g = ctx.createGain(); g.gain.value = 0.10; s.connect(lp); lp.connect(g); g.connect(S.bus); s.start(t0);
  },
  sound(dt) {
    if (!this.snd) { const b = YL.AUDIO.bus && YL.AUDIO.bus(); if (b) this.buildAudio(b); else return; }
    const S = this.snd, now = S.ctx.currentTime;
    S.bus.gain.setTargetAtTime(this.fade * (this.vol ?? 1), now, 0.4);
    if ((S.nextBub -= dt) <= 0) { if (this.cam[1] > -1.5) this.bubble(); S.nextBub = 0.15 + Math.random() * 0.8; }
    if (this.whale[2] > 0 && !S.ev.song) { S.ev.song = 1; this.song(1); }
    if (this.ink[2] > 0.01 && !S.ev.ink) { S.ev.ink = 1; this.inkSound(); }
  },
};
})();

</script>
<script>
/* ---- src/worlds/ink.js ---- */
/* ============================================================================
   世界六 · 水墨·烟雨山水
   ----------------------------------------------------------------------------
   深海的黑水化开，像一滴墨落进清水：翻涌、散成丝，再沉下来，沉成山。
   · 只有墨和纸。没有一根硬线：每一块墨的边都是湿的——往纸里洇开，毛边顺着纸的纤维，边上积一圈深的墨。
   · 墨分五色：远山淡墨一抹，中景的山用中墨，近处的石壁浓墨、焦墨，干笔擦出飞白；石上一棵老松斜出水面。
   · 大片留白就是水和云：雾一层一层地流过山腰，细雨斜斜地下。
   · 笔一笔一笔地落下来：远山先洇开，然后中景，然后石壁和松，最后是水上一叶小舟。
   · 一粒光在这里是一点朱砂：整张画里唯一暖的颜色，落在小舟上，水里一道淡淡的倒影。
   · 走的时候天边破晓：颜色从水墨里渗出来——天边的粉、水的青、山的绿——下一个世界从颜色里炸开。
   渲染：一个全屏着色器，直接出最终颜色。
   ========================================================================== */
(() => {
'use strict';
const YL = window.YL;
const W = (YL.worlds = YL.worlds || {});

const FS = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uTime, uFade, uBloom, uDawn, uAspect;
uniform vec4 uGrow;          // how far each layer of ink has spread: far peaks, middle range, the near cliff and its pine, the boat
uniform vec4 uHero;          // the vermilion light: where (painting coords), how bright, how big
uniform float uSunK;         // (at dawn a spark of it rises and becomes the sun: 0 … 1)
uniform vec3 uSunP;          // where that spark is
uniform vec2 uPan;
uniform sampler2D uBrush;    // the painted layers: R rocks and cliffs and the built things, G trees, B the willow and reeds
uniform sampler2D uWhen;     // when the light's brush reached each place (1 - the fraction of its way): R close by it, G within a wash's reach
uniform float uNow;          // how far along its way the light is (0 … 1; past 1, everything is painted)
uniform vec4 uWalker;        // the traveller crossing the bridge: where along it (0 … 1), the step, on/off
uniform vec4 uEg[4];         // egrets rising from the reeds: where, the beat of the wings, size
const float SL = 5.6;
uniform sampler2D uSeal;
out vec4 o;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y); }
float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return s / 0.96875; }
float sat(float x){ return clamp(x, 0.0, 1.0); }
// ---- wet ink. sd: how far inside the shape (painting units, + inside). The edge bleeds into the paper along its
// fibres; the ink pools at the edge as it dries (a darker rim); the wash inside is uneven
float wash(vec2 p, float sd, float soft, float seed){
  float feather = 0.010 * (fbm(p * 38.0 + seed) - 0.5) + 0.004 * (vnoise(vec2(p.x * 900.0, p.y * 140.0) + seed) - 0.5);
  float s = sd + feather * soft;
  float cov = smoothstep(-0.0035 * soft, 0.0035 * soft, s);
  float rim = exp(-max(s, 0.0) / (0.006 * soft)) * cov;
  float body = 0.78 + 0.35 * fbm(p * 7.0 + seed * 3.0);
  return cov * (body + 0.45 * rim);
}
// a spreading front: the ink reaches from where the brush touched (seed) out to r; at the front it is wettest
float spread(vec2 p, vec2 seed, float r, float seedN){
  float d = length((p - seed) * vec2(0.8, 1.0)) + 0.10 * (fbm(p * 5.0 + seedN) - 0.5);
  return smoothstep(r, r - 0.04, d);
}
// a mountain's outline: peaks with rounded tops (height h at x = c, flanks falling at slope k)
float peak(float x, float c, float h, float k){ float d = abs(x - c); return h - k * d * d / (d + 0.03); }
// dry brush (飞白): streaks where the hairs of a nearly dry brush skipped the paper, running along dir
float dry(vec2 p, vec2 dir, float amt){
  vec2 q = vec2(dot(p, dir), dot(p, vec2(-dir.y, dir.x)));
  float st = vnoise(vec2(q.x * 9.0, q.y * 260.0)) * 0.6 + vnoise(vec2(q.x * 30.0, q.y * 700.0)) * 0.4;
  return 1.0 - amt * smoothstep(0.45, 0.75, st);
}
float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; float h = sat(dot(pa, ba) / dot(ba, ba)); return length(pa - ba * h); }
// the light painting: has its brush (k = 0) or the wash it leaves (k = 1) reached p yet? and how wet is it still
float when(vec2 p, int k){ vec2 w = 1.0 - texture(uWhen, vec2(p.x / SL, p.y)).rg; return k == 0 ? w.r : w.g + 0.025; }
float painted(vec2 p, float tm){ return smoothstep(tm - 0.004, tm + 0.010, uNow + 0.010 * (fbm(p * 30.0) - 0.5)); }
float wetness(float tm){ return exp(-max(uNow - tm, 0.0) / 0.035) * step(tm, uNow + 0.01); }
// the painting: how much ink lies at p (and how warm a grey it is)
float ink(vec2 p, out float tone){
  tone = 0.0;
  float t = uTime, D = 0.0;
  // ---- the far peaks: pale, slender, rising out of the mist
  {
    float x = p.x, n = 0.012 * (fbm(vec2(x * 9.0, 1.0)) - 0.5);
    float r = max(max(peak(x, 0.62, 0.92, 2.6), peak(x, 0.76, 0.80, 3.0)), max(peak(x, 0.47, 0.71, 3.2), max(peak(x, 0.93, 0.68, 2.8), peak(x, 1.10, 0.60, 2.4))));

  toPaint(nx, ny, aspect) { return [(nx * 0.5 + 0.5) * aspect + (1.7778 - aspect) * 0.5 + (this.pan || 0), ny * 0.5 + 0.5]; },

  },
  addRing(x, y, k) { (this.rings = this.rings || []).push({ x, y, t0: this.t, k }); if (this.rings.length > 8) this.rings.shift(); if (this.snd && k > 0.5) this.plip(0.03 * k); },
  frogAt() { const P = this.pads, i = Math.min(NPAD - 3, 40); return [P[i * 4], P[i * 4 + 1] + 0.006]; },
  // the dragonflies: a dart, then hanging still, then another dart (each its own rhythm)
  flies() {
    const out = new Float32Array(16).fill(-9);
    const base = [[0.62, 0.55], [1.35, 0.42], [0.95, 0.28]];
    for (let k = 0; k < 3; k++) {
      const per = 1.6 + 0.5 * k, n = Math.floor((this.t + k * 0.7) / per), u = ((this.t + k * 0.7) / per) % 1;

  render(target, aspect) {

    gl.useProgram(this.pGround.p); U(this.pGround, 'uRes', [Cv.w, Cv.h]); YL.bindTex(this.pGround, 'uC', B.texs[0], 0);

  buildAudio(b) {

/* ============================================================================

   第一幕 · 雨夜的房间

     wander    它在屋里飘：茶的热气、练习本、挂钟、吊兰，最后停到窗玻璃上

     dive      镜头扎进它所在的那颗雨滴；雨滴的圆从它身上张开，夏天从里面涌出来
   第二幕 · 盛夏午后

   转场 2→3 · 被抽走的颜色
     updraft   一阵上升的风把它带走；镜头跟着它仰起来，望向那座最高的积云
     cloud     钻进云里：一片白，越来越厚、越来越暗、越来越冷；开始下雪；颜色被一层层抽走，最后只剩一张纸
   第三幕 · 雪夜·木刻
     print     这张纸被印上去：先靛版，再墨版，最后朱版——世界一块版一块版地出现；它随着雪落下来
     woodcut   它找到那盏黑着的灯笼，钻进去，灯亮了；你在黑处划一刀，它就沿着你的刀痕走

const FS_IRIS = `#version 300 es

float flakes(vec2 p, float cell, float rad, float speed, float dens, float blur, float seed){

    const hole = wood.holeOnScreen(aspect, I.h);
    if (!sea.hero.on) sea.arrive(hole.nx, hole.ny, aspect);                     // the light is down there, where it sank
    wood.update(dt); wood.render(I.A, aspect);
    sea.update(dt); sea.render(I.B, aspect);
    const p = tear();
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, I.w, I.h);
    gl.useProgram(p.p);
    YL.U(p, 'uRes', [I.w, I.h]); YL.U(p, 'uC', [(hole.nx * 0.5 + 0.5) * I.w, (hole.ny * 0.5 + 0.5) * I.h]); YL.U(p, 'uR0', [hole.rx, hole.ry]);
    YL.U(p, 'uU', u); YL.U(p, 'uZoom', 0.35 + 0.65 * ease(clamp((u - 0.15) / 0.85, 0, 1)));
    YL.bindTex(p, 'uA', I.A.tex, 0); YL.bindTex(p, 'uB', I.B.tex, 1);
    YL.drawFull();
    return true;
  }
  if (D.phase === 'surface' && D.pt < 1.0) {
    const I = irisTargets();
    YL.roomTarget = I.A; D.flashFrame = { I, f: 1 - smooth(0.0, 1.0, D.pt) };
    return false;
  } else if (YL.roomTarget && D.phase !== 'dive') YL.roomTarget = null;
  if (D.world === 'room') return false;
  const w = YL.worlds && YL.worlds[D.world];
  if (!w) return false;
  if (!w.ready) w.init();
  if (D.placeHero && D.world === 'summer') { D.placeHero = false; D.placeLight(); }
  if (D.seaJump && D.world === 'deepsea') { D.seaJump = false; w.arrive(0, 0, YL.canvasAspect()); }
  if (D.jump && D.world === 'woodcut') {
    const { ph, pt } = D.jump; D.jump = null;
    w.arrive(0.1, 0.6, YL.canvasAspect());
    D.go(ph === 'leave' || ph === 'tear' ? 'woodcut' : ph);
    if (ph === 'print') { w.show = [0, 0, 0]; D.pt = pt; }
    else { w.show = [1, 1, 1]; w.vol = 1; w.hero.mode = 'home'; w.lanLight = 1; w.lit = w.litBase.slice(); w.lightsOn = true; D.pt = ph === 'leave' ? T_WOOD + 1 : pt; }
    if (ph === 'tear') { w.hero.mode = 'gone'; w.gone = true; w.lanLight = 0.12; D.go('tear'); D.pt = pt; YL.worlds.deepsea.init(); }
    if (ph === 'spark') { w.villageDone = w.moonDone = true; w.sendSpark(); D.sparkIn = undefined; D.pt = 0; YL.worlds.shadow.init(); }
  }
  const P = YL.ptr;
  if (P && P !== lastPtr && w.pointer) w.pointer(P.nx, P.ny, P.speed);
  lastPtr = P;
  YL.ptrPar = YL.CAM.par;
  w.update(dt, YL.DBG.still);
  w.render(null, YL.canvasAspect());
  return true;
};
// the worlds of the village–stage–sea shot: move them on, then draw (the screen's picture first, or both sides of the water line)
D.stepLineage = (dt) => {
  const vil = YL.worlds.village, stg = YL.worlds.stage, sea = YL.worlds.sea;
  for (const w of [vil, stg, sea]) if (!w.ready) w.init();
  if (D.phase === 'village') { vil.update(dt); if (D.stageOn) stg.update(dt); }
  else if (D.phase === 'stage') stg.update(dt);
  else if (D.phase === 'fall') { stg.update(dt); sea.update(dt); }
  else if (D.phase === 'water') sea.update(dt);
};
D.drawLineage = (dt) => {
  if (D.lineageJump) {
    const { ph, pt } = D.lineageJump; D.lineageJump = null;
    const order = ['village', 'stage', 'fall', 'water'];
    // run until that phase is reached, then on into it by pt
    let guard = 0;
    while (order.indexOf(D.phase) < order.indexOf(ph) && guard++ < 24 * 60) D.ffLineage(1 / 24);
    D.ffLineage(pt);
  }
  const vil = YL.worlds.village, stg = YL.worlds.stage, sea = YL.worlds.sea, aspect = YL.canvasAspect(), gl = YL.gl;
  D.stepLineage(dt);
  if (D.phase === 'village') {
    if (D.stageOn) { const I = irisTargets(); stg.render(I.B, aspect); vil.screenTex = I.B.tex; } else vil.screenTex = null;
    vil.render(null, aspect);
  } else if (D.phase === 'stage') stg.render(null, aspect);
  else if (D.phase === 'fall') {
    const I = irisTargets();
    stg.render(I.A, aspect); sea.render(I.B, aspect);
    const p = fallP();
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, I.w, I.h);
    gl.useProgram(p.p);
    YL.U(p, 'uRes', [I.w, I.h]);
    YL.bindTex(p, 'uA', I.A.tex, 0); YL.bindTex(p, 'uB', I.B.tex, 1);
    YL.drawFull();
  } else sea.render(null, aspect);
};
// run the shot forward without drawing (for a jump straight into the middle of it)
D.ffLineage = (secs) => { const dt = 1 / 24; for (let i = 0; i < Math.round(secs * 24); i++) { D.pt += dt; D.t += dt; D.clock += dt; D.lineage(dt); D.stepLineage(dt); } };
// called by the host right after it has drawn the room (into A during the dive)
D.afterRoom = () => {
  if (D.flashFrame) {
    // out of the tea: the warm flash fading off the room
    const { I, f } = D.flashFrame, gl = YL.gl; D.flashFrame = null;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, I.w, I.h);
    gl.useProgram(I.p.p);
    YL.U(I.p, 'uRes', [I.w, I.h]); YL.U(I.p, 'uC', [-10, -10]); YL.U(I.p, 'uR', 0); YL.U(I.p, 'uFlash', f);
    YL.bindTex(I.p, 'uA', I.A.tex, 0); YL.bindTex(I.p, 'uB', I.A.tex, 1);
    YL.drawFull();
    return;
  }
  const F = D.irisFrame; if (!F || D.phase !== 'dive') return;
  D.irisFrame = null;
  const { I, u } = F, gl = YL.gl, summer = YL.worlds.summer;
  summer.render(I.B, YL.canvasAspect());
  // the iris opens from the light's own drop: slowly, then all at once
  const c = D.irisCenter, w = I.w, h = I.h;
  const cpx = [(c[0] * 0.5 + 0.5) * w, (c[1] * 0.5 + 0.5) * h];
  const R = u < 0.42 ? 0 : 6 * Math.exp((u - 0.42) / 0.58 * Math.log(Math.hypot(w, h) * 1.3 / 6));
  const flash = 0.55 * Math.exp(-Math.pow((u - 0.9) / 0.06, 2));
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, w, h);
  gl.useProgram(I.p.p);
  YL.U(I.p, 'uRes', [w, h]); YL.U(I.p, 'uC', cpx); YL.U(I.p, 'uR', R); YL.U(I.p, 'uFlash', flash);
  YL.bindTex(I.p, 'uA', I.A.tex, 0); YL.bindTex(I.p, 'uB', I.B.tex, 1);
  YL.drawFull();
};
if (D.world !== 'room') YL.roomVol = 0;
// a lost and restored GL context: everything the worlds and the transitions made belongs to the old one
YL.onContextRestored = () => {
  iris = null; tearP = null; drainP = null; mixProg = null; fallProg = null; YL.sharp2 = null; YL.roomTarget = null;
  for (const w of Object.values(YL.worlds || {})) {
    w.ready = false;
    w.res = null; w.tw = 0; w.inks = null; w.A = null; w.B = null;
  }
};

// ---- screenshots: jump straight to a moment
if (QS.get('phase')) {
  const ph = QS.get('phase'), pt = +(QS.get('pt') || 0);
  D.escape();
  if (FILM) D.clock = 3;                           // (past the film's opening fade from black)
  LIGHT.level = 0; HERO.glow = 1;
  const L = YL.hero.routeLength();
  if (ph === 'wander') { YL.hero.t = pt; D.t = pt; }
  else {
    YL.hero.t = L + 5; D.t = L + 5;
    const later = ['summer', 'paper', 'updraft', 'cloud', 'print', 'woodcut', 'spark', 'inlantern', 'shadow', 'drop', 'snuff', 'leave', 'tear', 'deepsea', 'inkbloom', 'ink', 'dawn', 'burst', 'pond', 'dew', 'rise', 'surface'];
    if (['village', 'stage', 'fall', 'water'].includes(ph)) {
      // into the village–stage–sea shot: run it from the village's start up to the moment asked for (once GL exists)
      D.irisCenter = [0.1, 0.1]; D.enterSummer(); YL.roomVol = 0;
      D.go('village'); D.world = 'village';
      D.lineageJump = { ph, pt };
    } else if (later.includes(ph)) {
      D.irisCenter = [0.1, 0.1]; D.enterSummer();
      if (ph === 'summer') D.pt = pt;
      else if (ph === 'updraft' || ph === 'cloud') { D.go(ph); D.pt = pt; }
      else if (ph === 'paper') { D.go(ph); D.pt = pt; setTimeout(() => { const su = YL.worlds.summer; su.startSheet(); su.sheet.t0 -= pt; }, 0); }
      else {
        // straight into the print (once the GL context exists: see renderFrame)
        D.world = 'woodcut'; YL.roomVol = 0; D.jump = { ph, pt };
        if (FILM && ['print', 'woodcut', 'spark', 'inlantern'].includes(ph)) { const w = YL.worlds.woodcut; w.pace = 1.7; w.panX = 0.80; }   // (as the film sets it on the way in)
        if (ph === 'deepsea' || ph === 'rise') { D.world = 'deepsea'; D.jump = null; D.go(ph); D.pt = pt; D.seaJump = true; }
        if (ph === 'shadow' || ph === 'snuff' || ph === 'drop') { D.world = 'shadow'; D.jump = null; D.go(ph); D.pt = pt; YL.worlds.shadow.t = 1 + pt + (ph === 'drop' ? 12 : 0); }
        if (ph === 'burst' || ph === 'pond' || ph === 'dew') { D.world = ph === 'burst' ? 'ink' : 'pond'; D.jump = null; D.go(ph); D.pt = pt; YL.worlds.ink.dawn = 1; }
        if (ph === 'inkbloom' || ph === 'ink' || ph === 'dawn') { D.world = 'ink'; D.jump = null; D.go(ph); D.pt = pt; const k = YL.worlds.ink; k.bloom = ph === 'inkbloom' ? 1 : 0; k.grow = ph === 'inkbloom' ? [0, 0, 0, 0] : [1, 1, 1, 1]; if (ph === 'inkbloom') k.arrive(0.9, 0.5); }
        if (ph === 'surface') { D.jump = null; YL.roomVol = 1; setTimeout(() => { D.surface(); D.pt = pt; YL.hero.t = pt; if (pt > T_SURF) D.go('home'); }, 0); }
      }
    }
    else { D.go(ph); D.pt = pt; }
  }
}
})();
