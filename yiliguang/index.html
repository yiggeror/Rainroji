<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0a09">
<title>一粒光</title>
<style>
  html,body{margin:0;height:100%;background:#0c0a09;overflow:hidden;overscroll-behavior:none}
  body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #veil{position:fixed;inset:0;background:#0c0a09;display:flex;align-items:center;justify-content:center;
    color:rgba(232,214,188,.5);font:300 13px/1.9 "Songti SC","Noto Serif SC","STSong",serif;letter-spacing:.6em;
    transition:opacity 3.2s ease;pointer-events:none;z-index:5}
  #veil.gone{opacity:0}
  #veil span{animation:breathe 4.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}
  #fallback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    color:rgba(232,214,188,.72);font:300 15px/2 "Songti SC","Noto Serif SC",serif;letter-spacing:.2em;text-align:center;padding:24px;
    background:radial-gradient(ellipse at 50% 60%,#2a2219 0%,#0c0a09 70%)}
  #fallback small{opacity:.5;letter-spacing:.08em;font-size:12px}
  /* minimal corner controls */
  #ui{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:4;
    font:300 12px/1.6 "PingFang SC","Noto Sans SC","Hiragino Sans GB",sans-serif;color:rgba(238,226,206,.82);letter-spacing:.12em;
    transition:opacity 1.6s ease;opacity:0}
  #ui.show{opacity:1} #ui.idle{opacity:.0} #ui.idle:hover{opacity:1} #ui.hidden{display:none}
  #uiBtn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(238,226,206,.22);background:rgba(20,16,13,.32);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:inherit;cursor:pointer;padding:0;display:grid;place-items:center;margin-left:auto}
  #uiBtn svg{width:15px;height:15px;opacity:.8}
  #panel{position:absolute;right:0;bottom:44px;width:196px;padding:14px 16px 12px;border-radius:12px;background:rgba(20,16,13,.42);
    border:1px solid rgba(238,226,206,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .5s ease,transform .5s ease}
  #panel.open{opacity:1;transform:none;pointer-events:auto}
  #panel label{display:block;margin:2px 0 10px}
  #panel .row{display:flex;justify-content:space-between;align-items:center}
  #panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:2px 0 0}
  #panel input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(238,226,206,.35)}
  #panel input[type=range]::-moz-range-track{height:1px;background:rgba(238,226,206,.35)}
  #panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#efe2cc;margin-top:-5px;border:0}
  #panel input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#efe2cc;border:0}
  #panel button.tog{font:inherit;color:inherit;letter-spacing:.12em;background:none;border:1px solid rgba(238,226,206,.28);border-radius:10px;padding:1px 10px;cursor:pointer}
  #panel .hint{margin-top:4px;font-size:11px;opacity:.5;letter-spacing:.06em;line-height:1.7}
  #panel .seg{display:flex;gap:2px}
  #panel .seg button{font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid transparent;padding:0 5px 1px;cursor:pointer;opacity:.45;letter-spacing:.1em}
  #panel .seg button.on{opacity:1;border-bottom-color:rgba(238,226,206,.6)}
  #panel .sub{opacity:.6;font-size:11px;letter-spacing:.08em}
  #panel .row + label, #panel .row + .row{margin-top:8px}
  #hint{position:fixed;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));text-align:center;z-index:3;pointer-events:none;
    font:300 12px/1.6 "Songti SC","Noto Serif SC",serif;letter-spacing:.42em;color:rgba(238,226,206,.55);opacity:0;transition:opacity 2.4s ease}
  #hint.show{opacity:1}
  #ui{display:none !important}            /* 《一粒光》: no settings panel in the film */
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"><span>雨还在下</span></div>
<div id="hint">轻触台灯</div>
<div id="ui">
  <div id="panel" role="dialog" aria-label="设置">
    <div class="row"><span>视角</span><span class="seg" id="view"><button data-v="0">窗内</button><button data-v="1">窗外</button></span></div>
    <div class="row"><span>季节</span><span class="seg" id="season"><button data-s="0">春</button><button data-s="1">夏</button><button data-s="2">秋</button><button data-s="3">冬</button></span></div>
    <label style="margin-top:8px"><span class="row"><span>时刻</span><span class="sub" id="todLabel"></span></span><input id="tod" type="range" min="0" max="24" step="0.05"></label>
    <div class="row" style="margin-bottom:10px"><span>时间流逝</span><button class="tog" id="flow" aria-pressed="false">停</button></div>
    <label><span id="rainLbl">雨势</span><input id="rain" type="range" min="0" max="1" step="0.01" value="0.55"></label>
    <label>流速<input id="speed" type="range" min="0.2" max="2.5" step="0.01" value="1"></label>
    <div class="row"><span>声音</span><button class="tog" id="snd" aria-pressed="true">开</button></div>
    <div class="hint">轻触台灯开关；在玻璃上划过可擦去雾气。<br>V 窗内／窗外 · S 季节 · T 时间流逝 · L 台灯 · M 静音 · H 隐藏</div>
  </div>
  <button id="uiBtn" aria-label="设置"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8 1.8C8 1.8 3.6 7 3.6 10a4.4 4.4 0 0 0 8.8 0C12.4 7 8 1.8 8 1.8Z"/></svg></button>
</div>
<div id="fallback"><div>这台设备暂时打不开这扇窗。</div><small>需要 WebGL2 支持 —— 换一个较新的浏览器，雨还会在那里。</small></div>
<script src="src/room.js"></script>
<script src="src/hero.js"></script>
<script src="src/worlds/summer.js"></script>
<script src="src/worlds/woodcut.js"></script>
<script src="src/worlds/village.js"></script>
<script src="src/worlds/shadow.js"></script>
<script src="src/worlds/stage.js"></script>
<script src="src/worlds/deepsea.js"></script>
<script src="src/worlds/sea.js"></script>
<script src="src/worlds/ink.js"></script>
<script src="src/worlds/pond.js"></script>
<script src="src/director.js"></script>
</body>
</html>
